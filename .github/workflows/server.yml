# Continuous integration for the Go server: lint, test, sqlc codegen
# drift check, and build. The heavy tiers run ON DEMAND, not per-PR:
# the merge-time machine gate is the local `make ci-local` target
# (the same checks, cold containers), and this workflow is the
# outside-in reproduction -- dispatched when wanted, and kept from
# rotting by the monthly schedule (a silent workflow rots: the runner
# image moves, the setup steps drift, and the first run after a long
# silence fails for infrastructure rather than for code). Web changes
# are included: the server embeds the web app's build output, so it
# compiles against it.

name: server

on:
  workflow_dispatch:
  schedule:
    # Monthly, off-peak UTC; scheduled runs take the default branch.
    - cron: '23 4 3 * *'

permissions:
  contents: read

jobs:
  server:
    name: lint, test, codegen drift, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # The Go server embeds the web app's build output (staged into
      # server/internal/web/dist by make web-build), so the web build
      # must run before every Go step below -- including the lint step,
      # which compiles the packages it lints. Without it the Go build
      # fails loudly at the embed directive.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Matches web/package.json's packageManager field; bump both
          # together.
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web app (embedded into the server)
        run: |
          make web-install
          make web-build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum

      # The media package is CGO: the govips binding compiles against
      # libvips and libheif headers, so the lint/test/build steps below
      # need them installed. ffmpeg rides along so the video poster
      # pipeline's tests run here rather than only in the dev
      # container (the metadata pipeline's exiftool stays dev-container
      # only; its tests skip cleanly here).
      #
      # The libheif codec plugins must be named explicitly: on the
      # runner's libheif the AVIF encoder (libheif-plugin-aomenc) is
      # only a Recommends and the HEIC decoder
      # (libheif-plugin-libde265) is only a Suggests, both cut by
      # --no-install-recommends -- without them every image-derivation
      # test fails with "heifsave: Unsupported compression".
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips-dev libheif-dev ffmpeg \
            libheif-plugin-aomenc libheif-plugin-libde265

      - name: Install onnxruntime
        # The search tests exercise the CLIP text tower through the
        # handler (the fixture model runs real inference), so the
        # runner carries the pinned shared library -- the same
        # per-arch sha256 discipline as the Dockerfiles.
        run: |
          set -eux
          curl -fsSL --retry 3 -o /tmp/onnxruntime.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/onnxruntime-linux-x64-1.31.0.tgz
          echo "cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57  /tmp/onnxruntime.tgz" | sha256sum -c -
          tar -xzf /tmp/onnxruntime.tgz -C /tmp
          sudo cp /tmp/onnxruntime-linux-x64-1.31.0/lib/libonnxruntime.so.1.31.0 /usr/local/lib/
          sudo ldconfig

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: server

      - name: Test
        working-directory: server
        # The per-package timeout rides at 20m (Go's default is 10m):
        # the api package legitimately runs ~7m on a healthy runner
        # (the ML/ffmpeg fixtures) and slow days multiply that past
        # the default cap -- slow by design, not stuck.
        run: go test -timeout 20m ./...
        # The database tests use testcontainers, which talks to the
        # Docker daemon available on ubuntu-latest runners.

      - name: Check that sqlc output is up to date
        run: |
          make sqlc-gen
          git diff --exit-code -- server/internal/db/gen
          if git status --porcelain -- server/internal/db/gen | grep -q .; then
            echo "sqlc output drifted: regenerated files differ from the committed ones"
            exit 1
          fi

      - name: Build
        working-directory: server
        run: go build ./...
