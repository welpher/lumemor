# Continuous integration for the translation files: run the i18n
# consistency checks (flat structure, snake_case keys, key-set parity
# with en.json, ICU placeholder parity) and cross-check the Error.code
# enum of openapi/lumemor.yaml against the translation keys in both
# directions (every code has a lowercased key, no orphan keys).

name: i18n

on:
  pull_request:
    paths:
      - 'i18n/**'
      - 'openapi/lumemor.yaml'
      - 'scripts/check_i18n.py'
      - '.github/workflows/i18n.yml'
  push:
    branches: [main]
    paths:
      - 'i18n/**'
      - 'openapi/lumemor.yaml'
      - 'scripts/check_i18n.py'
      - '.github/workflows/i18n.yml'

permissions:
  contents: read

jobs:
  i18n:
    name: i18n consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # The two check families run as separate steps so a red build is
      # easy to attribute in the CI log; locally
      # `python3 scripts/check_i18n.py` runs both in one go, and
      # `scripts/test_check_i18n.sh` exercises the negative fixtures.
      - name: Check translation files
        run: python3 scripts/check_i18n.py --translations-only

      - name: Cross-check error codes against i18n keys
        run: python3 scripts/check_i18n.py --error-codes-only
