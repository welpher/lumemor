# Continuous integration for the end-to-end acceptance: the full M3d
# chain on a real compose stack. The job installs the web toolchain
# and Playwright's chromium, then runs scripts/acceptance_m3d.sh,
# which chains the entire M1/M2/M3a/M3b/M3c acceptance line (the M2d
# chain, including the M2 web story through a real browser, the M3a
# model pipeline acceptance, the M3b people story and the M3c albums
# and sharing story) and then walks the M3d search and places story
# itself: the search surface's API walkthrough on a fresh stack (two
# accounts, the member's seeded library -- the Beijing GPS photo, the
# Chinese OCR photo, the face pair, the wildcard decoy and the
# private photo -- the FTS and semantic arms, the deterministic
# rank-fusion merge with its mode-tagged cursor pages, the facet
# counts, the person and place filters, the tags domain's idempotent
# create and honest batch skips, the sharee's visibility over both
# arms, and the places locale join) and the M3d search story of the
# web app through a real browser. The path filters keep this
# workflow from running on changes that cannot affect it; the
# workflow also runs when its own definition changes.

name: e2e

on:
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'
      - 'openapi/**'
      - 'i18n/**'
      - 'scripts/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'openapi/**'
      - 'i18n/**'
      - 'scripts/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    name: acceptance (compose stack and Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Matches web/package.json's packageManager field; bump both
          # together.
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      # The web dependencies first (the acceptance script re-checks
      # them, a cached no-op), then the browser the suite drives.
      # --with-deps installs the system libraries the runner needs;
      # the acceptance script's own install step is then a no-op.
      - name: Install web dependencies
        run: make web-install

      - name: Install Playwright's chromium
        run: cd web && pnpm exec playwright install --with-deps chromium

      - name: Run the M3d acceptance
        run: scripts/acceptance_m3d.sh

      # The suite's failure artifacts (traces, screenshots, videos of
      # the scenes) land under web/test-results/.
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: web/test-results/
          retention-days: 7
