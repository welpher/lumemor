# Continuous integration for the end-to-end suite: every Playwright
# spec drives one fresh compose stack. The job installs the web
# toolchain and Playwright's chromium, then runs scripts/e2e-suite.sh,
# which builds the image once, boots the stack per spec (the first-run
# setup belongs to the spec), walks the M1/M2/M3 stories and the later
# blocks' scenes, and tears each stack down. The storage bind survives
# the resets so model weights download once.
#
# The heavy tier is ON DEMAND, not per-PR: the per-block discipline
# runs the specs locally on fresh stacks, and this workflow is the
# outside-in reproduction -- dispatched when wanted, and kept from
# rotting by the monthly schedule.

name: e2e

# The heavy acceptance tier: ON DEMAND, not per-PR. The per-block
# discipline runs the chain and the specs locally on fresh stack
# lifetimes (the e2e hard rule); this workflow is the outside-in
# reproduction -- dispatched when wanted, and kept from rotting by
# the monthly schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 3 * *'

permissions:
  contents: read

jobs:
  e2e:
    name: acceptance (compose stack and Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Matches web/package.json's packageManager field; bump both
          # together.
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      # The web dependencies first (the acceptance script re-checks
      # them, a cached no-op), then the browser the suite drives.
      # --with-deps installs the system libraries the runner needs;
      # the acceptance script's own install step is then a no-op.
      - name: Install web dependencies
        run: make web-install

      - name: Install Playwright's chromium
        run: cd web && pnpm exec playwright install --with-deps chromium

      - name: Run the Playwright suite (a fresh stack per spec)
        run: scripts/e2e-suite.sh
        timeout-minutes: 180

      # The suite's failure artifacts (traces, screenshots, videos of
      # the scenes) land under web/test-results/ (the last spec's, when
      # an earlier stack already tore its directory down).
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: web/test-results/
          retention-days: 7
