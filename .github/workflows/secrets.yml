# Secret scanning over the full history on every push and pull
# request. The pinned CLI (not the action) keeps the run free of
# marketplace licensing questions; .gitleaks.toml carries the
# allowlist for the contract's illustrative examples.
name: secrets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --config .gitleaks.toml
