  /assets/{id}:
    get:
      operationId: getAsset
      tags:
        - assets
      summary: Fetch the detail of one owned asset.
      description: |
        The asset detail: the identity and storage fields of the upload
        response plus the refinements the pipeline produced afterwards
        -- dimensions, duration, blurhash, the EXIF hot fields, and
        readiness -- the owner-level editable attributes
        (`description`, `isArchived`, and the `takenAt` / `latitude` /
        `longitude` edits `PATCH` writes), which the asset detail view
        renders, the asset's faces
        with the caller's own label of each face's cluster (`faces`),
        which the detail view's people section renders and the people
        write endpoints maintain, and the caller's own tags on the
        asset (`tags`, name ascending), which the detail view's tag
        section renders and the tags endpoints maintain -- another
        account's tags on the same asset never surface here.

        Access is the caller-visible gate: the asset's owner, and
        every member of an album the caller sees -- their own sync
        and directory albums plus every album shared to them (the
        same album union the timeline aggregates). An id none of
        those cover answers the same 404 `ASSET_NOT_FOUND` as an id
        that does not exist, byte for byte, so asset ids cannot be
        enumerated. The owner's reads keep their current shape: a
        trashed or archived asset answers 200 (`isTrashed`, `isArchived`
        honest) because the owner's album memberships outlive both
        marks; for a sharee the same holds by id -- the family flows
        list live rows only, so an archived or trashed shared asset
        surfaces only where its album keeps it (an album keeps its
        archived members) and stays readable at its known id until
        the share itself goes.

        A trashed asset answers 200 with `isTrashed: true` -- the
        trash view reads the detail the same way. The component video
        row of a Live Photo is readable by its id (the detail, the
        original download and the transcoded play stream resolve it
        through `livePhotoVideoId`; it counts a transcode job of its
        own) but never appears in the timeline.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
        - name: locale
          in: query
          required: false
          description: |
            The display locale of the `place` face's name: `en` or
            `zh-Hans`, the instance's UI language set. Absent means
            `en`. A value outside the set answers 400
            `VALIDATION_FAILED` (the `GET /places` parameter's own
            shape -- the web app owns the active locale and passes
            it along; the server never guesses it from headers).
          schema:
            type: string
            enum:
              - en
              - zh-Hans
            default: en
          example: zh-Hans
      responses:
        '200':
          description: |
            The asset detail. `isReady` is true once the whole pipeline
            (metadata and serving copies) completed; until then the
            pipeline-dependent fields stay null and the client waits
            for the `asset.ready` event. `exif` is always present; its
            fields are null until the metadata job wrote the
            extraction. `faces` is always present, ordered by score
            descending with the face id as the tiebreak, each entry
            carrying the caller's own label state of the face's
            cluster; the `person.*` events on the stream converge it.
            `tags` is always present, the caller's own tags on the
            asset sorted by name case-insensitively with the tag id
            as the tiebreak; the tags writes' own responses carry the
            converged state, so no event needs to. `albums` is
            always present, the caller-visible albums holding the
            asset; `place` is the locale-joined city face (null
            when nothing resolved); `location` is the coordinates
            the panel renders -- the manual edit when one landed,
            the camera's GPS otherwise, null when neither exists.
          content:
