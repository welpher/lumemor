                    name: Ada
                    isHidden: true
        '400':
          description: |
            The body is not valid JSON or lacks `isHidden` -- or the
            caller has not labeled the cluster: hiding rides on the
            label row, so an unlabeled cluster answers
            `VALIDATION_FAILED` with the message key
            `person_hide_requires_label` in `details.key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personHideRequiresLabel:
                  summary: Hiding an unlabeled cluster.
                  value:
                    code: VALIDATION_FAILED
                    message: the person carries no label to hide
                    details:
                      key: person_hide_requires_label
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such cluster for this caller: the id is unknown, or
            the cluster exists but none of its faces sits on an
            asset visible to the caller -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /people/merge:
    post:
      operationId: mergePeople
      tags:
        - people
      summary: Fold 1-50 face clusters into one surviving cluster.
      description: |
        One structural merge: every source cluster's faces re-home
        onto the target cluster, the target's representative face
        recomputes to the strongest-scoring member of the merged
        set, and every source cluster dissolves -- with its label
        rows cascading. A single source is the pairwise fold the
        cluster detail's "merge into" action drives (that person
        merges into the picked one); more sources are the batch
        organize path of the unnamed region.

        THE HONEST COST, by design: a source cluster's user-given
        name DIES with the cluster, whatever account gave it. A
        person merged away cannot keep the name a caller gave the
        cluster they merged; the target cluster's label persists.
        The web UI names the target before merging when the caller
        wants the merged person called something.

        The whole merge runs as ONE transaction through the cluster
        maintenance discipline (representative re-pointing plus
        dissolution of the vacated clusters -- the same primitives
        the asset deletion sweep applies), never as bare member
        moves that would strand a stale representative or an empty
        cluster.

        Rules: every source and the target must be visible to the
        caller (at least one face on an asset the caller OWNS and
        that is live) -- merging is cluster curation, and curation
        is the owner's alone: a sharee who sees a cluster through a
        shared album reads it and labels it, but a merge from their
        hand answers the same 404 `PERSON_NOT_FOUND`, so the shared
        structure never re-shapes under another account's cursor.
        The target must not be among the sources -- any violation
        answers the same byte-identical 404 `PERSON_NOT_FOUND`
        (anti-enumeration). An empty source list or more than 50
        source ids (duplicates collapse first) answer 400
        `VALIDATION_FAILED`.

        The write publishes one `person.merged` event with the
        surviving cluster id, the dissolved ids comma-joined as
        `mergedClusterIds`, and the acting user's id.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePeopleRequest'
            examples:
              oneSource:
                summary: The pairwise fold of the cluster detail's "merge into".
                value:
                  sourceClusterIds:
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f76
                  targetClusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
              twoSources:
                summary: Two unnamed clusters folded into a named one.
                value:
                  sourceClusterIds:
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f76
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f78
                  targetClusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
      responses:
        '200':
          description: The merge committed as one transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergePeopleResponse'
              examples:
                merged:
                  value:
                    survivingClusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    mergedClusterIds:
                      - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f76
                      - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f78
        '400':
          description: |
            The body is not valid JSON, or the source list is empty
            or holds more than 50 distinct clusters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: A source list over the cap.
                  value:
                    code: VALIDATION_FAILED
                    message: merge exceeds the 50 source cluster limit
                    details:
                      fields:
                        - sourceClusterIds
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such merge for this caller: a source or the target is
            unknown or invisible to the caller, or the target sits
            among the sources -- indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /faces/{faceId}/move:
    post:
      operationId: moveFace
      tags:
        - people
      summary: Move one face onto an existing face cluster.
      description: |
        One face's move onto an existing target cluster: the tidy-up
        primitive behind the viewer's face chips. The face must sit
        on an asset the caller OWNS and that is live, and the target
        must be caller-visible -- any other state (unknown face,
        another account's asset, an asset shared to the caller but
        not owned -- the move is curation, and curation is the
        owner's alone -- an invisible or unknown target) answers the
        same byte-identical 404 `PERSON_NOT_FOUND`
        (anti-enumeration). A face the clustering has not yet
        assigned to any cluster is not part of any person and
        answers the same 404.

        The move runs as ONE transaction through the cluster
        maintenance discipline: the target's representative face
        recomputes to its strongest member, and the vacated source
        cluster re-homes its representative to the best surviving
        member -- or dissolves with its label rows cascading when
        the move empties it (a source cluster's user-given name dies
        with the cluster, the same honest cost as a merge).

        Moving a face onto the cluster it already occupies is an
        accepted no-op. The write publishes `person.face_moved` with
        the face id, the cluster it now occupies and the acting
        user's id.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: faceId
          in: path
          required: true
          description: Identifier of the face to move.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveFaceRequest'
            examples:
              moveToAda:
                summary: Assign the face to an existing person.
                value:
                  targetClusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
      responses:
        '200':
          description: The move committed as one transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveFaceResponse'
              examples:
                moved:
                  value:
                    faceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                    clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
        '400':
          description: |
            The body is not valid JSON or lacks a usable
            `targetClusterId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  value:
                    code: VALIDATION_FAILED
                    message: request body must be valid JSON
                    details:
                      fields:
                        - body
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such movable face for this caller: the face id is
            unknown, its asset (or the target cluster) is invisible
            to the caller, or the face belongs to no cluster yet --
            indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /faces/{faceId}/thumbnail:
    get:
      operationId: getFaceThumbnail
      tags:
        - people
      summary: Serve one face's 256x256 crop thumbnail.
      description: |
        The face crop pixels of the people surface: a 256x256
        `image/avif` crop of one detected face, derived at query time
        and never stored on disk. The source pixels are the face's
        asset's `view` derivative -- the inline serving size of
        `GET /assets/{id}/thumbnail` -- never the original; the face
        row's bounding box is in per-mille units of the full image,
        and the view derivative preserves the original's framing
        exactly, so the same per-mille values address the
        derivative's own pixels.

        The crop window is pinned: a square whose side is 1.25x the
        larger of the box's pixel width and height (a 25% margin
        around the face), centered on the box and clamped to the
        image bounds (a face larger than the image yields the
        image's smaller edge); the window then renders to exactly
        256x256 pixels -- upscaled when the window is smaller,
        a zoom rather than a fit.

        The permission gate is the face's asset: the caller must see
        a live, non-component asset -- their own, or one shared to
        them through an album. Every other state answers the SAME
        byte-identical 404 PERSON_NOT_FOUND -- an unknown face id, a
        face on another account's unshared (or a trashed, or hidden)
        asset, and an asset whose view derivative has not been
        derived yet (the thumbnail job has not run). Face ids cannot
        be probed for existence; the web renders its skeleton
        placeholder until the pixels exist, which is why there is
        deliberately no separate not-ready code here, unlike the
        asset thumbnail endpoint.

        The response is a private immutable derived asset:
        `Cache-Control: private, max-age=31536000, immutable`, and a
        strong `ETag` of `"face-{faceId}-{updatedAt}"`, where
        updatedAt is the face row's change signal in unix seconds --
        cluster moves bump it, and re-detection replaces the face row
        outright. A matching `If-None-Match` answers 304 with the
        same validators and no body. Conditional requests and byte
        ranges otherwise follow the Go standard library's
        `ServeContent` semantics.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: faceId
          in: path
          required: true
          description: Identifier of the face to crop.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The 256x256 AVIF face crop.
          headers:
            ETag:
              description: |
                Strong entity tag: `face-{faceId}-{updatedAt}` -- the
                face row's id with its change signal (unix seconds),
                quoted. The derivation is deterministic, so one signal
                always renders the same bytes.
              schema:
                type: string
              example: '"face-0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71-1777636800"'
            Cache-Control:
              description: |
                The crop is private to the caller and a pure function
                of the face row and its asset's view derivative, so
                clients may cache it for a year.
              schema:
                type: string
              example: private, max-age=31536000, immutable
          content:
            image/avif:
              schema:
                type: string
                format: binary
        '304':
          description: |
            The `If-None-Match` value matched the entity tag; the
            cached copy is current. The response carries the same
            `ETag` and `Cache-Control` validators and no body.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie or
            bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such face for this caller: the face id is unknown, its
            asset is not visible to the caller (another account's,
            trashed, hidden, or a Live Photo component), or the
            asset's view derivative does not exist yet -- all
            indistinguishable by design; the web renders a skeleton
            placeholder until the pixels exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users:
    get:
      operationId: listInstanceUsers
      tags:
        - users
      summary: The instance's member list.
      description: |
        The minimal member list of the instance: one entry per
        account, `email` ascending. Any authenticated account may
        enumerate it -- the family-instance posture: the accounts
        of a shared photo home are not secret from one another, and
        the album share dialog's pick list (the owner choosing whom
        to grant) is the list's first consumer.

        The entries carry exactly the identity a pick list renders:
        `id`, `email`, `role` and `isDisabled` -- no display name,
        no timestamps, and a password hash never appears in any
        response. The disabled switch rides the entry so callers
        can present accounts that cannot sign in for what they are
        (granting to one still answers 400 through the share
        endpoint's own target rule).

        The list is small by construction (a family instance holds
        a handful of accounts) and grows only through the admin
        surface's own create endpoint, so it answers every account
        in one response: there is no pagination, no filtering and
        no ordering parameter. This is NOT the admin management
        face (`GET /admin/users`): it is the minimal, non-managing
        pick list every authenticated account may read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            Every account of the instance, `email` ascending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              examples:
                familyInstance:
                  summary: The wizard's admin and one member account.
                  value:
                    users:
                      - id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                        email: ada@example.com
                        role: admin
                        isDisabled: false
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        email: grace@example.com
                        role: user
                        isDisabled: false
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users:
    get:
      operationId: listUsers
      tags:
        - admin
      summary: List the instance's accounts.
      description: |
        The user management listing of the admin surface: every
        account of the instance with its role and its disabled
        switch, oldest first. The listing selects only the safe
        columns -- a password hash never appears in any admin
        response.

        The list is small by construction (a family instance holds a
        handful of accounts) and grows only through this surface's
        own create endpoint, so it answers every account in one
        response: there is no pagination, no filtering and no
        ordering parameter. Account rows never disappear (deleting
        an account together with its data is a later milestone's
        disposal flow), so a refetch after any write reconciles the
        list completely.

        The endpoint is admin-only: the session middleware
        authenticates the caller like every authed route, and a
        caller whose role is not `admin` answers 403 AUTH_FORBIDDEN
        -- a code distinct from the 401 family, because the caller
        is signed in, just not entitled to this surface.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            Every account of the instance, oldest first (the
            first-run wizard's administrator leads a fresh
            instance's list).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
              examples:
                familyInstance:
                  summary: The wizard's admin and one disabled member account.
                  value:
                    items:
                      - id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                        name: ada@example.com
                        email: ada@example.com
                        role: admin
                        isDisabled: false
                        createdAt: '2026-10-29T08:30:00Z'
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        name: Grace Hopper
                        email: grace@example.com
                        role: user
                        isDisabled: true
                        createdAt: '2026-10-30T11:04:05Z'
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createUser
      tags:
        - admin
      summary: Create one account.
      description: |
        The account creation of the admin surface, the management
        counterpart of the first-run wizard: an administrator
        provisions another account -- a family member's login, or a
        second administrator. The account rules mirror the wizard's
        exactly: the email is parsed and lower-cased as the login
        identity, the password is stored only as an Argon2id hash
        and never appears in any response, the id is a fresh UUIDv7,
        and the account's sync album -- the core backup stream every
        upload lands in and the timeline aggregates -- is created in
        the SAME transaction, so the new account can take uploads
        the moment it exists (a second creation point of the same
        wiring the wizard uses). The wizard's one-time guarantee is
        NOT part of this endpoint; it exists exactly because an
        administrator already does.

        The role defaults to `user` when omitted; creating another
        administrator is the same request with `role: "admin"`. A
        duplicate email answers 409 USER_EMAIL_TAKEN -- the address
        is the account identity, unique instance-wide, and the login
        lookup depends on that uniqueness.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
            examples:
              familyMember:
                summary: A plain member account.
                value:
                  name: Grace Hopper
                  email: grace@example.com
                  password: correct horse battery staple
              secondAdmin:
                summary: Another administrator.
                value:
                  name: Ada Lovelace
                  email: ada@example.com
                  password: correct horse battery staple
                  role: admin
      responses:
        '201':
          description: |
            The account exists, its sync album with it. The response
            describes the created account; `isDisabled` is false by
            construction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
              examples:
                createdMember:
                  summary: The new member account.
                  value:
                    id: 0192f5b2-6c7d-8e9f-a0b1-2c3d4e5f6070
                    name: Grace Hopper
                    email: grace@example.com
                    role: user
                    isDisabled: false
                    createdAt: '2026-10-31T09:15:00Z'
        '400':
          description: |
            The request body is not a valid account payload: a
            missing or malformed email, a password outside the 8-128
            rune bound, a name past 100 runes, or a `role` outside
            the enum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: Missing or invalid fields.
                  value:
                    code: VALIDATION_FAILED
                    message: invalid account payload
                    details:
                      fields:
                        - password
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '409':
          description: |
            An account with this email already exists; the address is
            the account identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailTaken:
                  value:
                    code: USER_EMAIL_TAKEN
                    message: an account with this email already exists
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags:
        - admin
      summary: Toggle one account's disabled switch.
      description: |
        The enable/disable switch of the admin surface: an
        administrator locks an account out of the instance (or lets
        it back in) without deleting the account or any of its data.
        The switch is enforced by the session middleware on EVERY
        request, which is what pins its observable semantics:

        - Disabling takes effect with the account's next request: an
          existing session of the account answers 401 from then on
          (byte-identical with any other authentication failure) and
          sign-in is refused the same way. The session rows
          themselves are not deleted -- disabling revokes their
          authority, not their existence.
        - Re-enabling restores the account's unexpired sessions
          without a new sign-in; a session that lapsed its own
          expiry while the account was disabled is gone for good.

        The write is idempotent -- setting the current value again
        answers 200 with the unchanged account -- and the response
        is the account after the write, so the client adopts it as
        the fresh state without a refetch.

        An administrator cannot disable their own account: the last
        admin locking themselves out would strand the admin surface,
        so the request answers 400 VALIDATION_FAILED naming the id.
        Nothing stops an admin from disabling ANOTHER administrator;
        the last enabled admin is the instance's line of defense.

        The id must name an account. Account ids are enumerable
        through this surface's own listing, so there is no
        anti-enumeration pairing here: an unknown id (a stale list
        on the client) answers 404 USER_NOT_FOUND.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the account.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPatch'
            examples:
              disable:
                summary: Disable an account.
                value:
                  isDisabled: true
              reEnable:
                summary: Let a disabled account back in.
                value:
                  isDisabled: false
      responses:
        '200':
          description: |
            The account after the write; the client adopts it as the
            fresh state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
              examples:
                disabled:
                  summary: The account is now disabled.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    name: Grace Hopper
                    email: grace@example.com
                    role: user
                    isDisabled: true
                    createdAt: '2026-10-30T11:04:05Z'
        '400':
          description: |
            The request body is not a valid toggle payload, or the id
            names the caller's own account (self-disable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                selfDisable:
                  summary: The caller named their own account.
                  value:
                    code: VALIDATION_FAILED
                    message: an administrator cannot disable their own account
                    details:
                      fields:
                        - id
                validationFailed:
                  summary: Malformed body.
                  value:
                    code: VALIDATION_FAILED
                    message: request body must be valid JSON
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '404':
          description: No account with this id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userNotFound:
                  value:
                    code: USER_NOT_FOUND
                    message: no account with this identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/models/download:
    post:
      operationId: downloadModels
      tags:
        - admin
      summary: Start the default model group's download.
      description: |
        The model download trigger of the admin surface: the default
        group's models -- pinned by the manifest with upstream URLs and
        sha256 digests -- are downloaded, verified and registered, and
        each model activates into its slot when the slot is still
        empty. The request body is deliberately empty: the default
        group is the only group v1 downloads.

        The endpoint is idempotent. A run that is still in flight
        (state `queued` or `running`) answers 200 with its identifier
        and nothing new is started; so does the most recent finished
        run -- a repeated click neither re-downloads a landed group
        nor piles up jobs, and the recovery of a failed run belongs to
        the job's own retries. Only a first call -- no run of this kind
        at all -- creates one and answers 202.

        The run's progress is observable two ways: the `job_runs` row
        of the returned identifier (kind `model_download`, `total` and
        `done` carrying the group's pinned byte counts) and the
        `job.started` / `job.progress` / `job.finished` events on the
        activity stream, the progress events throttled to at most one
        per second.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            A model download run already exists -- one that is still in
            flight (`queued` or `running`), or, when none is, the most
            recent finished one. Its identifier is returned and NO new
            run is created or enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDownloadResponse'
              examples:
                inFlight:
                  summary: The run currently downloading.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '202':
          description: |
            The download run was created (state `queued`, `total`
            carrying the group's pinned byte count) and the model
            download job enqueued. The worker flips the run to
            `running` when the download begins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDownloadResponse'
              examples:
                started:
                  summary: The freshly created run.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: |
            The download run could not be started: no job queue is
            wired to the API surface, or creating the run failed. The
            run itself, once started, reports its own failures through
            its `job_runs` row (state `failed`) -- this code is the
            start failure, not the download failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                downloadFailed:
                  value:
                    code: MODEL_DOWNLOAD_FAILED
                    message: the model download could not be started
  /admin/models:
    get:
      operationId: listModels
      tags:
        - admin
      summary: List the registered models and the download run's state.
      description: |
        The model management listing of the admin surface: every
        registered model of the instance with its facts, its
        activation state and the presence of its files, plus the most
        recent model download run as the summary the model page's
        progress bar renders.

        Every model row of the `models` table appears, grouped by slot
        then id -- including a model whose weights went missing, which
        lists with `filesPresent: false` so the administrator can see
        and clean it up. `filesPresent` is a presence probe only (the
        on-disk manifest is readable and every file it pins exists);
        the sha256 verification itself is the activation's and the
        session loader's business, never the listing's. `license`,
        `notice` and `inputSize` come from the model's on-disk
        manifest, `dim` and `params` from the registered row (which
        the download and the scan keep in step with that manifest);
        `dim` and `inputSize` are null when the model declares none,
        `license` is empty and `notice` null when the manifest is
        unreadable; `isActive` comes from the table.

        `download` is the most recent `model_download` run of whatever
        state -- the run the download endpoint's idempotence would
        return -- or null before the first download was ever started.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            Every registered model plus the download summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
              examples:
                oneActiveModel:
                  summary: One active clip model and a finished download.
                  value:
