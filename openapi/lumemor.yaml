openapi: 3.1.0
info:
  title: lumemor API
  version: 0.1.0
  summary: Instance API of a self-hosted family photo library.
  description: |
    The single source of truth for the lumemor instance API. One contract
    generates the Go server stubs, the TypeScript web client types and the
    Flutter Dart client; hand-written bindings must not drift from it.

    Conventions shared by every endpoint:

    - All paths are served under the `/api/v1` prefix. Breaking changes bump
      the prefix to `/api/v2`; `v1` stays compatible across at least two
      major releases.
    - Errors use a stable envelope with a machine-readable `code`; `message`
      is an English technical description for debugging and is never
      localized. Client UIs translate `code` through their i18n tables
      (translation key = the lowercase error code).
    - Web clients authenticate with the `lumemor_session` cookie issued
      by `POST /auth/login`; mobile clients hold the bearer token issued
      by `POST /auth/pairing/consume` and send it as
      `Authorization: Bearer`. Both credentials front the same session
      records.
    - System timestamps (`createdAt`, ...) are RFC 3339 UTC (`Z`).
    - IDs are UUIDv7.
  contact:
    name: lumemor contributors
    url: https://github.com/welpher/lumemor
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
    description: Instance-local API served by the Go binary.
tags:
  - name: admin
    description: 'Instance administration by administrators: account
      management of the users surface, the instance settings
      (the storage template, the trash retention, the video
      transcoding profile, the release check, the map tile source
      and the model download policy), the release check''s own read
      and manual run, and the model and job surfaces.'
  - name: albums
    description: 'The album surface: the wall of the caller''s own and
      shared albums, one album''s detail with its keyset-paged items,
      the write faces -- the directory album creation (the
      administrator''s own), the memory creation (every member''s
      own), the property patch, the delete and the membership
      curation -- the owner''s
      sharing face, granting and revoking the view-only ACL, and the
      caller''s per-user timeline preference over their own directory
      and shared albums. The caller''s own sync album surfaces here
      read-only -- the pinned default card on the wall and the
      detail''s view -- while every write face refuses sync albums:
      system-managed, the timeline is their feed and never their
      edit surface.'
  - name: assets
    description: 'Photo and video assets: upload with idempotent three-state
      semantics and device idempotency lookup.'
  - name: auth
    description: Login, session management and device pairing.
  - name: events
    description: Server-sent activity stream.
  - name: people
    description: 'The people surface: named people, unnamed face clusters,
      per-cluster detail and face crop thumbnails, every view scoped to
      the calling user''s visible assets and private labels.'
  - name: places
    description: 'The places surface: the caller''s city grouping over
      GeoNames reference data, every count and cover scoped to the
      calling user''s visible assets, and the map''s client-side tile
      configuration the grouping''s map view renders over.'
  - name: search
    description: 'The unified search: one text box driving the merged
      full-text and semantic paths over the caller''s visible assets,
      the filter-bar parameters, and the honest facet counts of the
      current filtered set minus each dimension.'
  - name: server
    description: Instance discovery and first-run setup.
  - name: tags
    description: 'The tags surface: the caller''s private vocabulary and
      its batch assignment to assets. Every tag, every count and every
      assignment row is per-user state: another account''s tags
      never surface anywhere, and the asset detail''s tags array
      carries the calling user''s own tags only.'
  - name: users
    description: 'The user surface: the caller''s own account through the
      me-scoped settings endpoints (profile, password, appearance,
      download preferences and signed-in devices -- the session IS
      the identity, no userId parameter anywhere), plus the minimal
      authenticated member enumeration of the family instance -- the
      share dialog''s pick list.'
paths:
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Exchange credentials for a web session.
      description: |
        The login endpoint of web clients: a valid email and password
        create a new web session. The session credential is the
        `lumemor_session` cookie set by this response (HttpOnly,
        SameSite=Strict, Secure over HTTPS); the body describes the
        session for the account view and the device list. Mobile
        devices never log in here -- they pair through
        `POST /auth/pairing/consume` and hold a bearer token instead.

        Web sessions slide their expiry by 30 days on use. Failed
        attempts are rate limited per address and account: after a
        burst of failures the endpoint answers 429 and the lockout
        grows with each further attempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            A web session was created. The credential travels in the
            Set-Cookie header and is not repeated in the body.
          headers:
            Set-Cookie:
              description: |
                Session cookie of the new web session: HttpOnly,
                SameSite=Strict, Secure when the instance is reached
                over HTTPS, sliding 30-day expiry.
              schema:
                type: string
              example: lumemor_session=<opaque>; Path=/; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              examples:
                browserSession:
                  summary: A browser that just signed in.
                  value:
                    id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: web
                    userId: 0192f2a0-1a2b-7c3d-4e5f-60718293a4b5
                    role: admin
                    deviceName: Firefox on macOS
                    createdAt: '2026-10-29T08:30:00Z'
                    lastSeenAt: '2026-10-29T08:30:00Z'
                    expiresAt: '2026-11-28T08:30:00Z'
        '400':
          description: |
            The request body is not a valid login payload, for example
            a malformed email or a missing password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: Missing or invalid fields.
                  value:
                    code: VALIDATION_FAILED
                    message: password is required
                    details:
                      fields:
                        - password
        '401':
          description: The credentials do not match an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: invalid email or password
        '429':
          description: |
            Too many failed attempts for this address and account; the
            lockout grows with each further attempt.
          headers:
            Retry-After:
              description: |
                Seconds until the lockout ends and another attempt is
                accepted; clients must not retry before it elapses.
              schema:
                type: integer
              example: 900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rateLimited:
                  value:
                    code: AUTH_RATE_LIMITED
                    message: too many failed attempts, retry later
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Revoke the current session.
      description: |
        Signs the caller out by revoking the session that
        authenticates the request -- the web cookie session and the
        mobile bearer session are the same session records. On web
        clients the response also clears the session cookie. A request
        made with an already-revoked session fails authentication with
        401 before reaching this handler.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: The session was revoked; the response has no body.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/sessions:
    get:
      operationId: listSessions
      tags:
        - auth
      summary: List the caller's active sessions.
      description: |
        Returns every active session of the authenticated user across
        devices -- web cookie sessions and mobile bearer sessions --
        most recently used first. The device management view (signing
        out other devices) is this list plus
        `DELETE /auth/sessions/{id}`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions of the caller, most recently used first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
              examples:
                mixedDevices:
                  summary: A browser and a paired phone.
                  value:
                    - id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                      kind: web
                      userId: 0192f2a0-1a2b-7c3d-4e5f-60718293a4b5
                      role: admin
                      deviceName: Firefox on macOS
                      createdAt: '2026-10-01T08:30:00Z'
                      lastSeenAt: '2026-10-29T21:05:00Z'
                      expiresAt: '2026-11-28T21:05:00Z'
                    - id: 0192f3b2-4c5d-7e8f-8a9b-0c1d2e3f4a5b
                      kind: mobile
                      userId: 0192f2a0-1a2b-7c3d-4e5f-60718293a4b5
                      role: admin
                      deviceName: Pixel 9
                      createdAt: '2026-10-02T10:12:00Z'
                      lastSeenAt: '2026-10-28T18:40:00Z'
                      expiresAt: null
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags:
        - auth
      summary: Revoke one of the caller's sessions.
      description: |
        Signs out one device by revoking the session with the given
        id, for example from the device management list. Sessions are
        scoped to their owner and the delete follows set semantics:
        an id that is unknown, belongs to another user, or is already
        revoked still answers 204, without revealing whether such a
        session exists. Revoking the session of the current request
        behaves like logout.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the session to revoke.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The session is revoked (or never was); the response has no
            body.
        '400':
          description: |
            The path id is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: Malformed session id.
                  value:
                    code: VALIDATION_FAILED
                    message: invalid request parameter
                    details:
                      fields:
                        - id
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/pairing/token:
    post:
      operationId: createPairingToken
      tags:
        - auth
      summary: Create a one-time device pairing token.
      description: |
        Issues the secret behind the add-a-family-device QR code: a
        signed-in user opens the pairing page, and the new device scans
        the rendered code and redeems it at
        `POST /auth/pairing/consume` to gain a session of that user.

        The token encodes 128 random bits as a URL-safe string, can be
        consumed once within five minutes, and is stored only as a
        hash, so a leaked database cannot redeem it. Creation is rate
        limited per user to stop farming QR codes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The pairing token; render it as a QR code immediately, it
            expires within five minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingTokenResponse'
              examples:
                freshToken:
                  summary: A token valid for five minutes.
                  value:
                    token: q73x9QmV2pZ8sL4wR6tY0A
                    expiresAt: '2026-10-29T09:00:00Z'
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '429':
          description: |
            The user exhausted the pairing token budget; retry after
            it resets.
          headers:
            Retry-After:
              description: |
                Seconds until the daily budget resets at UTC
                midnight; clients must not retry before it elapses.
              schema:
                type: integer
              example: 3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rateLimited:
                  value:
                    code: AUTH_RATE_LIMITED
                    message: pairing token budget exhausted
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/pairing/consume:
    post:
      operationId: consumePairingToken
      tags:
        - auth
      summary: Exchange a pairing token for a mobile session.
      description: |
        Completes device pairing: the mobile app scans the QR code and
        posts the token together with its device metadata. The server
        burns the one-time token and returns the bearer credential of
        a new mobile session of the user who created the token.

        Bearer sessions never expire; the app holds the token until
        the session is revoked -- from the device list, by logging the
        device out, or by a password change, which revokes every
        session of the user. The server stores only the hash of the
        token, so it appears exactly once, in this response; a device
        that loses it must pair again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingConsumeRequest'
      responses:
        '200':
          description: |
            The mobile session was created; `session.kind` is always
            `mobile` here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BearerSession'
              examples:
                pairedPhone:
                  summary: A phone that just paired.
                  value:
                    token: 8N3Jz5xqKv2RtW9mY4bC7dFgH1jL6p0s
                    session:
                      id: 0192f3b2-4c5d-7e8f-8a9b-0c1d2e3f4a5b
                      kind: mobile
                      userId: 0192f2a0-1a2b-7c3d-4e5f-60718293a4b5
                      role: admin
                      deviceName: Pixel 9
                      createdAt: '2026-10-29T08:31:00Z'
                      lastSeenAt: '2026-10-29T08:31:00Z'
                      expiresAt: null
        '400':
          description: |
            The request body is not a valid pairing payload, for
            example a missing device name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: Missing or invalid fields.
                  value:
                    code: VALIDATION_FAILED
                    message: deviceName is required
                    details:
                      fields:
                        - deviceName
        '401':
          description: |
            The token is unknown, expired or already consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenInvalid:
                  value:
                    code: PAIRING_TOKEN_INVALID
                    message: pairing token is invalid or expired
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /events:
    get:
      operationId: getEvents
      tags:
        - events
      summary: Stream instance activity over server-sent events.
      description: |
        The activity stream of the instance, authenticated like the
        REST API: the web session cookie and the mobile bearer token
        both open the stream.

        Every event is one `text/event-stream` block: `event:` carries
        the event name, `id:` a monotonically increasing number, and
        `data:` the JSON payload -- the resource id plus a summary of
        the changed fields. Event names follow
        `<resource>.<past-tense verb>`:

        - `asset.uploaded`, `asset.ready`, `asset.added`,
          `asset.updated`, `asset.trashed`, `asset.restored`,
          `asset.deleted`
        - `album.created`, `album.updated`, `album.deleted`,
          `album.items-changed`, `album.shared`, `album.unshared`
        - `auth.login_failed`
        - `face.clustered`
        - `job.started`, `job.progress`, `job.finished`
        - `pairing.token_created`
        - `person.labeled`, `person.unlabeled`,
          `person.birthdate_updated`, `person.avatar_updated`,
          `person.merged`, `person.face_moved`,
          `person.face_clustered`, `person.face_detached`
        - `session.started`, `session.revoked`
        - `server.settings-changed`

        The `person.*` events report the people surface's label,
        entity-attribute (birth date, avatar), merge and face-write
        writes. Every payload carries ONLY the acting user's `userId`
        beside the cluster (or face) id: the label text and the
        birth date are state the subscribers refetch, never bus
        payload. A subscriber filters by the ids it renders, never by
        another account's change. `person.merged` carries the
        dissolved source cluster ids comma-joined as
        `mergedClusterIds`, `person.face_moved` carries the face's
        new `clusterId`, `person.face_clustered` the newly created
        cluster's id, and `person.face_detached` the cluster the face
        left.

        The `album.*` events report the album write surface: the
        directory album's and the memory's creation
        (`album.created`), the property patch (`album.updated`), the
        delete (`album.deleted`), the membership writes
        (`album.items-changed`) and the audience writes
        (`album.shared`, `album.unshared`). Every payload carries
        ONLY the album's id and one user's `userId`: titles,
        covers, the deletability switch, the source path and
        the membership itself are album state the subscribers
        refetch, never bus payload. `album.updated` fires on every
        successful patch (the convergent refetch makes the
        unconditional fire harmless), `album.items-changed` exactly
        when a membership write changed at least one row (the
        memory's curation arms, or the rescan's add arm growing the
        set), and
        `album.shared`/`album.unshared` exactly when the audience
        write (or a creation's initial audience) landed or removed a
        row -- one event per row transition, every idempotent no-op
        stays silent. On the two audience events the `userId` is
        the GRANTEE whose view of the album changed, not the acting
        owner: the owner is derivable server-side, the grantee is
        the state that changed, and the grant time and the grantee's
        email never ride the bus.

        The timeline-preference writes publish nothing at all: the
        per-user preference is self-affecting state -- the caller's
        own timeline is the only view that changes, and their own
        response carries the new value, so no other session has
        anything to refetch.

        The `asset.added` event reports the directory rescan's add
        arm: one event per file the scan ingested by reference (the
        row, its membership and its pipeline jobs landed), the same
        id-plus-kind payload every asset event carries. The rescan's
        other two arms reuse the family's existing transitions: the
        vanish arm fires `asset.trashed` (the row's state transition
        -- though the orphan never appears in the trash view, the
        file being the source's own), and the change arm fires
        `asset.updated` (the snapshot changed and the metadata
        pipeline re-runs). A rescan that changed nothing publishes
        none of them. The membership the add arm grew announces
        through `album.items-changed` exactly when at least one
        membership row landed -- the same predicate the removal arm
        fires under, widened to both directions of the membership
        write.

        The server keeps the last five minutes of events in a ring
        buffer. Browser EventSource clients reconnect automatically and
        resend `Last-Event-ID`; the server replays everything newer
        than that id, and events that fell out of the ring are skipped.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: |
            The id of the last received event, resent automatically by
            browser EventSource implementations on reconnect. When
            present, the server replays the events newer than this id
            from its five-minute ring buffer; events that fell out of
            the ring are skipped.
          schema:
            type: string
      responses:
        '200':
          description: |
            The stream is open. Each block carries `event: <name>`,
            `id: <n>` and `data: <json payload>`.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: |
            The `Last-Event-ID` header is not a single non-negative
            integer, for example a malformed value or a duplicated
            header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: Malformed or duplicated Last-Event-ID.
                  value:
                    code: VALIDATION_FAILED
                    message: Last-Event-ID must be a non-negative integer
                    details:
                      fields:
                        - Last-Event-ID
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: The event stream could not be started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /server/info:
    get:
      operationId: getServerInfo
      tags:
        - server
      summary: Report instance version and feature switches.
      description: |
        Unauthenticated capability discovery. Clients call it before login to
        locate the API, render the first-run wizard when the instance is not
        yet initialized, and adapt to the features the instance enables.

        `initialized` is derived from the existence of an administrator
        account.
      responses:
        '200':
          description: Instance info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
              examples:
                freshInstance:
                  summary: A fresh instance that has no admin yet.
                  value:
                    version: 0.1.0
                    initialized: false
                    features:
                      faces: true
                      semanticSearch: true
                initializedInstance:
                  summary: An instance whose first-run wizard is done.
                  value:
                    version: 0.1.0
                    initialized: true
                    features:
                      faces: true
                      semanticSearch: false
  /server/setup/admin:
    post:
      operationId: createAdmin
      tags:
        - server
      summary: Create the first administrator account.
      description: |
        One-time first-run wizard endpoint, available only while the instance
        has no administrator. Once an admin exists the endpoint answers 409
        `SETUP_ALREADY_COMPLETED` and the client should route to login.

        The password is stored as an Argon2id hash; it never appears in any
        response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '201':
          description: The administrator account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            The request body is not a valid account payload, for example a
            malformed email or a missing password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: Missing or invalid fields.
                  value:
                    code: VALIDATION_FAILED
                    message: email must be a valid address
                    details:
                      fields:
                        - email
        '409':
          description: An administrator already exists; setup is complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                setupAlreadyCompleted:
                  value:
                    code: SETUP_ALREADY_COMPLETED
                    message: an administrator account already exists
  /server/update-check:
    get:
      operationId: getUpdateCheck
      tags:
        - admin
      summary: Read the instance's release check state.
      description: |
        The instance's release check, read from the cached answer --
        this request never touches the network. The server runs the
        probe itself on the configured cadence (a release feed URL,
        the interval in hours) and this face reports what the last
        probe concluded.

        THE PROBE: one plain HTTPS request for a public document --
        no photo, no EXIF, no embedding, no instance identifier; the
        feed sees the instance's address and nothing else. The check
        can be switched off (a settings switch); the endpoint
        address must be a public one: an address that resolves to a
        loopback, private, link-local or otherwise internal range is
        refused, and redirects are never followed. A refused or
        failed probe is not an error state: `status` turns `unknown`
        and nothing else changes -- the next interval retries.

        THE COMPARISON takes tags only: an optional `v` prefix, then
        the numeric version fields. `up_to_date` and
        `update_available` are the two claims a successful probe can
        make; `latestVersion` carries the feed's tag verbatim. The
        server never downloads or installs an update -- this surface
        only reports that a newer release exists.

        `disabled` means the check does not run: the administrator
        switched it off, or the deployment disabled it at boot. The
        last answer is kept while disabled, so switching the check
        back on resumes from the same state.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The cached state of the release check: the switch in
            force, the verdict of the last probe, the running
            version, the newest tag the feed named (null when no
            probe succeeded) and when the last probe completed
            (null before the first one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckResponse'
              examples:
                upToDate:
                  summary: The last probe found the running release.
                  value:
                    enabled: true
                    status: up_to_date
                    currentVersion: 0.4.1
                    latestVersion: v0.4.1
                    checkedAt: '2026-11-14T09:00:00Z'
                updateAvailable:
                  summary: The feed's newest tag is ahead.
                  value:
                    enabled: true
                    status: update_available
                    currentVersion: 0.4.1
                    latestVersion: v0.5.0
                    checkedAt: '2026-11-14T09:00:00Z'
                unknown:
                  summary: The last probe failed; the state stays quiet.
                  value:
                    enabled: true
                    status: unknown
                    currentVersion: 0.4.1
                    latestVersion: null
                    checkedAt: '2026-11-13T09:00:00Z'
                disabled:
                  summary: The check is switched off.
                  value:
                    enabled: false
                    status: disabled
                    currentVersion: 0.4.1
                    latestVersion: v0.5.0
                    checkedAt: '2026-11-10T09:00:00Z'
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
    post:
      operationId: runUpdateCheck
      tags:
        - admin
      summary: Run the release check now.
      description: |
        The manual check of the settings face: the server probes the
        configured release feed now (the same bounded, refused-
        internal-address, redirect-refusing request the scheduled
        check makes) and answers the fresh state -- the same document
        `GET` serves.

        A failed probe answers 200 with `status: unknown`, exactly as
        the scheduled one would: a check that cannot reach its feed
        is the ordinary case of an offline instance, not a request
        error, and it carries no message. A check that is switched
        off (or disabled by the deployment) answers 200 with
        `disabled` and probes nothing. The probe is bounded
        server-side and well under the request timeout; a slow feed
        lands on `unknown` like any other failure.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The state after the probe: the fresh verdict when it
            succeeded, `unknown` when it failed, `disabled` when no
            check runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckResponse'
              examples:
                probeSucceeded:
                  summary: The probe reached the feed; the tag is newer.
                  value:
                    enabled: true
                    status: update_available
                    currentVersion: 0.4.1
                    latestVersion: v0.5.0
                    checkedAt: '2026-11-14T10:32:00Z'
                probeFailed:
                  summary: The probe failed; the answer stays quiet.
                  value:
                    enabled: true
                    status: unknown
                    currentVersion: 0.4.1
                    latestVersion: null
                    checkedAt: '2026-11-14T10:32:00Z'
                switchedOff:
                  summary: The check is switched off; nothing was probed.
                  value:
                    enabled: false
                    status: disabled
                    currentVersion: 0.4.1
                    latestVersion: v0.5.0
                    checkedAt: '2026-11-10T09:00:00Z'
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /assets:
    post:
      operationId: uploadAsset
      tags:
        - assets
      summary: Upload one photo, optionally with its Live Photo video.
      description: |
        The backup upload endpoint: one photo per request, streamed into
        content-addressed storage while it is read, with the Live Photo
        pairing video riding the same request as a second file part.

        The request body is `multipart/form-data` with these parts:

        - `deviceAssetId` (text, required) -- the stable identity the
          uploading device assigned to the file; together with the
          account it scopes the device idempotency of backups.
        - `fileName` (text, required) -- the original client-side file
          name of the photo, recorded as the asset's
          `originalFilename`.
        - `deviceCreatedAt` (text, optional) -- the capture time the
          device reports, RFC 3339 with offset. It seeds the asset's
          `takenAt` until the metadata pipeline refines it from EXIF.
        - `deviceTimeZone` (text, optional) -- the IANA time zone name
          of the capture location; it feeds the metadata pipeline's
          timezone fallback chain and is not validated at upload.
        - `photo` (file, required) -- the photo bytes.
        - `liveVideo` (file, optional) -- the pairing video of a Live
          Photo; present only together with `photo`.

        Part order is part of the contract: all text fields precede
        every file part, and the `liveVideo` part follows the `photo`
        part. The server streams file parts to disk without buffering
        them, so every field must be known and validated before the
        first file byte is accepted -- a file part arriving before the
        required fields, a text field after a file part, or a
        `liveVideo` without a preceding `photo` answers 400
        `VALIDATION_FAILED`. Each text field value is capped at 1024
        bytes; `deviceAssetId`, `fileName` and `deviceTimeZone` carry
        the length bounds below. The storage extension and the media
        kind derive from the *file part's own* file name, and the
        payload must be consistent with it: a renamed file of another
        type answers 400 `VALIDATION_FAILED`.

        Uploads are idempotent through the owner-scoped checksum:
        re-uploading identical bytes never creates a second asset.
        The outcome is one of three states, discriminated by the
        `state` field of the response body:

        - 201 `created`: no asset with this checksum existed; a new
          asset was created (a Live Photo created two rows, the
          response describes the photo).
        - 200 `duplicate`: an identical asset of the same owner is
          live; that asset is returned.
        - 200 `trashed`: an identical asset of the same owner sits in
          the trash; that asset is returned (with `isTrashed: true`)
          so the client can offer the user restore or save-as-new.

        A Live Photo's motion bytes are content, not a second copy:
        when the `liveVideo` part's checksum already names a LIVE video
        of the same owner, the server reuses that row as the pair's
        motion instead of storing the bytes again. The upload still
        answers 201 `created` for the photo, and the answer's
        `notices` says what happened so the client can tell the user
        (the client MUST surface them). Motion bytes that exist only
        in the trash are never reused and never duplicated: the upload
        answers 409 `ASSET_COMPONENT_CONFLICT`, so the user can decide
        about that trashed video first.

        The reverse direction is answered with a notice, not a
        conflict: uploading a video whose bytes already play as a Live
        Photo's motion hits that hidden component row through the
        checksum or the device identity, and the answer is 200
        `duplicate` -- the content genuinely exists -- carrying
        `LIVE_PHOTO_MOTION_ALREADY_STORED` so the client can say why
        the upload does not list separately. A component in the trash
        keeps the ordinary `trashed` answer (the client's restore /
        save-as dialog already explains it), and a plain live asset
        keeps the ordinary `duplicate` with no notice.

        Each file is capped at the instance's per-file upload limit
        (2 GiB by default); a file over the limit aborts mid-stream
        with 413 `ASSET_TOO_LARGE`. This endpoint takes multipart
        bodies, not JSON, and is deliberately exempt from the API-wide
        JSON body cap; the per-file upload limit governs instead.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: |
                The parts of the upload body. The `fileName` field is
                the photo's original name; the file parts carry their
                own file names, from which the server derives the
                storage extension and media kind.
              required:
                - deviceAssetId
                - fileName
                - photo
              properties:
                deviceAssetId:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Stable device-side identity of the uploaded file.
                  examples:
                    - 'IMG_1234'
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Original client-side file name of the photo.
                  examples:
                    - IMG_1234.jpg
                deviceCreatedAt:
                  type: string
                  format: date-time
                  description: |
                    Capture time reported by the device (RFC 3339 with
                    offset). Optional; when absent the server records
                    the upload time until the metadata pipeline
                    refines it.
                  examples:
                    - '2026-10-13T20:30:00+08:00'
                deviceTimeZone:
                  type: string
                  maxLength: 64
                  description: |
                    IANA time zone name of the capture location, for
                    the metadata pipeline's timezone fallback chain.
                    Not validated at upload time.
                  examples:
                    - Asia/Shanghai
                photo:
                  type: string
                  format: binary
                  description: The photo bytes; their file part name carries the extension.
                liveVideo:
                  type: string
                  format: binary
                  description: |
                    The Live Photo pairing video; present only together
                    with `photo`. The server stores it as a linked
                    component row that never appears in the timeline,
                    and queues its transcode so the pair's motion is
                    playable in the browser.
      responses:
        '201':
          description: |
            The photo asset was created; `state` is `created`. A Live
            Photo also created its linked video component row; the
            response describes the photo asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
              examples:
                freshUpload:
                  summary: A JPEG that just landed.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1234.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    state: created
                    createdAt: '2026-10-29T09:12:00Z'
                    takenAt: '2026-10-13T12:30:00Z'
                    isTrashed: false
                motionAbsorbed:
                  summary: |
                    A Live Photo whose motion bytes already existed as
                    a live standalone video: the pair reused that row,
                    and the notice tells the user where it went.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1235.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 1b4f0e2b7c3d4a5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6
                    state: created
                    createdAt: '2026-10-29T09:14:00Z'
                    takenAt: '2026-10-13T12:31:00Z'
                    isTrashed: false
                    notices:
                      - code: LIVE_PHOTO_MOTION_ABSORBED
                        assetId: 0192f4b2-6c7d-7e8f-9a0b-1c2d3e4f5a60
                        name: IMG_1235.mov
        '200':
          description: |
            The upload hit the owner-scoped checksum idempotency:
            `state` is `duplicate` (an identical live asset) or
            `trashed` (an identical asset in the trash, returned with
            `isTrashed: true` so the client can offer restore or
            save-as-new). The response body is the existing asset. A
            live asset that is a Live Photo's motion component also
            carries a `notices` entry saying the bytes already play
            there; the state stays `duplicate`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
              examples:
                duplicate:
                  summary: A retry of an already uploaded photo.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1234.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    state: duplicate
                    createdAt: '2026-10-29T09:12:00Z'
                    takenAt: '2026-10-13T12:30:00Z'
                    isTrashed: false
                motionAlreadyStored:
                  summary: |
                    A video whose bytes already play as a Live Photo's
                    motion: the upload is a duplicate naming the
                    hidden component, and the notice says why the
                    video no longer lists on its own.
                  value:
                    id: 0192f4b2-6c7d-7e8f-9a0b-1c2d3e4f5a60
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: video
                    originalFilename: IMG_1235.mov
                    fileSize: 1821933
                    mimeType: video/quicktime
                    checksum: 3c5a7e9b1d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e6b8d0f2a4c
                    state: duplicate
                    createdAt: '2026-10-29T09:14:00Z'
                    takenAt: '2026-10-13T12:31:00Z'
                    isTrashed: false
                    notices:
                      - code: LIVE_PHOTO_MOTION_ALREADY_STORED
                        assetId: 0192f4b2-6c7d-7e8f-9a0b-1c2d3e4f5a60
                        name: IMG_1235.mov
                trashed:
                  summary: The same photo, already in the trash.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1234.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    state: trashed
                    createdAt: '2026-10-29T09:12:00Z'
                    takenAt: '2026-10-13T12:30:00Z'
                    isTrashed: true
        '400':
          description: |
            The upload body is structurally or semantically invalid:
            a missing required field, a misordered part, an unknown
            part, a text field over its bound, an unparseable
            `deviceCreatedAt`, or file bytes inconsistent with their
            claimed extension (a renamed file of another type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: A required text field is missing.
                  value:
                    code: VALIDATION_FAILED
                    message: multipart fields must precede file parts
                    details:
                      fields:
                        - deviceAssetId
                rejectedContent:
                  summary: A renamed text file claiming to be a JPEG.
                  value:
                    code: VALIDATION_FAILED
                    message: 'uploaded file rejected: sniffed content type "text/plain; charset=utf-8" is not consistent with extension "jpg"'
                    details:
                      fields:
                        - photo
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '409':
          description: |
            A Live Photo's motion bytes sit in the caller's trash: the
            same video was trashed earlier, and the upload will neither
            reuse an invisible asset nor silently store a duplicate of
            its bytes. Nothing was stored; the client asks the user to
            restore or remove the trashed video and upload the Live
            Photo again. No other upload outcome answers 409.
          content:
            application/json:
