                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
  /admin/models/{slot}/probe:
    post:
      operationId: probeModelSource
      tags:
        - admin
      summary: Probe a model source for one slot.
      description: |
        The first half of a source import: download (or read) the
        candidate model, check it against the slot's contract, and
        stage it -- without touching the slot's active model. The
        answer is 202 with a probeId; the probe itself runs in the
        server's background (a URL download legitimately takes
        minutes) and is read through the probe GET until it settles.

        The body is `multipart/form-data` with these parts:

        - `kind` (text, required) -- `url` or `file`.
        - `url` (text, required for kind `url`) -- the model URL; the
          download lands in the slot's staging area, its bytes are
          never trusted before the digest check.
        - `sha256` (text, optional) -- a digest the bytes must match;
          without it the probe still computes and reports the digest,
          and the save marks the model an unverified source.
        - `file` (file, required for kind `file`) -- the ONNX bytes
          (up to 2 GiB; the sniff reads the content, never the file
          name).

        The checks, in order, every failure naming its own check: the
        digest when one was given; the graph loads (a file that is not
        a readable ONNX model is refused); the input shape and the
        output dimension against the slot's contract -- a mismatch is
        refused naming both numbers. A host that is not on the
        download sources list does NOT refuse: the probe answers
        `warn` (the checks passed, the host is undeclared, the save is
        still the administrator's own act and its use is logged).

        The probe does not register anything: the save endpoint takes
        the probeId, and a probe whose checks failed can never be
        saved.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: slot
          in: path
          required: true
          description: The slot the candidate model would fill.
          schema:
            $ref: '#/components/schemas/ModelSlot'
          example: clip_embed
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: |
                The parts of the probe body. `url` is required when
                `kind` is `url`, `file` when `kind` is `file`.
              required:
                - kind
              properties:
                kind:
                  type: string
                  enum: [url, file]
                  description: Which source the candidate comes from.
                url:
                  type: string
                  description: The candidate model's URL, for kind `url`.
                  example: https://models.example.net/my-clip.onnx
                sha256:
                  type: string
                  description: |
                    The digest the bytes must match, when the caller
                    pins one (64 lowercase hex chars).
                file:
                  type: string
                  format: binary
                  description: The candidate model's bytes, for kind `file`.
      responses:
        '202':
          description: The probe was accepted; read it through the probe GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProbeAcceptedResponse'
              examples:
                accepted:
                  value:
                    probeId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '400':
          description: |
            The body is malformed: the kind is missing or unknown, the
            URL part is absent for kind `url` (or not an absolute
            http/https URL), the file part is absent for kind `file`,
            the slot does not carry file imports (the text tower rides
            the vision tower), or the sha256 is not 64 hex chars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badKind:
                  value:
                    code: VALIDATION_FAILED
                    message: kind must be url or file
                    details:
                      fields:
                        - kind
        '404':
          description: |
            No slot with this name (the slot path is a machine value,
            as the listing returns it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknownSlot:
                  value:
                    code: MODEL_SLOT_UNKNOWN
                    message: no model slot with this name
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
  /admin/models/{slot}/source:
    post:
      operationId: switchModelSource
      tags:
        - admin
      summary: Switch a slot onto a probed source.
      description: |
        The second half of a source import, and the official list's
        switch: the slot is switched onto the source the request
        names, under the slot's lock. The answer is 202 -- the switch
        itself is seconds, the recalculation its semantics demand is
        an async run the task panel owns.

        The body depends on the kind:

        - `builtin` (the official list): `modelId` names the manifest
          entry; nothing was probed because the entry is the
          validated list. A cross-dimension switch of the embed slot
          requires `confirmWipe: true` -- the confirmation is the
          dialog's contract, and the response reports the wipe's facts
          exactly as the activation switch does.
        - `url` or `file` (a custom source): `probeId` names a probe
          that finished OK -- the server never reuses an unverified
          result, a missing or failed probe answers 400. The model is
          registered from the staged bytes (same sha256 reuse: bytes
          already on disk are never stored twice), activated, and the
          slot's recalculation run is enqueued.

        The slot lock: a switch stops being possible while one is in
        flight (409) -- the same-dimension switch is seconds, but the
        recalculation it started is the slot's business, and two
        overlapping switches would race its products. The switch
        refuses to lose the named persons: a face slot's recalculation
        inherits the cluster names by overlap, so the confirm copy
        states what is kept; nothing here deletes a user label.

        A failed switch changes nothing: the slot keeps its previous
        model and its products.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: slot
          in: path
          required: true
          description: The slot being switched.
          schema:
            $ref: '#/components/schemas/ModelSlot'
          example: clip_embed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSourceSwitchRequest'
            examples:
              builtin:
                summary: Switch onto an official-list entry.
                value:
                  kind: builtin
                  modelId: cnclip-vit-b16-vision
              customUrl:
                summary: Switch onto a probed custom URL.
                value:
                  kind: url
                  probeId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
                  confirmWipe: true
      responses:
        '202':
          description: The switch landed; the recalculation, when one is due, is an async run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSourceSwitchResponse'
              examples:
                sameDim:
                  summary: Same-dimension switch, no recalculation due.
                  value:
                    activated:
                      id: my-clip
                      slot: clip_embed
                    dimensionChanged: null
                    wipedEmbeddings: null
                    recalcRunId: null
                crossDim:
                  summary: Cross-dimension switch, the rebuild runs.
                  value:
                    activated:
                      id: my-clip
                      slot: clip_embed
                    dimensionChanged:
                      from: 512
                      to: 768
                    wipedEmbeddings: 120
                    recalcRunId: 0192f8a2-0b1c-2d3e-4f5a-6b7c8d9e0f11
        '400':
          description: |
            The request is malformed or refuses itself: an unknown
            kind, a builtin without `modelId`, a custom source without
            a probeId or with a probe that did not finish OK, a
            cross-dimension switch without `confirmWipe`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                confirmRequired:
                  value:
                    code: MODEL_CONFIRM_REQUIRED
                    message: this switch wipes the slot's products; confirm it first
                probeRequired:
                  value:
                    code: MODEL_PROBE_REQUIRED
                    message: the source must carry a probe that passed
        '404':
          description: |
            No slot with this name, or no builtin model under the
            named id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknownSlot:
                  value:
                    code: MODEL_SLOT_UNKNOWN
                    message: no model slot with this name
        '409':
          description: |
            The slot is locked by a switch already in flight; nothing
            was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slotLocked:
                  value:
                    code: MODEL_SLOT_LOCKED
                    message: a switch of this slot is already in flight
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
  /admin/models/{id}:
    patch:
      operationId: activateModel
      tags:
        - admin
      summary: Activate the model (the model switch).
      description: |
        The activation switch of the admin surface: the model becomes
        the active one of its slot. The request body is an empty JSON
        object -- the path's model identifier is the whole request.

        A same-slot switch runs in one transaction that only flips
        the activation flags: the previous model's products stay in
        the database untouched (multi-generation embeddings and faces
        coexist by their model columns), queries that filter on the
        active model stop seeing them, and switching back revives
        them with zero recompute -- but the newly activated model
        does nothing until its products are rerun.

        Cross-dimension switches of the clip-embed slot are the one
        exception, because a vector column cannot hold two dimensions:
        activating a clip model whose dimension differs from the
        `clip_embeddings` column's current one (read from the
        database catalog, never assumed) clears the table and
        re-types the column to `vector(N)` inside the SAME
        transaction as the flag flip -- the wipe, the new dimension
        and the activation land together or not at all, and a failure
        rolls everything back. The response then reports the switch's
        facts (`dimensionChanged` with the from and to dimensions,
        `wipedEmbeddings` with the number of deleted rows) so the
        admin UI can demand the explicit confirmation a destructive
        switch deserves. The rerun that fills the new model's
        embeddings stays manual: nothing is recomputed here.

        The model's files are verified against their pinned sha256
        digests before anything flips: a model whose files are
        missing or drifted answers 400 MODEL_INVALID and activates
        nothing.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The identifier of the model to activate (the models
            table's slug id, as the listing returns it).
          schema:
            type: string
          example: cnclip-vit-b16-vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                The activation request carries no fields: the path
                parameter is the whole request. Send an empty JSON
                object.
              additionalProperties: false
      responses:
        '200':
          description: |
            The model is now the active one of its slot. On a
            cross-dimension switch of the clip-embed slot the
            response additionally carries `dimensionChanged` and
            `wipedEmbeddings`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelActivateResponse'
              examples:
                sameDimension:
                  summary: A same-dimension switch -- nothing was deleted.
                  value:
                    activated:
                      id: cnclip-vit-b16-vision
                      slot: clip_embed
                crossDimension:
                  summary: A cross-dimension switch -- the wipe is reported.
                  value:
                    activated:
                      id: clip-large-vision
                      slot: clip_embed
                    dimensionChanged:
                      from: 512
                      to: 768
                    wipedEmbeddings: 14002
        '400':
          description: |
            The model's files are missing or do not match their pinned
            sha256 digests: nothing was activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidModel:
                  value:
                    code: MODEL_INVALID
                    message: model files are missing or do not match their pinned digests
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '404':
          description: |
            No model is registered under this identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: MODEL_NOT_FOUND
                    message: no model with this identifier
    delete:
      operationId: deleteModel
      tags:
        - admin
      summary: Delete one registered model.
      description: |
        The removal of a model registration: the row is deleted and
        its model directory (weights plus manifest copy) is removed
        from the models dir. Only a model that is NOT its slot's
        active one can be deleted -- the active model of a slot is
        the pipeline's running configuration, and the removal of it
        is a switch first (the dialog's removal flow switches the
        slot back onto the official entry, then removes).

        A rerun or other job still holding the model's products is
        unaffected: the products reference the model by id and the
        registry's foreign keys keep them resolvable, so a delete of
        a model whose products still exist answers 200 and leaves the
        products to their own lifecycle.

        The model's files are removed from disk after the row is
        deleted; a directory removal failure logs and still answers
        200 (the registration is gone; the leftover directory is
        cleaned by the next scan's refusal).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The identifier of the model to delete.
          schema:
            type: string
          example: my-clip-980020bf
      responses:
        '200':
          description: The model was deleted.
          content:
            application/json:
              schema:
                type: object
                description: The deletion's report.
                required:
                  - deleted
                properties:
                  deleted:
                    type: boolean
              examples:
                deleted:
                  value:
                    deleted: true
        '400':
          description: |
            The model is its slot's active one: switch the slot first
            (the removal flow does).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                activeModel:
                  value:
                    code: MODEL_INVALID
                    message: the active model of a slot cannot be deleted; switch first
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '404':
          description: |
            No model is registered under this identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: MODEL_NOT_FOUND
                    message: no model with this identifier
  /admin/models/{id}/rerun:
    post:
      operationId: rerunModel
      tags:
        - admin
      summary: Start a manual rerun of the active model's slot.
      description: |
        The rerun trigger of the admin surface: one run that redoes
        the slot's ML work over the whole library -- the run that
        fills the newly activated model's products, the manual step
        every model switch deliberately leaves to the administrator
        (a same-dimension switch keeps the old products usable
        immediately; a cross-dimension switch leaves the table empty
        until this run refills it).

        Only the ACTIVE model of a slot can be rerun: products attach
        to the active model, so a rerun of a dormant model would fill
        rows no active-model query could see. The run's scope is
        every image asset that finished its pipeline and is not in
        the trash (ML work belongs after asset readiness, and video
        assets stay out of ML so far); `total` and `done`
        of the run's row count those assets and `failed` the ones
        whose rerun failed -- progress in asset counts, not bytes
        (the model download's row counts pinned bytes and failed
        models; each run's units are its own work's).

        The endpoint is idempotent the way the download endpoint is:
        a rerun of the same slot still in flight (`queued` or
        `running`) answers 200 with its identifier and starts
        nothing. Unlike the download, a FINISHED run never blocks a
        new one -- the rerun is manual, so a second click after a
        completed (or failed) run starts a fresh run.

        The per-asset ML workers of the slots arrive later;
        until a slot's dispatch is wired, a
        rerun of that slot still creates the run but the run fails
        (state `failed`, zero progress) instead of pretending to
        have done work it cannot do.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The identifier of the active model whose slot is rerun
            (the models table's slug id, as the listing returns it).
          schema:
            type: string
          example: yunet-2023mar
      responses:
        '200':
          description: |
            A rerun of the slot is already in flight (`queued` or
            `running`); its identifier is returned and NO new run is
            created or enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRerunResponse'
              examples:
                inFlight:
                  summary: The run currently rerunning the slot.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '202':
          description: |
            The rerun run was created (state `queued`, `total`
            carrying the scope's asset count) and the rerun job
            enqueued. The driver flips the run to `running` when the
            dispatch begins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRerunResponse'
              examples:
                started:
                  summary: The freshly created run.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '400':
          description: |
            The model is registered but is not the active one of its
            slot, or its slot has no rerun at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidModel:
                  value:
                    code: MODEL_INVALID
                    message: only the active model of a slot can be rerun
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '404':
          description: |
            No model is registered under this identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: MODEL_NOT_FOUND
                    message: no model with this identifier
        '500':
          description: |
            The rerun could not be started: no job queue is wired to
            the API surface, or creating the run failed. The run
            itself, once started, reports its own failures through
            its `job_runs` row (state `failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: the rerun could not be started
  /admin/models/scan:
    post:
      operationId: scanModels
      tags:
        - admin
      summary: Register the custom models found in the models dir.
      description: |
        The custom model registration of the admin surface: every
        directory under the instance's models dir that carries a
        `manifest.json` is verified against the digests the manifest
        pins and registered in the models table with source
        `custom`. Directories without a manifest are skipped -- the
        models dir also holds download staging, not every entry is a
        model.

        Scanning registers, it never activates: an administrator
        reviews the registered models and switches them on through
        the activation endpoint. Re-scanning converges: the
        registration is an upsert on the descriptive fields and
        leaves every row's activation state alone. A directory whose
        files drifted from their pinned digests fails the whole scan
        with 400 MODEL_INVALID and registers nothing.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
