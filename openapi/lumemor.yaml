            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetTooLarge:
                  value:
                    code: ASSET_TOO_LARGE
                    message: uploaded file exceeds the instance upload limit
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/timeline:
    get:
      operationId: getTimeline
      tags:
        - assets
      summary: The aggregated timeline, one keyset page at a time.
      description: |
        The aggregated timeline of the caller: the union of the albums
        that feed it -- the caller's sync album (the core backup
        stream, never excludable), the caller's own directory albums,
        and every album shared to the caller regardless of type
        (memory albums included) -- minus the albums the caller
        turned off with the per-user "keep out of the timeline"
        preference (a missing preference row means kept in). The
        caller's own memory albums never feed their own timeline:
        in-stream curation would be pure duplication. One asset
        visible through several albums appears once.

        Every item is live by construction: archived assets, assets in
        the trash, and the component video rows of Live Photos never
        appear.

        `isFavorite` is per-user state: it reports whether the
        CALLING user favorites the asset (the favorites rows the
        batch endpoint writes), whatever the asset's owner -- the
        same item is a favorite for one viewer and a plain tile for
        another.

        Pages are keyset-paginated with an opaque cursor: the response
        carries `nextCursor` exactly when another page exists, and the
        client passes it back as `cursor` to continue after the last
        item of the page. Cursors are stable for the ordering key
        (`takenAt` descending, `id` as the tiebreak); an asset
        uploaded with an older `takenAt` than the cursor appears only
        in a fresh pagination run, never in the current one. The
        first page omits the `cursor` parameter.

        `limit` bounds the page size: absent means the default of
        100, a value over 200 is answered with the maximum of 200,
        and a value below 1 answers 400 `VALIDATION_FAILED`.

        `albumId` narrows the response to that album's own timeline
        instead of the aggregate: the album's items in the same
        ordering and filtering. The caller must be able to see the
        album (own album of any type, or an album shared to the
        caller); an album that does not exist or is not visible
        answers the empty list, not an error, so album ids cannot be
        probed for existence through this endpoint.

        `clusterId` narrows the response to one face cluster's own
        photos -- the person detail's photo wall: the distinct live
        assets carrying at least one of the cluster's faces that the
        caller can see, in the same ordering and per-user favourite
        flags, deduplicated by asset (two faces of the person in one
        photo are one item). The narrows are mutually exclusive: a
        request carrying more than one answers 400
        `VALIDATION_FAILED`. A cluster that does not exist or is not
        visible to the caller answers the empty list, not an error
        -- the same anti-enumeration shape as `albumId`.

        `placeIds` narrows the response to the live assets resolved
        to one of those places (GeoNames ids) -- the place detail's
        photo wall, and the map panel's read for the spot a pin or a
        bubble stands for. Every item passes the same caller-visible
        live filter and carries the same per-user favourite flag as
        the aggregate; an id no caller-visible asset resolves to
        contributes nothing, so the answer is the empty list rather
        than an error.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page; absent on the first
            page. An unparseable value answers 400
            `VALIDATION_FAILED` (cursors are opaque strings produced
            by this endpoint, never assembled by clients).
          schema:
            type: string
          example: GN4WpRPw0AABkvShW2x9jp8KKzxNXm9w
        - name: limit
          in: query
          required: false
          description: |
            Page size: the number of timeline items one response
            carries at most. Defaults to 100; values over 200 are
            answered with 200, values below 1 answer 400.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          example: 100
        - name: clusterId
          in: query
          required: false
          description: |
            Restrict the response to one face cluster's photos (the
            person detail's wall). Mutually exclusive with `albumId`
            and `placeIds`; an unknown or invisible cluster answers
            the empty list.
          schema:
            type: string
            format: uuid
        - name: placeIds
          in: query
          required: false
          description: |
            Restrict the response to assets resolved to one of these
            places (GeoNames ids) -- the place detail's wall and the
            map panel's read. Mutually exclusive with `albumId` and
            `clusterId`; ids no visible asset resolves to answer the
            empty list.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
            maxItems: 200
          style: form
          explode: false
        - name: albumId
          in: query
          required: false
          description: |
            Restrict the response to the timeline of this one album
            (an album the caller owns or that is shared to the caller)
            instead of the aggregate. An unknown or invisible album
            answers the empty list. An album is a reference
            container: its archived members ride the walk (the
            archive removes an asset from the family flows, never
            from the album that holds it). A memory is a family-flow
            surface of its own, so its archived members leave the
            walk exactly like they leave the aggregate -- and for a
            memory shared to the caller the walk honors the re-share
            ground: the items are the members the memory's owner
            currently sees, revalidated at read time (a photo whose
            source visibility died leaves the walk), while the
            memory's owner keeps the plain membership.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            One page of the timeline. `nextCursor` is present exactly
            when another page follows; the last page carries none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
              examples:
                firstPage:
                  summary: A full page with a follow-up cursor.
                  value:
                    items:
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                        kind: image
                        originalFilename: IMG_1234.jpg
                        fileSize: 4821933
                        mimeType: image/jpeg
                        checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        createdAt: '2026-10-29T09:12:00Z'
                        takenAt: '2026-10-13T12:30:00Z'
                        takenAtSource: exif
                        isTrashed: false
                        isArchived: false
                        isFavorite: false
                        isReady: true
                        width: 4032
                        height: 3024
                        durationMs: null
                        blurhash: UHL6aAof00WBWB00ayWB00
                        livePhotoVideoId: null
                    nextCursor: GN4WpRPw0AABkvShW2x9jp8KKzxNXm9w
                lastPage:
                  summary: The final page carries no cursor.
                  value:
                    items:
