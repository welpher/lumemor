        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumPatch'
            examples:
              rename:
                summary: Rename the album.
                value:
                  title: Road trip 2026 -- rerun
              setCover:
                summary: Pin one member as the cover.
                value:
                  coverAssetId: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072
              unlock:
                summary: The unlock -- locked itself is never gated.
                value:
                  locked: false
      responses:
        '200':
          description: |
            The patch landed; the response is the album's wall card
            after the edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumSummary'
              examples:
                renamed:
                  summary: The album after the rename.
                  value:
                    id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6071
                    title: Road trip 2026 -- rerun
                    description: The coastal week in the van.
                    type: virtual
                    locked: false
                    isShared: true
                    coverAssetIds:
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072
                    itemCount: 128
                    updatedAt: '2026-11-05T11:02:00Z'
                    callerRole: owner
        '400':
          description: |
            The request is invalid: the body is not valid JSON or
            carries no field; a present title is empty,
            whitespace-only or spans more than 64 characters; the
            description exceeds its bound; or a present
            `coverAssetId` is not a live member of this album (the
            message key `album_cover_not_member`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                coverNotMember:
                  summary: The cover must be a live member.
