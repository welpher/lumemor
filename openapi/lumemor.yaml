  /admin/derivatives/rebuild:
    post:
      operationId: rebuildDerivatives
      tags:
        - admin
      summary: Start a derivative rebuild run.
      description: |
        The image card's explicit rebuild: one run that re-derives the
        serving copies of every image asset at the settings the
        instance currently carries.

        THE COST IS NEVER SILENT: the image card states what the
        settings change (nothing is recomputed until this run is
        asked for), and the two scopes are the honest pair --

        - `missing` derives only the assets whose current-format
          serving files are absent: a library that has never been
          rebuilt, or one that gained the full-size copy, pays only
          for what it lacks (minutes on a family library).
        - `all` re-derives every image asset at the current settings
          and removes the other encoding format's stale files: the CPU
          belongs to the rebuild for the estimate's duration, and
          browsing is slower while it runs.

        THE RUN IS A JOB: it lists on the task panel with the four
        states, its progress counts the image assets it visited, and
        the pause and window rules that govern thumbnail-class work
        hold it the same way -- a night window that closes stops it at
        the asset it just finished, and the next window resumes from
        there, never from zero.

        The endpoint is idempotent the way the place re-resolution is:
        a rebuild run still in flight (`queued` or `running`) answers
        200 with its identifier and starts nothing; a finished run
        never blocks a new one.

        SETTINGS CHANGES NEVER TRIGGER THIS: saving the image settings
        writes the document only -- the serving copies already on disk
        stay as they are until an explicit rebuild re-derives them.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildDerivativesRequest'
            examples:
              fillMissing:
                summary: Only the assets whose derivatives are absent.
                value:
                  scope: missing
              fullRebuild:
                summary: Every image asset, at the current settings.
                value:
                  scope: all
      responses:
        '200':
          description: |
            A rebuild run is already in flight (`queued` or
            `running`); its identifier is returned and NO new run is
            created or enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildDerivativesResponse'
              examples:
                inFlight:
                  summary: The run already rebuilding.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '202':
          description: |
            The rebuild run was created (state `queued`, `total`
            carrying the image asset count) and its job enqueued. The
            worker flips the run to `running` when the walk begins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildDerivativesResponse'
              examples:
                started:
                  summary: The freshly created run.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '400':
          description: |
            The `scope` field is missing or not one of the enum's two
            values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidScope:
                  value:
                    code: VALIDATION_FAILED
                    message: scope must be one of missing, all
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: |
            The run could not be started: no job queue is wired to
            the API surface, or the enqueue failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /admin/derivatives/rebuild/stop:
    post:
      operationId: stopDerivativesRebuild
      tags:
        - admin
      summary: Stop the in-flight derivative rebuild run.
      description: |
        The task panel's stop for a rebuild in flight: the run's row
        is marked as asked-to-stop, and the driver -- which checks the
        flag between assets -- closes the run at the asset it just
        finished, never mid-asset. The work already done stays on
        disk: a stopped rebuild has paid exactly for the assets it
        re-derived, and the next rebuild's `missing` scope skips
        them.

        The run closes `cancelled` -- the task panel renders the
        cancelled state, not a broken run: the admin asked for this
        ending (E41 shared the flag-closed ending with the task
        panel's per-run cancel, and the two speak one state).

        A stop with no rebuild in flight (the run finished between the
        panel's listing and the click, or none ever started) answers
        409 `REBUILD_NOT_RUNNING`: the flag has nothing to land on.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The stop was recorded against the in-flight run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildDerivativesResponse'
              examples:
                stopping:
                  summary: The run that will close at its next breakpoint.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '409':
          description: |
            No rebuild run is in flight: nothing to stop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notRunning:
                  value:
                    code: REBUILD_NOT_RUNNING
                    message: no derivative rebuild is in flight
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /admin/jobs/{runId}/cancel:
    post:
      operationId: cancelJobRun
      tags:
        - admin
      summary: Cancel one in-flight job run.
      description: |
        The task panel's cancel (E41): asks the named run to end at
        its next chunk boundary. The request itself flags the run
        only -- the run's driver checks the flag BETWEEN chunks (a
        walk page, a rescan batch, one model of a download group) and
        closes the run `cancelled` there, so:

        - The committed portion stays: every chunk already finished
        keeps its work on disk and its count in the run's `done`.
        The response makes no promise about work that has not
        committed yet.
        - An in-flight asset-level job (one decode, one inference,
        one encode) runs to its own end -- the boundary is between
        chunks, never mid-asset.
        - The run's state flips to `cancelled` when the driver
        closes it, and the close rides the task panel's existing
        events (`job.finished`) -- the listing converges through the
        same stream it always converges through. A QUEUED run cancels
        at once (its driver checks the flag before the first chunk).
        - A run that already finished -- succeeded, failed or
        cancelled -- answers 409 `JOB_NOT_CANCELLABLE`: nothing is in
        flight to cancel, and the row's own state is the honest
        answer. An unknown run id answers 404 `JOB_RUN_NOT_FOUND`.

        The cancel takes no request body and answers no body: the
        204 is the flag's whole receipt.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          description: The `job_runs` row identifier of the run to cancel.
          schema:
            type: string
            format: uuid
          example: 0192f8b2-6c7d-8e9f-a0b1-2c3d4e5f6070
      responses:
        '204':
          description: |
            The cancel was recorded against the in-flight run; its
            driver closes it `cancelled` at the next chunk boundary.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '404':
          description: |
            No run carries the id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: JOB_RUN_NOT_FOUND
                    message: no job run carries this id
        '409':
          description: |
            The run already finished: nothing is in flight to
            cancel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notCancellable:
                  value:
                    code: JOB_NOT_CANCELLABLE
                    message: this run has already finished and cannot be cancelled
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /admin/jobs:
