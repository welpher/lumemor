          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
    put:
      operationId: updateImageSettings
      tags:
        - admin
      summary: Save the derivative image settings.
      description: |
        The settings save. Every field is contract-required (an
        omitted one would decode as its zero value and silently
        change the posture), and each value is checked against its
