        (`description`, `isHidden`), which the asset detail view
        renders and the `PATCH` endpoint edits, and the asset's faces
        with the caller's own label of each face's cluster (`faces`),
        which the detail view's people section renders and the people
        write endpoints maintain.

        Access is the caller-visible gate: the asset's owner, and
        every member of an album the caller sees -- their own sync
        and directory albums plus every album shared to them (the
        same album union the timeline aggregates). An id none of
        those cover answers the same 404 `ASSET_NOT_FOUND` as an id
        that does not exist, byte for byte, so asset ids cannot be
        enumerated. The owner's reads keep their current shape: a
        trashed or hidden asset answers 200 (`isTrashed`, `isHidden`
        honest) because the owner's album memberships outlive both
        marks; for a sharee the same holds by id -- the album views
        and the timeline list live members only, so a hidden or
        trashed shared asset surfaces nowhere but stays readable at
        its known id until the share itself goes.

        A trashed asset answers 200 with `isTrashed: true` -- the
        trash view reads the detail the same way. The component video
        row of a Live Photo is readable by its id (the detail, the
        original download and the transcoded play stream resolve it
        through `livePhotoVideoId`; it counts a transcode job of its
        own) but never appears in the timeline.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The asset detail. `isReady` is true once the whole pipeline
            (metadata and serving copies) completed; until then the
            pipeline-dependent fields stay null and the client waits
            for the `asset.ready` event. `exif` is always present; its
            fields are null until the metadata job wrote the
            extraction. `faces` is always present, ordered by score
            descending with the face id as the tiebreak, each entry
            carrying the caller's own label state of the face's
            cluster; the `person.*` events on the stream converge it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
              examples:
                readyImage:
                  summary: A processed JPEG whose pipeline completed.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1234.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    createdAt: '2026-10-29T09:12:00Z'
                    takenAt: '2026-10-13T12:30:00Z'
                    takenAtSource: exif
                    isTrashed: false
                    isHidden: false
                    description: Sunset over the lake, our first evening there.
                    isReady: true
                    width: 4032
                    height: 3024
                    durationMs: null
                    blurhash: UHL6aAof00WBWB00ayWB00
                    livePhotoVideoId: null
                    exif:
                      cameraMake: Lumemor
                      cameraModel: Golden Camera
                      lens: Golden 35mm f/2.8
                      iso: 200
                      aperture: 2.8
                      shutter: 1/250
                      focal: 35
                      lat: 48.8584
                      lon: 2.2945
                      alt: 35
                      tzOffset: '+05:30'
                    faces:
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                        score: 0.97
                        thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
                        clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f80
                        label:
