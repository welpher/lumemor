components:
  schemas:
    LoginRequest:
      type: object
      description: Credentials of `POST /auth/login`.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Login address of the account.
        password:
          type: string
          format: password
          description: Account password; never echoed in any response.
          examples:
            - correct horse battery staple
    SessionInfo:
      type: object
      description: |
        One authenticated session of a user. Web sessions authenticate
        through the `lumemor_session` cookie and mobile sessions
        through their bearer token; both are the same session records
        and appear together in `GET /auth/sessions`.
      required:
        - id
        - kind
        - createdAt
        - lastSeenAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the session.
        kind:
          type: string
          description: |
            Where the session credential lives: `web` sessions ride
            the `lumemor_session` cookie and slide their expiry by 30
            days on use; `mobile` sessions ride a bearer token and are
            revoked explicitly.
          enum:
            - web
            - mobile
        deviceName:
          type: string
          description: |
            Human-readable device label of the session. For web
            sessions it is the browser user agent captured at login;
            mobile sessions carry the name supplied during pairing.
        createdAt:
          type: string
          format: date-time
          description: When the session was created (RFC 3339 UTC).
        lastSeenAt:
          type: string
          format: date-time
          description: When the session was last used (RFC 3339 UTC).
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the session expires (RFC 3339 UTC). Null for bearer
            sessions, which are revoked explicitly instead of
            expiring.
    PairingTokenResponse:
      type: object
      description: The one-time pairing token issued by `POST /auth/pairing/token`.
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: |
            One-time pairing secret, 128 random bits as a URL-safe
            string. Render it as a QR code and never store or log it;
            the server keeps only its hash.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the token expires (RFC 3339 UTC); five minutes after
            issuance.
    PairingConsumeRequest:
      type: object
      description: Payload of `POST /auth/pairing/consume`.
      required:
        - token
        - deviceName
        - deviceId
      properties:
        token:
          type: string
          description: The pairing token read from the QR code.
        deviceName:
          type: string
          description: |
            Human-readable device label shown in the session list,
            for example `Pixel 9`.
        deviceId:
          type: string
          description: |
            Stable client-generated identifier of the physical device,
            for example a UUID the app persists; it lets the server
            recognize the same device across pairings.
    BearerSession:
      type: object
      description: |
        The mobile session minted by consuming a pairing token: the
        bearer credential plus the session it authenticates.
      required:
        - token
        - session
      properties:
        token:
          type: string
          description: |
            Bearer credential of the new mobile session; send it as
            `Authorization: Bearer <token>`. It appears only in this
            response, and the server stores only its hash: a device
            that loses it must pair again.
        session:
          $ref: '#/components/schemas/SessionInfo'
    ServerInfo:
      type: object
      description: Instance capability report served by `GET /server/info`.
      required:
        - version
        - initialized
        - features
      properties:
        version:
          type: string
          description: Server version (semantic versioning).
          examples:
            - 0.1.0
        initialized:
          type: boolean
          description: |
            True once the instance has an administrator account. Clients use
            it to decide between the first-run wizard and the login screen.
        features:
          type: object
          description: |
            Instance feature switches (model slots, search modes, pairing).
            Unknown keys must be ignored by clients.
          additionalProperties:
            type: boolean
          examples:
            - faces: true
              semanticSearch: true
    CreateAdminRequest:
      type: object
      description: Payload of the first-run wizard (`POST /server/setup/admin`).
      required:
        - email
        - password
      properties:
        name:
          type: string
          description: Optional display name; defaults to the email address.
        email:
          type: string
          format: email
          description: Login address of the administrator.
        password:
          type: string
          format: password
          description: Account password; stored only as an Argon2id hash.
          examples:
            - correct horse battery staple
    UserRole:
      type: string
      description: |
        Authorization role of an account: `admin` is granted by the
        first-run wizard or by another administrator, `user` is the
        default of every other creation path.
      enum:
        - admin
        - user
    AdminUserResponse:
      type: object
      description: |
        One account as the admin surface returns it: the identity and
        role columns together with the disabled switch this surface
        toggles. The password hash is never part of an admin
        response.
      required:
        - id
        - name
        - email
        - role
        - isDisabled
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
          description: Display name.
        email:
          type: string
          format: email
          description: Login address.
        role:
          $ref: '#/components/schemas/UserRole'
        isDisabled:
          type: boolean
          description: |
            The disabled switch. A disabled account loses the
            authority of its sessions and its sign-in until
            re-enabled; its data stays untouched.
        createdAt:
          type: string
          format: date-time
          description: Creation time (RFC 3339 UTC).
    AdminUserListResponse:
      type: object
      description: |
        The user management listing: every account of the instance,
        oldest first, in one bounded response.
      required:
        - items
      properties:
        items:
          type: array
          description: Every account of the instance, oldest first.
          items:
            $ref: '#/components/schemas/AdminUserResponse'
    AdminCreateUserRequest:
      type: object
      description: Payload of `POST /admin/users`.
      required:
        - email
        - password
      properties:
        name:
          type: string
          description: Optional display name; defaults to the email address.
        email:
          type: string
          format: email
          description: Login address of the new account; unique instance-wide.
        password:
          type: string
          format: password
          description: Account password; stored only as an Argon2id hash.
          examples:
            - correct horse battery staple
        role:
          $ref: '#/components/schemas/UserRole'
    AdminUserPatch:
      type: object
      description: Payload of `PATCH /admin/users/{id}`.
      required:
        - isDisabled
      properties:
        isDisabled:
          type: boolean
          description: |
            The switch to write. `true` locks the account out of its
            sessions and sign-in; `false` lets it back in.
    ModelDownloadResponse:
      type: object
      description: |
        The identifier of one model download run: the `job_runs` row
        the download drives and the `job.*` events announce.
      required:
        - jobRunId
      properties:
        jobRunId:
          type: string
          format: uuid
          description: |
            UUIDv7 identifier of the run's `job_runs` row. `202`
            carries the freshly created run; `200` the existing
            in-flight or most recent one.
    ModelSlot:
      type: string
      description: |
        The functional slot a model fills. `face_detect`,
        `face_recognize`, `clip_embed` and `ocr` are the machine
        learning slots of this milestone; a speech slot arrives with
        a later one.
      enum:
        - face_detect
        - face_recognize
        - clip_embed
        - ocr
    ModelSource:
      type: string
      description: |
        Where a model's registration came from: `downloaded` models
        landed through the download endpoint's manifest-pinned
        group; `custom` models were registered by the scan of a
        directory an administrator placed.
      enum:
        - downloaded
        - custom
    ModelResponse:
      type: object
      description: |
        One registered model as the admin surface returns it: the
        database row's identity, source, dimension and params, the
        on-disk manifest's license, provenance notice and input
        geometry, the activation flag, and the presence probe of the
        model's files. The pinned sha256 digests and the file paths
        are server-side business and never leave the server.
      required:
        - id
        - slot
        - version
        - source
        - license
        - notice
        - dim
        - inputSize
        - isActive
        - filesPresent
        - params
      properties:
        id:
          type: string
          description: |
            The model's stable slug identifier -- also the name of
            its directory under the models dir.
        slot:
          $ref: '#/components/schemas/ModelSlot'
        version:
          type: string
          description: |
            The upstream release tag of the model family, as the
            manifest declares it.
        source:
          $ref: '#/components/schemas/ModelSource'
        license:
          type: string
          description: |
            The upstream license identifier, as the model's manifest
            declares it (empty when the manifest is unreadable -- the
            row still lists so the administrator can clean it up).
        notice:
          type:
            - string
            - 'null'
          description: |
            The model's provenance notice line, as the manifest
            declares it (null when the manifest is unreadable -- the
            fact is unknowable; empty when the manifest declares no
            notice). The admin surface displays it beside the license
            so the attribution stays honest.
        dim:
          type:
            - integer
            - 'null'
          description: |
            The embedding dimension the model emits. Null for models
            that do not embed (detectors, OCR).
        inputSize:
          type:
            - object
            - 'null'
          description: |
            The model's input geometry. Null when the model's
            manifest is unreadable.
          properties:
            width:
              type: integer
              description: Input width in pixels.
            height:
              type: integer
              description: Input height in pixels.
          required:
            - width
            - height
        isActive:
          type: boolean
          description: |
            True when the model is the active one of its slot. At
            most one model per slot is active.
        filesPresent:
          type: boolean
          description: |
            True when the model's on-disk manifest is readable and
            every file it pins exists -- a presence probe only. The
            sha256 verification runs at activation and load time,
            not here.
        params:
          type: object
          description: |
            The model's inference defaults (thresholds, normalization
            constants) as its manifest declares them; empty when it
            declares none.
          additionalProperties: true
    JobRunKind:
      type: string
      description: |
        The kinds of job runs the instance records. The model
        download is one run; each machine learning slot's rerun is
        its own kind, named after the slot it redoes.
      enum:
        - model_download
        - face_detect_rerun
        - face_recognize_rerun
        - clip_embed_rerun
        - ocr_rerun
    JobRunState:
      type: string
      description: |
        The lifecycle of a job run: `queued` from creation until the
        driver picks it up, `running` while it works, then
        `succeeded` or `failed`.
      enum:
        - queued
        - running
        - succeeded
        - failed
    JobRunResponse:
      type: object
      description: |
        One job run as the task panel and the model page render it.
        The progress fields carry the run's own work's units: pinned
        bytes for the model download (with `failed` counting failed
        models), asset counts for the reruns (with `failed` counting
        the assets whose rerun failed).
      required:
        - id
        - kind
        - state
        - total
        - done
        - failed
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the run's `job_runs` row.
        kind:
          $ref: '#/components/schemas/JobRunKind'
        state:
          $ref: '#/components/schemas/JobRunState'
        total:
          type: integer
          description: |
            The run's whole work, in the run's own units: the
            download group's pinned bytes, or the rerun scope's
            asset count.
        done:
          type: integer
          description: |
            The work completed so far, in the same units as
            `total`.
        failed:
          type: integer
          description: |
            The failed work count: failed models for the download,
            assets whose rerun failed for a rerun.
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the run's driver first picked it up (RFC 3339
            UTC). Null while the run sits `queued`.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the run closed (RFC 3339 UTC). Null until then.
    JobRunListResponse:
      type: object
      description: |
        The task panel listing: the instance's job runs, newest
        first, bounded by the `limit` parameter.
      required:
        - jobs
      properties:
        jobs:
          type: array
          description: The newest job runs, newest first.
          items:
            $ref: '#/components/schemas/JobRunResponse'
    ModelListResponse:
      type: object
      description: |
        The model management listing: every registered model plus
        the download run summary.
      required:
        - models
        - download
      properties:
        models:
          type: array
          description: |
            Every registered model, grouped by slot then id.
          items:
            $ref: '#/components/schemas/ModelResponse'
        download:
          type:
            - object
            - 'null'
          description: |
            The most recent `model_download` run of whatever state,
            or null before the first download was ever started.
          allOf:
            - $ref: '#/components/schemas/JobRunResponse'
    ModelRef:
      type: object
      description: |
        The identity of one model: its slug id and its slot.
      required:
        - id
        - slot
      properties:
        id:
          type: string
          description: The model's stable slug identifier.
        slot:
          $ref: '#/components/schemas/ModelSlot'
    ModelDimensionChange:
      type: object
      description: |
        The dimension switch of a cross-dimension clip activation:
        what the embeddings column was and what it became.
      required:
        - from
        - to
      properties:
        from:
          type: integer
          description: The embeddings column's dimension before the switch.
        to:
          type: integer
          description: The embeddings column's dimension after the switch.
    ModelActivateResponse:
      type: object
      description: |
        The report of one activation. The optional fields appear
        exactly on a cross-dimension switch of the clip-embed slot
        -- the destructive arm -- so their absence IS the
        same-dimension guarantee that nothing was deleted.
      required:
        - activated
      properties:
        activated:
          $ref: '#/components/schemas/ModelRef'
        dimensionChanged:
          $ref: '#/components/schemas/ModelDimensionChange'
        wipedEmbeddings:
          type: integer
          description: |
            The number of clip embedding rows the cross-dimension
            switch deleted inside its transaction.
    ModelScanResponse:
      type: object
      description: |
        The custom model scan's report: every model directory the
        scan verified and registered, in scan order. Nothing is
        activated.
      required:
        - registered
      properties:
        registered:
          type: array
          description: |
            The models the scan registered, in scan order.
          items:
            $ref: '#/components/schemas/ModelResponse'
    ModelRerunResponse:
      type: object
      description: |
        The identifier of one rerun run: the `job_runs` row the
        rerun drives and the `job.*` events announce.
      required:
        - jobRunId
      properties:
        jobRunId:
          type: string
          format: uuid
          description: |
            UUIDv7 identifier of the run's `job_runs` row. `202`
            carries the freshly created run; `200` the in-flight one
            the click joined instead.
    User:
      type: object
      description: A lumemor account.
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
          description: Display name.
        email:
          type: string
          format: email
          description: Login address.
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          description: Creation time (RFC 3339 UTC).
    AssetResponse:
      type: object
      description: |
        One stored asset as the upload and idempotency endpoints return
        it. `state` discriminates the upload outcome: `created` (201, a
        new asset), `duplicate` (200, an identical live asset already
        existed), `trashed` (200, an identical asset sits in the trash;
        the body carries that asset so the client can offer restore or
        save-as-new). The idempotency lookup mirrors the same states:
        it reports what a re-upload of the content would yield, so
        `created` never appears there.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - state
        - createdAt
        - takenAt
        - isTrashed
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image` whose
            video component is stored as a linked `video` row that
            never appears in the timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: |
            The file name the asset was uploaded with: the client-side
            `fileName` of the photo (the component video keeps its own
            file part name).
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            owner-scoped idempotency key of the upload.
        state:
          type: string
          description: |
            The upload outcome: `created` (201), `duplicate` (200, an
            identical live asset) or `trashed` (200, an identical asset
            in the trash).
          enum:
            - created
            - duplicate
            - trashed
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; responses render the best value the
            server has at answer time.
        isTrashed:
          type: boolean
          description: |
            True when the asset sits in the trash; `state: trashed`
            responses carry it as true so clients can offer the
            restore or save-as-new decision.
    AssetDetail:
      type: object
      description: |
        One asset as the detail endpoint returns it: the upload
        response's identity and storage fields, the pipeline's
        refinements, the two owner-level attributes the PATCH
        endpoint edits (`description`, `isHidden`), and the asset's
        faces as the calling user sees them (`faces`). The shape is
        fixed -- every property is always present -- and the
        pipeline-dependent values (`width`, `height`, `durationMs`,
        `blurhash` and the fields inside `exif`) are null until the
        jobs produced them, turning non-null when `asset.ready`
        fired. A value that stays null on a ready asset means the
        file carries no such metadata.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - isTrashed
        - isHidden
        - description
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - livePhotoVideoId
        - exif
        - faces
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image` whose
            video component is stored as a linked `video` row that
            never appears in the timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: |
            The file name the asset was uploaded with; the original
            download re-uses it (RFC 5987 escaped) for
            `Content-Disposition`.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; the response renders the best value the
            server has at answer time.
        takenAtSource:
          type: string
          description: |
            Where `takenAt` comes from: `import` is the
            device-reported capture time of the upload, `exif` an
            EXIF capture time the metadata job resolved with an
            offset, `file` a file timestamp (reserved for the future
            directory-album importer).
          enum:
            - exif
            - file
            - import
        isTrashed:
          type: boolean
          description: True when the asset sits in the trash.
        isHidden:
          type: boolean
          description: |
            True while the owner-level visibility switch is off: the
            asset is out of every live view (the timeline, the
            favorites) and manageable only through the hidden view,
            until it is unhidden. The same switch `PATCH
            /assets/{id}` and the batch `hide` / `unhide` actions
            flip.
        description:
          type: string
          description: |
            The owner's free-text description of the asset, the text
            the detail panel renders; the empty string until the
            owner wrote one. Editable only by the owner through
            `PATCH /assets/{id}`, which replaces it wholesale.
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset completed -- the
            metadata and thumbnail jobs for an image, plus the
            transcode job for a video (for a Live Photo component,
            the transcode job alone); the `asset.ready` event fires
            at that moment. Until then the client shows placeholders
            and the media endpoints answer `ASSET_NOT_READY` for
            missing derived files.
        width:
          type:
            - integer
            - 'null'
          description: |
            Pixel width in sensor order (not orientation-corrected);
            null until the metadata job refined the dimensions.
        height:
          type:
            - integer
            - 'null'
          description: |
            Pixel height in sensor order (not orientation-corrected);
            null until the metadata job refined the dimensions.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile (image assets) or poster frame
            (video assets) for placeholder rendering; null until the
            thumbnail job stored it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (never in the timeline; its original is
            downloadable by that id, and its transcoded play stream
            is served there too); null otherwise.
        exif:
          allOf:
            - $ref: '#/components/schemas/ExifSummary'
          description: |
            The EXIF hot fields. Always present as an object; every
            field inside it is null until the metadata job wrote the
            extraction.
        faces:
          type: array
          description: |
            The asset's faces as the calling user sees them, strongest
            score first with the face id as the tiebreak. The array is
            caller-scoped (B4): the asset being visible to the caller
            is the gate -- the faces ride on the detail's own
            permission -- and each entry's `label` is the caller's own
            label of the face's cluster, never another account's.
            Always present, empty when the asset carries no faces
            (none detected, or detection has not run yet). The PATCH
            response serves the same array, exactly as the GET serves
            it.
          items:
            $ref: '#/components/schemas/AssetFaceSummary'
    AssetFaceSummary:
      type: object
      description: |
        One face of the asset detail's `faces` array: the crop's
        identity, the detection score, the face's cluster and the
        CALLER's label of that cluster. The label is per-user state
        (B4): another account's label of the same global cluster never
        shows here. `clusterId` is null while the face waits for its
        first clustering assignment; such a face has no person yet and
        every assignment write on it answers the people surface's 404.
      required:
        - id
        - score
        - thumbnail
        - clusterId
        - label
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the face row.
        score:
          type: number
          format: float
          description: The detector's confidence for this face.
        thumbnail:
          type: string
          description: |
            URL of the face's crop: the face crop endpoint
            `GET /api/v1/faces/{faceId}/thumbnail` with this face's
            id, serving the bounding-box crop of the asset's
            view-size derivative.
          examples:
            - /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Identifier of the face's cluster, or null before the
            clustering assigned one (a face the recognition run has
            not grouped yet).
        label:
          description: |
            The caller's own label of the face's cluster, or null when
            the caller has not labeled it (the unnamed state) -- and
            null for a clusterless face, which has no cluster to
            label.
          anyOf:
            - $ref: '#/components/schemas/PersonLabel'
            - type: 'null'
    ExifSummary:
      type: object
      description: |
        The EXIF hot fields of an asset, flattened from the raw
        exiftool output by the metadata job. Every property is always
        present and null until the job wrote it -- or forever, for
        files that carry no such tag.
      required:
        - cameraMake
        - cameraModel
        - lens
        - iso
        - aperture
        - shutter
        - focal
        - lat
        - lon
        - alt
        - tzOffset
      properties:
        cameraMake:
          type:
            - string
            - 'null'
          description: Camera manufacturer (EXIF Make).
        cameraModel:
          type:
            - string
            - 'null'
          description: Camera model (EXIF Model).
        lens:
          type:
            - string
            - 'null'
          description: Lens identifier (LensModel, LensID or Lens).
        iso:
          type:
            - integer
            - 'null'
          description: ISO sensitivity.
        aperture:
          type:
            - number
            - 'null'
          description: Aperture as the f-number.
        shutter:
          type:
            - string
            - 'null'
          description: |
            Exposure time in photo notation, for example `1/250` or
            `2.5s`.
        focal:
          type:
            - number
            - 'null'
          description: Focal length in millimeters.
        lat:
          type:
            - number
            - 'null'
          format: double
          description: GPS latitude in degrees.
        lon:
          type:
            - number
            - 'null'
          format: double
          description: GPS longitude in degrees.
        alt:
          type:
            - number
            - 'null'
          description: GPS altitude in meters.
        tzOffset:
          type:
            - string
            - 'null'
          description: |
            The offset that resolved the capture time, in EXIF
            notation (`+05:30`); null when the capture time did not
            resolve through EXIF.
    TimelineItem:
      type: object
      description: |
        One asset of the timeline: the asset detail's fields minus the
        `exif` object and the two detail-panel edit attributes
        (`description`, `isHidden`) -- the detail endpoint renders the
        EXIF panel and the edit controls; the timeline renders tiles.
        Every item is live by construction --
        hidden assets, trashed assets and the component video rows of
        Live Photos never enter the timeline -- so `isTrashed` is
        always false here and is carried only to keep the item shape
        identical to the detail's. `isReady` still varies: a fresh
        upload enters the timeline immediately with its
        pipeline-dependent fields null, and the client upgrades the
        tile when `asset.ready` fires. The shape is fixed -- every
        property is always present. `isFavorite` is per-user state
        computed for the requesting user, so the same asset is a
        favorite tile for one viewer and a plain tile for another.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - isTrashed
        - isFavorite
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - livePhotoVideoId
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image`
            whose linked component video row never appears in the
            timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: The file name the asset was uploaded with.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; the timeline orders by it.
        takenAtSource:
          type: string
          description: |
            Where `takenAt` comes from: `import` is the
            device-reported capture time of the upload, `exif` an
            EXIF capture time the metadata job resolved with an
            offset, `file` a file timestamp (reserved for the future
            directory-album importer).
          enum:
            - exif
            - file
            - import
        isTrashed:
          type: boolean
          description: |
            Always false in the timeline: trashed assets never enter
            it. The field exists to keep the shape identical to the
            asset detail's.
        isFavorite:
          type: boolean
          description: |
            Whether the REQUESTING user favorites this asset: the
            caller's own row of the per-user favorites state, written
            by the batch endpoint's favorite action. False whenever
            the caller has no favorites row for the asset -- the same
            asset can be a favorite for one viewer of a shared
            timeline and not for another.
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset (metadata and
            serving copies) completed; until then the
            pipeline-dependent fields are null and the client renders
            placeholders.
        width:
          type:
            - integer
            - 'null'
          description: |
            Pixel width in sensor order; null until the metadata job
            refined the dimensions.
        height:
          type:
            - integer
            - 'null'
          description: |
            Pixel height in sensor order; null until the metadata job
            refined the dimensions.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile (image assets) or poster frame
            (video assets) for placeholder rendering; null until the
            thumbnail job stored it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (its original is downloadable by that id, the
            transcoded play stream is not); null otherwise.
    TimelineResponse:
      type: object
      description: |
        One page of a timeline-shaped view: the aggregated timeline,
        the favorites view or the hidden view all answer with this
        page shape (the same ordering and the same cursor semantics).
        `nextCursor` is present exactly when another page follows the
        `items` of this one: the client passes it back as the
        `cursor` query parameter to continue, and a response without
        it ends the pagination. The last page is the one whose
        follow-up page would be empty, so no run ever observes an
        empty page mid-pagination.
      required:
        - items
      properties:
        items:
          type: array
          description: |
            The timeline items of this page, ordered by `takenAt`
            descending with the id as the tiebreak.
          items:
            $ref: '#/components/schemas/TimelineItem'
        nextCursor:
          type: string
          description: |
            The opaque continuation cursor: pass it back as the
            `cursor` query parameter to fetch the next page. Absent
            exactly when this is the last page.
    TrashItem:
      type: object
      description: |
        One asset of the trash view: the timeline item's fields (the
        tile-relevant identity and pipeline fields, so the trash page
        renders the same tiles as the timeline) plus the trash
        semantics -- `deletedAt`, when the soft delete happened, and
        `remainingDays`, the countdown of whole days until the expiry
        job removes the row (rounded up; 0 once past the deadline,
        for the short window until the hourly job catches up). Every
        item is trashed by construction; there is no `isTrashed`
        field. The component video rows of Live Photos never appear:
        the pair is represented by its photo. The shape is fixed --
        every property is always present.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - livePhotoVideoId
        - deletedAt
        - remainingDays
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: Media family of the asset.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: The file name the asset was uploaded with.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339), the value the timeline would
            order the asset by.
        takenAtSource:
          type: string
          description: Where `takenAt` comes from.
          enum:
            - exif
            - file
            - import
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset (metadata and
            serving copies) completed.
        width:
          type:
            - integer
            - 'null'
          description: |
            Pixel width in sensor order; null until the metadata job
            refined the dimensions.
        height:
          type:
            - integer
            - 'null'
          description: |
            Pixel height in sensor order; null until the metadata job
            refined the dimensions.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile for placeholder rendering; null
            until the thumbnail job stored it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (restored and expired together with the photo);
            null otherwise.
        deletedAt:
          type: string
          format: date-time
          description: |
            When the asset was soft deleted (RFC 3339 UTC). The
            retention window ends at `deletedAt` plus the instance's
            `trash_retention_days`.
        remainingDays:
          type: integer
          minimum: 0
          description: |
            Whole days until the expiry job removes the asset,
            rounded up (an asset trashed moments ago with the default
            retention of 30 days shows 30). 0 once the deadline has
            passed -- the row survives only until the next hourly
            expiry run.
    TrashResponse:
      type: object
      description: |
        The trash view: the caller's trashed assets, newest deletion
        first. The list is bounded (the 200 most recent deletions)
        and unpaginated -- the trash is a recovery view for recent
        deletes, and items age out through expiry on their own.
      required:
        - items
      properties:
        items:
          type: array
          description: |
            The trashed assets of the caller, ordered by `deletedAt`
            descending.
          items:
            $ref: '#/components/schemas/TrashItem'
    BatchRequest:
      type: object
      description: |
        One batch action over a list of asset ids. The action applies
        to every id that resolves to a caller-owned asset; the rest
        (unknown or another account's, indistinguishable) are ignored
        and reported in the response's `missing` list -- a batch never
        fails over an individual id. `ids` carries between 1 and 1000
        entries; repeated ids collapse to one application.
      required:
        - action
        - ids
      properties:
        action:
          type: string
          description: |
            The set operation to apply. `favorite` / `unfavorite`
            write or remove the caller's per-user favorites rows;
            `hide` / `unhide` flip the owner-level visibility switch
            (a hidden asset leaves every live view until unhidden);
            `trash` / `restore` run the trash lifecycle of the trash
            endpoints, the Live Photo pair moving as one asset.
          enum:
            - favorite
            - unfavorite
            - hide
            - unhide
            - trash
            - restore
        ids:
          type: array
          description: |
            The asset ids to apply the action to: at least 1, at most
            1000.
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1000
    BatchResponse:
      type: object
      description: |
        The set-semantics report of one batch action. `affected` and
        `missing` partition the request's distinct ids: every id is
        either applied or unresolvable, none is both, and none is
        silently dropped.
      required:
        - affected
        - missing
      properties:
        affected:
          type: integer
          description: |
            How many distinct request ids resolved to a caller-owned
            asset and were processed -- INCLUDING ids that were
            already in the target state (the idempotent no-op of the
            set semantics: a repeat of a successful batch answers the
            same count, because the endpoint is a convergence
            operation, not a state-change counter). NOT a count of
            rows written: trashing a Live Photo pair moves two rows
            but one request id, and counts once.
          minimum: 0
        missing:
          type: array
          description: |
            The distinct request ids that did not resolve to a
            caller-owned asset -- unknown ids and other accounts'
            assets, indistinguishable by design -- in the order of
            their first appearance in the request. Empty when every
            id resolved. This deliberate reporting (instead of the
            byte-identical 404 of the single-asset endpoints) is the
            trade of the list surface: the caller handed the ids over
            themselves, so reporting them back hides nothing.
          items:
            type: string
            format: uuid
    AssetPatch:
      type: object
      description: |
        The partial edit of one asset: every field is optional, at
        least one must be present (a body that carries neither -- null
        values count as absent -- is a client bug and answers 400),
        and only the fields the request carries update; the rest keep
        their values. Both fields are owner-level asset state, so a
        patch that actually changes one of them publishes a single
        `asset.updated` event; a patch that repeats the stored values
        is the idempotent no-op and publishes nothing.
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 10000
          description: |
            The owner's free-text description of the asset, the text
            the detail panel renders. The value replaces the stored
            text wholesale (an empty string clears it). At most
            10,000 Unicode characters -- the count is over runes, so
            a text of multi-byte characters stays within the bound at
            the same length.
        isHidden:
          type: boolean
          description: |
            The owner-level visibility switch: `true` keeps the asset
            out of every live view (the timeline, the favorites)
            until it is unhidden; `false` returns it. The same switch
            the batch `hide` / `unhide` actions flip.
    PersonSummary:
      type: object
      description: |
        One named person of the caller's people list: a global face
        cluster carrying the caller's own label. The name and the
        hidden switch are the caller's private label state (B4) --
        another account labeling or hiding the same cluster never
        changes this view.
      required:
        - clusterId
        - name
        - faceCount
        - representativeFaceId
        - thumbnail
        - isHidden
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        name:
          type: string
          description: The caller's own label of the cluster.
        faceCount:
          type: integer
          description: |
            The cluster's faces on assets visible to the caller --
            the honest per-caller count, not the global member count.
        representativeFaceId:
          type: string
          format: uuid
          description: |
            The face the person card renders: the cluster's
            strongest-scoring face on a caller-visible live asset
            (score descending, the face id ascending as the
            tiebreak) -- the best face the CALLER can see, not the
            cluster's global representative, so a card never crops
            out of an asset the caller cannot view. The field is the
            thumbnail's face id.
        thumbnail:
          type: string
          description: |
            URL of the card's face crop: the face crop endpoint
            `GET /api/v1/faces/{faceId}/thumbnail` with the
            caller-visible best face's id.
          examples:
            - /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
        isHidden:
          type: boolean
          description: |
            The caller's hidden switch for this person. Hidden people
            stay listed carrying this flag (badge semantics); they
            are not filtered out.
    UnnamedClusterSummary:
      type: object
      description: |
        One unnamed face cluster of the caller's unnamed region: a
        global cluster the caller sees through at least one visible
        asset and has not labeled themselves. Unlabeled for THIS
        caller says nothing about another account's labels (B4 --
        labels are private per user).
      required:
        - clusterId
        - faceCount
        - representativeFaceId
        - thumbnail
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        faceCount:
          type: integer
          description: |
            The cluster's faces on assets visible to the caller --
            the honest per-caller count, not the global member count.
        representativeFaceId:
          type: string
          format: uuid
          description: |
            The face the cluster tile renders: the cluster's
            strongest-scoring face on a caller-visible live asset
            (score descending, the face id ascending as the
            tiebreak) -- the best face the CALLER can see, not the
            cluster's global representative, so a tile never crops
            out of an asset the caller cannot view.
        thumbnail:
          type: string
          description: |
            URL of the tile's face crop: the face crop endpoint
            `GET /api/v1/faces/{faceId}/thumbnail` with the
            caller-visible best face's id.
          examples:
            - /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
    UnnamedClustersResponse:
      type: object
      description: One keyset page of the caller's unnamed clusters.
      required:
        - items
      properties:
        items:
          type: array
          description: |
            The page's clusters, ordered by `faceCount` descending
            with the cluster id as the tiebreak.
          items:
            $ref: '#/components/schemas/UnnamedClusterSummary'
        nextCursor:
          type: string
          description: |
            The opaque continuation cursor: pass it back as the
            `cursor` query parameter to fetch the next page. Absent
            exactly when this is the last page.
    ClusterDetail:
      type: object
      description: |
        One face cluster's detail as the calling user sees it: the
        caller's own label state and the cluster's faces on
        caller-visible assets, strongest score first.
      required:
        - clusterId
        - label
        - faces
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        label:
          description: |
            The caller's label of the cluster, or null when the
            caller has not labeled it (the unnamed state). It is the
            calling user's label or no label at all: another
            account's label never shows here (B4).
          anyOf:
            - $ref: '#/components/schemas/PersonLabel'
            - type: 'null'
        faces:
          type: array
          description: |
            The cluster's faces on assets visible to the caller,
            strongest score first with the face id as the tiebreak.
            Faces on other accounts' assets never appear.
          items:
            $ref: '#/components/schemas/FaceDetail'
    PersonLabel:
      type: object
      description: The calling user's private label of one face cluster.
      required:
        - name
        - isHidden
      properties:
        name:
          type: string
          description: The caller's name for the person.
        isHidden:
          type: boolean
          description: |
            The caller's hidden switch. Hidden people stay listed in
            `GET /people` carrying this flag (badge semantics).
    FaceDetail:
      type: object
      description: |
        One face of the cluster on an asset visible to the caller:
        the crop's identity, the detection score and the minimal
        asset context the detail grid renders.
      required:
        - id
        - assetId
        - score
        - thumbnail
        - asset
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the face row.
        assetId:
          type: string
          format: uuid
          description: Identifier of the asset the face sits on.
        score:
          type: number
          format: float
          description: The detector's confidence for this face.
        thumbnail:
          type: string
          description: |
            URL of the face's crop: the face crop endpoint
            `GET /api/v1/faces/{faceId}/thumbnail` with this face's
            id, serving the bounding-box crop of the asset's
            view-size derivative.
        asset:
          type: object
          description: |
            The minimal context of the asset the face sits on: when
            it was taken and under what file name -- the two lines
            the cluster detail renders under each crop.
          required:
            - takenAt
            - originalFilename
          properties:
            takenAt:
              type: string
              format: date-time
              description: When the asset was taken (RFC 3339 UTC).
            originalFilename:
              type: string
              description: The file name the asset was uploaded under.
    LabelPersonRequest:
      type: object
      description: |
        The caller's name for one face cluster. The server trims the
        value and requires 1-64 characters; duplicate names are
        allowed (no NAME_TAKEN -- families have real duplicates).
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The caller's name for the person, trimmed.
          example: Ada
    SetPersonHiddenRequest:
      type: object
      description: |
        The caller's hidden switch for one face cluster. The switch
        rides on the caller's label row, so hiding requires the
        caller to have named the cluster first
        (`person_hide_requires_label` otherwise).
      required:
        - isHidden
      properties:
        isHidden:
          type: boolean
          description: |
            true hides the person for the caller (a badge on their
            people list, not a filter); false unhides.
          example: true
    PersonLabelResponse:
      type: object
      description: |
        The calling user's label state of one face cluster after a
        label or hidden write: the caller's own row only (B4 --
        another account's label never shows here).
      required:
        - clusterId
        - name
        - isHidden
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        name:
          type: string
          description: The caller's (trimmed) name for the person.
        isHidden:
          type: boolean
          description: The caller's hidden switch for this person.
    MergePeopleRequest:
      type: object
      description: |
        One merge: 1-50 source clusters folded into one target
        cluster. The source clusters dissolve with their labels (the
        honest documented cost -- a source cluster's user-given name
        dies); the target's label persists.
      required:
        - sourceClusterIds
        - targetClusterId
      properties:
        sourceClusterIds:
          type: array
          description: |
            The clusters to fold into the target: at least 1 and at
            most 50 after duplicates collapse, every one visible to
            the caller. Each dissolves with its label rows. A single
            id is the pairwise fold of the cluster detail's
            "merge into" action.
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        targetClusterId:
          type: string
          format: uuid
          description: |
            The surviving cluster: every source face re-homes here
            and its representative recomputes to the strongest
            member of the merged set. It must be visible to the
            caller and must not sit among the sources.
    MergePeopleResponse:
      type: object
      description: One committed merge.
      required:
        - survivingClusterId
        - mergedClusterIds
      properties:
        survivingClusterId:
          type: string
          format: uuid
          description: The target cluster that absorbed the sources.
        mergedClusterIds:
          type: array
          description: |
            The source clusters that dissolved into the target, in
            request order. Their rows -- and every label on them --
            are gone.
          items:
            type: string
            format: uuid
    MoveFaceRequest:
      type: object
      description: One face's move onto an existing face cluster.
      required:
        - targetClusterId
      properties:
        targetClusterId:
          type: string
          format: uuid
          description: |
            The cluster the face joins. It must be visible to the
            caller; its representative recomputes when the move
            changes the strongest member.
    MoveFaceResponse:
      type: object
      description: One committed face move.
      required:
        - faceId
        - clusterId
      properties:
        faceId:
          type: string
          format: uuid
          description: Identifier of the moved face.
        clusterId:
          type: string
          format: uuid
          description: The cluster the face occupies after the move.
    AlbumWallResponse:
      type: object
      description: |
        The caller's album wall: the own group followed by the shared
        group, concatenated into one array.
      required:
        - albums
      properties:
        albums:
          type: array
          description: |
            Every wall album: the own group first (the caller's
            virtual and directory albums, `updatedAt` descending),
            then the shared group (the albums shared to the caller,
            the caller's grant time descending). Each group breaks
            ties on the album id, descending. Sync albums never
            appear in either group.
          items:
            $ref: '#/components/schemas/AlbumSummary'
    AlbumSummary:
      type: object
      description: |
        One album card of the wall: the metadata, the live member
        count and the collage source, plus the `callerRole`
        discriminator the web client sections the wall by. Shared
        items carry `owner`, the honest attribution of another
        account's album; own items omit it.
      required:
        - id
        - title
        - description
        - type
        - locked
        - isShared
        - coverAssetIds
        - itemCount
        - updatedAt
        - callerRole
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the album.
        title:
          type: string
          description: The album's display title.
        description:
          type: string
          description: The album's free-text description (empty when unset).
        type:
          type: string
          enum:
            - virtual
            - directory
          description: |
            The album's type. `virtual` albums are curated by their
            owner; `directory` albums mirror a filesystem path. Sync
            albums never reach this shape.
        locked:
          type: boolean
          description: |
            The owner's lock: a locked album refuses its owner's
            curation and property writes until unlocked. It is
            metadata to a viewer (viewers are read-only regardless).
        isShared:
          type: boolean
          description: |
            True when the album carries at least one `album_shares`
            row -- someone besides the owner can see it. Always true
            on shared-group items by construction.
        coverAssetIds:
          type: array
          maxItems: 4
          description: |
            The collage source of the wall card: the pinned cover
            asset as a single-element list when the owner set one,
            otherwise the album's most recent live member assets (up
            to four, `takenAt` descending, the asset id as the
            tiebreak). Empty for an album with no live members.
          items:
            type: string
            format: uuid
        itemCount:
          type: integer
          description: |
            The album's live member count: trashed, hidden and Live
            Photo component rows never count (A5 -- a hidden asset is
            invisible to the whole family).
        updatedAt:
          type: string
          format: date-time
          description: When the album row last changed (RFC 3339 UTC).
        callerRole:
          type: string
          enum:
            - owner
            - viewer
          description: |
            The caller's relation to this album: `owner` items belong
            to the own group, `viewer` items to the shared group. The
            web client sections the wall off this discriminator.
        owner:
          description: |
            The owner attribution of a shared item: the account that
            owns the album. Present exactly when `callerRole` is
            `viewer`; own items omit it (the owner is the caller).
          allOf:
            - $ref: '#/components/schemas/AlbumOwnerRef'
        inTimeline:
          type: boolean
          description: |
            The caller's timeline preference of this album: whether
            it feeds their aggregated timeline. Present exactly on
            the excludable cards -- the own `directory` items and
            every shared item; the own `virtual` items omit it
            (they never feed the caller's own timeline, so there is
            nothing to exclude). The value is the preference row's
            switch, true when no row exists (the default).
    AlbumOwnerRef:
      type: object
      description: |
        The owner of an album shared to the caller: the honest
        attribution a shared wall card renders.
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the owning account.
        email:
          type: string
          format: email
          description: The email address of the owning account.
    AlbumDetail:
      type: object
      description: |
        One album's detail as the calling user sees it: the metadata,
        the caller's role, the live member count and one keyset page
        of the live items.
      required:
        - id
        - title
        - description
        - type
        - locked
        - coverAssetId
        - callerRole
        - itemCount
        - items
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the album.
        title:
          type: string
          description: The album's display title.
        description:
          type: string
          description: The album's free-text description (empty when unset).
        type:
          type: string
          enum:
            - virtual
            - directory
          description: The album's type; sync albums never reach this shape.
        locked:
          type: boolean
          description: The owner's lock (metadata to a viewer).
        coverAssetId:
          description: |
            The pinned cover asset, or null when unset -- the raw
            column; the wall derives its collage fallback, the detail
            carries the pin itself.
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        callerRole:
          type: string
          enum:
            - owner
            - viewer
          description: |
            The caller's relation to this album: the owner holds the
            write affordances, a viewer is read-only.
        itemCount:
          type: integer
          description: |
            The album's live member count, the same predicate as the
            items below.
        items:
          type: array
          description: |
            One page of the album's live members, `takenAt` descending
            with the asset id as the tiebreak.
          items:
            $ref: '#/components/schemas/AlbumItem'
        nextCursor:
          type: string
          description: |
            The opaque continuation cursor: pass it back as the
            `cursor` query parameter to fetch the next page. Absent
            exactly when this is the last page.
        shares:
          type: array
          description: |
            The album's grantee list, riding ONLY the owner's view:
            one entry per `album_shares` row in the grant order
            (`grantedAt` ascending) -- the share management dialog's
            list. The owner's response always carries the field, an
            empty array when the album holds no grants; viewer
            responses never carry it at all.
          items:
            $ref: '#/components/schemas/AlbumShareEntry'
        inTimeline:
          type: boolean
          description: |
            The caller's timeline preference of this album: whether
            it feeds their aggregated timeline. Present exactly when
            the album is excludable for the caller -- an own
            `directory` album or an album shared to them; an own
            `virtual` album omits the field (it never feeds the
            caller's own timeline). The value is the preference
            row's switch, true when no row exists (the default).
            The preference scopes the aggregated timeline only: it
            never filters this album's own items, whatever the
            switch says.
    AlbumItem:
      type: object
      description: |
        One live member of the album: the membership's identity and
        the minimal asset context the detail grid renders.
      required:
        - assetId
        - addedAt
        - asset
      properties:
        assetId:
          type: string
          format: uuid
          description: Identifier of the member asset.
        addedAt:
          type: string
          format: date-time
          description: |
            When the membership row was added to the album (RFC 3339
            UTC).
        asset:
          description: The minimal context of the member asset.
          allOf:
            - $ref: '#/components/schemas/AlbumItemAsset'
    AlbumItemAsset:
      type: object
      description: |
        The minimal context of one album member asset: the lines the
        detail grid renders per tile.
      required:
        - takenAt
        - originalFilename
        - kind
        - thumbnail
      properties:
        takenAt:
          type: string
          format: date-time
          description: When the asset was taken (RFC 3339 UTC).
        originalFilename:
          type: string
          description: The file name the asset was uploaded under.
        kind:
          type: string
          enum:
            - image
            - video
          description: The asset's media kind.
        thumbnail:
          type: string
          description: |
            URL of the asset's tile-size serving copy: the asset
            thumbnail endpoint
            `GET /api/v1/assets/{assetId}/thumbnail?size=tile`.
          examples:
            - /api/v1/assets/0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072/thumbnail?size=tile
    AlbumCreateRequest:
      type: object
      description: |
        The creation body of one virtual album: the title and the
        optional bounded description. No type field exists -- this
        endpoint IS virtual creation, the only creatable album type
        of the face.
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The album's display title, trimmed server-side; it must
            span 1-64 Unicode characters after the trim (the count
            is over runes, so multi-byte titles stay within the
            bound at the same length).
        description:
          type: string
          maxLength: 10000
          description: |
            The album's free-text description; empty when absent.
            At most 10,000 Unicode characters, the asset
            description's own bound.
    AlbumPatch:
      type: object
      description: |
        The partial edit of one album: every field is optional, at
        least one must be present (a body that carries none -- JSON
        null values count as absent, the patch discipline of the
        asset surface -- is a client bug and answers 400), and only
        the fields the request carries update; the rest keep their
        values. A present `coverAssetId` must be a live member of
        the album itself. The write publishes one `album.updated`
        event whatever fields changed.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The album's display title, trimmed server-side; when
            present it must span 1-64 Unicode characters after the
            trim.
        description:
          type: string
          maxLength: 10000
          description: |
            The album's free-text description; the value replaces
            the stored text wholesale (an empty string clears it).
            At most 10,000 Unicode characters.
        coverAssetId:
          type: string
          format: uuid
          description: |
            The pinned cover asset. When present it must be a LIVE
            member of THIS album (the membership row exists and the
            asset is not trashed, not hidden, not a Live Photo
            component row) -- otherwise the answer is 400 with the
            message key `album_cover_not_member`. Absent (or JSON
            null, which decodes as absent) leaves the pin
            unchanged.
        locked:
          type: boolean
          description: |
            The owner's lock. `true` freezes the album's curation
            and property fields against later writes (this same
            endpoint refuses them with 409 until the owner patches
            `locked: false` -- the unlock, never gated itself).
            Locking does not gate the album's delete.
    AlbumItemsRequest:
      type: object
      description: |
        The membership write body: the list of asset ids to add to
        or remove from one virtual album. Repeated ids collapse to
        one application; the report's counts cover the distinct ids.
      required:
        - assetIds
      properties:
        assetIds:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            The asset ids of the membership write, between 1 and 200
            entries. The add skips -- never errors on -- every id
            that is not a live caller-owned asset or that already
            sits in the album; the remove skips the ids that are no
            members.
          items:
            type: string
            format: uuid
    AddAlbumItemsResponse:
      type: object
      description: |
        The honest report of one membership add over the request's
        distinct ids: what landed and what was skipped, foreign,
        non-live and already-member ids alike.
      required:
        - added
        - skipped
      properties:
        added:
          type: integer
          description: |
            The membership rows the request inserted. Zero for an
            all-skipped request, which is still a 200 -- batch
            semantics, never an error.
        skipped:
          type: integer
          description: |
            The distinct ids that did not land: unknown ids, another
            account's assets, trashed, hidden or component rows, and
            the ids already sitting in the album (the idempotent
            add).
    RemoveAlbumItemsResponse:
      type: object
      description: |
        The honest report of one membership remove over the
        request's distinct ids: the rows that left and the ids that
        were no members.
      required:
        - removed
        - skipped
      properties:
        removed:
          type: integer
          description: |
            The membership rows the request deleted. Zero for an
            all-skipped request, which is still a 200.
        skipped:
          type: integer
          description: |
            The distinct ids that were no members of the album --
            never added, or already removed.
    AlbumShareGrantRequest:
      type: object
      description: |
        The grant body: the account receiving the view ACL. The
        target rules live in the endpoint's own answer -- the
        album's owner and unusable accounts answer 400 there, never
        a distinct shape here.
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
          description: Identifier of the account receiving the view ACL.
    AlbumShareResponse:
      type: object
      description: |
        One share row as the grant endpoint answers it: the album,
        the grantee and the grant time. The idempotent re-grant
        answers the existing row's values -- the original
        `grantedAt` and grantor untouched.
      required:
        - albumId
        - userId
        - grantedAt
      properties:
        albumId:
          type: string
          format: uuid
          description: Identifier of the shared album.
        userId:
          type: string
          format: uuid
          description: Identifier of the grantee account.
        grantedAt:
          type: string
          format: date-time
          description: When the view ACL was granted (RFC 3339 UTC).
    AlbumTimelinePreferenceRequest:
      type: object
      description: |
        The caller's timeline preference write: the per-user switch
        of whether one album feeds the caller's aggregated timeline.
        The `inTimeline` field is required in practice: a body
        without it (or one carrying an explicit JSON null -- a
        required boolean has no absent-state semantics) answers 400
        `VALIDATION_FAILED` naming the body.
      properties:
        inTimeline:
          type: boolean
          nullable: true
          description: |
            Whether the album's items feed the caller's aggregated
            timeline. `false` keeps them out; `true` (and a missing
            preference row) keeps them in.
    AlbumTimelinePreferenceResponse:
      type: object
      description: |
        One album's timeline preference as the caller's row now
        carries it. Self-affecting state: the write publishes no
        event, this response is the only view that changed.
      required:
        - albumId
        - inTimeline
      properties:
        albumId:
          type: string
          format: uuid
          description: Identifier of the album the preference scopes.
        inTimeline:
          type: boolean
          description: |
            Whether the album feeds the caller's aggregated timeline
            (a missing preference row means true, the default).
    AlbumShareEntry:
      type: object
      description: |
        One grantee of the owner's `shares` list on the album
        detail: the grantee's identity and the grant time -- the
        share management dialog's row.
      required:
        - userId
        - email
        - grantedAt
      properties:
        userId:
          type: string
          format: uuid
          description: Identifier of the grantee account.
        email:
          type: string
          format: email
          description: The grantee's login address.
        grantedAt:
          type: string
          format: date-time
          description: When the view ACL was granted (RFC 3339 UTC).
    UserSummary:
      type: object
      description: |
        One account of the minimal member list: exactly the identity
        fields a pick list renders -- no display name, no
        timestamps, and never a password hash.
      required:
        - id
        - email
        - role
        - isDisabled
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        email:
          type: string
          format: email
          description: Login address.
        role:
          $ref: '#/components/schemas/UserRole'
        isDisabled:
          type: boolean
          description: |
            The disabled switch: a disabled account cannot sign in
            and its sessions carry no authority until re-enabled.
    UserListResponse:
      type: object
      description: |
        The instance's member list: every account, `email`
        ascending, in one bounded response (a family instance holds
        a handful of accounts).
      required:
        - users
      properties:
        users:
          type: array
          description: Every account of the instance, `email` ascending.
          items:
            $ref: '#/components/schemas/UserSummary'
    Error:
      type: object
      description: |
        Error envelope shared by all endpoints. `code` is the authoritative
        registry of stable error codes; clients must not parse `message`.
      required:
        - code
      properties:
        code:
          type: string
          description: |
            Stable error code. The i18n translation key is the lowercase
            form of this value.
          enum:
            - SETUP_ALREADY_COMPLETED
            - VALIDATION_FAILED
            - INTERNAL
            - AUTH_FORBIDDEN
            - AUTH_INVALID_CREDENTIALS
            - AUTH_RATE_LIMITED
            - PAIRING_TOKEN_INVALID
            - ASSET_TOO_LARGE
            - ASSET_NOT_FOUND
            - ASSET_NOT_READY
            - USER_EMAIL_TAKEN
            - USER_NOT_FOUND
            - MODEL_DOWNLOAD_FAILED
            - MODEL_NOT_FOUND
            - MODEL_INVALID
            - PERSON_NOT_FOUND
            - ALBUM_NOT_FOUND
            - ALBUM_LOCKED
        message:
          type: string
          description: English technical description for debugging.
        details:
          type: object
          additionalProperties: true
          description: |
            Optional structured context, for example the offending field
            names of a `VALIDATION_FAILED` request. Its shape is
            code-specific.
          examples:
            - fields:
                - email
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lumemor_session
      description: |
        Web session cookie issued by `POST /auth/login`: HttpOnly,
        SameSite=Strict, Secure when the instance is reached over
        HTTPS, sliding 30-day expiry.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Mobile session token issued by `POST /auth/pairing/consume`,
        sent as `Authorization: Bearer`. It is the mobile form of the
        same session records the cookie authenticates; both are
        revoked together.
