        manual location edit. All body fields are optional
        but at least one must be present (a field set to JSON null
        counts as absent, so a body of nulls is the empty patch); a
        request that carries none answers 400 `VALIDATION_FAILED`.
        Only the fields the request carries update -- the rest keep
        their values -- and the response is the full asset detail
        after the edit, the same shape `GET /assets/{id}` serves.

        The edit follows set semantics: patching a field with the
        value the row already carries is the idempotent no-op -- the
        answer stays the 200 success with the row's current state,
        nothing is written (not even `updated_at`), and NO
        `asset.updated` event fires. A patch that actually changes
        any field publishes exactly ONE `asset.updated` event
        (the asset id and kind, after the commit): every field is
        owner-level asset state, so the same announcement refreshes
        every viewer of the shared timeline and the detail panel.
        The description alone has no timeline effect -- it is
        detail-panel content -- but it is asset state the event
        covers all the same. The response serves the caller's tags
        on the asset beside the faces, both unchanged by this edit
        (the tags endpoints maintain them): the full detail shape
        `GET /assets/{id}` serves.

        Access is owner-only, the attribute-editing row of the
        permission matrix: there is deliberately no administrator
        override here (unlike the permanent delete), so an id that
        is unknown or foreign answers the same 404
        `ASSET_NOT_FOUND`, byte for byte, as every asset endpoint --
        asset ids cannot be enumerated. A trashed asset is editable
        like it is readable (the detail answers 200 with `isTrashed:
        true`): the edit lands on the row and resurfaces with the
        restore. The archive switch this endpoint flips is the same
        one the batch endpoint's `hide` / `unhide` actions flip, so
        the two surfaces agree on the state of an asset.

        `description` carries at most 10,000 Unicode characters
        (runes); above that the request answers 400
        `VALIDATION_FAILED`. The value replaces the stored text
        wholesale -- an empty string is a valid patch and clears it.

        `takenAt` replaces the stored capture time wholesale. The
        timestamp MUST carry a UTC offset (RFC 3339's `Z` or
        `+hh:mm` designator): the offset is the capture zone the
        info panel displays beside the time, so a zone-less value is
        ambiguous and answers 400 `VALIDATION_FAILED` -- the same
        value decides where the photo sits on the timeline (the
        instant) and which offset renders beside it (the offset).
        The stored `takenAtSource` keeps its value; the value itself
        carries the edit. The same patch publishes the one
        `asset.updated` event when the instant or the zone changed.

        `latitude` and `longitude` are the manual location edit, and
        they ride together: the pair replaces the asset's location
        wholesale (carrying one alone answers 400
        `VALIDATION_FAILED` -- half a coordinate is no location).
        The written pair is what the info panel renders (`location`)
        and what the place resolution runs on: the resolved city
        follows the pin (the nearest city within the resolution
        threshold, or no place at all when the point sits beyond
        one -- the honest absence). The camera-recorded GPS in
        `exif` keeps the file's own reading and is not touched. A
        deployment without the baked place data keeps the resolved
        place whatever it held: the coordinates still stand, the
        city join stays out of the edit.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
        - name: locale
          in: query
          required: false
          description: |
            The display locale of the response's `place` face: the
            `GET /assets/{id}` parameter's own shape, riding the
            same-shape discipline -- the PATCH response serves the
            detail exactly as the GET serves it, place join
            included.
          schema:
            type: string
            enum:
              - en
              - zh-Hans
            default: en
          example: zh-Hans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPatch'
            examples:
              describe:
                summary: Describe a photo from the detail panel.
                value:
                  description: Sunset over the lake, our first evening there.
              hide:
                summary: Archive one asset out of the family flows.
                value:
                  isArchived: true
              redate:
                summary: Move the capture time and state its zone.
                value:
                  takenAt: '2026-08-12T18:42:00+08:00'
              relocate:
                summary: Pin the photo's location by hand.
                value:
                  latitude: 36.0671
                  longitude: 120.3826
              both:
                summary: Edit two attributes in one request.
                value:
                  description: Captioned, and archived for now.
                  isArchived: true
      responses:
        '200':
          description: |
            The asset detail after the edit -- the same shape `GET
            /assets/{id}` serves, with the applied values (the
            `faces`, `tags` and `albums` arrays included, unchanged by
            the edit; `place` resolved at the request's `locale`).
            The idempotent no-op answers it too, with the
            row's current state unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
              examples:
                described:
                  summary: A described, visible, pipeline-ready asset.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1234.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    createdAt: '2026-10-29T09:12:00Z'
                    takenAt: '2026-10-13T12:30:00Z'
                    takenAtSource: exif
                    takenAtZone: '+05:30'
                    isTrashed: false
                    isArchived: false
                    description: Sunset over the lake, our first evening there.
                    isReady: true
                    width: 4032
                    height: 3024
                    durationMs: null
                    blurhash: UHL6aAof00WBWB00ayWB00
                    contentCopies: 0
                    livePhotoVideoId: null
                    exif:
                      cameraMake: Lumemor
                      cameraModel: Golden Camera
                      lens: Golden 35mm f/2.8
                      iso: 200
                      aperture: 2.8
                      shutter: 1/250
                      focal: 35
                      lat: 48.8584
                      lon: 2.2945
                      alt: 35
                      tzOffset: '+05:30'
                    location:
                      lat: 48.8584
                      lon: 2.2945
                    path: originals/9f8a3c/2026/10/IMG_1234.jpg
                    faces: []
                    tags: []
                    albums:
                      - id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6061
                        title: Sync
                        type: sync
                        callerRole: owner
                        sourceWritable: true
                    place: null
        '400':
          description: |
            The patch is not well-formed: the body is not valid JSON
            (a field of the wrong type included), carries no field,
            the description exceeds the 10,000-character bound, the
            `takenAt` value carries no UTC offset, or the location
            edit carries exactly one of the two coordinate halves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: A patch that carries no field.
                  value:
                    code: VALIDATION_FAILED
                    message: the patch must carry description, takenAt, latitude/longitude or isArchived
                    details:
                      fields:
                        - body
                zonelessTakenAt:
                  summary: A capture time without its offset.
                  value:
                    code: VALIDATION_FAILED
                    message: takenAt must carry a UTC offset (RFC 3339 Z or +hh:mm)
                    details:
                      fields:
                        - takenAt
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset with this id is editable by the caller: the id
            is unknown or belongs to another account (the owner-only
            gate applies to administrators too), and the two cases
            are indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAsset
      tags:
        - assets
      summary: Permanently delete one asset, files and all.
      description: |
        The explicit permanent deletion -- the destructive surface
        beside the trash. It removes the asset row whatever its state
        (live or trashed: this endpoint does not route through the
        trash), and with it the asset's on-disk artifacts under the
        shared-blob rule: content addressing means another owner's row
        (or any other row) with the same checksum references the SAME
        physical file, so the original file is removed only when no
        other asset row references it; otherwise the row goes and the
        file stays. The derived serving copies (the per-asset
        thumbnail directory) belong to this asset id alone and are
        always removed. The component video row of a Live Photo is
        deleted with its photo (it is never an asset of its own).

        The application-layer permission gate of the two-layer delete
        discipline: the owner of the asset, or an administrator. An
        id of another user's asset answers the same 404
        `ASSET_NOT_FOUND` as an id that does not exist, byte for
        byte, so asset ids cannot be enumerated. (The file-system
        layer of the gate matters for directory albums, whose files
        move on delete; it arrives with the album domain later --
        blob originals live inside the server's own data
        directory.)

        The ordinary client "delete" is the trash (soft delete
        through the batch endpoint); this endpoint is the explicit
        bypass: the client that already knows it wants the asset gone
        forever, and the empty-trash surface. Repeating the request
        after a successful deletion answers 404 -- the asset no
        longer exists, exactly like an unknown id.

        The deletion is committed before the files are removed: a
        failure between the two (a full disk, a failing mount) leaves
        the row gone and the file orphaned, which is a storage leak,
        never data loss; it is logged server-side and the response
        still reports the deletion.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The asset is permanently deleted: the row is gone, the
            derived files are removed, and the original file is
            removed unless another asset row still references it.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset with this id exists: the id is unknown, was
            already permanently deleted, or belongs to another
            account while the caller is neither its owner nor an
            administrator -- all indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{id}/thumbnail:
    get:
      operationId: getAssetThumbnail
      tags:
        - assets
      summary: Serve a derived thumbnail, or a video's poster frame.
      description: |
        The static serving copy of the asset:

        - image assets: the AVIF thumbnail of the requested size --
          `tile` (fits the 250px timeline box), `view` (long edge
          capped at 1080px), `original` (the full-resolution
          re-encode) -- served as `image/avif`;
        - video assets: the poster frame, whatever `size` says -- the
          poster (the first frame, scaled into the tile box) is the
          video's thumbnail, while the playable stream is the
          transcoded copy of `GET /assets/{id}/play` -- served as
          `image/jpeg`.

        The response is a private immutable static asset:
        `Cache-Control: private, max-age=31536000, immutable`, and a
        strong `ETag` built from the first 16 hex characters of the
        asset's checksum (quoted). A matching `If-None-Match` answers
        304 with the same validators and no body. Conditional requests
        and byte ranges otherwise follow the Go standard library's
        `ServeContent` semantics.

        The asset exists but its derived file is absent -- the
        thumbnail job has not run yet, or failed and is retrying --
        answers 404 `ASSET_NOT_READY`: the client renders the blurhash
        or a placeholder and waits for the `asset.ready` event instead
        of treating the asset as gone. `ASSET_NOT_FOUND`, by contrast,
        means the id is unknown or not caller-visible: the detail
        endpoint's album-union gate applies here too (the owner, or
        a member of an album the caller sees), with byte-identical
        404 bodies for foreign and unknown ids.

        `size` must be one of the three values below; anything else
        (including a missing `size`) answers 400 `VALIDATION_FAILED`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          required: true
          description: |
            The serving size: `tile` for the timeline, `view` for the
            inline display, `original` for the full-resolution serving
            copy. Video assets answer the poster frame for every
            value.
          schema:
            type: string
            enum:
              - tile
              - view
              - original
          example: tile
      responses:
        '200':
          description: |
            The serving copy: `image/avif` for an image thumbnail,
            `image/jpeg` for a video poster.
          headers:
            ETag:
              description: |
                Strong entity tag: the first 16 hex characters of the
                asset's checksum, quoted. The derivation is
                deterministic, so the tag is stable across re-runs of
                the thumbnail job.
              schema:
                type: string
              example: '"9f86d081884c7d65"'
            Cache-Control:
              description: |
                The derived file is private to the owner and immutable
                (its content is a function of the immutable original
                bytes), so clients may cache it for a year.
              schema:
                type: string
              example: private, max-age=31536000, immutable
          content:
            image/avif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: |
            The `If-None-Match` value matched the entity tag; the
            cached copy is current. The response carries the same
            `ETag` and `Cache-Control` validators and no body.
        '400':
          description: |
            The `size` parameter is missing or not one of the three
            serving sizes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: An unknown serving size.
                  value:
                    code: VALIDATION_FAILED
                    message: invalid thumbnail size
                    details:
                      fields:
                        - size
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            Either no asset with this id is visible to the caller
            (unknown or foreign id, `ASSET_NOT_FOUND`), or the asset
            exists but its derived file is not on disk yet
            (`ASSET_NOT_READY` -- the pipeline has not produced it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
                assetNotReady:
                  summary: The thumbnail job has not run yet.
                  value:
                    code: ASSET_NOT_READY
                    message: asset media is not ready yet
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{id}/original:
    get:
      operationId: getAssetOriginal
      tags:
        - assets
      summary: Download the original file of one owned asset.
      description: |
        Streams the stored original bytes as a download. It is
        available immediately after the upload: the original is the
        uploaded content-addressed file itself, not a pipeline
        product.

        A LIVE PHOTO ANSWERS AS ONE ARCHIVE. The still alone is not
        what the family kept -- the pair is -- so this endpoint answers
        `application/zip` holding the still and its motion (the stored
        originals themselves: nothing is re-encoded). The archive is
        named after the still's stem (`IMG_1234.zip`), and a display
        name both files share is suffixed rather than overwritten.

        WHICH MOTION RIDES: one that arrived as a file of its own --
        the paired upload's video, or a later half matched by content
        identifier -- is part of the pair and always rides along. One
        the server extracted from the still's own bytes (a single-file
        "motion photo") already sits inside the still, so it rides only
        when the caller's `downloadIncludeEmbeddedVideos` preference is
        on (default `false`); with the switch off the archive holds the
        still alone. A motion deleted since the pair formed, or one
        whose bytes are missing, likewise leaves the still alone: a
        broken pair degrades to a plain photo, never to an error.

        Every other asset keeps the plain original branch below.

        The download is always an attachment: `Content-Disposition:
        attachment; filename*=UTF-8''...` with the original file name
        escaped per RFC 5987 -- every byte outside the attribute
        character set is percent-encoded, which rules out header
        injection and in-browser rendering alike (SVG is not in the
        upload whitelist, so the download-only rule covers every
        stored format). `Content-Type` is the asset's stored MIME
        type. The response carries the same `ETag` and
        `Cache-Control` validators as the thumbnail (the original
        bytes are content-addressed, hence immutable).

        Byte ranges follow the Go standard library's `ServeContent`
        semantics: a satisfiable single range answers 206 with
        `Content-Range`; multiple ranges answer a
        `multipart/byteranges` body; an unsatisfiable range answers
        416 with the total size in `Content-Range`; a malformed Range
        header is ignored and the full body answers 200.

        The same caller-visible gate as every asset endpoint: the
        owner, or a member of an album the caller sees -- foreign
        and unknown ids answer byte-identical 404
        `ASSET_NOT_FOUND`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The original file, or -- for a Live Photo -- the one archive
            of the pair. The `Content-Type` header carries the asset's
            stored MIME type, or `application/zip` on the archive arm.
            The `ETag` and `Cache-Control` validators describe the plain
            branch; the archive arm answers `Cache-Control: no-store`
            and no entity tag, because its entry set depends on the
            caller's preference.
          headers:
            ETag:
              description: |
                Strong entity tag: the first 16 hex characters of the
                asset's checksum, quoted. Absent on the archive arm.
              schema:
                type: string
              example: '"9f86d081884c7d65"'
            Cache-Control:
              description: |
                The original bytes are content-addressed and therefore
                immutable; the download is private to the owner. The
                archive arm answers `no-store` instead.
              schema:
                type: string
              example: private, max-age=31536000, immutable
            Content-Disposition:
              description: |
                Always `attachment` with the RFC 5987 escaped name: the
                original file name on the plain branch, the still's
                stem with the zip extension on the archive arm.
              schema:
                type: string
              example: attachment; filename*=UTF-8''IMG_1234.jpg
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '206':
          description: |
            A satisfiable single byte range; `Content-Range` names the
            served slice. Multi-range requests answer
            `multipart/byteranges` instead.
          headers:
            Content-Range:
              description: The served slice of the total file size.
              schema:
                type: string
              example: bytes 0-99/12345
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: |
            The `If-None-Match` value matched the entity tag; the
            cached copy is current.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset with this id is visible to the caller: the id is
            unknown or belongs to another account, and the two cases
            are indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
        '416':
          description: |
            The requested range is unsatisfiable for this file; the
            `Content-Range` header of the error carries the total size
            (`bytes */<size>`).
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{id}/play:
    get:
      operationId: playAsset
      tags:
        - assets
      summary: Stream the transcoded playable copy of one owned video.
      description: |
        Streams the web-safe transcoded MP4 of a video asset: the
        pipeline's transcode job re-encoded the original into H.264
        video (yuv420p) plus AAC audio -- the pair every browser plays
        natively -- with the movie index relocated to the front of the
        container (`+faststart`), so playback begins while the file is
        still downloading. The stream is served inline as `video/mp4`
        with no `Content-Disposition`: it feeds the client's video
        element, while downloading the original bytes stays on `GET
        /assets/{id}/original` (the transcoded copy is a derivative,
        never the archival original).

        The response is a private immutable static asset like the
        thumbnail: `Cache-Control: private, max-age=31536000,
        immutable`, and a strong `ETag` built from the first 16 hex
        characters of the asset's checksum (quoted) -- the transcode is
        a deterministic function of the immutable original bytes, so
        the tag is stable across re-runs of the job. A matching
        `If-None-Match` answers 304 with the same validators and no
        body.

        Byte ranges follow the Go standard library's `ServeContent`
        semantics (video seeking needs them): a satisfiable single
        range answers 206 with `Content-Range`; multiple ranges answer
        a `multipart/byteranges` body; an unsatisfiable range answers
        416 with the total size in `Content-Range`; a malformed Range
        header is ignored and the full body answers 200.

        Only the video family has a playable stream: a standalone
        video and a Live Photo's component video row alike (linked
        through `livePhotoVideoId` -- since the component counts a
        transcode job of its own, its playable copy arrives exactly
        like any video's, and the pair's motion plays through this
        endpoint by the component's id). An image asset answers 404
        `ASSET_NOT_FOUND` -- there is nothing to play by that id, and
        the answer is the asset's own not-found envelope, the same
        anti-enumeration shape (byte for byte) as an unknown or a
        foreign id. A video whose transcode has not been produced
        yet -- the pipeline is still running, or the transcode job
        failed and is retrying -- answers 404 `ASSET_NOT_READY`: the
        client renders the poster frame (the thumbnail endpoint
        serves it) and waits for the `asset.ready` event instead of
        treating the asset as gone; for a Live Photo component, whose
        readiness the pair's photo announces on its own schedule,
        the client keeps the still photo until the stream appears.
        The standalone video pipeline counts three jobs (metadata,
        thumbnail, transcode), so its readiness follows all three;
        the component's counter counts its transcode alone.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The transcoded stream, `video/mp4`.
          headers:
            ETag:
              description: |
                Strong entity tag: the first 16 hex characters of the
                asset's checksum, quoted. The transcode is a
                deterministic function of the immutable original bytes,
                so the tag is stable across re-runs of the job.
              schema:
                type: string
              example: '"9f86d081884c7d65"'
            Cache-Control:
              description: |
                The transcoded copy is private to the caller and
                immutable (its content is a function of the immutable
                original bytes), so clients may cache it for a year.
              schema:
                type: string
              example: private, max-age=31536000, immutable
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: |
            A satisfiable single byte range (video seeking); the
            `Content-Range` header names the served slice.
            Multi-range requests answer `multipart/byteranges` instead.
          headers:
            Content-Range:
              description: The served slice of the total file size.
              schema:
                type: string
              example: bytes 0-99/24680
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '304':
          description: |
            The `If-None-Match` value matched the entity tag; the
            cached copy is current. The response carries the same
            `ETag` and `Cache-Control` validators and no body.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            Either no playable asset with this id is visible to the
            caller (unknown id, foreign id, or an image asset --
            `ASSET_NOT_FOUND`), or the video exists but its transcoded
            stream is not on disk yet (`ASSET_NOT_READY` -- the
            transcode job has not produced it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  summary: |
                    Unknown, foreign, or an image asset (nothing to
                    play).
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
                assetNotReady:
                  summary: The transcode job has not run yet.
                  value:
                    code: ASSET_NOT_READY
                    message: asset media is not ready yet
        '416':
          description: |
            The requested range is unsatisfiable for this file; the
            `Content-Range` header of the error carries the total size
            (`bytes */<size>`).
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/by-device-id/{deviceAssetId}:
    get:
      operationId: getAssetByDeviceId
      tags:
        - assets
      summary: Look up an uploaded asset by its device identifier.
      description: |
        The backup idempotency probe: the app asks, before uploading a
        local file, whether its `deviceAssetId` already exists for this
        account, and skips the upload when it does.

        The lookup is owner-scoped -- a `deviceAssetId` of another
        user's asset is invisible and answers 404. The `state` field
        mirrors what a re-upload of the same content would produce:
        `duplicate` when the asset is live, `trashed` when it sits in
        the trash (the client can then offer restore or save-as-new
        before spending bandwidth). 404 means the device has not
        uploaded this identifier (or only under another account).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: deviceAssetId
          in: path
          required: true
          description: The device-side identity the asset was uploaded with.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: |
            The asset recorded under this device identifier. `state` is
            `duplicate` (live) or `trashed` (in the trash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
              examples:
                alreadyUploaded:
                  summary: The device already uploaded this photo.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1234.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    state: duplicate
                    createdAt: '2026-10-29T09:12:00Z'
                    takenAt: '2026-10-13T12:30:00Z'
                    isTrashed: false
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset of this account carries the device identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this device identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trash:
    get:
      operationId: getTrash
      tags:
        - assets
      summary: List the caller's trashed assets with their retention countdown.
      description: |
        The trash view of the caller: every asset the caller soft
        deleted, newest deletion first, each with the countdown of
        whole days until the expiry job removes it. Retention is the
        instance setting `trash_retention_days` (default 30): the
        expiry job runs hourly and permanently deletes rows whose
        `deletedAt` fell past the retention window, so an item shows
        `remainingDays` 0 on its way out (the row survives only until
        the next job run) and disappears afterwards -- restoring it
        then answers 404, it does not resurrect.

        `remainingDays` counts the days left rounded up: an asset
        trashed moments ago with the default retention shows 30. The
        list is owner-scoped and bounded: it answers at most the 200
        most recent deletions (the trash is a recovery view for
        recent deletes, and older items age out through expiry long
        before the bound could bite). The component video rows of
        Live Photos never appear: the pair is represented by its
        photo. `retentionDays` carries the instance setting the
        countdowns were computed against -- the note the trash page
        renders its number from.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The trashed assets of the caller, newest deletion first.
            `items` is the full (bounded) list -- there is no
            pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResponse'
              examples:
                onePhoto:
                  summary: One photo, trashed earlier today.
                  value:
                    retentionDays: 30
                    items:
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                        kind: image
                        storageKind: blob
                        originalFilename: IMG_1234.jpg
                        fileSize: 4821933
                        mimeType: image/jpeg
                        checksum: 9f86d081884c7d65a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        createdAt: '2026-10-29T09:12:00Z'
                        takenAt: '2026-10-13T12:30:00Z'
                        takenAtSource: exif
                        isReady: true
                        width: 4032
                        height: 3024
                        durationMs: null
                        blurhash: UHL6aAof00WBWB00ayWB00
                        livePhotoVideoId: null
                        deletedAt: '2026-10-30T11:04:05Z'
                        remainingDays: 30
                empty:
                  summary: Nothing in the trash.
                  value:
                    items: []
                    retentionDays: 30
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trash/{id}/restore:
    post:
      operationId: restoreAsset
      tags:
        - assets
      summary: Restore one trashed asset.
      description: |
        Clears the trash mark of one asset: the row becomes live
        again and re-enters the timeline (its album memberships were
        never removed -- a trashed asset is filtered out of the live
        views, not evicted from its albums). The component video row
        of a Live Photo is restored with its photo.

        The restore splits on the row's storage kind, its
        two semantics: a `blob` row's file never moved (the
        mark was the whole trash), while an `external` row's file
        was moved into the server's trash area -- the restore moves
        it back to the `original_path` the row recorded. A location
        that can no longer receive the file (the source folder
        unmounted, the directory gone) fails the restore explicitly
        with 500 `ASSET_RESTORE_MOVE_FAILED`: the row stays trashed
        and the file stays in the trash area, exactly where a retry
        after remounting finds it.

        The operation follows set semantics: restoring an asset that
        is already live succeeds (204, nothing to do) -- a client
        that races another restore, or asks twice, converges instead
        of erroring; the row is already in the desired state. Only an
        id that is unknown, or that belongs to another account while
        the caller is not its owner, answers 404 -- byte-identical
        for both cases, so asset ids cannot be enumerated. An asset
        whose row the expiry job already removed answers 404 as well:
        a purge is not reversible.

        The retention countdown of the trash list is the only signal
        that a restore is still possible; after the row is gone, the
        content itself can only return through a re-upload (which the
        upload idempotency answers as a fresh asset) or, for a
        directory album's source file, the next rescan's add arm.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the trashed asset.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The asset is live again (or already was: the idempotent
            success). The row re-enters the timeline and every live
            view.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset with this id is restorable by the caller: the id
            is unknown, already purged by the expiry job, or belongs
            to another account -- all indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
        '500':
          description: |
            Unexpected server failure, or the external restore's
            move failure: the file could not be moved back to its
            recorded original location. The row stayed trashed and
            the file stayed in the trash area -- a retry after the
            source location returns is the recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                restoreMoveFailed:
                  value:
                    code: ASSET_RESTORE_MOVE_FAILED
                    message: the file could not be moved back to its original location
  /trash/restore-all:
    post:
      operationId: restoreAllTrash
      tags:
        - assets
      summary: Restore every trashed asset of the caller.
      description: |
        The whole-trash restore: every row of the caller's trash
        right now returns to the live views, the newest deletion
        last. The Live Photo pair restores as one asset (its
        component video row rides the photo's restore), an external
        row's file moves back to its recorded original location, and
        the rows that actually left the trash announce one
        `asset.restored` each on the activity stream.

        The endpoint is idempotent: an empty trash answers 200 with
        `affected` 0 -- there is no not-found surface, the sweep
        scans what is in the caller's trash at the time of the
        request, so the 404 of the single-row restore never appears.
        The sweep never touches another account's rows (the trash is
        owner-scoped) and never reaches rows that are already live.

        The caller confirms nothing: a whole restore is reversible
        through the timeline's own trash flow, so unlike the empty
        arm no confirmation gate is specified -- the client runs it
        directly.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The restore landed: `affected` names the rows that left
            the trash (0 when the trash was already empty -- the
            idempotent no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashSweepResponse'
              examples:
                restoredAll:
                  summary: Six rows returned to the live views.
                  value:
                    affected: 6
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: |
            Unexpected server failure, or the external restore's move
            failure: the file could not be moved back to its recorded
            original location. The rows restored before the failure
            stay restored and the row in question stays trashed --
            the sweep answers like the single-row restore's move
            failure, and a retry after remounting finds the rest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                restoreMoveFailed:
                  value:
                    code: ASSET_RESTORE_MOVE_FAILED
                    message: the file could not be moved back to its original location
  /trash/empty:
    post:
      operationId: emptyTrash
      tags:
        - assets
      summary: Permanently delete everything in the caller's trash.
      description: |
        The whole-trash delete: every row of the caller's trash right
        now goes for good, under the same rules the single-row
        permanent delete pins (the shared-blob reference rule keeps a
        file another row still uses; the derived trees go with the
        rows; the Live Photo pair goes together). Each purged row
        announces one `asset.deleted` on the activity stream, so the
        connected surfaces converge the way they follow the expiry
        job's purges.

        The endpoint is idempotent: an empty trash answers 200 with
        `affected` 0 -- the sweep scans what is in the caller's trash
        at the time of the request, so the 404 of the single-row
        delete never appears. The sweep never touches another
        account's rows: the trash is owner-scoped, an empty answers
        only ever concern the caller's own deletes.

        The caller confirms FIRST: the permanent deletion of every
        trashed asset is irreversible, so the client opens its
        confirmation dialog (naming the count it is about to destroy)
        before the request may fire.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The empty landed: `affected` names the rows that were
            purged (0 when the trash was already empty -- the
            idempotent no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashSweepResponse'
              examples:
                emptiedAll:
                  summary: Six rows destroyed for good.
                  value:
                    affected: 6
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /trash/batch:
    post:
      operationId: batchTrash
      tags:
        - assets
      summary: Apply one restore or delete action over a list of ids in the caller's trash.
      description: |
        The trash view's multi-select surface: one request applies one
        action (`restore` or `delete`) to a list of ids. The id
        resolution mirrors the assets batch's set semantics with a
        TRASH-SCOPED guard: only an id that is in the caller's trash
        at the time of the request resolves -- unknown ids, other
        accounts' assets (indistinguishable, so ids cannot be
        enumerated), rows already restored to the live views and rows
        the expiry job already purged land in the response's
        `missing` list instead, and the batch never fails over an
        individual id. The resolved ids' actions run under the same
        semantics the single-row endpoints pin: the restore moves a
        Live Photo pair and an external row's file as the single-row
        restore does, the delete runs the permanent-delete rules (the
        shared-blob rule included) row by row, and the rows whose
        state actually changed announce the same events per row
        (`asset.restored` / `asset.deleted`).

        `delete` is the destructive arm: the caller's client confirms
        first (the count in the sentence), exactly like the whole-trash
        empty.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashBatchRequest'
            examples:
              restoreSelection:
                summary: Restore two of the caller's trashed photos.
                value:
                  action: restore
                  ids:
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
      responses:
        '200':
          description: |
            The batch landed: `affected` and `missing` partition the
            request's distinct ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashBatchResponse'
              examples:
                partial:
                  summary: One id had already left the trash.
                  value:
                    affected: 2
                    missing:
                      - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
        '400':
          description: |
            The request body is malformed JSON, the action is not one
            of the two the surface knows, or the id list is empty or
            over the batch bound of 1000.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                    message: ids must carry at least one asset id
                    details:
                      fields:
                        - ids
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: |
            Unexpected server failure, or the external restore's move
            failure (the same explicit answer the single-row restore
            gives).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                restoreMoveFailed:
                  value:
                    code: ASSET_RESTORE_MOVE_FAILED
                    message: the file could not be moved back to its original location
  /albums:
    get:
      operationId: listAlbums
      tags:
        - albums
      summary: The caller's album wall.
      description: |
        The album wall of the calling user: every album that deserves
        a wall card, in one array whose three arms are concatenated --
        the client renders ONE list and keys each card's face off the
        `callerRole` discriminator the item carries.

        The caller's sync album is pinned FIRST, before the own
        group: the one card of type `sync`, the caller's own core
        upload stream surfaced as the default "My photos" album --
        every upload lands in it, so a fresh account's wall is never
        empty. The own group follows: the albums the caller owns of
        type `memory` or `directory`, the most recently updated
        first (the album id descending as the tiebreak). The shared
        group follows last: every album shared to the caller through
        an `album_shares` row, the caller's most recently granted
        share first (the album id descending as the tiebreak).
        Shared items carry `owner` -- the honest attribution of
        another account's album: the owner's id, email and display
        name (the card renders the name, the email its fallback and
        its disambiguator).

        A sync album of ANOTHER account never appears, in either
        group: the shared arm carries `memory` and `directory`
        albums only, whatever share rows exist. The pinned card's
        `title` is the system's internal fixed label ('Sync') -- the
        display name is the CLIENT's: `type: 'sync'` keys the
        localized default-album name (en "My photos", zh-Hans
        "我的照片"), and the stored title never renders.

        `coverAssetIds` is the wall card's collage source, in render
        order: the owner's pinned set when one exists (exactly as
        written -- the server never re-sorts a pin), otherwise the
        server's automatic group for the week (see
        `AlbumSummary.coverAssetIds`). The card is the first thing
        drawn and cannot see the collection, so the automatic group
        is computed here; it is never the newest frames and never a
        client's random pick, and an upload mid-week cannot move it.
        Fewer frames than the card holds when the album has fewer
        members; empty for an album with none. `itemCount`
        counts the album's members under the container rule and
        `photoCount` the image-kind ones among them (the card's
        image-glyph count renders `photoCount`): trashed and Live
        Photo component rows never count, while an archived member
        does -- an album keeps its archived members (it is a
        reference container), and the count is the container's own
        face. A `memory` card is the exception: the memories surface
        is a family flow, so its archived members count nowhere. For
        a shared-group `memory` card the predicate widens the same
        way the detail's does: both counts and the collage frames
        are the members the memory's owner currently sees -- the
        re-share ground, revalidated at read time, so a revoked photo
        leaves the sharee's card and collage with no snapshot
        residue.

        `isShared` reports whether the album carries at least one
        `album_shares` row -- the owner's "someone else sees this"
        badge. It is true by construction on every shared-group item
        (the caller's share row is the reason the item exists).

        `inTimeline` rides the excludable cards -- the own
        `directory` items and every shared item: the caller's
        timeline preference of that album, true when no preference
        row exists (the default of feeding the timeline). The own
        `memory` items omit the field: they never feed the caller's
        own timeline. The pinned `sync` card omits it too: the core
        stream is never excludable (the preference face answers 400
        for it). The field is the toggle's source of truth for
        the wall's "excluded" badge, kept current by the
        `PUT/DELETE /albums/{albumId}/timeline-preference` endpoints.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The caller's wall: the pinned sync card, then the own
            group, then the shared group. The array is empty only
            when the caller's account predates the sync-album
            wiring (no sync album exists) and no memory or
            directory album is theirs and no album is shared to
            them -- the sync card otherwise always leads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumWallResponse'
              examples:
                ownThenShared:
                  summary: The pinned sync card, two own albums, then one shared by another account.
                  value:
                    albums:
                      - id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6061
                        title: Sync
                        description: ''
                        type: sync
                        isShared: false
                        coverAssetIds:
                          - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6076
                          - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6077
                          - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6078
                          - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6079
                        itemCount: 1204
                        photoCount: 1197
                        updatedAt: '2026-11-05T07:30:00Z'
                        callerRole: owner
                      - id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6071
                        title: Road trip 2026
                        description: The coastal week in the van.
                        type: memory
                        isShared: true
