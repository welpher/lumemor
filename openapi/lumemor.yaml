                      - hf-mirror.com
                    mirrorBaseUrl: ''
                    params:
                      faceDetectMinScore: 0.6
                      faceRecognizeThreshold: 0.55
        '400':
          description: |
            A required field is missing, a host entry is malformed, or
            the body is not valid JSON. The details name the field;
            nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: VALIDATION_FAILED
                    message: 'required fields missing: autoDownload'
                    details:
                      fields:
                        - autoDownload
                badHost:
                  value:
                    code: VALIDATION_FAILED
                    message: 'allowedHosts must be hostnames, with an optional leading *. wildcard'
                    details:
                      fields:
                        - allowedHosts
                badParam:
                  value:
                    code: VALIDATION_FAILED
                    message: 'params must sit in the closed 0-1 domain'
                    details:
                      fields:
                        - params.faceDetectMinScore
        '401':
