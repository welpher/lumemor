  /faces:
    post:
      operationId: createFace
      tags:
        - people
      summary: Add one hand-drawn face to an asset.
      description: |
        The manual face: the owner draws a box around a face the
        detector missed and the drawn box becomes a face row of that
        asset -- the same rows detection writes, minus a detector
        (the row's model is null, its score 1.0 -- the caller's own
        certainty) and minus an embedding (the recognition never saw
        it, so the face joins no cluster until the caller assigns
        one). The box rides in the FaceBbox per-mille units; the
        width and height halves must be at least 1 (a zero-extent box
        is nothing drawn).

        The refusal discipline is the face writes' own: the face must
        sit on an asset the caller OWNS and that is live -- any other
        state (unknown asset, another account's asset, an asset shared
        to the caller but not owned, a trashed, archived or Live Photo
        component asset) answers the same byte-identical 404
        `PERSON_NOT_FOUND` (anti-enumeration). A bbox value outside
        the 0..1000 bounds, a missing half, or a body that fails to
        decode answers 400 `VALIDATION_FAILED`.

        The write inserts the row and answers it; it publishes NO
        event: a face with no cluster announces no person change, and
        the caller's own session converges through the response (the
        same silence a fresh detection's rows keep until recognition
        names them). The caller's next step is the assign flow --
        `POST /faces/{faceId}/move` or the from-face creation -- which
        is where the drawn face becomes someone.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceCreateRequest'
            examples:
              drawnBox:
                summary: A box drawn around a face the detector missed.
                value:
                  assetId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                  bbox:
                    x: 260
                    y: 300
                    w: 150
                    h: 150
      responses:
        '200':
          description: The face row is stored; the response carries its identity and crop URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceCreated'
              examples:
                created:
                  summary: The drawn face, ready for the assign flow.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f74
                    thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f74/thumbnail
        '400':
          description: |
            The request is invalid: the body is not valid JSON, a
            bbox half is missing or outside the 0..1000 bounds, or a
            drawn box carries a zero width or height.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                zeroBox:
                  summary: Nothing was drawn.
                  value:
                    code: VALIDATION_FAILED
                    message: the drawn box must carry a positive width and height
                    details:
                      fields:
                        - bbox
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such drawable asset for this caller: the asset id is
            unknown, or it is not the caller's own live asset --
            indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /faces/{faceId}:
    patch:
      operationId: patchFaceBox
      tags:
        - people
      summary: Rewrite one face's bounding box.
      description: |
        The face-box editor's write: the caller adjusts a face's
        bounding box on the photo (drag to move, drag a corner to
        resize) and the PATCH stores the adjusted box. The body
        carries the box NORMALIZED to the image (0-1, four values
        required -- x/y the top-left corner, width/height the
        extents); the server stores it in the faces table's own
        per-mille units (the same numbers the crop endpoint and the
        on-photo face-box layer address).

        The box must stay in frame: every coordinate and extent
        within 0-1 with x + width <= 1 and y + height <= 1, and
        neither extent below 0.01 (a box smaller than a hundredth of
        the image is nothing worth storing). Any other body answers
        `400 VALIDATION_FAILED`.

        The guard is the face writes' own: the face must sit on an
        asset the caller OWNS and that is live -- an unknown face,
        another account's asset, or a trashed, archived or Live
        Photo component asset answers the same byte-identical 404
        `PERSON_NOT_FOUND` (anti-enumeration).

        On success the face's crop is recomputed from the new box --
        the crop endpoint derives it at query time, so the change
        converges through the face row's own `updated_at` (the crop
        ETag's change signal). The write publishes
        `person.face_box_updated` with the face id and the acting
        user's id.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: faceId
          in: path
          required: true
          description: Identifier of the face whose box is rewritten.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceBoxPatchRequest'
            examples:
              adjusted:
                summary: A box moved to the upper right quadrant.
                value:
                  x: 0.56
                  y: 0.38
                  width: 0.14
                  height: 0.14
      responses:
        '200':
          description: |
            The box is stored: the response is the updated face's
            identity, its crop URL and the box in the stored per-mille
            units.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceBoxPatchResponse'
              examples:
                updated:
                  value:
                    faceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                    thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
                    bbox:
                      x: 560
                      y: 380
                      w: 140
                      h: 140
        '400':
          description: |
            The body is not a well-formed in-frame box: a missing or
            non-numeric value, a coordinate or extent outside 0-1, a
            box crossing the frame, or an extent below 0.01.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  value:
                    code: VALIDATION_FAILED
                    message: the box must carry four in-frame normalized values with extents of at least 0.01
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such editable face for this caller: the face id is
            unknown, its asset is not the caller's own live asset --
            indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: detachFace
      tags:
        - people
      summary: Release one face from its person.
      description: |
        The single-face detach: the face's cluster assignment goes
        NULL, returning it to the not-yet-grouped pool it came
        from (the state a freshly detected face holds before the
        clustering assigns it). The face row survives -- it still
        lists among its asset's faces, now carrying no person --
        and any later assign write can re-home it.

        The refusal discipline is the face move's own: the face
        must sit on an asset the caller OWNS and that is live --
        any other state (unknown face, another account's asset, an
        asset shared to the caller but not owned, a trashed,
        archived or Live Photo component asset) answers the same
        byte-identical 404 `PERSON_NOT_FOUND`
        (anti-enumeration). A face the clustering has not yet
        assigned to any cluster is part of no person and answers
        the same 404: there is no membership to release.

        The source cluster does NOT dissolve unless this detach
        emptied it; the vacated cluster re-homes its
        representative to the best surviving member, and an
        emptied cluster dissolves WITH its label rows cascading --
        the same honest cost a merge pays. The whole structural
        change lands as ONE transaction. The write publishes
        `person.face_detached` with the face id, the cluster the
        face left and the acting user's id.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: faceId
          in: path
          required: true
          description: Identifier of the face to release.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The face is released: it holds no cluster, and any
            cluster it emptied dissolved with its labels. The
            response has no body.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such detachable face for this caller: the face id is
            unknown, its asset is not the caller's own live asset,
            or the face belongs to no cluster -- indistinguishable
            by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /faces/{faceId}/cluster:
    post:
      operationId: clusterFace
      tags:
        - people
      summary: Seed a new person from one face.
      description: |
        The from-face person creation: the face leaves whatever
        cluster it occupies and becomes the sole member AND the
        representative face of a brand-new cluster. Naming acts on
        a whole cluster, so a face grouped into the wrong person
        becomes its own person here -- the caller labels the new
        cluster afterwards like any other.

        The refusal discipline is the face move's own: the face
        must sit on an asset the caller OWNS and that is live --
        any other state (unknown face, another account's asset, an
        asset shared to the caller but not owned, a trashed,
        archived or Live Photo component asset) answers the same
        byte-identical 404 `PERSON_NOT_FOUND`
        (anti-enumeration). A face the clustering has not yet
        assigned to any cluster is VALID here: the creation seeds
        the new cluster with it and there is simply no source to
        maintain.

        A call on a face that already holds a cluster is a CREATE,
        never a no-op: the face re-homes onto a new cluster and
        the vacated source follows the cluster maintenance
        discipline -- its representative re-homes to the best
        surviving member, or the cluster dissolves with its label
        rows cascading when this creation emptied it (the same
        honest cost a merge pays; a source cluster's user-given
        name dies with the cluster).

        The whole structural change lands as ONE transaction. The
        write publishes `person.face_clustered` with the face id,
        the new cluster id and the acting user's id.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: faceId
          in: path
          required: true
          description: Identifier of the face that seeds the new cluster.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The creation committed as one transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterFaceResponse'
              examples:
                clustered:
                  value:
                    faceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                    clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f74
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such seedable face for this caller: the face id is
            unknown, or its asset is not the caller's own live
            asset -- indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /faces/{faceId}/move:
    post:
      operationId: moveFace
      tags:
        - people
      summary: Move one face onto an existing face cluster.
      description: |
        One face's move onto an existing target cluster: the tidy-up
        primitive behind the viewer's face chips. The face must sit
        on an asset the caller OWNS and that is live, and the target
        must be caller-visible -- any other state (unknown face,
        another account's asset, an asset shared to the caller but
        not owned -- the move is curation, and curation is the
        owner's alone -- an invisible or unknown target) answers the
        same byte-identical 404 `PERSON_NOT_FOUND`
        (anti-enumeration). A face the clustering has not yet
        assigned to any cluster is a valid source: it simply joins
        the target (there is no source cluster to maintain).

        The move runs as ONE transaction through the cluster
        maintenance discipline: the target's representative face
        recomputes to its strongest member, and the vacated source
        cluster re-homes its representative to the best surviving
        member -- or dissolves with its label rows cascading when
        the move empties it (a source cluster's user-given name dies
        with the cluster, the same honest cost as a merge).

        Moving a face onto the cluster it already occupies is an
        accepted no-op. The write publishes `person.face_moved` with
        the face id, the cluster it now occupies and the acting
        user's id.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: faceId
          in: path
          required: true
          description: Identifier of the face to move.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveFaceRequest'
            examples:
              moveToAda:
                summary: Assign the face to an existing person.
                value:
                  targetClusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
      responses:
        '200':
          description: The move committed as one transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveFaceResponse'
              examples:
                moved:
                  value:
                    faceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                    clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
        '400':
          description: |
            The body is not valid JSON or lacks a usable
            `targetClusterId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  value:
                    code: VALIDATION_FAILED
                    message: request body must be valid JSON
                    details:
                      fields:
                        - body
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such movable face for this caller: the face id is
            unknown, its asset is not the caller's own live asset,
            or the target cluster is invisible to the caller --
            indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /faces/{faceId}/thumbnail:
    get:
      operationId: getFaceThumbnail
      tags:
        - people
      summary: Serve one face's 256x256 crop thumbnail.
      description: |
        The face crop pixels of the people surface: a 256x256
        `image/avif` crop of one detected face, derived at query time
        and never stored on disk. The source pixels are the face's
        asset's `view` derivative -- the inline serving size of
        `GET /assets/{id}/thumbnail` -- never the original; the face
        row's bounding box is in per-mille units of the full image,
        and the view derivative preserves the original's framing
        exactly, so the same per-mille values address the
        derivative's own pixels.

        The crop window is pinned: a square whose side is 1.25x the
        larger of the box's pixel width and height (a 25% margin
        around the face), centered on the box and clamped to the
        image bounds (a face larger than the image yields the
        image's smaller edge); the window then renders to exactly
        256x256 pixels -- upscaled when the window is smaller,
        a zoom rather than a fit.

        The permission gate is the face's asset: the caller must see
        a live, non-component asset -- their own, or one shared to
        them through an album. Every other state answers the SAME
        byte-identical 404 PERSON_NOT_FOUND -- an unknown face id, a
        face on another account's unshared (or a trashed, or archived)
        asset, and an asset whose view derivative has not been
        derived yet (the thumbnail job has not run). Face ids cannot
        be probed for existence; the web renders its skeleton
        placeholder until the pixels exist, which is why there is
        deliberately no separate not-ready code here, unlike the
        asset thumbnail endpoint.

        The response is a private immutable derived asset:
        `Cache-Control: private, max-age=31536000, immutable`, and a
        strong `ETag` of `"face-{faceId}-{updatedAt}"`, where
        updatedAt is the face row's change signal in unix seconds --
        cluster moves bump it, and re-detection replaces the face row
        outright. A matching `If-None-Match` answers 304 with the
        same validators and no body. Conditional requests and byte
        ranges otherwise follow the Go standard library's
        `ServeContent` semantics.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: faceId
          in: path
          required: true
          description: Identifier of the face to crop.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The 256x256 AVIF face crop.
          headers:
            ETag:
              description: |
                Strong entity tag: `face-{faceId}-{updatedAt}` -- the
                face row's id with its change signal (unix seconds),
                quoted. The derivation is deterministic, so one signal
                always renders the same bytes.
              schema:
                type: string
              example: '"face-0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71-1777636800"'
            Cache-Control:
              description: |
                The crop is private to the caller and a pure function
                of the face row and its asset's view derivative, so
                clients may cache it for a year.
              schema:
                type: string
              example: private, max-age=31536000, immutable
          content:
            image/avif:
              schema:
                type: string
                format: binary
        '304':
          description: |
            The `If-None-Match` value matched the entity tag; the
            cached copy is current. The response carries the same
            `ETag` and `Cache-Control` validators and no body.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie or
            bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such face for this caller: the face id is unknown, its
            asset is not visible to the caller (another account's,
            trashed, archived, or a Live Photo component), or the
            asset's view derivative does not exist yet -- all
            indistinguishable by design; the web renders a skeleton
            placeholder until the pixels exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /places:
    get:
      operationId: listPlaces
      tags:
        - places
      summary: The caller's city grouping.
      description: |
        The places surface: every place of the GeoNames reference data
        that holds at least one asset the caller can see -- the city
        grouping the places page renders as its grid. A place joins
        the list when it carries a caller-visible live asset (the
        album union of the caller's own sync and directory albums
        plus every album shared to them, and the timeline's live-row
        filters: not trashed, not archived, no Live Photo component
        row); `assetCount` counts exactly those assets, so the same
        place can show different counts to different accounts -- the
        honest per-caller counting discipline the people surface
        pins, applied to cities.

        `name` is the locale-joined display name: the
        `place_names` row of the requested locale when the place
        data carries one, the GeoNames canonical (English or
        romanized) name otherwise. Locale is a REQUEST parameter
        (the web app owns the active locale and passes it along);
        `en` is the default. A locale switch changes the join only
        -- the assets rows never carry locale strings, so switching
        languages never rewrites asset data.

        `representativeCoverAssetIds` is the wall's derived-cover
        discipline applied to city groups: the place's (up to) four
        most recent caller-visible live members, taken_at descending
        with the asset id as the tiebreak -- the cover tiles the
        places page renders from. A listed place always carries at
        least one candidate (the listing itself proved a visible
        member exists).

        `takenAtFrom` and `takenAtTo` are the place's caller-visible
        live members' earliest and latest capture times: the span the
        city card prints as its year range ("2019-2026", one year
        when the two fall in the same calendar year). A listed place
        always carries both.

        The list is ordered by `takenAtTo` descending -- the most
        recently photographed city first -- with the place id
        ascending as the deterministic tiebreak. It is not paginated:
        the same single-document shape the named-people listing uses,
        sized for a family instance's few thousand places.

        Place resolution itself (which asset belongs to which city)
        is the ingestion pipeline's business -- the metadata job's
        GPS step and the admin re-resolution run -- and follows the
        place data baked into the server image; this endpoint
        only reads what those wrote.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: locale
          in: query
          required: false
          description: |
            The display locale of the place names: `en` or `zh-Hans`,
            the instance's UI language set. Absent means `en`. A
            value outside the set answers 400 `VALIDATION_FAILED`.
          schema:
            type: string
            enum:
              - en
              - zh-Hans
            default: en
          example: zh-Hans
      responses:
        '200':
          description: |
            The caller's city grouping, ordered by the latest capture
            time descending (the place id ascending as the tiebreak).
            The array is empty when no visible asset of the caller
            carries a resolved place.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceSummary'
              examples:
                twoPlaces:
                  summary: Two cities, the names in the zh-Hans locale.
                  value:
                    - placeId: 1816670
                      name: 北京
                      country: CN
                      assetCount: 42
                      latitude: 39.9075
                      longitude: 116.39723
                      takenAtFrom: '2019-04-08T10:12:00Z'
                      takenAtTo: '2026-08-02T15:40:00Z'
                      representativeCoverAssetIds:
                        - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                    - placeId: 2988507
                      name: 巴黎
                      country: FR
                      assetCount: 17
                      latitude: 48.85341
                      longitude: 2.3488
                      takenAtFrom: '2024-01-21T09:05:00Z'
                      takenAtTo: '2024-01-25T18:20:00Z'
                      representativeCoverAssetIds:
                        - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f72
                empty:
                  summary: Nothing resolved (or nothing visible) yet.
                  value: []
        '400':
          description: |
            The locale parameter carries a value outside the
            instance's language set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidLocale:
                  value:
                    code: VALIDATION_FAILED
                    message: 'locale must be one of: en, zh-Hans'
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /map/config:
    get:
      operationId: getMapConfig
      tags:
        - places
      summary: The map's client-side tile configuration.
      description: |
        The configuration the places map and the viewer's location
        card need before they can draw a base layer: the tile
        sources the administrator configured, and nothing else.

        THE POLYGON: the values are URLs the BROWSER loads directly
        from the tile host -- the server never fetches, proxies or
        caches a tile, so a pan or a zoom never makes the photo
        server a tile CDN. What the tile host sees is the viewport,
        the zoom level and the browsing device's address; the pins
        the map draws come from this instance's own API and never
        cross the tile line. A deployment whose browser cannot reach
        a public tile host points the setting at a self-hosted or
        mirrored source; there is deliberately no bundled default
        (a public tile service's usage policy forbids carrying the
        traffic of an application's whole install base).

        THE THEME PAIR: `tilejsonUrl` is the light style, always
        present when a source is configured. `darkTilejsonUrl` is
        the optional dark style: the client loads it in the dark
        theme and follows a live theme switch. A null dark URL means
        the dark theme reuses the light one -- one configured source
        keeps one look.

        Either field is null when no such source is configured. Null
        is not an error: the map renders its honest degraded state --
        the pins stay, the base layer is stated as absent -- and the
        admin settings face is where it gets fixed. A stored value
        is handed back verbatim; its reachability is the browser's
        business, and a source that fails to load lands on the same
        stated absence.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The tile source URLs, each null when unconfigured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapConfigResponse'
              examples:
                pair:
                  summary: A self-hosted vector style with its dark twin.
                  value:
                    tilejsonUrl: https://tiles.example.net/planet/style.json
                    darkTilejsonUrl: https://tiles.example.net/planet/style-dark.json
                    gcj02: false
                    darkGcj02: false
                lightOnly:
                  summary: One style for both themes.
                  value:
                    tilejsonUrl: https://tiles.example.net/planet/style.json
                    darkTilejsonUrl: null
                    gcj02: false
                    darkGcj02: false
                chinaBasemap:
                  summary: A GCJ-02 basemap (Amap) in both themes.
                  value:
                    tilejsonUrl: https://webrd01.is.autonavi.com/appmaptile?style=7&x={x}&y={y}&z={z}
                    darkTilejsonUrl: null
                    gcj02: true
                    darkGcj02: false
                unconfigured:
                  summary: No source configured (the degraded state).
                  value:
                    tilejsonUrl: null
                    darkTilejsonUrl: null
                    gcj02: false
                    darkGcj02: false
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /search:
    get:
      operationId: searchAssets
      tags:
        - search
      summary: The unified search, one text box, two merged paths, filter facets.
      description: |
        The unified search over the caller-visible asset domain (the
        album union of the caller's own sync and directory albums plus
        every album shared to them, and the timeline's live-row
        filters: not trashed, not archived, no Live Photo component
        row). One optional text box drives TWO backend paths that
        merge deterministically; the optional filter parameters
        narrow both paths and the pure-filter mode (no text) is the
        filter browse the search page opens with.

        The TEXT path is unaccented case-insensitive SUBSTRING
        matching over the asset's own text sources -- the original
        filename, the description, and the extracted OCR text -- plus
        the caller's relational vocabularies joined at query time:
        the caller's own tags, the titles of albums the caller can
        see (own albums and albums shared to them; the sync album is
        the timeline's face, not a filter), and the caller's own
        non-hidden person labels. The query is a LITERAL substring,
        never a pattern: the engine escapes its own wildcard
        characters, so `50%` matches the literal text `50%` and never
        globs. Word semantics, stemming and segmentation are out of
        scope by design (the v1 boundary: the match is containment,
        which is language-agnostic by construction; a tokenizing
        engine is the v1.x upgrade path). The path's weak rank
        signal is the trigram similarity of the best matched source.

        The SEMANTIC path embeds the query through the active CLIP
        text tower (the model registry's clip-text slot) and ranks
        the caller-visible assets by cosine similarity over the
        image embeddings the active clip-embed model produced -- the
        same joint space both towers share. The semantic path needs
        the model machinery: when no text tower is active (or the
        tower's dimension disagrees with the embeddings column) the
        semantic path honestly answers EMPTY and the text path still
        serves -- the degradation the model admin page resolves by
        downloading and activating the text tower.

        The MERGE: both paths answer at most their top 500 ranked
        hits; an asset's fused score is the sum over the paths it
        appears in of (500 minus its zero-based position in that
        path), so an asset hit by both paths outranks the single-path
        hits around it; the page orders by the fused score descending
        with the asset id ascending as the total-order tiebreak, and
        one asset hit through many sources or both paths appears
        exactly once. The rule is deterministic: the same query over
        unchanged data answers the same page, and cursors page
        through that stable order.

        A query of fewer than two characters (after trimming), or
        only whitespace, takes NO text path and NO semantic path: the
        request is the pure filter browse. An empty `from`/`to` pair
        with no other filter is the whole visible timeline.

        The FACETS count the current filtered set minus their own
        dimension: `people` lists the caller's named, non-hidden
        people with the number of assets of the current set (query
        and every filter applied EXCEPT personIds) that carry a face
        of that cluster; `places`, `years`, `cameras`, `kinds`,
        `albums` and `tags` follow the same rule for their own
        dimension. Facet ids the caller cannot resolve (an album they
        cannot see, another account's tag) DROP OUT of the filter
        parameters rather than emptying the result -- filters narrow,
        they never probe.

        `personIds`, `albumIds` and `tagIds` are comma-separated id
        lists; `placeIds` is a comma-separated integer list;
        `cameras` is a comma-separated list of the camera facet ids
        (`make|model`). Every id list is capped at 200 entries; a
        longer list answers 400 `VALIDATION_FAILED`. `from` is
        inclusive, `to` is EXCLUSIVE; an inverted range answers 400.
        `locale` picks the places facet's display names exactly the
        way `GET /places` does.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          description: |
            The free-text query: a literal substring matched
            (unaccented, case-insensitively) against the filename,
            the description, the OCR text and the caller's tag,
            album-title and person-name vocabularies, and embedded
            through the CLIP text tower for the semantic path. A
            value of fewer than two characters (after trimming) takes
            no text path: the request is the pure filter browse. The
            length is capped at 256 characters.
          schema:
            type: string
            maxLength: 256
          example: 海边
        - name: personIds
          in: query
          required: false
          description: |
            Restrict the results to assets carrying a face of one of
            these face clusters (the caller's people surface's
            cluster ids).
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 200
          style: form
          explode: false
        - name: placeIds
          in: query
          required: false
          description: |
            Restrict the results to assets resolved to one of these
            places (the places facet's GeoNames ids).
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
            maxItems: 200
          style: form
          explode: false
        - name: from
          in: query
          required: false
          description: |
            The inclusive lower bound of the taken-at range.
          schema:
            type: string
            format: date-time
          example: '2024-01-01T00:00:00Z'
        - name: to
          in: query
          required: false
          description: |
            The EXCLUSIVE upper bound of the taken-at range. A `to`
            at or before `from` answers 400 `VALIDATION_FAILED`.
          schema:
            type: string
            format: date-time
          example: '2025-01-01T00:00:00Z'
        - name: cameras
          in: query
          required: false
          description: |
            Restrict the results to assets whose EXIF camera matches
            one of these camera facet ids (`make|model`).
          schema:
            type: array
            items:
              type: string
            maxItems: 200
          style: form
          explode: false
        - name: kinds
          in: query
          required: false
          description: |
            Restrict the results to these media families. A value
            outside `image`/`video` answers 400.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MediaKind'
            maxItems: 2
          style: form
          explode: false
        - name: albumIds
          in: query
          required: false
          description: |
            Restrict the results to members of these albums. Albums
            the caller cannot see drop out of the filter: they
            contribute nothing, they never empty the result.
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 200
          style: form
          explode: false
        - name: tagIds
          in: query
          required: false
          description: |
            Restrict the results to assets carrying one of the
            CALLER's tags. Another account's tag ids drop out of the
            filter (tags are per-user state).
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 200
          style: form
          explode: false
        - name: isMotion
          in: query
          required: false
          description: |
            Restrict the results to Live Photos (`true`) or to
            everything else (`false`): an asset counts as a Live Photo
            exactly when it carries a motion. THE INTERFACE LEAVES
            THIS SLOT UNEXPOSED for now -- the search surface's
            filter bar does not render it and the web client never
            sends it; the parameter exists so the backend can answer
            the question when a surface asks, without a second
            contract revision. It is not a facet: the facet counts
            ignore it.
          schema:
            type: boolean
          example: true
        - name: locale
          in: query
          required: false
          description: |
            The display locale of the places facet's names, exactly
            the `GET /places` locale join. Absent means `en`. A value
            outside the set answers 400 `VALIDATION_FAILED`.
          schema:
            type: string
            enum:
              - en
              - zh-Hans
            default: en
          example: zh-Hans
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page; absent on the first
            page. The cursor carries the page's ordering mode (the
            fused rank of a text query, or the timeline order of the
            filter browse): a cursor of the other mode answers 400
            `VALIDATION_FAILED`, and so does any value this endpoint
            did not produce.
          schema:
            type: string
          example: GN4WpRPw0AABkvShW2x9jp8KKzxNXm9w
        - name: limit
          in: query
          required: false
          description: |
            Page size: the number of items one response carries at
            most. Defaults to 100; values over 200 are answered with
            200, values below 1 answer 400.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          example: 100
      responses:
        '200':
          description: |
            One page of the merged search (or the filter browse),
            plus the facet counts over the current filtered set minus
            each dimension. `nextCursor` is present exactly when
            another page follows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                mergedPage:
                  summary: A text query's first page with facets.
                  value:
                    items:
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                        kind: image
                        originalFilename: 海边.jpg
                        fileSize: 4821933
                        mimeType: image/jpeg
                        checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        createdAt: '2026-10-29T09:12:00Z'
                        takenAt: '2026-10-13T12:30:00Z'
                        takenAtSource: exif
                        isTrashed: false
                        isArchived: false
                        isFavorite: false
                        isReady: true
                        width: 4032
                        height: 3024
                        durationMs: null
                        blurhash: UHL6aAof00WBWB00ayWB00
                        livePhotoVideoId: null
                    nextCursor: GN4WpRPw0AABkvShW2x9jp8KKzxNXm9w
                    facets:
                      people:
                        - id: 40000000-0000-0000-0000-000000000001
                          name: Mom
                          assetCount: 3
                      places:
                        - placeId: 2988507
                          name: 巴黎
                          country: FR
                          assetCount: 2
                      years:
                        - year: 2024
                          assetCount: 3
                      cameras:
                        - id: Apple|iPhone 15
                          make: Apple
                          model: iPhone 15
                          assetCount: 2
                      kinds:
                        - kind: image
                          assetCount: 3
                      albums:
                        - id: 20000000-0000-0000-0000-000000000001
                          title: Trip
                          assetCount: 2
                      tags:
                        - id: 30000000-0000-0000-0000-000000000001
                          name: beach
                          assetCount: 2
                filterBrowse:
                  summary: The pure filter browse (no text query).
                  value:
                    items: []
                    facets:
                      people: []
                      places: []
                      years: []
                      cameras: []
                      kinds: []
                      albums: []
                      tags: []
        '400':
          description: |
            The parameters are invalid: a mangled or mode-mismatched
            cursor, `limit` below 1, an inverted or unparseable time
            range, a `kinds` value outside the media families, a
            negative `placeIds` entry, an id list over 200 entries, a
            `locale` outside the language set, or a `query` over 256
            characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: A mangled cursor.
                  value:
                    code: VALIDATION_FAILED
                    message: invalid search cursor
                    details:
                      fields:
                        - cursor
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /tags:
    get:
      operationId: listTags
      tags:
        - tags
      summary: The caller's tags, the search vocabulary.
      description: |
        Every tag the calling user owns, one array sorted by name
        case-insensitively with the tag id as the deterministic
        tiebreak (the named-people listing's own ordering discipline):
        the vocabulary the search's tag facet, the batch bar's "add
        tag" and the info panel's tag section consume. Unpaginated
        like the places listing -- a family instance's vocabulary is
        a bounded set, one document.

        Tags are per-user state (the favorites' privacy shape):
        the tags' owner is always the caller, and no tag, name or
        count of another account ever surfaces here. The listing
        carries the vocabulary in full -- a tag whose every member is
        trashed or archived still lists, with its honest count of zero
        (the assignment rows survive, exactly like a favorite row,
        and the count returns with the restore or unhide).

        `assetCount` counts the tag's assignment rows joined to
        CALLER-VISIBLE LIVE assets: the album union (the caller's
        own sync and directory albums plus every album shared to
        them) and the timeline's live filters -- not trashed, not
        archived, no Live Photo component -- the honest-counts
        discipline of the people and places surfaces. A sharee's
        count covers the shared members they can see; a revoked
        share retracts them while the assignment rows survive
        underneath.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The caller's vocabulary, sorted by name case-insensitively
            with the tag id as the tiebreak. Empty when the caller
            owns no tag.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSummary'
              examples:
                threeTags:
                  summary: A small vocabulary with honest counts.
                  value:
                    - id: 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7081
                      name: Beach
                      assetCount: 42
                      createdAt: '2026-11-06T09:00:00Z'
                      updatedAt: '2026-11-06T09:00:00Z'
                    - id: 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7082
                      name: Sunrise
                      assetCount: 0
                      createdAt: '2026-11-06T09:30:00Z'
                      updatedAt: '2026-11-06T09:30:00Z'
                    - id: 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7083
                      name: Trip
                      assetCount: 128
                      createdAt: '2026-11-05T18:00:00Z'
                      updatedAt: '2026-11-06T10:12:00Z'
                empty:
                  summary: No tag yet.
                  value: []
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
    post:
      operationId: createTag
      tags:
        - tags
      summary: Create one tag, idempotently.
      description: |
        Creates one tag owned by the caller. The name is trimmed
        server-side and must span 1-64 Unicode characters after the
        trim (the count is over runes, so multi-byte names stay
        within the bound at the same length); anything else answers
        400 `VALIDATION_FAILED`.

        Creation is IDEMPOTENT, the assignment face's set semantics
        applied to the vocabulary: a name the caller already owns
        converges on the tag that already exists. A fresh name
        answers 201 with the new row; a name that already exists
        answers 200 with the EXISTING tag -- the same id, nothing
        written, `updatedAt` untouched -- never a 409, because the
        vocabulary is a set and the duplicate ask is the same ask.
        Two concurrent creators converge on one row the same way
        (the unique constraint is the race guard). Names are
        distinct when their characters differ; the duplicate check
        is the constraint's own equality.

        The response is the tag's summary exactly as `GET /tags`
        lists it. The write publishes nothing: tags are per-user
        state, the only view that changes is the caller's own, and
        the response itself carries it.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagNameRequest'
            examples:
              fresh:
                summary: One word of vocabulary.
                value:
                  name: Beach
              padded:
                summary: The trim applies server-side.
                value:
                  name: '  Beach  '
      responses:
        '200':
          description: |
            The name already belongs to the caller: the answer is
            the EXISTING tag's summary, the idempotent convergence
            (nothing was written, `updatedAt` untouched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSummary'
              examples:
                existing:
                  summary: The tag the caller already owns.
                  value:
                    id: 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7081
                    name: Beach
                    assetCount: 42
                    createdAt: '2026-11-06T09:00:00Z'
                    updatedAt: '2026-11-06T09:00:00Z'
        '201':
          description: |
            The tag exists now; the response is its summary with the
            creation-time zero count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSummary'
              examples:
                freshTag:
                  summary: The freshly created tag.
                  value:
                    id: 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7084
                    name: Beach
                    assetCount: 0
                    createdAt: '2026-11-06T11:00:00Z'
                    updatedAt: '2026-11-06T11:00:00Z'
        '400':
          description: |
            The request is invalid: the body is not valid JSON, or
            the name is missing, empty, whitespace-only, or spans
            more than 64 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nameTooLong:
                  summary: A name past the bound.
                  value:
                    code: VALIDATION_FAILED
                    message: name must span 1-64 characters
                    details:
                      fields:
                        - name
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /tags/{tagId}:
    patch:
      operationId: renameTag
      tags:
        - tags
      summary: Rename one tag.
      description: |
        Renames the caller's tag. The name validation is the
        create's own: trimmed server-side, 1-64 Unicode characters
        after the trim, else 400 `VALIDATION_FAILED`.

        Renaming to the name the row already carries is the
        idempotent no-op: 200 with the row's current state, nothing
        written (not even `updatedAt`). Renaming to a name ANOTHER
        of the caller's tags carries answers 409 `TAG_NAME_TAKEN`:
        the vocabulary keeps one row per name, and the honest answer
        for a collision is the conflict, not a silent merge into the
        other tag. (The create's idempotence does not extend here:
        the URL already names one tag, and converging on the other
        row would substitute the resource instead of answering.)

        The response is the tag's summary after the edit, exactly as
        `GET /tags` lists it. The write publishes nothing (per-user
        state, the create's reasoning). The tag must be the caller's
        own: an unknown id and another account's tag answer the same
        404 `TAG_NOT_FOUND`, byte for byte, so tag ids cannot be
        probed for existence.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: tagId
          in: path
          required: true
          description: Identifier of the tag.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagNameRequest'
            examples:
              rename:
                summary: One rename.
                value:
                  name: Roadtrip
      responses:
        '200':
          description: |
            The tag's summary after the edit. The idempotent no-op
            answers it too, with the row's current state unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSummary'
              examples:
                renamed:
                  summary: The renamed tag.
                  value:
                    id: 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7081
                    name: Roadtrip
                    assetCount: 128
                    createdAt: '2026-11-05T18:00:00Z'
                    updatedAt: '2026-11-06T12:00:00Z'
        '400':
          description: |
            The request is invalid: the body is not valid JSON, or
            the name is missing, empty, whitespace-only, or spans
            more than 64 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nameTooLong:
                  summary: A name past the bound.
                  value:
                    code: VALIDATION_FAILED
                    message: name must span 1-64 characters
                    details:
                      fields:
                        - name
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such tag for this caller: the id is unknown or
            belongs to another account -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tagNotFound:
                  value:
                    code: TAG_NOT_FOUND
                    message: no such tag for this caller
        '409':
          description: |
            Another of the caller's tags already carries the
            requested name: the vocabulary keeps one row per name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nameTaken:
                  value:
                    code: TAG_NAME_TAKEN
                    message: another tag already carries this name
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
    delete:
      operationId: deleteTag
      tags:
        - tags
      summary: Delete one tag.
      description: |
        Deletes the caller's tag and every assignment row with it:
        the schema's `ON DELETE CASCADE` removes the asset_tags rows
        in the same statement, so a deleted tag leaves no orphans
        behind -- on any account's view, because the rows were the
        caller's own to begin with. The answer is 204 with no body.

        Repeating the request answers 404 `TAG_NOT_FOUND`: the tag
        is gone exactly like an unknown id (the album delete's
        discipline -- a resource delete, not a set removal). The tag
        must be the caller's own; another account's tag folds into
        the same single-shape 404. The write publishes nothing
        (per-user state, the create's reasoning).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: tagId
          in: path
          required: true
          description: Identifier of the tag.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The tag and every assignment row are gone.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such tag for this caller: the id is unknown, was
            already deleted, or belongs to another account --
            indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tagNotFound:
                  value:
                    code: TAG_NOT_FOUND
                    message: no such tag for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /tags/{tagId}/assets:
    post:
      operationId: addTagAssets
      tags:
        - tags
      summary: Tag assets in one batch.
      description: |
        Adds the caller's tag to a list of at most 200 asset ids
        with the batch surface's set semantics: one request, one
        honest report `{added, skipped}`.

        Skip semantics (the missing-ids discipline, the
        album-items precedent widened to the union): every id must
        address an asset the CALLER CAN SEE -- the album union (the
        caller's own sync and directory albums plus every album
        shared to them), the same resolution the favorites arms of
        the batch endpoint apply. The union deliberately carries
        tags: a sharee tags what they see with THEIR OWN tag, and
        the owner's tag on the same asset stays untouched (the
        assignment rows are per-user). An unknown id, another
        account's unshared asset, and any id the caller cannot see
        are silently skipped, never errors. An id that already
        carries this tag is skipped too: assignment is a set, the
        add is idempotent. NO live-state filter applies to the
        resolution: the assignment row is per-user state written
        whatever the asset's live state (a trashed or archived asset
        carries the tag underneath the view's filters and the count
        returns with the restore or unhide, exactly like a favorite
        row). An all-skipped request still answers 200 with `added`
        0. Repeated ids collapse to one application; the counts
        cover the distinct ids.

        The tag must be the caller's own: an unknown id and another
        account's tag answer the same 404 `TAG_NOT_FOUND`. The write
        publishes nothing: the only view that changes is the
        caller's own tags, which the response itself reports.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: tagId
          in: path
          required: true
          description: Identifier of the tag.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssetsRequest'
            examples:
              threePicks:
                summary: Three asset ids to tag.
                value:
                  assetIds:
                    - 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7091
                    - 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7092
                    - 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7093
      responses:
        '200':
          description: |
            The report over the request's distinct ids: `added`
            counts the assignment rows the request inserted,
            `skipped` the rest -- already-tagged ids and ids the
            caller cannot see alike.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddTagAssetsResponse'
              examples:
                twoAdded:
                  summary: Two fresh assignments, one already tagged.
                  value:
                    added: 2
                    skipped: 1
                allSkipped:
                  summary: Nothing the caller can tag.
                  value:
                    added: 0
                    skipped: 3
        '400':
          description: |
            The request is invalid: the body is not valid JSON, the
            list is empty, or it carries more than 200 ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooManyIds:
                  summary: Past the list bound.
                  value:
                    code: VALIDATION_FAILED
                    message: assetIds exceed the limit of 200
                    details:
                      fields:
                        - assetIds
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such tag for this caller: the id is unknown or
            belongs to another account -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tagNotFound:
                  value:
                    code: TAG_NOT_FOUND
                    message: no such tag for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
    delete:
      operationId: removeTagAssets
      tags:
        - tags
      summary: Untag assets in one batch.
      description: |
        Removes the caller's assignment rows of one tag:
        `{removed, skipped}`, the same batch semantics as the add.
        An id that carries no assignment of this tag -- never was,
        or already removed -- is skipped; an all-skipped request
        still answers 200 with `removed` 0. Repeated ids collapse;
        the counts cover the distinct ids.

        The removal carries no visibility predicate: it tidies the
        caller's own set, so the rows leave whatever the assets'
        live state (a trashed member's assignment row still leaves,
        the honest cleanup of the set itself). The tag must be the
        caller's own: an unknown id and another account's tag answer
        the same 404 `TAG_NOT_FOUND`. The write publishes nothing
        (per-user state, the add's reasoning).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: tagId
          in: path
          required: true
          description: Identifier of the tag.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssetsRequest'
            examples:
              twoDrops:
                summary: Two asset ids to untag.
                value:
                  assetIds:
                    - 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7091
                    - 0192f6a1-7b8c-9d0e-a1b2-3c4d5e6f7092
      responses:
        '200':
          description: |
            The report over the request's distinct ids: `removed`
            counts the assignment rows the request deleted,
            `skipped` the ids that carried no assignment of this
            tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveTagAssetsResponse'
              examples:
                oneRemoved:
                  summary: One assignment left, one id was no assignment.
                  value:
                    removed: 1
                    skipped: 1
        '400':
          description: |
            The request is invalid: the body is not valid JSON, the
            list is empty, or it carries more than 200 ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooManyIds:
                  summary: Past the list bound.
                  value:
                    code: VALIDATION_FAILED
                    message: assetIds exceed the limit of 200
                    details:
                      fields:
                        - assetIds
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such tag for this caller: the id is unknown or
            belongs to another account -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tagNotFound:
                  value:
                    code: TAG_NOT_FOUND
                    message: no such tag for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /users:
    get:
      operationId: listInstanceUsers
      tags:
        - users
      summary: The instance's member list.
      description: |
        The minimal member list of the instance: one entry per
        account, `email` ascending. Any authenticated account may
        enumerate it -- the family-instance posture: the accounts
        of a shared photo home are not secret from one another, and
        the album share dialog's pick list (the owner choosing whom
        to grant) is the list's first consumer.

        The entries carry exactly the identity a pick list renders:
        `id`, `email`, `name`, `role` and `isDisabled` -- no
        timestamps, and a password hash never appears in any
        response. The display name leads there (the pick list says
        "Mum", not her login address); `email` stays the fallback
        an empty name leaves and the disambiguator between two
        accounts that share a name. The disabled switch rides the
        entry so callers can present accounts that cannot sign in
        for what they are (granting to one still answers 400
        through the share endpoint's own target rule).

        The list is small by construction (a family instance holds
        a handful of accounts) and grows only through the admin
        surface's own create endpoint, so it answers every account
        in one response: there is no pagination, no filtering and
        no ordering parameter. This is NOT the admin management
        face (`GET /admin/users`): it is the minimal, non-managing
        pick list every authenticated account may read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            Every account of the instance, `email` ascending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              examples:
                familyInstance:
                  summary: The wizard's admin and one member account.
                  value:
                    users:
                      - id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                        name: ''
                        email: ada@example.com
                        role: admin
                        isDisabled: false
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        name: Grace Hopper
                        email: grace@example.com
                        role: user
                        isDisabled: false
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me:
    get:
      operationId: getUserSelf
      tags:
        - users
      summary: Read the caller's own account.
      description: |
        The self-scoped profile read behind the user settings page:
        the calling session's own account row -- the identity fields
        of the profile section, the appearance pair (theme and
        locale) the account persisted, and the download preferences
        the batch and whole-album download flows will consume. The
        endpoint is `me`-scoped by construction: the session that
        authenticates the request IS the identity, there is no
        userId parameter to get wrong, and one account can never
        read another's row through it.

        The theme and the locale are the values the account chose on
        the settings page; a client that applies them (the web app's
        `.dark` class and i18n store) restores the account's
        appearance at sign-in. The download preferences are
        declarative account state: they persist here and every
        future download flow reads them as the account's default
        packaging (see `UserSelfPatch` for the honest consumption
        state).
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The caller's own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelfResponse'
              examples:
                adminOnDefaults:
                  summary: A fresh account on the column defaults.
                  value:
                    id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    name: Ada Lovelace
                    email: ada@example.com
                    role: admin
                    theme: auto
                    locale: en
                    downloadFormat: zip
                    downloadIncludeVideos: true
                    downloadIncludeSidecars: false
                    downloadIncludeEmbeddedVideos: false
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateUserSelf
      tags:
        - users
      summary: Patch the caller's own account.
      description: |
        The self-scoped write behind the settings page's profile,
        appearance and download-preferences sections. Every field is
        optional: an absent field keeps its stored value, a present
        one replaces it, and the response is the complete saved
        account state (the caller adopts it as the fresh state,
        exactly like the storage settings save).

        THE ME-SCOPING: the endpoint addresses the session's own
        account row only -- no userId parameter exists, and the
        session middleware's identity decides the row. The email is
        the one field whose uniqueness spans accounts: an address
        another account already owns answers 409 USER_EMAIL_TAKEN
        and nothing is written.

        The theme and the locale persist for the NEXT sign-in and
        every client that reads them; the client performing the
        patch is expected to apply them immediately itself (the web
        app flips its `.dark` class and reloads its i18n store on
        the response, not on a re-login).

        THE DOWNLOAD PREFERENCES split honestly in two. The
        embedded-motion switch is consumed today: the single-asset
        download reads it when it assembles a Live Photo's archive.
        The format, videos and sidecars switches stay declarative --
        the batch and whole-album download endpoints do not exist
        yet (they arrive with a later surface), and those flows will
        read the account's default packaging when they arrive: a
        stored preference is never silently dropped, it is simply
        not consumed yet.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSelfPatch'
            examples:
              profileEdit:
                summary: The profile section's save.
                value:
                  name: Ada Lovelace
                  email: ada@example.com
              appearanceEdit:
                summary: The appearance section's save.
                value:
                  theme: dark
                  locale: zh-Hans
              downloadPrefs:
                summary: The download preferences section's save.
                value:
                  downloadFormat: tar
                  downloadIncludeVideos: false
                  downloadIncludeSidecars: true
      responses:
        '200':
          description: |
            The patch was applied; the response is the complete
            saved account state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelfResponse'
              examples:
                saved:
                  summary: The account after an appearance save.
                  value:
                    id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    name: Ada Lovelace
                    email: ada@example.com
                    role: admin
                    theme: dark
                    locale: zh-Hans
                    downloadFormat: zip
                    downloadIncludeVideos: true
                    downloadIncludeSidecars: false
                    downloadIncludeEmbeddedVideos: false
        '400':
          description: |
            The payload failed validation: a name past 100 runes, a
            malformed email, a theme, locale or download format
            outside its enum, or a body that is not valid JSON. The
            details name the offending field(s); nothing was
            written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: A field outside its bound.
                  value:
                    code: VALIDATION_FAILED
                    message: invalid profile payload
                    details:
                      fields:
                        - name
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '409':
          description: |
            The patch''s email address already belongs to another
            account; the address is the account identity, unique
            instance-wide, and the login lookup depends on that
            uniqueness. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailTaken:
                  value:
                    code: USER_EMAIL_TAKEN
                    message: an account with this email already exists
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me/password:
    put:
      operationId: changeUserPassword
      tags:
        - users
      summary: Change the caller's own password.
      description: |
        The self-scoped password change behind the settings page's
        change-password section. The current password must verify
        against the account's stored Argon2id hash; the next one is
        stored as a fresh Argon2id hash (the same profile every
        creation path pins -- a rehash with a new salt, never a
        mutation of the old hash).

        **The revocation contract, pinned:** a successful change
        revokes EVERY OTHER session of the account, across all
        devices -- web cookie sessions and mobile bearer sessions
        alike, their credentials failing authentication with 401
        from the next request on -- while the session that performed
        the change STAYS signed in (the caller is not signed out of
        the device they just proved they own). The rationale is the
        credential-severance rule: a changed password means every
        other held credential of the account is stale, and a device
        that wants back in signs in with the new password.

        A wrong current password answers 400 VALIDATION_FAILED
        naming `current` -- NOT 401, because the request''s session
        is valid and healthy; only the request''s own field failed
        to verify. (Clients must not treat it as a session expiry.)
        The next password follows the account rules everywhere: 8 to
        128 runes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            examples:
              change:
                summary: A routine change.
                value:
                  current: correct horse battery staple
                  next: another fine passphrase here
      responses:
        '204':
          description: |
            The password was changed and every other session of the
            account was revoked; the response has no body. The
            current session stays signed in.
        '400':
          description: |
            The current password does not match (details name
            `current`), or the next password is outside the 8-128
            rune bound (details name `next`), or the body is not
            valid JSON. Nothing was written in any case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wrongCurrent:
                  summary: The current password failed to verify.
                  value:
                    code: VALIDATION_FAILED
                    message: current password does not match
                    details:
                      fields:
                        - current
                nextTooShort:
                  summary: The new password is under the bound.
                  value:
                    code: VALIDATION_FAILED
                    message: password must be 8 to 128 runes
                    details:
                      fields:
                        - next
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me/sessions:
    get:
      operationId: listUserDevices
      tags:
        - users
      summary: List the caller's signed-in devices.
      description: |
        The device list behind the settings page's devices section:
        every active session of the calling account across devices,
        most recently used first, each entry carrying the device
        rendering's own fields -- and, unlike the auth surface's
        own `GET /auth/sessions`, the `isCurrent` marker derived by
        comparing the session id against the credential of THIS
        request, plus the session's creation-time IP address.

        The list is the account's own sessions only (the `me`
        scoping again: the session IS the identity); a web session
        and a paired phone both appear. `ipAddress` is the address
        the session was created from (the login's or the pairing
        exchange's socket peer), omitted when the row predates the
        column or the address was not captured. It is an audit hint,
        not a geolocation claim.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The caller's active sessions, most recently used first,
            with the current one marked.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSession'
              examples:
                browserAndPhone:
                  summary: This browser and a paired phone.
                  value:
                    - id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                      kind: web
                      deviceName: Firefox on macOS
                      lastSeenAt: '2026-11-08T14:23:00Z'
                      ipAddress: 192.168.1.100
                      isCurrent: true
                    - id: 0192f3b2-4c5d-7e8f-8a9b-0c1d2e3f4a5b
                      kind: mobile
                      deviceName: Pixel 9
                      lastSeenAt: '2026-11-06T09:15:00Z'
                      isCurrent: false
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me/sessions/{id}:
    delete:
      operationId: revokeUserDevice
      tags:
        - users
      summary: Revoke one of the caller's other devices.
      description: |
        The device list's revoke button: signs out one device by
        deleting its session row. The endpoint is owner-scoped like
        the auth surface's own `DELETE /auth/sessions/{id}` -- an id
        that is unknown, belongs to another account, or is already
        revoked still answers the same 204, without revealing
        whether such a session exists.

        THE ONE DIFFERENCE FROM THE AUTH SURFACE: the CURRENT
        session -- the one authenticating this very request, the
        row the device list marks `isCurrent` -- answers 400
        VALIDATION_FAILED instead. The settings page's list is a
        remote-device manager; the current device's own exit is the
        sign-out flow (`POST /auth/logout`), and the 400 keeps a
        stray click on the wrong row from signing the caller out of
        the very session they are managing from.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the session to revoke.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The session is revoked (or never was); the response has
            no body.
        '400':
          description: |
            The id is the current session's own (the sign-out flow
            is that session's exit, not this one), or the path id is
            not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                currentSession:
                  summary: The caller tried to revoke the session they are calling from.
                  value:
                    code: VALIDATION_FAILED
                    message: the current session is signed out through the sign-out flow
                    details:
                      fields:
                        - id
                malformedId:
                  summary: Malformed session id.
                  value:
                    code: VALIDATION_FAILED
                    message: invalid request parameter
                    details:
                      fields:
                        - id
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users:
    get:
      operationId: listUsers
      tags:
        - admin
      summary: List the instance's accounts.
      description: |
        The user management listing of the admin surface: every
        account of the instance with its role and its disabled
        switch, oldest first. The listing selects only the safe
        columns -- a password hash never appears in any admin
        response.

        The list is small by construction (a family instance holds a
        handful of accounts) and grows only through this surface's
        own create endpoint, so it answers every account in one
        response: there is no pagination, no filtering and no
        ordering parameter. Account rows disappear only through this
        surface's own delete endpoint, whose disposal moves the
        account's content to a surviving owner or into the trash
        before the row goes, so a refetch after any write reconciles
        the list completely.

        The endpoint is admin-only: the session middleware
        authenticates the caller like every authed route, and a
        caller whose role is not `admin` answers 403 AUTH_FORBIDDEN
        -- a code distinct from the 401 family, because the caller
        is signed in, just not entitled to this surface.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            Every account of the instance, oldest first (the
            first-run wizard's administrator leads a fresh
            instance's list).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
              examples:
                familyInstance:
                  summary: The wizard's admin and one disabled member account.
                  value:
                    items:
                      - id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                        name: ada@example.com
                        email: ada@example.com
                        role: admin
                        isDisabled: false
                        createdAt: '2026-10-29T08:30:00Z'
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        name: Grace Hopper
                        email: grace@example.com
                        role: user
                        isDisabled: true
                        createdAt: '2026-10-30T11:04:05Z'
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createUser
      tags:
        - admin
      summary: Create one account.
      description: |
        The account creation of the admin surface, the management
        counterpart of the first-run wizard: an administrator
        provisions another account -- a family member's login, or a
        second administrator. The account rules mirror the wizard's
        exactly: the email is parsed and lower-cased as the login
        identity, the password is stored only as an Argon2id hash
        and never appears in any response, the id is a fresh UUIDv7,
        and the account's sync album -- the core backup stream every
        upload lands in and the timeline aggregates -- is created in
        the SAME transaction, so the new account can take uploads
        the moment it exists (a second creation point of the same
        wiring the wizard uses). The wizard's one-time guarantee is
        NOT part of this endpoint; it exists exactly because an
        administrator already does.

        The role defaults to `user` when omitted; creating another
        administrator is the same request with `role: "admin"`. A
        duplicate email answers 409 USER_EMAIL_TAKEN -- the address
        is the account identity, unique instance-wide, and the login
        lookup depends on that uniqueness.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
            examples:
              familyMember:
                summary: A plain member account.
                value:
                  name: Grace Hopper
                  email: grace@example.com
                  password: correct horse battery staple
              secondAdmin:
                summary: Another administrator.
                value:
                  name: Ada Lovelace
                  email: ada@example.com
                  password: correct horse battery staple
                  role: admin
      responses:
        '201':
          description: |
            The account exists, its sync album with it. The response
            describes the created account; `isDisabled` is false by
            construction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
              examples:
                createdMember:
                  summary: The new member account.
                  value:
                    id: 0192f5b2-6c7d-8e9f-a0b1-2c3d4e5f6070
                    name: Grace Hopper
                    email: grace@example.com
                    role: user
                    isDisabled: false
                    createdAt: '2026-10-31T09:15:00Z'
        '400':
          description: |
            The request body is not a valid account payload: a
            missing or malformed email, a password outside the 8-128
            rune bound, a name past 100 runes, or a `role` outside
            the enum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: Missing or invalid fields.
                  value:
                    code: VALIDATION_FAILED
                    message: invalid account payload
                    details:
                      fields:
                        - password
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '409':
          description: |
            An account with this email already exists; the address is
            the account identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailTaken:
                  value:
                    code: USER_EMAIL_TAKEN
                    message: an account with this email already exists
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags:
        - admin
      summary: Toggle one account's disabled switch.
      description: |
        The enable/disable switch of the admin surface: an
        administrator locks an account out of the instance (or lets
        it back in) without deleting the account or any of its data.
        The switch is enforced by the session middleware on EVERY
        request, which is what pins its observable semantics:

        - Disabling takes effect with the account's next request: an
          existing session of the account answers 401 from then on
          (byte-identical with any other authentication failure) and
          sign-in is refused the same way. The session rows
          themselves are not deleted -- disabling revokes their
          authority, not their existence.
        - Re-enabling restores the account's unexpired sessions
          without a new sign-in; a session that lapsed its own
          expiry while the account was disabled is gone for good.

        The write is idempotent -- setting the current value again
        answers 200 with the unchanged account -- and the response
        is the account after the write, so the client adopts it as
        the fresh state without a refetch.

        An administrator cannot disable their own account: the last
        admin locking themselves out would strand the admin surface,
        so the request answers 400 VALIDATION_FAILED naming the id.
        Nothing stops an admin from disabling ANOTHER administrator;
        the last enabled admin is the instance's line of defense.

        The id must name an account. Account ids are enumerable
        through this surface's own listing, so there is no
        anti-enumeration pairing here: an unknown id (a stale list
        on the client) answers 404 USER_NOT_FOUND.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the account.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPatch'
            examples:
              disable:
                summary: Disable an account.
                value:
                  isDisabled: true
              reEnable:
                summary: Let a disabled account back in.
                value:
                  isDisabled: false
      responses:
        '200':
          description: |
            The account after the write; the client adopts it as the
            fresh state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
              examples:
                disabled:
                  summary: The account is now disabled.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    name: Grace Hopper
                    email: grace@example.com
                    role: user
                    isDisabled: true
                    createdAt: '2026-10-30T11:04:05Z'
        '400':
          description: |
            The request body is not a valid toggle payload, or the id
            names the caller's own account (self-disable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                selfDisable:
                  summary: The caller named their own account.
                  value:
                    code: VALIDATION_FAILED
                    message: an administrator cannot disable their own account
                    details:
                      fields:
                        - id
                validationFailed:
                  summary: Malformed body.
                  value:
                    code: VALIDATION_FAILED
                    message: request body must be valid JSON
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '404':
          description: No account with this id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userNotFound:
                  value:
                    code: USER_NOT_FOUND
                    message: no account with this identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteUser
      tags:
        - admin
      summary: Delete one account, disposing of its content.
      description: |
        The account disposal of the admin surface: an account leaves
        the instance, and everything it held -- photos, albums,
        memories and the labels it gave them -- is settled before the
        row goes. The account row goes immediately: there is no soft
        delete and no recovery window for the account itself. The
        whole settlement is ONE transaction that commits whole or
        rolls back whole, so a failure leaves the account and its
        content exactly as they were.

        THE DISPOSITION is exactly one of two arms:

        - `transferTo` names another account that receives everything
          the departing account owned: its photos with their albums
          and memories, their archived and trash marks intact, and the
          tags attached to them. The photos join the receiver's own
          stream, so the family timeline continues without a gap, and
          the albums the departing account shared keep their grantees.

          COLLIDING CONTENT. The storage's uniqueness rule is
          owner plus content checksum, and it is TOTAL: one account
          holds at most one row of a given content whether that row is
          live or in the trash. Content the receiver already holds --
          in ANY of the four state pairs -- therefore cannot simply
          change hands, and the disposal folds it instead:

          - the LIVE copy wins a mixed pair, so content that arrives
            live stays visible under the receiver's name, and a copy
            the receiver had trashed earlier does not bind it (trash it
            again to be rid of it) -- symmetrically, the receiver's
            live copy survives a trashed departing one;
          - a tie keeps the RECEIVER's own row: both live keeps its
            copy, both trashed keeps it under the LATER of the two
            deletion marks (the content stays recoverable as long as
            either copy had left);
          - the losing copy's album memberships, tags, favorites and
            any album cover it pinned move onto the survivor, then the
            losing row goes. A losing Live Photo takes its component
            video row with it (the pair is one asset), and every losing
            photo announces `asset.deleted`, so a client holding the id
            lets it go.

        - `dispose: "trash"` walks the departing account's photos into
          the CALLING administrator's trash, where the instance's
          retention window governs them -- restorable until it runs
          out, permanently removed after. The departing account's own
          albums and memories go with the account (a container whose
          owner is gone has no reader), so the photos survive as
          individual trash items; a directory album's source file is
          moved into the server's trash area on this arm exactly like
          any other trash move, and the rest of the family's source
          files are never touched. The collision rule above applies
          here too, onto the calling administrator: content they
          already hold in any state folds rather than collides, and
          their own live copy is never trashed by someone else's
          disposal.

        What dies with the account in BOTH arms: its sessions, API
        keys and pairing tokens (it can never authenticate again), its
        favorites, its per-album timeline preferences, the private
        names it gave shared face clusters (a cluster belongs to the
        family; the name a person gave it is theirs), and every album
        share granted TO it. A share the account granted on its own
        album rides the content: the album changes hands and its
        grantees keep their access. Authorship another member's album
        carries -- a membership the departing account added -- passes
        to the surviving owner instead of deleting the membership, so
        no photo leaves an album it sits in.

        THE REFUSALS. The instance's last administrator cannot be
        deleted (409 USER_LAST_ADMIN): an instance without an
        administrator strands this surface, and while one
        administrator remains that account is necessarily the
        caller's own row. An administrator cannot delete their own
        account at all (400 VALIDATION_FAILED naming the id) -- the
        disposal hands the content to a survivor, and the caller is
        the one performing the handover. `transferTo` naming the
        departing account itself answers 409 USER_TRANSFER_TO_SELF,
        and an unknown receiver is a payload error (400
        VALIDATION_FAILED naming the field). Account ids are
        enumerable through this surface's own listing, so an unknown
        path id answers 404 USER_NOT_FOUND without an
        anti-enumeration pairing.

        The 204 carries no body: the account is gone, and the caller's
        own disposal target (the receiver's stream or the caller's
        trash) is where its content answers next.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the account to delete.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserDeleteRequest'
            examples:
              transferToAnotherMember:
                summary: Hand the photos to another member.
                value:
                  transferTo: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
              moveToTrash:
                summary: Walk the photos into the trash.
                value:
                  dispose: trash
      responses:
        '204':
          description: |
            The account is gone and its content has been settled: the
            receiver holds it, or the caller's trash does.
        '400':
          description: |
            The request body is not a usable disposition, or it names
            something this surface refuses: both arms at once (or
            neither), an unknown receiver, or the caller's own account
            (an administrator cannot delete themselves).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                selfDelete:
                  summary: The caller named their own account.
                  value:
                    code: VALIDATION_FAILED
                    message: an administrator cannot delete their own account
                    details:
                      fields:
                        - id
                unknownReceiver:
                  summary: transferTo names no existing account.
                  value:
                    code: VALIDATION_FAILED
                    message: transferTo must name another account
                    details:
                      fields:
                        - transferTo
                oneDispositionOnly:
                  summary: Both arms, or neither, were sent.
                  value:
                    code: VALIDATION_FAILED
                    message: exactly one of transferTo and dispose is required
                    details:
                      fields:
                        - transferTo
                        - dispose
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '404':
          description: No account with this id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userNotFound:
                  value:
                    code: USER_NOT_FOUND
                    message: no account with this identifier
        '409':
          description: |
            The disposition conflicts with the instance's state: the
            target is the instance's last administrator, or
            `transferTo` names the account being deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                lastAdmin:
                  summary: The instance would be left without an administrator.
                  value:
                    code: USER_LAST_ADMIN
                    message: the last administrator cannot be deleted
                transferToSelf:
                  summary: The receiver is the account being deleted.
                  value:
                    code: USER_TRANSFER_TO_SELF
                    message: the receiving account must be another account
        '500':
          description: |
            Unexpected server failure, or the trash arm's
            external-move failure: a directory album's external file
            that the server could not move into its trash area -- the
            operating system denied the permission, or the source the
            row names is no longer there. The whole disposal rolled
            back: the account and its content are exactly as they were,
            and every internal file move already performed was moved
            back to its source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                trashMoveFailed:
                  summary: An external file could not be moved into the trash.
                  value:
                    code: ASSET_TRASH_MOVE_FAILED
                    message: the file could not be moved into the trash
  /admin/models/download:
    post:
      operationId: downloadModels
      tags:
        - admin
      summary: Start the default model group's download.
      description: |
        The model download trigger of the admin surface: the default
        group's models -- pinned by the manifest with upstream URLs and
        sha256 digests -- are downloaded, verified and registered, and
        each model activates into its slot when the slot is still
        empty. The request body is deliberately empty: the default
        group is the only group v1 downloads.

        The endpoint is idempotent. A run that is still in flight
        (state `queued` or `running`) answers 200 with its identifier
        and nothing new is started; so does the most recent finished
        run -- a repeated click neither re-downloads a landed group
        nor piles up jobs, and the recovery of a failed run belongs to
        the job's own retries. Only a first call -- no run of this kind
        at all -- creates one and answers 202.

        The run's progress is observable two ways: the `job_runs` row
        of the returned identifier (kind `model_download`, `total` and
        `done` carrying the group's pinned byte counts) and the
        `job.started` / `job.progress` / `job.finished` events on the
        activity stream, the progress events throttled to at most one
        per second.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            A model download run already exists -- one that is still in
            flight (`queued` or `running`), or, when none is, the most
            recent finished one. Its identifier is returned and NO new
            run is created or enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDownloadResponse'
              examples:
                inFlight:
                  summary: The run currently downloading.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '202':
          description: |
            The download run was created (state `queued`, `total`
            carrying the group's pinned byte count) and the model
            download job enqueued. The worker flips the run to
            `running` when the download begins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDownloadResponse'
              examples:
                started:
                  summary: The freshly created run.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
