            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /albums/{albumId}/shares/{userId}:
    delete:
      operationId: revokeAlbumShare
      tags:
        - albums
      summary: Revoke one account's view ACL of an album.
      description: |
        Removes one `album_shares` row: the grantee's read access
        ends immediately -- the album leaves their wall, the detail
        answers the single-shape 404.

        The owner (or an administrator) revokes any grantee. A
        grantee may revoke their OWN row -- leaving a shared album
        is the sharee's own right, the family semantics -- through
        this same endpoint: the caller's own user id in the path is
        the departure, whoever granted the row. A sharee cannot
        revoke ANOTHER account's grant: 403 `AUTH_FORBIDDEN`, the
        honest refusal of a caller who can see the album but holds
        no power over its ACL.

        Everything else mirrors the grant: the single-shape 404 for
        the invisible ids (an unknown album, another account's
        unshared album, every sync album), and `locked` never gates
        -- revocation is not curation.

        The 204 is idempotent: revoking a share that is already
        gone -- never granted, already revoked, or an id that names
        no account -- is the state the caller asked for, so it
        answers 204 again and stays silent on the activity stream.

        The write publishes one `album.unshared` event exactly when
        a row left: the payload carries the album's id and the
        revoked grantee's user id, nothing else.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the album.
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          description: |
            Identifier of the account whose share row leaves: any
            grantee for the owner or an administrator, the caller's
            own id for a sharee's departure.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The share row is gone -- or was already gone: the
            idempotent revoke answers 204 either way, with no body.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller can see the album but is neither its owner
            nor the departing grantee: a sharee cannot revoke
            another account's grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                viewerRevokes:
                  value:
                    code: AUTH_FORBIDDEN
                    message: only the album's owner or the grantee may revoke this share
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, or it is a sync album -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /albums/{albumId}/timeline-preference:
    put:
      operationId: setAlbumTimelinePreference
      tags:
        - albums
      summary: Set the caller's timeline preference of one album.
      description: |
        Upserts the calling user's per-user timeline preference of
        one album: the `user_album_prefs` row keyed
        (userId, albumId) whose `inTimeline` switch says whether the
        album feeds the caller's aggregated timeline. The preference
        is the CALLER's own state over an album they can see --
        self-affecting only, which is why these writes publish no
        event: the caller's own response is the only view that
        changed, and no other session has anything to refetch.
        The scope is the albums whose membership a caller could want
        out of their timeline feed: the caller's own `directory`
        albums, and every album shared to the caller (whatever the
        owner's type). Two kinds of album answer 400 instead, with
        the `album_pref_not_excludable` message key in the details:

        - the caller's own `sync` album: it IS the core stream, and
          the core stream is never excludable (the aggregation
          formula exempts the sync arm from the preference row --
          a stray row there excludes nothing);
        - the caller's own `virtual` albums: they never feed the
          caller's own timeline at all (in-stream curation would be
          pure duplication), so there is nothing to exclude.

        An album the caller cannot see -- unknown, another account's
        unshared album, a revoked share -- answers the same
        byte-identical 404 `ALBUM_NOT_FOUND` as every album face, so
        album ids cannot be probed for existence through this
        endpoint. There is no administrator override: the
        preference is always the caller's own row over their own
        view, never a write onto another account's state.

        `inTimeline` is required and must be a JSON boolean: a body
        that is not valid JSON, or one without the field, answers
        400 `VALIDATION_FAILED`. The write is an upsert: repeating
        it with the same value converges to the same row, and
        repeating it with the other value flips the switch -- the
        response always carries the stored state.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the album.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumTimelinePreferenceRequest'
            examples:
              excludeFromTimeline:
                summary: Keep the album's items out of the timeline.
                value:
                  inTimeline: false
              includeAgain:
                summary: Feed the timeline again.
                value:
                  inTimeline: true
      responses:
        '200':
          description: |
            The stored preference: the album and the switch as the
            row now carries it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumTimelinePreferenceResponse'
              examples:
                excluded:
                  value:
                    albumId: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6073
                    inTimeline: false
        '400':
          description: |
            The request is not a well-formed preference: the body is
            not valid JSON or carries no `inTimeline`; or the album
            is not excludable from the caller's timeline (the
            caller's own sync or own virtual album, the
            `album_pref_not_excludable` message key in the details).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: The body carries no switch.
                  value:
                    code: VALIDATION_FAILED
                    message: request body must be valid JSON
                    details:
                      fields:
                        - body
                notExcludable:
                  summary: The caller's own sync album.
                  value:
                    code: VALIDATION_FAILED
                    message: this album cannot be excluded from the timeline
                    details:
                      key: album_pref_not_excludable
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, or the share was revoked -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: resetAlbumTimelinePreference
      tags:
        - albums
      summary: Reset the caller's timeline preference of one album.
      description: |
        Removes the calling user's preference row of one album: the
        album returns to the default state of feeding the caller's
        timeline (a missing row means kept in). The eligibility
        scope is the PUT's own -- the caller's own directory albums
        and the albums shared to the caller; the same 400
        `album_pref_not_excludable` answers the caller's own sync
        and own virtual albums, and the same single-shape 404
        answers an album the caller cannot see.

        The delete is idempotent: an album with no preference row
        (never set, or already reset) still answers 204 -- the row
        is gone either way, which is the state the caller asked for.
        Like the PUT it publishes no event: the preference is the
        caller's own state, and no other session has anything to
        refetch.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the album.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The preference row is gone; the album feeds the caller's
            timeline again (or never stopped).
        '400':
          description: |
            The album is not excludable from the caller's timeline:
            the caller's own sync or own virtual album
            (`album_pref_not_excludable` in the details).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notExcludable:
                  value:
                    code: VALIDATION_FAILED
                    message: this album cannot be excluded from the timeline
                    details:
                      key: album_pref_not_excludable
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, or the share was revoked -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /people:
    get:
      operationId: listPeople
      tags:
        - people
      summary: The caller's named people.
      description: |
        The named region of the people surface: every face cluster
        the caller sees that carries one of the caller's own labels.
        A cluster is listed here when both hold:

        - it contains at least one face on an asset visible to the
          caller (an asset the caller can see that is live -- not
          trashed, not hidden, no Live Photo component row: their
          own, or one shared to them through an album), and
        - the caller has labeled it with a `user_face_labels` row of
          their own.

        The B4 semantics of the people domain: face clusters are
        GLOBAL structures of the instance (the same person's faces
        land in one cluster whatever account uploaded the photos),
        while names and the hidden switch are PRIVATE per user --
        two accounts label the same cluster independently and
        neither sees the other's label. `faceCount` is honest per
        caller: it counts only the cluster's faces on caller-visible
        assets, so the same cluster can show different counts to
        different accounts.

        Hidden people STAY in this list carrying `isHidden` true:
        the switch is a badge for the web UI, not a filter -- the
        caller labeled the person and keeps seeing them, flagged.

        The list is sorted by name, case-insensitively, with the
        cluster id as the tiebreak.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The caller's named people, sorted by name (case-
            insensitive, cluster id as the tiebreak). The array is
            empty when the caller has labeled no cluster they can
            see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonSummary'
              examples:
                twoPeople:
                  summary: Two labeled clusters, one hidden.
                  value:
                    - clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                      name: Ada
                      faceCount: 12
                      representativeFaceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                      thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
                      isHidden: false
                    - clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f72
                      name: Grace
                      faceCount: 3
                      representativeFaceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f73
                      thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f73/thumbnail
                      isHidden: true
                empty:
                  summary: Nothing labeled yet.
                  value: []
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /people/unnamed:
    get:
      operationId: listUnnamedPeople
      tags:
        - people
      summary: The caller's unnamed face clusters, one keyset page at a time.
      description: |
        The unnamed region of the people surface: every face cluster
        that contains at least one face on an asset visible to the
        caller (an asset the caller can see that is live -- not
        trashed, not hidden, no Live Photo component row: their own,
        or one shared to them through an album) and carries NO
        `user_face_labels` row of the caller. The moment the caller
        labels a cluster it moves to `GET /people` and out of this
        list; another account's label never moves it for this
        caller (B4: clusters are global, labels are private per
        user).

        Pages are keyset-paginated with an opaque cursor over the
        ordering `faceCount` descending, `clusterId` descending as
        the tiebreak. The continuation key is the (faceCount,
        clusterId) pair of a page's last row -- the same row-value
        predicate pattern the timeline endpoint applies to its
        (takenAt, id) pair, which keeps pages stable while clusters
        gain or lose faces. The response carries `nextCursor` exactly
        when another page exists; the first page omits the `cursor`
        parameter.

        `limit` bounds the page size: absent means the default of
        60; a value below 1 or over 200 answers 400
        `VALIDATION_FAILED`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page; absent on the
            first page. An unparseable value answers 400
            `VALIDATION_FAILED` (cursors are opaque strings produced
            by this endpoint, never assembled by clients).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |
            Page size: the number of cluster summaries one response
            carries at most. Defaults to 60; values below 1 or over
            200 answer 400.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
          example: 60
      responses:
        '200':
          description: |
            One page of unnamed clusters, largest face count first.
            `nextCursor` is present exactly when another page
            follows; the last page carries none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnnamedClustersResponse'
              examples:
                firstPage:
                  summary: A full page with a follow-up cursor.
                  value:
                    items:
                      - clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f74
                        faceCount: 8
                        representativeFaceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f75
                        thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f75/thumbnail
                      - clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f76
                        faceCount: 2
                        representativeFaceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f77
                        thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f77/thumbnail
                    nextCursor: GJwAARBkYWQ1YTQ2
                lastPage:
                  summary: The final page carries no cursor.
                  value:
                    items:
                      - clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f78
                        faceCount: 2
                        representativeFaceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f79
                        thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f79/thumbnail
                empty:
                  summary: Every visible cluster is labeled (or none exists).
                  value:
                    items: []
        '400':
          description: |
            The pagination parameters are invalid: `cursor` is not a
            value this endpoint produced, or `limit` is below 1 or
            over 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: A page size over the cap.
                  value:
                    code: VALIDATION_FAILED
                    message: limit must be at most 200
                    details:
                      fields:
                        - limit
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /people/{clusterId}:
    get:
      operationId: getPersonCluster
      tags:
        - people
      summary: One face cluster's detail as the caller sees it.
      description: |
        The detail view of one face cluster: the caller's own label
        state and the cluster's faces on assets visible to the
        caller, strongest score first with the face id as the
        tiebreak.

        `label` is null when the caller has not labeled the cluster
        (the unnamed state). It is the CALLING user's label or no
        label at all: another account's label never shows here
        (B4 -- clusters are global, labels are private per user).

        404 has a double meaning by design: the cluster id is
        unknown, or the cluster exists but none of its faces sits on
        an asset visible to the caller (the cluster's assets all
        belong to other accounts and none is shared to them). Both
        answer the same `PERSON_NOT_FOUND`, byte for byte, so
        cluster ids cannot be probed for existence -- the same
        anti-enumeration shape as `ASSET_NOT_FOUND`.

        Every `thumbnail` points at the face crop endpoint
        `GET /api/v1/faces/{faceId}/thumbnail`, which serves the
        face's bounding-box crop of the asset's view-size
        derivative.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: clusterId
          in: path
          required: true
          description: Identifier of the face cluster.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The cluster's detail as the caller sees it. `label` is
            null in the unnamed state; `faces` holds exactly the
            faces on caller-visible assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetail'
              examples:
                labeled:
                  summary: A labeled cluster with two visible faces.
                  value:
                    clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    label:
                      name: Ada
                      isHidden: false
                    faces:
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                        assetId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f72
                        score: 0.94
                        thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
                        asset:
                          takenAt: '2026-10-13T12:30:00Z'
                          originalFilename: IMG_1234.jpg
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f73
                        assetId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f74
                        score: 0.81
                        thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f73/thumbnail
                        asset:
                          takenAt: '2026-10-12T08:00:00Z'
                          originalFilename: IMG_1235.jpg
                unnamed:
                  summary: The caller has not labeled this cluster.
                  value:
                    clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f76
                    label: null
                    faces: []
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such cluster for this caller: the id is unknown, or
            the cluster exists but none of its faces sits on an asset
            visible to the caller -- indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /people/{clusterId}/label:
    put:
      operationId: labelPerson
      tags:
        - people
      summary: Name one face cluster (the caller's private label).
      description: |
        Upserts the calling user's label of one face cluster: the
        `user_face_labels` row keyed (userId, clusterId) -- the B4
        write. The cluster must be visible to the caller (at least
        one of its faces sits on an asset visible to them -- their
        own, or one shared to them through an album, so a sharee
        names the people they see); an unknown or invisible cluster
        id answers the same byte-identical 404 `PERSON_NOT_FOUND`
        as every people read (anti-enumeration -- cluster ids
        cannot be probed).

        The name is trimmed and must span 1-64 characters; anything
        else answers 400 `VALIDATION_FAILED` naming the `name`
        field.

        Duplicate names are ALLOWED, server-side and on purpose: no
        `NAME_TAKEN` error exists. Families have real duplicates
        (two grandparents named Grace), so a de-duplication hint is
        a web-UI suggestion, never a server rule.

        Re-labeling an already labeled cluster renames it in place:
        the hidden switch keeps its state (a rename is not an
        unhide). The label is the caller's private state -- another
        account labeling the same cluster writes its own row and
        neither sees the other's (B4).

        The write publishes `person.labeled` on the activity stream
        with the acting user's id in the payload.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: clusterId
          in: path
          required: true
          description: Identifier of the face cluster.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelPersonRequest'
            examples:
              ada:
                summary: A family name.
                value:
                  name: Ada
      responses:
        '200':
          description: |
            The caller's label state of the cluster after the write:
            the trimmed name and the current hidden switch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonLabelResponse'
              examples:
                labeled:
                  value:
                    clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    name: Ada
                    isHidden: false
        '400':
          description: |
            The body is not valid JSON, or the name is missing,
            empty after trimming or longer than 64 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: A name outside the 1-64 character bounds.
                  value:
                    code: VALIDATION_FAILED
                    message: name must span 1-64 characters
                    details:
                      fields:
                        - name
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such cluster for this caller: the id is unknown, or
            the cluster exists but none of its faces sits on an
            asset visible to the caller -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                personNotFound:
                  value:
                    code: PERSON_NOT_FOUND
                    message: no such person for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: unlabelPerson
      tags:
        - people
      summary: Remove the caller's label of one face cluster.
      description: |
        Deletes the calling user's `user_face_labels` row of one
        cluster: the person returns to the caller's unnamed region
        (`GET /people/unnamed`) and out of the caller's named list.
        The cluster itself and every other account's label survive
        (B4 -- labels are private per user; only the caller's own
        row dies).

        The write is idempotent once the cluster is visible: naming
        no label still answers 204. The cluster must be visible to
        the caller -- an unknown or invisible cluster id answers the
        same byte-identical 404 `PERSON_NOT_FOUND` as every people
        read (anti-enumeration).

        The write publishes `person.unlabeled` on the activity
        stream with the acting user's id in the payload.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: clusterId
          in: path
          required: true
          description: Identifier of the face cluster.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The caller's label row is gone (or was never there); the
            person sits in the caller's unnamed region.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
