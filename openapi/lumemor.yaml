                ok:
                  summary: The checks passed.
                  value:
                    probeId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
                    state: ok
                    progress: null
                    dims: 512
                    inputSize:
                      width: 224
                      height: 224
                    sha256: 980020bf226e528a202de26c6a6186df125b74c612b09cfcd797a082e046b628
                    hostDeclared: true
                    reason: null
                mismatch:
                  summary: The slot contract named the failing check.
                  value:
                    probeId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
                    state: error
                    progress: null
                    dims: 384
                    inputSize: null
                    sha256: null
                    hostDeclared: true
                    reason: the model emits 384 dimensions, this slot needs 512
        '404':
          description: |
            No probe under this identifier: it expired, or the id is
            not one the server issued.
          content:
