                        updatedAt: '2026-11-02T14:05:00Z'
                        callerRole: viewer
                        owner:
                          id: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                          name: Grace Hopper
                          email: grace@example.com
                empty:
                  summary: A pre-wiring account -- no sync album, no own albums, no shares.
                  value:
                    albums: []
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createAlbum
      tags:
        - albums
      summary: Create one directory album from an existing path.
      description: |
        Creates one directory album owned by the calling
        ADMINISTRATOR: the album IS a source -- the request names an
        existing directory the server validates and references in
        place, the files stay where they are (zero copy, zero move;
        the rescan that fills the album's membership is a later flow).
        No type field exists: this endpoint IS directory creation --
        the curation-into-a-container story is gone (a memory is
        born through its own every-member face, POST /memories),
        and every account's sync album is born with the account.

        Mounting an existing photo directory is a CONFIGURATION act:
        it points the application at a filesystem location, and a
        plain member never sees the container's filesystem at all.
        Creation is therefore the administrator's alone (the
        boundary ruling): a signed-in member whose role is not
        `admin` answers 403 `AUTH_FORBIDDEN` before any part of the
        request is considered -- the refusal-matrix semantics of the
        admin surfaces. Members contribute photos through the upload
        stream and are untouched by this guard. The trust boundary is
        the compose file's own mounts: the operator controls what the
        container can see, and the application layer neither can nor
        needs to restrict the operator further -- the mount-root
        allowlist of the previous design retired whole with this
        ruling, and no software-layer allowlist stands behind it.

        The title is trimmed and must span 1-64 Unicode characters
        (the count is over runes, so multi-byte titles stay within
        the bound at the same length).

        `rootPath` is the source directory, and it runs the path
        validation matrix before anything is written, each branch
        its own 400 error code:

        - the path must be absolute (after a server-side clean; a
          relative, empty or over-long value is a plain
          `VALIDATION_FAILED`),
        - it must exist (`ALBUM_PATH_NOT_FOUND`),
        - it must be a directory (`ALBUM_PATH_NOT_DIRECTORY`),
        - the server must be able to list it
          (`ALBUM_PATH_NOT_READABLE`),
        - the RESOLVED path (symlinks evaluated) must never sit
          inside the server's own managed data tree
          (`ALBUM_PATH_IN_MANAGED_TREE`) -- the one confine that
          survived the allowlist retirement: the application's own
          originals, derivatives and trash never become an album
          source, whatever the container can see. The
          allowlist-domain and root-overlap branches of the previous
          matrix died with the allowlist: with creation in the
          administrator's hands, a second album over the same tree
          is an operator's visible choice, not an attack to refuse.

        The album row stores the RESOLVED absolute path, so a later
        symlink swap can never repoint an existing album.

        After the matrix passes, the server probes the directory's
        writability exactly ONCE: it writes a uniquely named probe
        file, reads it back, and removes it. A directory that refuses
        any step is a perfectly legitimate album source -- the
        probe's failure is NOT a creation failure -- and the fact
        lands on the row as `sourceWritable: false`, honestly
        reported in the response: photos of a read-only directory
        cannot be deleted through the application, and the creation
        answer says so instead of every later deletion discovering
        it. The truth is discovered at creation and never re-probed
        at runtime.

        `audience` is the album's audience, the full grantee set of
        view ACL rows the creation lands in the same request: the
        add-style picker's chips of the dialog, empty (or absent)
        meaning "only me". Its semantics are the audience write's:
        every id that cannot be granted -- an unknown or disabled
        account, or the caller's own id (the owner sees the album by
        construction) -- is skipped, never an error, and the
        response's `skipped` list reports each with its reason.

        The two dialog switches ride the same request. The
        deletability switch (`allowAppDeletion`) lands on the row --
        on by default, rendered by the dialog only where the source
        is writable (the completion row's `writable` fact; the
        read-only sources' stored value governs nothing). The
        creator's timeline exclusion (`inTimeline: false`) lands the
        caller's own preference row in the same creation -- the
        album is born out of its creator's aggregated timeline, the
        audience's own feeds untouched.

        The response is the created album's wall card -- the summary
        exactly as `GET /albums` lists it: `callerRole` `owner`,
        `type` `directory`, an empty `coverAssetIds` array (never
        null), `itemCount` 0 and `photoCount` 0, nothing being a
        member yet -- plus the honest audience report and the
        `sourceWritable` fact.
        The card's `inTimeline` carries the exclusion's landed state.
        The write publishes one `album.created` event and one
        `album.shared` event per audience row that landed.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumCreateRequest'
            examples:
              titled:
                summary: A titled album sourced at a shared family archive.
                value:
                  title: Family archive
                  rootPath: /Volumes/Photos/family
                  audience:
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
              bare:
                summary: The minimal creation, title and path only.
                value:
                  title: Quick picks
                  rootPath: /Volumes/Photos/2026-spring
              switchesOff:
                summary: Both dialog switches off -- no deletes through the app, out of the creator's timeline.
                value:
                  title: Raw vault
                  rootPath: /mnt/archive-vault
                  allowAppDeletion: false
                  inTimeline: false
      responses:
        '201':
          description: |
            The album exists; the response is its wall card (the
            creation-time zeros: no member, no cover) with the
            audience report and the probe's `sourceWritable` fact --
            `false` for a readable but read-only source, a legitimate
            album whose photos cannot be deleted through the
            application. The grants that landed are the request's
            usable ids; the `skipped` entries are the rest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumCreateResponse'
              examples:
                freshAlbum:
                  summary: The freshly created directory album, one grantee landed.
                  value:
                    id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6071
                    title: Family archive
                    type: directory
                    isShared: true
                    coverAssetIds: []
                    itemCount: 0
                    photoCount: 0
                    updatedAt: '2026-11-05T10:15:00Z'
                    callerRole: owner
                    inTimeline: true
                    sourceWritable: true
                    skipped: []
                skippedAudience:
                  summary: The creation landed, one requested audience id did not.
                  value:
                    id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072
                    title: Family archive
                    type: directory
                    isShared: false
                    coverAssetIds: []
                    itemCount: 0
                    photoCount: 0
                    updatedAt: '2026-11-05T10:15:00Z'
                    callerRole: owner
                    inTimeline: true
                    sourceWritable: false
                    skipped:
                      - userId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        reason: invalid_account
        '400':
          description: |
            The request is invalid. `VALIDATION_FAILED` covers the
            shape problems: the title is missing, empty,
            whitespace-only or spans more than 64 characters; the
            body is not valid JSON; `rootPath` is missing, relative,
            or past the 4,096-byte bound; the audience carries more
            than 200 ids. The path validation matrix answers its own
            codes: `ALBUM_PATH_NOT_FOUND`, `ALBUM_PATH_NOT_DIRECTORY`,
            `ALBUM_PATH_NOT_READABLE`, `ALBUM_PATH_IN_MANAGED_TREE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                titleTooLong:
                  summary: A title past the bound.
                  value:
                    code: VALIDATION_FAILED
                    message: title must span 1-64 characters
                    details:
                      fields:
                        - title
                pathNotFound:
                  summary: The source directory does not exist.
                  value:
                    code: ALBUM_PATH_NOT_FOUND
                    message: the source path does not exist
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`: mounting an existing photo directory is a
            configuration act, and the members' contribution path is
            the upload stream. The refusal arrives before any part
            of the request -- title, path, audience -- is considered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                memberRefused:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /albums/path-completions:
    get:
      operationId: completeAlbumPath
      tags:
        - albums
      summary: Complete a directory album's source path.
      description: |
        The source-path completion of the album creation dialog: the
        typed prefix in, the pickable directories out. The call is
        ADMIN-scoped: mounting an existing photo directory is the
        administrator's act, so the completion that browses the
        filesystem on the dialog's behalf is the administrator's
        too -- a signed-in member answers 403 `AUTH_FORBIDDEN`
        before the prefix is even read (the members' contribution
        path is the upload stream; a member never needs to see the
        container's filesystem).

        The completion domain is the container's REAL visible
        filesystem: whatever the operating system lets the server
        read, drilled segment by segment. The compose file's mounts
        ARE the boundary -- the operator decides what the container
        sees, and the completion honestly reflects that visibility
        instead of a software-layer allowlist (the retirement:
        the mount-root allowlist that used to confine this endpoint
        died whole, with its settings face and its validation
        branches). The ONE exclusion that stays is the server's own
        managed data tree: no row ever names the application's
        originals, derivatives or trash, whatever prefix would
        match them -- the same confine the creation's
        `ALBUM_PATH_IN_MANAGED_TREE` branch enforces, kept honest on
        both sides of the pair.

        The matching rule, driven by the typed prefix:

        - an empty (or absent) prefix lists the filesystem root
          itself (`/`) -- the dialog's first open, "start here";
        - a prefix of exactly `/` lists the root's top-level
          directories (the separator says "I am at the root, show me
          what it holds");
        - otherwise the entries of the prefix's parent directory
          whose names start with the prefix's last segment are
          listed as full paths (typing `/mnt/fam` lists
          `/mnt/family-archive`);
        - a trailing separator switches to the children of the
          cleaned prefix itself (typing `/mnt/family-archive/`
          drills into it), and no extra row rides along then -- the
          trailing slash says "I am inside this directory".

        Only real directories are listed (symlinked entries are
        not), the rows are deduplicated, sorted ascending, and
        capped at 20 -- past the cap the user narrows by typing;
        there is no pagination. A prefix that matches nothing
        answers the empty list, never an error -- a relative prefix
        and an unreadable parent both answer `completions: []`.

        Every row carries its write fact: as the listing lands, the
        server probes each row's directory once with the
        creation-time probe's own three steps (write a uniquely
        named probe file, read it back, remove it). A probe step's
        refusal is a FACT (`writable: false`), never an error --
        the row lists alongside the others and the dialog renders
        the deletability switch only for the `writable` rows.

        The completion runs a bounded read: at most one directory
        listing and at most 20 per-row probes, and the response
        carries at most 20 rows.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: prefix
          in: query
          required: false
          description: |
            The path fragment typed so far. Absent or empty lists
            the filesystem root itself. Values past 4,096 bytes
            answer 400 -- the filesystem's own path ceiling, so no
            honest typing ever hits it.
          schema:
            type: string
            maxLength: 4096
          example: /mnt/fam
      responses:
        '200':
          description: |
            The completion rows: the pickable directories of the
            container's visible filesystem, never inside the
            server's managed tree, deduplicated, sorted ascending,
            at most 20, each carrying its write fact. The empty list
            is an honest answer (nothing visible matches the
            prefix), never an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumPathCompletionsResponse'
              examples:
                root:
                  summary: An empty prefix lists the filesystem root.
                  value:
                    completions:
                      - path: /
                        writable: true
                drilledIn:
                  summary: A mid-path fragment lists the matching children, write facts included.
                  value:
                    completions:
                      - path: /mnt/family-archive/2026-spring
                        writable: true
                      - path: /mnt/family-archive/2026-summer
                        writable: false
                nothingMatches:
                  summary: A prefix that matches nothing answers nothing.
                  value:
                    completions: []
        '400':
          description: |
            The prefix exceeds the 4,096-byte bound (the generated
            binder does not enforce query maxLength, the handler
            does).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                prefixTooLong:
                  value:
                    code: VALIDATION_FAILED
                    message: prefix exceeds the limit of 4096 bytes
                    details:
                      fields:
                        - prefix
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`: the completion browses the container's
            filesystem on the creation dialog's behalf, and that
            browse belongs to the same configuration act the
            creation itself is. The refusal arrives before the
            prefix is read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                memberRefused:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /albums/{albumId}:
    get:
      operationId: getAlbum
      tags:
        - albums
      summary: One album's detail and one page of its items.
      description: |
        The detail view of one album the caller can see: the caller
        owns it, or it is shared to the caller through an
        `album_shares` row. `callerRole` says which -- `owner` for
        the owner's write affordances, `viewer` for the read-only
        share -- with the one exception below.

        The caller's OWN sync album answers 200: the default album's
        read-only detail. `callerRole` is `owner`, the members page
        through the same keyset as any album's (the grid and
        the viewer work like any album's), but the album is
        system-managed: NO write affordance applies to it -- the
        property patch, the membership curation, the sharing face,
        the timeline preference and the delete all keep refusing a
        sync album with their unchanged 404/400 answers, whatever
        this read admits. `inTimeline` is absent (the core stream is
        never excludable) and the owner's `shares` list rides the
        response always empty (no share row can name a sync album).
        The client renders the localized display name (en "My
        photos", zh-Hans "我的照片") keyed by `type: 'sync'` -- the
        stored title is the internal system label and never renders.

        A sync album of ANOTHER account answers the same 404 as an
        unknown id, whatever share rows exist: invisible by design.

        404 is single-shape by design: an unknown id, another
        account's unshared album, and another account's sync album
        all answer the same `ALBUM_NOT_FOUND` byte for byte -- the
        anti-enumeration discipline of `ASSET_NOT_FOUND` applied to
        the album face. An album whose share to the caller was
        revoked before the request simply sits in that same invisible
        region.

        `itemCount` counts the album's members and `photoCount` the
        image-kind members among them (the bar's "N photos" idiom
        reads the latter -- a video is a member, never a photo);
        `items` is one keyset page of them, ordered `takenAt`
        descending with the asset id as the tiebreak -- the
        timeline's own ordering and cursor pair, so the album grid
        pages with the timeline's walking machinery. Every item
        carries the membership's `addedAt` and the minimal asset
        context the grid renders; `thumbnail` is the asset thumbnail
        endpoint's `tile`-size URL. Trashed and Live Photo component
        rows never appear; an ARCHIVED member does -- an album is a
        reference container, so the archive removes an asset from
        the family flows, never from the album that holds it, and
        the owner unarchives from here. A `memory` is the exception:
        the memories surface is a family flow of its own, so its
        archived members leave the count and the pages exactly like
        they leave the timeline.

        For a `memory` seen by a VIEWER (a memory shared to the
        caller), the set is narrower: the count and the pages carry
        the members the memory's owner CURRENTLY sees -- the re-share
        ground, revalidated at read time. When the owner's sight of a
        photo dies (the album that carried it to the owner was
        unshared, the row was trashed, or -- on a memory -- it was
        archived), the photo leaves every shared view of the memory
        at once: the next read drops it, with no snapshot residue.
        The owner's own detail keeps the plain membership -- the
        curation is the owner's own view of the set, and the owner's
        rows can still be tidied through the membership remove.

        `coverAssetIds` is the owner's stored pin, in pick order: the
        frames the owner picked, exactly as written, or an empty
        array when the album is on the automatic weekly group. A
        pinned frame that has since left the album (moved out,
        trashed, archived) still appears here -- the picker seeds from
        this list and marks the cells that are no longer in the
        album, so the detail answers the PIN, never the rendered
        card (the wall card's `coverAssetIds` is the filled group).

        `rootPath` rides the `directory` albums only: the album's
        source, the resolved absolute path the row stores -- the
        edit dialog's read-only source line (the source is pinned
        at creation; the property patch carries no field for it).
        Memory and sync albums omit it: a memory has no source --
        its photos live in the albums they were ingested through.

        `sourceWritable` rides beside it, on the `directory` albums
        only: the creation-time write probe's fact, false for a
        read-only source. `allowAppDeletion` and `deletable` ride
        the owner's view of a `directory` album only: the
        deletability switch's stored state (the edit dialog's
        toggle) and the wall's delete-affordance derivation
        (owner, writable source, switch on -- computed
        server-side, pure data, no runtime probing). A viewer's
        response carries none of the three faces a write would
        need, and a read-only source never carries a true
        `deletable` whatever the switch says.

        `shares` rides only the owner's view: the album's grantee
        list, one entry per `album_shares` row in the grant order
        (`grantedAt` ascending), each carrying the grantee's id,
        email and grant time -- the share management dialog's list.
        The owner's response always carries the field, an empty
        array when the album holds no grants; viewer responses
        never carry it at all (a sharee sees the album, never the
        ACL).

        `inTimeline` is the caller's timeline preference of this
        album (the exclusion toggle's source of truth): present on
        the excludable types -- the caller's own `directory` albums
        and the albums shared to them -- and absent on the caller's
        own `memory` albums. The preference scopes the aggregate:
        it never filters this album's own items, so browsing a
        switched-off album still shows everything.

        `limit` bounds the page size: absent means the default of 60;
        a value below 1 or over 200 answers 400 `VALIDATION_FAILED`.
        Pages continue through the opaque `cursor`, the timeline's
        exact keyset semantics: `nextCursor` is present exactly when
        another page follows, and the last page carries none.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the album.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page; absent on the first
            page. An unparseable value answers 400
            `VALIDATION_FAILED` (cursors are opaque strings produced
            by this endpoint, never assembled by clients).
          schema:
            type: string
          example: GN4WpRPw0AABkvShW2x9jp8KKzxNXm9w
        - name: limit
          in: query
          required: false
          description: |
            Page size: the number of album items one response carries
            at most. Defaults to 60; values below 1 or over 200
            answer 400.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
          example: 60
      responses:
        '200':
          description: |
            The album's detail with one page of its live items.
            `nextCursor` is present exactly when another page follows;
            the last page carries none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetail'
              examples:
                ownersFirstPage:
                  summary: The owner's first page over a curated album.
                  value:
                    id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6071
                    title: Road trip 2026
                    description: The coastal week in the van.
                    type: memory
                    coverAssetIds:
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6073
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6074
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6075
                    callerRole: owner
                    itemCount: 128
                    photoCount: 125
                    items:
                      - assetId: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072
                        addedAt: '2026-11-04T18:19:00Z'
                        asset:
                          takenAt: '2026-10-13T12:30:00Z'
                          originalFilename: IMG_1234.jpg
                          kind: image
                          thumbnail: /api/v1/assets/0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072/thumbnail?size=tile
                      - assetId: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6073
                        addedAt: '2026-11-04T18:19:30Z'
                        asset:
                          takenAt: '2026-10-12T08:00:00Z'
                          originalFilename: IMG_1235.jpg
                          kind: image
                          thumbnail: /api/v1/assets/0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6073/thumbnail?size=tile
                    nextCursor: GN4WpRPw0AABkvShW2x9jp8KKzxNXm9w
                    shares:
                      - userId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        email: grace@example.com
                        grantedAt: '2026-11-05T09:30:00Z'
                emptyAlbum:
                  summary: An empty album, seen by a viewer.
                  value:
                    id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6081
                    title: Family archive
                    description: ''
                    type: directory
                    coverAssetIds: []
                    rootPath: /Volumes/Photos/family
                    callerRole: viewer
                    itemCount: 0
                    photoCount: 0
                    items: []
        '400':
          description: |
            The pagination parameters are invalid: `cursor` is not a
            value this endpoint produced, or `limit` is below 1 or
            over 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: A page size over the cap.
                  value:
                    code: VALIDATION_FAILED
                    message: limit must be at most 200
                    details:
                      fields:
                        - limit
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, or it is a sync album another account owns --
            indistinguishable by design (the caller's own sync album
            answers 200, read-only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateAlbum
      tags:
        - albums
      summary: Patch one album's properties.
      description: |
        The owner's partial edit of the album's properties: `title`,
        `coverAssetIds` and `allowAppDeletion`, any subset,
        at least one field (a body that carries none -- JSON null counts
        as absent, the patch discipline of the asset surface -- is a
        client bug and answers 400). The response is the album's wall
        card after the edit.

        Authorization is the two-tier answer every album write pins:
        an album the caller cannot see at all -- an unknown id,
        another account's unshared album, every sync album -- answers
        the single-shape 404 `ALBUM_NOT_FOUND`, byte-identical to the
        read face, so album ids cannot be probed; an album the caller
        CAN see but does not own (an album shared to the caller) is
        an honest authorization failure -- 403 `AUTH_FORBIDDEN`, the
        share is view-only. The owner writes, and an administrator
        may override the owner check (the admin role bypasses it, the
        permanent delete's own discipline).

        Cover validation (the application-layer check): a present
        `coverAssetIds` must carry 0 or exactly N distinct ids (N is
        the card's frame count: four on the album card, six on the
        memory band), and every one must be a renderable member of
        THIS album -- the membership row exists and the asset is not
        trashed and not a Live Photo component row. An archived
        member is renderable on an album (the container keeps it) and
        not on a memory (a family-flow surface drops it). Any other
        id -- an asset that is no member, a trashed or component row,
        an archived member of a memory, another account's asset --
        answers 400 `VALIDATION_FAILED` carrying the message key
        `album_cover_not_member` and the count of refused frames. A
        length that is neither 0 nor N, and a repeated id, answer
        400 `VALIDATION_FAILED` naming the field. The order is the
        owner's pick order and the stored order: the server never
        re-sorts a pin. An empty array clears the pin (the album
        returns to the automatic weekly group); a `coverAssetIds`
        that is absent (or JSON null, which decodes as absent)
        leaves the pin unchanged.

        The deletability switch (`allowAppDeletion`) is the
        directory album's own field: a patch that carries it on a
        memory album answers 400 `VALIDATION_FAILED` with the
        message key `album_deletable_not_directory` (a memory
        album's deletions never move files, so the switch has no
        home there). The write is idempotent -- repeating the stored
        value converges.

        The write publishes one `album.updated` event on every
        successful patch, whatever fields changed -- the convergent
        refetch makes the unconditional fire harmless.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the album.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumPatch'
            examples:
              rename:
                summary: Rename the album.
                value:
                  title: Road trip 2026 -- rerun
              setCover:
                summary: Pin four members as the album's cover, in this order.
                value:
                  coverAssetIds:
                    - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072
                    - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6073
                    - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6074
                    - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6075
              restoreAutomatic:
                summary: Clear the pin and return to the weekly rotation.
                value:
                  coverAssetIds: []
              deletabilityOff:
                summary: The owner manages file deletions themselves.
                value:
                  allowAppDeletion: false
      responses:
        '200':
          description: |
            The patch landed; the response is the album's wall card
            after the edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumSummary'
              examples:
                renamed:
                  summary: The album after the rename.
                  value:
                    id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6071
                    title: Road trip 2026 -- rerun
                    description: The coastal week in the van.
                    type: memory
                    isShared: true
                    coverAssetIds:
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6073
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6074
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6075
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6076
                      - 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6077
                    itemCount: 128
                    photoCount: 126
                    updatedAt: '2026-11-05T11:02:00Z'
                    callerRole: owner
        '400':
          description: |
            The request is invalid: the body is not valid JSON or
            carries no field; a present title is empty,
            whitespace-only or spans more than 64 characters; a
            present `coverAssetIds` carries a length other than 0 or
            the card's frame count, repeats an id, or names an id
            that is not a renderable member of this album (the message key
            `album_cover_not_member` with the refused count); or a
            present `allowAppDeletion` names a non-directory album
            (the message key `album_deletable_not_directory`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                coverNotMember:
                  summary: Two picked photos are no longer in the album.
                  value:
                    code: VALIDATION_FAILED
                    message: the cover must name renderable members of this album
                    details:
                      key: album_cover_not_member
                      count: 2
                deletableNotDirectory:
                  summary: The deletability switch has no home on a memory album.
                  value:
                    code: VALIDATION_FAILED
                    message: the deletability switch is a directory album's own setting
                    details:
                      key: album_deletable_not_directory
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller can see the album but is not its owner (an
            album shared to the caller): the share is view-only, so
            the write is an honest authorization failure, not a
            missing resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                viewerWrite:
                  value:
                    code: AUTH_FORBIDDEN
                    message: only the album's owner may write it
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, or it is a sync album -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAlbum
      tags:
        - albums
      summary: Remove one album.
      description: |
        Removes the caller's album. The answer is 204 with no body,
        and the write publishes one `album.deleted` event -- the wall
        and the detail converge through it on every connected client.

        The removal's database half is ONE transaction: the album row
        goes, and every `album_items` membership row, every
        `album_shares` row and every per-user timeline preference row
        follows through the schema's cascades.

        What happens to the album's MEMBERS splits by the album's
        type. A `memory` album holds references, not photos:
        removing it takes only its own rows -- the album row, its
        membership rows, its audience
        and its per-user preference rows go, and NOTHING else does.
        The photos are not the memory's: they live in the albums
        they were ingested through, and every one of their states
        (the asset rows, the per-user favorites and tags, the faces,
        the generated files) is untouched, whatever their storage
        kind -- no guard on other albums' references runs, nothing
        is purged, no file is contacted. A `directory` album is a source, and removing it is the
        UN-INGEST of what its scans brought in: every member asset
        that NO OTHER album references (the album union -- the sync
        album's permanent membership covers every uploaded row, and a
        member shared with a second album survives on that
        reference) is cleaned from the library entirely -- the asset
        row and its per-user states (favorites, tag assignments) go,
        its faces follow (a face cluster left empty dissolves with
        its labels, a surviving member re-homes the cluster's
        representative), its CLIP embedding and OCR text go, and the
        GENERATED files (the thumbnails and the transcode outputs)
        are deleted. The row deletion is a hard delete: the library
        data is gone, not trashed. The member's SOURCE file is NEVER
        touched -- the album only ever referenced it where it lies,
        and the file remains the family's own. An external member
        currently in the trash (its file in the server's trash area)
        loses the row and the trash copy together. The file removals
        run after the transaction commits and are best-effort: a
        file the operating system refuses is left behind as inert
        garbage, never as a row that names it. Every purged member
        publishes one `asset.deleted` event (the Live Photo
        component rows stay silent, exactly like every other purge),
        so the timeline, the search and the people surfaces converge
        on the removal while it happens.

        The sync album is no album resource: it answers the
        single-shape 404, whatever the caller's role. The same 404
        answers an unknown id.

        Authorization is the writes' two-tier answer: an album the
        caller cannot see answers the single-shape 404; an album
        shared to the caller answers 403 `AUTH_FORBIDDEN` (the share
        is view-only); the owner -- or an administrator overriding
        the owner check -- removes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the album.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The album is gone. Its membership, share and preference
            rows cascaded with it; a directory album's unreferenced
            members were purged from the library (their source files
            untouched). The answer carries no body.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller can see the album but is not its owner (an
            album shared to the caller): the share is view-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                viewerWrite:
                  value:
                    code: AUTH_FORBIDDEN
                    message: only the album's owner may write it
        '404':
          description: |
            No such album for this caller: the id is unknown or it is
            another account's unshared or sync album --
            indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
