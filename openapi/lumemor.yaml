  /assets/batch:
    post:
      operationId: batchAssets
      tags:
        - assets
      summary: Apply one set action to a batch of assets.
      description: |
        The batch surface of the curation actions: one request applies
        one action -- favorite, unfavorite, hide, unhide, trash or
        restore -- to a list of up to 1000 asset ids, in one
        transaction. The endpoint follows set semantics: it is a
        convergence operation, not a state-change counter. Every id
        that resolves against the action's guard is applied (an id
        already in the target state is the idempotent no-op and still
        counts as affected), and every id that does not resolve --
        unknown, or one the guard does not cover, the two
        indistinguishable -- is ignored and reported in the response's
        `missing` list. The two lists partition the request's
        distinct ids: no individual id ever fails the request, and a
        repeat of a successful batch converges to the same answer.

        The guards differ by action, exactly as the single-asset
        faces do: favorite and unfavorite resolve CALLER-VISIBLE ids
        -- the caller's own assets plus the assets of every album
        shared to them, the same union the timeline aggregates (a
        sharee favorites what they see) -- while hide, unhide, trash
        and resolve's restore arm stay OWNER-scoped: curation and the
        trash lifecycle are the owner's alone, so another account's
        asset resolves for a sharee only through the favorite arms
        and reports as missing through every other.

        This is the deliberate trade of the list surface: the
        byte-identical 404 anti-enumeration of the single-asset
        endpoints does not apply here. The caller handed the ids over
        themselves, so reporting the unresolvable ones back in
        `missing` hides nothing -- and hands honest clients their
        retry list.

        `ids` must carry between 1 and 1000 entries: an empty list, or
        one past the cap, answers 400 `VALIDATION_FAILED`, as does an
        `action` outside the enum or a body that is not valid JSON
        (an id that is not a uuid fails the body decode). Repeated ids
        collapse to one application.

        The whole batch commits as one transaction: the action's
        writes land together or not at all, so a partial batch never
        surfaces. Failures on resolvable ids are not expected -- the
        per-item guards turn foreign and already-in-state ids into
        no-ops, not errors -- so the all-or-nothing bound is the
        infrastructure safety, not a client-visible case.

        The actions resolve to their single-row primitives: favorite
        / unfavorite write or remove the caller's per-user favorites
        rows; hide / unhide flip the owner-level archive switch of
        the row the id names (an archived asset leaves every family
        flow -- the timeline, the favorites, the people and places
        walls, the map, the memories, the search -- until
        unarchived); trash /
        restore run the trash lifecycle of the trash endpoints, Live
        Photo pair included (trashing or restoring the photo carries
        its component video row along, whichever row the id names).

        The trash arm splits on the row's storage kind, its
        two semantics: a `blob` row is soft-deleted in
        place (the file stays until expiry), while an `external`
        row's file is MOVED into the server's trash area
        (`data/trash/<assetId>/`) with `original_path` and
        `trash_path` recorded on the row -- and the move needs the
        operating system's permission. A file the server cannot
        move (an unreadable source, an unwritable directory) fails
        the WHOLE batch explicitly with 500
        `ASSET_TRASH_MOVE_FAILED`: nothing moves, nothing is
        written, the rows stay live -- the batch's one transaction
        rolls back and every file already moved is moved back.
        Restoring an external row moves the file back to its
        recorded original location by the same discipline (a
        location that can no longer receive it fails the batch the
        same way).

        Events publish AFTER the commit, one per asset whose state
        actually changed -- the idempotent no-op stays silent, the
        same discipline as the single-asset restore: `asset.trashed`
        and `asset.restored` for trash and restore, `asset.updated`
        for hide and unhide (the archive switch is owner-level
        state, and every viewer of the shared timeline sees it
        change).
        favorite / unfavorite publish nothing: favorites are per-user
        state with no cross-user visibility effect, so no other
        session has anything to refresh.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            examples:
              trashSelection:
                summary: Trash a selection of assets.
                value:
                  action: trash
                  ids:
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
              unhideSelection:
                summary: Return archived assets to the family flows.
                value:
                  action: unhide
                  ids:
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f72
      responses:
        '200':
          description: |
            The set-semantics report: `affected` distinct ids resolved
            and were applied (idempotent no-ops included), `missing`
            lists the ids that did not resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              examples:
                partial:
                  summary: Two ids applied, one unresolvable reported.
                  value:
                    affected: 2
                    missing:
                      - 31000000-0000-0000-0000-000000000001
                clean:
                  summary: Every id resolved.
                  value:
                    affected: 3
                    missing: []
        '400':
          description: |
            The request is not a well-formed batch: `action` is not a
            member of the enum, `ids` is empty or exceeds the
            1000-id cap, or the body is not valid JSON (an id that is
            not a uuid included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: An id list past the cap.
                  value:
                    code: VALIDATION_FAILED
                    message: ids exceed the batch limit of 1000
                    details:
                      fields:
                        - ids
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: |
            Unexpected server failure, or the external-move failure
            of the trash arm: a `trash` (or `restore`) action over a
            directory album's external asset whose file the server
            could not move -- the operating system denied the
            permission, or the recorded original location can no
            longer receive the file. The whole batch rolled back:
            nothing was written and every moved file was moved back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                trashMoveFailed:
                  value:
                    code: ASSET_TRASH_MOVE_FAILED
                    message: the file could not be moved into the trash
                restoreMoveFailed:
                  value:
                    code: ASSET_RESTORE_MOVE_FAILED
                    message: the file could not be moved back to its original location
  /assets/favorites:
    get:
      operationId: getFavorites
      tags:
        - assets
      summary: The caller's favorites, one keyset page at a time.
      description: |
        The favorites view: the assets the calling user favorites,
        filtered to the live view -- archived assets, assets in the
        trash and the component video rows of Live Photos never
        appear -- with every item carrying `isFavorite: true` by
        construction (the listing joins the caller's favorites rows).

        The view shares the timeline's shape, ordering and pagination:
        `takenAt` descending with the id as the tiebreak, `limit`
        absent meaning 100 and capped at 200, and the opaque `cursor`
        handed back as `nextCursor` precisely when another page
        follows, so the same wall UI that walks the timeline walks
        the favorites.

        Favorites are per-user state written by the batch endpoint's
        favorite action, and the view is the caller's favorites rows
        crossed with CALLER-VISIBLE assets: the caller's own, plus
        the assets of every album shared to them -- the same album
        union the timeline aggregates. A sharee's favorites of
        shared assets appear here; a revoked share removes the
        assets from the view (the favorite row itself survives and
        resurfaces if the album is shared again). Hiding (or
        trashing) a favorited asset removes it from this view; it
        returns when unarchived (or restored), the favorite row
        untouched -- an idempotent per-user mark, not a copy of the
        asset.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page; absent on the first
            page. An unparseable value answers 400
            `VALIDATION_FAILED` (cursors are opaque strings produced
            by this endpoint, never assembled by clients).
          schema:
            type: string
          example: GN4WpRPw0AABkvShW2x9jp8KKzxNXm9w
        - name: limit
          in: query
          required: false
          description: |
            Page size: the number of timeline items one response
            carries at most. Defaults to 100; values over 200 are
            answered with 200, values below 1 answer 400.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          example: 100
      responses:
        '200':
          description: |
            One page of the favorites view. `nextCursor` is present
            exactly when another page follows; the last page carries
            none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
              examples:
                oneFavorite:
                  summary: One favorited photo.
                  value:
                    items:
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
