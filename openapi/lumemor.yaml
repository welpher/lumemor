  /assets/{id}:
    get:
      operationId: getAsset
      tags:
        - assets
      summary: Fetch the detail of one owned asset.
      description: |
        The asset detail: the identity and storage fields of the upload
        response plus the refinements the pipeline produced afterwards
        -- dimensions, duration, blurhash, the EXIF hot fields, and
        readiness -- which the asset detail view renders.

        Access is owner-only: an id that belongs to another account
        answers the same 404 `ASSET_NOT_FOUND` as an id that does not
        exist, byte for byte, so asset ids cannot be enumerated. Album
        sharing and ACLs widen access for shared content in a later
        milestone (M2c, with the album domain); until then only the
        owner's own assets answer.

        A trashed asset answers 200 with `isTrashed: true` -- the
        trash view reads the detail the same way. The component video
        row of a Live Photo is readable by its id (the future playback
        endpoint resolves it through `livePhotoVideoId`) but never
        appears in the timeline.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The asset detail. `isReady` is true once the whole pipeline
            (metadata and serving copies) completed; until then the
            pipeline-dependent fields stay null and the client waits
            for the `asset.ready` event. `exif` is always present; its
            fields are null until the metadata job wrote the
            extraction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
              examples:
                readyImage:
                  summary: A processed JPEG whose pipeline completed.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1234.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    createdAt: '2026-10-29T09:12:00Z'
                    takenAt: '2026-10-13T12:30:00Z'
                    takenAtSource: exif
                    isTrashed: false
                    isReady: true
                    width: 4032
                    height: 3024
                    durationMs: null
                    blurhash: UHL6aAof00WBWB00ayWB00
                    livePhotoVideoId: null
                    exif:
                      cameraMake: Lumemor
                      cameraModel: Golden Camera
                      lens: Golden 35mm f/2.8
                      iso: 200
                      aperture: 2.8
                      shutter: 1/250
                      focal: 35
                      lat: 48.8584
                      lon: 2.2945
                      alt: 35
                      tzOffset: '+05:30'
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset with this id is visible to the caller: the id is
            unknown or belongs to another account, and the two cases
            are indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAsset
      tags:
        - assets
      summary: Permanently delete one asset, files and all.
      description: |
        The explicit permanent deletion -- the destructive surface
        beside the trash. It removes the asset row whatever its state
        (live or trashed: this endpoint does not route through the
        trash), and with it the asset's on-disk artifacts under the
        shared-blob rule: content addressing means another owner's row
        (or any other row) with the same checksum references the SAME
        physical file, so the original file is removed only when no
        other asset row references it; otherwise the row goes and the
        file stays. The derived serving copies (the per-asset
        thumbnail directory) belong to this asset id alone and are
        always removed. The component video row of a Live Photo is
        deleted with its photo (it is never an asset of its own).

        The application-layer permission gate of the two-layer delete
        discipline: the owner of the asset, or an administrator. An
        id of another user's asset answers the same 404
        `ASSET_NOT_FOUND` as an id that does not exist, byte for
        byte, so asset ids cannot be enumerated. (The file-system
        layer of the gate matters for directory albums, whose files
        move on delete; it arrives with the album domain in a later
        milestone -- blob originals live inside the server's own data
        directory.)

        The ordinary client "delete" is the trash (soft delete
        through the batch endpoint); this endpoint is the explicit
        bypass: the client that already knows it wants the asset gone
        forever, and the empty-trash surface. Repeating the request
        after a successful deletion answers 404 -- the asset no
        longer exists, exactly like an unknown id.

        The deletion is committed before the files are removed: a
        failure between the two (a full disk, a failing mount) leaves
        the row gone and the file orphaned, which is a storage leak,
        never data loss; it is logged server-side and the response
        still reports the deletion.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The asset is permanently deleted: the row is gone, the
            derived files are removed, and the original file is
            removed unless another asset row still references it.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset with this id exists: the id is unknown, was
            already permanently deleted, or belongs to another
            account while the caller is neither its owner nor an
            administrator -- all indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{id}/thumbnail:
    get:
      operationId: getAssetThumbnail
      tags:
        - assets
      summary: Serve a derived thumbnail, or a video's poster frame.
      description: |
        The static serving copy of the asset:

        - image assets: the AVIF thumbnail of the requested size --
          `tile` (fits the 250px timeline box), `view` (long edge
          capped at 1080px), `original` (the full-resolution
          re-encode) -- served as `image/avif`;
        - video assets: the poster frame, whatever `size` says -- the
          poster (the first frame, scaled into the tile box) is the
          video's only serving copy until transcodes exist -- served
          as `image/jpeg`.

        The response is a private immutable static asset:
        `Cache-Control: private, max-age=31536000, immutable`, and a
        strong `ETag` built from the first 16 hex characters of the
        asset's checksum (quoted). A matching `If-None-Match` answers
        304 with the same validators and no body. Conditional requests
        and byte ranges otherwise follow the Go standard library's
        `ServeContent` semantics.

        The asset exists but its derived file is absent -- the
        thumbnail job has not run yet, or failed and is retrying --
        answers 404 `ASSET_NOT_READY`: the client renders the blurhash
        or a placeholder and waits for the `asset.ready` event instead
        of treating the asset as gone. `ASSET_NOT_FOUND`, by contrast,
        means the id is unknown or not the caller's; the owner-only
        anti-enumeration of the detail endpoint applies here too, with
        byte-identical 404 bodies for foreign and unknown ids.

        `size` must be one of the three values below; anything else
        (including a missing `size`) answers 400 `VALIDATION_FAILED`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          required: true
          description: |
            The serving size: `tile` for the timeline, `view` for the
            inline display, `original` for the full-resolution serving
            copy. Video assets answer the poster frame for every
            value.
          schema:
            type: string
            enum:
              - tile
              - view
              - original
          example: tile
      responses:
        '200':
          description: |
            The serving copy: `image/avif` for an image thumbnail,
            `image/jpeg` for a video poster.
          headers:
            ETag:
              description: |
                Strong entity tag: the first 16 hex characters of the
                asset's checksum, quoted. The derivation is
                deterministic, so the tag is stable across re-runs of
                the thumbnail job.
              schema:
                type: string
              example: '"9f86d081884c7d65"'
            Cache-Control:
              description: |
                The derived file is private to the owner and immutable
                (its content is a function of the immutable original
                bytes), so clients may cache it for a year.
              schema:
                type: string
              example: private, max-age=31536000, immutable
          content:
            image/avif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: |
            The `If-None-Match` value matched the entity tag; the
            cached copy is current. The response carries the same
            `ETag` and `Cache-Control` validators and no body.
        '400':
          description: |
            The `size` parameter is missing or not one of the three
            serving sizes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: An unknown serving size.
                  value:
                    code: VALIDATION_FAILED
                    message: invalid thumbnail size
                    details:
                      fields:
                        - size
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            Either no asset with this id is visible to the caller
            (unknown or foreign id, `ASSET_NOT_FOUND`), or the asset
            exists but its derived file is not on disk yet
            (`ASSET_NOT_READY` -- the pipeline has not produced it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
                assetNotReady:
                  summary: The thumbnail job has not run yet.
                  value:
                    code: ASSET_NOT_READY
                    message: asset media is not ready yet
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{id}/original:
    get:
      operationId: getAssetOriginal
      tags:
        - assets
      summary: Download the original file of one owned asset.
      description: |
        Streams the stored original bytes as a download. It is
        available immediately after the upload: the original is the
        uploaded content-addressed file itself, not a pipeline
        product.

        The download is always an attachment: `Content-Disposition:
        attachment; filename*=UTF-8''...` with the original file name
        escaped per RFC 5987 -- every byte outside the attribute
        character set is percent-encoded, which rules out header
        injection and in-browser rendering alike (SVG is not in the
        upload whitelist, so the download-only rule covers every
        stored format). `Content-Type` is the asset's stored MIME
        type. The response carries the same `ETag` and
        `Cache-Control` validators as the thumbnail (the original
        bytes are content-addressed, hence immutable).

        Byte ranges follow the Go standard library's `ServeContent`
        semantics: a satisfiable single range answers 206 with
        `Content-Range`; multiple ranges answer a
        `multipart/byteranges` body; an unsatisfiable range answers
        416 with the total size in `Content-Range`; a malformed Range
        header is ignored and the full body answers 200.

        The same owner-only download gate as every asset endpoint:
        foreign and unknown ids answer byte-identical 404
        `ASSET_NOT_FOUND`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the asset.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The original file. The `Content-Type` header carries the
            asset's stored MIME type (the media type below is the
            generic documentation placeholder).
          headers:
            ETag:
              description: |
                Strong entity tag: the first 16 hex characters of the
                asset's checksum, quoted.
              schema:
                type: string
              example: '"9f86d081884c7d65"'
            Cache-Control:
              description: |
                The original bytes are content-addressed and therefore
                immutable; the download is private to the owner.
              schema:
                type: string
              example: private, max-age=31536000, immutable
            Content-Disposition:
              description: |
                Always `attachment` with the RFC 5987 escaped original
                file name, so browsers download instead of rendering.
              schema:
                type: string
              example: attachment; filename*=UTF-8''IMG_1234.jpg
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: |
            A satisfiable single byte range; `Content-Range` names the
            served slice. Multi-range requests answer
            `multipart/byteranges` instead.
          headers:
            Content-Range:
              description: The served slice of the total file size.
              schema:
                type: string
              example: bytes 0-99/12345
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: |
            The `If-None-Match` value matched the entity tag; the
            cached copy is current.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset with this id is visible to the caller: the id is
            unknown or belongs to another account, and the two cases
            are indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
        '416':
          description: |
            The requested range is unsatisfiable for this file; the
            `Content-Range` header of the error carries the total size
            (`bytes */<size>`).
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/by-device-id/{deviceAssetId}:
    get:
      operationId: getAssetByDeviceId
      tags:
        - assets
      summary: Look up an uploaded asset by its device identifier.
      description: |
        The backup idempotency probe: the app asks, before uploading a
        local file, whether its `deviceAssetId` already exists for this
        account, and skips the upload when it does.

        The lookup is owner-scoped -- a `deviceAssetId` of another
        user's asset is invisible and answers 404. The `state` field
        mirrors what a re-upload of the same content would produce:
        `duplicate` when the asset is live, `trashed` when it sits in
        the trash (the client can then offer restore or save-as-new
        before spending bandwidth). 404 means the device has not
        uploaded this identifier (or only under another account).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: deviceAssetId
          in: path
          required: true
          description: The device-side identity the asset was uploaded with.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: |
            The asset recorded under this device identifier. `state` is
            `duplicate` (live) or `trashed` (in the trash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
              examples:
                alreadyUploaded:
                  summary: The device already uploaded this photo.
                  value:
                    id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                    kind: image
                    originalFilename: IMG_1234.jpg
                    fileSize: 4821933
                    mimeType: image/jpeg
                    checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    state: duplicate
                    createdAt: '2026-10-29T09:12:00Z'
                    takenAt: '2026-10-13T12:30:00Z'
                    isTrashed: false
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset of this account carries the device identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this device identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trash:
    get:
      operationId: getTrash
      tags:
        - assets
      summary: List the caller's trashed assets with their retention countdown.
      description: |
        The trash view of the caller: every asset the caller soft
        deleted, newest deletion first, each with the countdown of
        whole days until the expiry job removes it. Retention is the
        instance setting `trash_retention_days` (default 30): the
        expiry job runs hourly and permanently deletes rows whose
        `deletedAt` fell past the retention window, so an item shows
        `remainingDays` 0 on its way out (the row survives only until
        the next job run) and disappears afterwards -- restoring it
        then answers 404, it does not resurrect.

        `remainingDays` counts the days left rounded up: an asset
        trashed moments ago with the default retention shows 30. The
        list is owner-scoped and bounded: it answers at most the 200
        most recent deletions (the trash is a recovery view for
        recent deletes, and older items age out through expiry long
        before the bound could bite). The component video rows of
        Live Photos never appear: the pair is represented by its
        photo.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The trashed assets of the caller, newest deletion first.
            `items` is the full (bounded) list -- there is no
            pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResponse'
              examples:
                onePhoto:
                  summary: One photo, trashed earlier today.
                  value:
                    items:
                      - id: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                        ownerId: 0192f2a1-3b4c-7d8e-9f0a-1b2c3d4e5f60
                        kind: image
                        originalFilename: IMG_1234.jpg
                        fileSize: 4821933
                        mimeType: image/jpeg
                        checksum: 9f86d081884c7d65a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        createdAt: '2026-10-29T09:12:00Z'
                        takenAt: '2026-10-13T12:30:00Z'
                        takenAtSource: exif
                        isReady: true
                        width: 4032
                        height: 3024
                        durationMs: null
                        blurhash: UHL6aAof00WBWB00ayWB00
                        livePhotoVideoId: null
                        deletedAt: '2026-10-30T11:04:05Z'
                        remainingDays: 30
                empty:
                  summary: Nothing in the trash.
                  value:
                    items: []
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trash/{id}/restore:
    post:
      operationId: restoreAsset
      tags:
        - assets
      summary: Restore one trashed asset.
      description: |
        Clears the trash mark of one asset: the row becomes live
        again and re-enters the timeline (its album memberships were
        never removed -- a trashed asset is filtered out of the live
        views, not evicted from its albums). The component video row
        of a Live Photo is restored with its photo.

        The operation follows set semantics: restoring an asset that
        is already live succeeds (204, nothing to do) -- a client
        that races another restore, or asks twice, converges instead
        of erroring; the row is already in the desired state. Only an
        id that is unknown, or that belongs to another account while
        the caller is not its owner, answers 404 -- byte-identical
        for both cases, so asset ids cannot be enumerated. An asset
        whose row the expiry job already removed answers 404 as well:
        a purge is not reversible.

        The retention countdown of the trash list is the only signal
        that a restore is still possible; after the row is gone, the
        content itself can only return through a re-upload (which the
        upload idempotency answers as a fresh asset).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the trashed asset.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The asset is live again (or already was: the idempotent
            success). The row re-enters the timeline and every live
            view.
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No asset with this id is restorable by the caller: the id
            is unknown, already purged by the expiry job, or belongs
            to another account -- all indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotFound:
                  value:
                    code: ASSET_NOT_FOUND
                    message: no asset with this identifier
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    LoginRequest:
      type: object
      description: Credentials of `POST /auth/login`.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Login address of the account.
        password:
          type: string
          format: password
          description: Account password; never echoed in any response.
          examples:
            - correct horse battery staple
    SessionInfo:
      type: object
      description: |
        One authenticated session of a user. Web sessions authenticate
        through the `lumemor_session` cookie and mobile sessions
        through their bearer token; both are the same session records
        and appear together in `GET /auth/sessions`.
      required:
        - id
        - kind
        - createdAt
        - lastSeenAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the session.
        kind:
          type: string
          description: |
            Where the session credential lives: `web` sessions ride
            the `lumemor_session` cookie and slide their expiry by 30
            days on use; `mobile` sessions ride a bearer token and are
            revoked explicitly.
          enum:
            - web
            - mobile
        deviceName:
          type: string
          description: |
            Human-readable device label of the session. For web
            sessions it is the browser user agent captured at login;
            mobile sessions carry the name supplied during pairing.
        createdAt:
          type: string
          format: date-time
          description: When the session was created (RFC 3339 UTC).
        lastSeenAt:
          type: string
          format: date-time
          description: When the session was last used (RFC 3339 UTC).
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the session expires (RFC 3339 UTC). Null for bearer
            sessions, which are revoked explicitly instead of
            expiring.
    PairingTokenResponse:
      type: object
      description: The one-time pairing token issued by `POST /auth/pairing/token`.
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: |
            One-time pairing secret, 128 random bits as a URL-safe
            string. Render it as a QR code and never store or log it;
            the server keeps only its hash.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the token expires (RFC 3339 UTC); five minutes after
            issuance.
    PairingConsumeRequest:
      type: object
      description: Payload of `POST /auth/pairing/consume`.
      required:
        - token
        - deviceName
        - deviceId
      properties:
        token:
          type: string
          description: The pairing token read from the QR code.
        deviceName:
          type: string
          description: |
            Human-readable device label shown in the session list,
            for example `Pixel 9`.
        deviceId:
          type: string
          description: |
            Stable client-generated identifier of the physical device,
            for example a UUID the app persists; it lets the server
            recognize the same device across pairings.
    BearerSession:
      type: object
      description: |
        The mobile session minted by consuming a pairing token: the
        bearer credential plus the session it authenticates.
      required:
        - token
        - session
      properties:
        token:
          type: string
          description: |
            Bearer credential of the new mobile session; send it as
            `Authorization: Bearer <token>`. It appears only in this
            response, and the server stores only its hash: a device
            that loses it must pair again.
        session:
          $ref: '#/components/schemas/SessionInfo'
    ServerInfo:
      type: object
      description: Instance capability report served by `GET /server/info`.
      required:
        - version
        - initialized
        - features
      properties:
        version:
          type: string
          description: Server version (semantic versioning).
          examples:
            - 0.1.0
        initialized:
          type: boolean
          description: |
            True once the instance has an administrator account. Clients use
            it to decide between the first-run wizard and the login screen.
        features:
          type: object
          description: |
            Instance feature switches (model slots, search modes, pairing).
            Unknown keys must be ignored by clients.
          additionalProperties:
            type: boolean
          examples:
            - faces: true
              semanticSearch: true
    CreateAdminRequest:
      type: object
      description: Payload of the first-run wizard (`POST /server/setup/admin`).
      required:
        - email
        - password
      properties:
        name:
          type: string
          description: Optional display name; defaults to the email address.
        email:
          type: string
          format: email
          description: Login address of the administrator.
        password:
          type: string
          format: password
          description: Account password; stored only as an Argon2id hash.
          examples:
            - correct horse battery staple
    User:
      type: object
      description: A lumemor account.
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
          description: Display name.
        email:
          type: string
          format: email
          description: Login address.
        role:
          type: string
          description: Authorization role; `admin` is granted by the
            first-run wizard, later accounts are created by an admin.
          enum:
            - admin
            - user
        createdAt:
          type: string
          format: date-time
          description: Creation time (RFC 3339 UTC).
    AssetResponse:
      type: object
      description: |
        One stored asset as the upload and idempotency endpoints return
        it. `state` discriminates the upload outcome: `created` (201, a
        new asset), `duplicate` (200, an identical live asset already
        existed), `trashed` (200, an identical asset sits in the trash;
        the body carries that asset so the client can offer restore or
        save-as-new). The idempotency lookup mirrors the same states:
        it reports what a re-upload of the content would yield, so
        `created` never appears there.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - state
        - createdAt
        - takenAt
        - isTrashed
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image` whose
            video component is stored as a linked `video` row that
            never appears in the timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: |
            The file name the asset was uploaded with: the client-side
            `fileName` of the photo (the component video keeps its own
            file part name).
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            owner-scoped idempotency key of the upload.
        state:
          type: string
          description: |
            The upload outcome: `created` (201), `duplicate` (200, an
            identical live asset) or `trashed` (200, an identical asset
            in the trash).
          enum:
            - created
            - duplicate
            - trashed
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; responses render the best value the
            server has at answer time.
        isTrashed:
          type: boolean
          description: |
            True when the asset sits in the trash; `state: trashed`
            responses carry it as true so clients can offer the
            restore or save-as-new decision.
    AssetDetail:
      type: object
      description: |
        One asset as the detail endpoint returns it: the upload
        response's identity and storage fields plus the pipeline's
        refinements. The shape is fixed -- every property is always
        present -- and the pipeline-dependent values (`width`,
        `height`, `durationMs`, `blurhash` and the fields inside
        `exif`) are null until the jobs produced them, turning
        non-null when `asset.ready` fired. A value that stays null on
        a ready asset means the file carries no such metadata.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - isTrashed
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - livePhotoVideoId
        - exif
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image` whose
            video component is stored as a linked `video` row that
            never appears in the timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: |
            The file name the asset was uploaded with; the original
            download re-uses it (RFC 5987 escaped) for
            `Content-Disposition`.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; the response renders the best value the
            server has at answer time.
        takenAtSource:
          type: string
          description: |
            Where `takenAt` comes from: `import` is the
            device-reported capture time of the upload, `exif` an
            EXIF capture time the metadata job resolved with an
            offset, `file` a file timestamp (reserved for the future
            directory-album importer).
          enum:
            - exif
            - file
            - import
        isTrashed:
          type: boolean
          description: True when the asset sits in the trash.
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset (metadata and
            serving copies) completed; the `asset.ready` event fires
            at that moment. Until then the client shows placeholders
            and the media endpoints answer `ASSET_NOT_READY` for
            missing derived files.
        width:
          type:
            - integer
            - 'null'
          description: |
            Pixel width in sensor order (not orientation-corrected);
            null until the metadata job refined the dimensions.
        height:
          type:
            - integer
            - 'null'
          description: |
            Pixel height in sensor order (not orientation-corrected);
            null until the metadata job refined the dimensions.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile (image assets) or poster frame
            (video assets) for placeholder rendering; null until the
            thumbnail job stored it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (never in the timeline, but resolvable for
            playback); null otherwise.
        exif:
          allOf:
            - $ref: '#/components/schemas/ExifSummary'
          description: |
            The EXIF hot fields. Always present as an object; every
            field inside it is null until the metadata job wrote the
            extraction.
    ExifSummary:
      type: object
      description: |
        The EXIF hot fields of an asset, flattened from the raw
        exiftool output by the metadata job. Every property is always
        present and null until the job wrote it -- or forever, for
        files that carry no such tag.
      required:
        - cameraMake
        - cameraModel
        - lens
        - iso
        - aperture
        - shutter
        - focal
        - lat
        - lon
        - alt
        - tzOffset
      properties:
        cameraMake:
          type:
            - string
            - 'null'
          description: Camera manufacturer (EXIF Make).
        cameraModel:
          type:
            - string
            - 'null'
          description: Camera model (EXIF Model).
        lens:
          type:
            - string
            - 'null'
          description: Lens identifier (LensModel, LensID or Lens).
        iso:
          type:
            - integer
            - 'null'
          description: ISO sensitivity.
        aperture:
          type:
            - number
            - 'null'
          description: Aperture as the f-number.
        shutter:
          type:
            - string
            - 'null'
          description: |
            Exposure time in photo notation, for example `1/250` or
            `2.5s`.
        focal:
          type:
            - number
            - 'null'
          description: Focal length in millimeters.
        lat:
          type:
            - number
            - 'null'
          format: double
          description: GPS latitude in degrees.
        lon:
          type:
            - number
            - 'null'
          format: double
          description: GPS longitude in degrees.
        alt:
          type:
            - number
            - 'null'
          description: GPS altitude in meters.
        tzOffset:
          type:
            - string
            - 'null'
          description: |
            The offset that resolved the capture time, in EXIF
            notation (`+05:30`); null when the capture time did not
            resolve through EXIF.
    TimelineItem:
      type: object
      description: |
        One asset of the timeline: the asset detail's fields minus the
        `exif` object (the detail endpoint renders the EXIF panel; the
        timeline renders tiles). Every item is live by construction --
        hidden assets, trashed assets and the component video rows of
        Live Photos never enter the timeline -- so `isTrashed` is
        always false here and is carried only to keep the item shape
        identical to the detail's. `isReady` still varies: a fresh
        upload enters the timeline immediately with its
        pipeline-dependent fields null, and the client upgrades the
        tile when `asset.ready` fires. The shape is fixed -- every
        property is always present. Favorites are per-user state
        (`isFavorite`) and join this shape with the favorites API of
        the same milestone.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - isTrashed
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - livePhotoVideoId
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image`
            whose linked component video row never appears in the
            timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: The file name the asset was uploaded with.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; the timeline orders by it.
        takenAtSource:
          type: string
          description: |
            Where `takenAt` comes from: `import` is the
            device-reported capture time of the upload, `exif` an
            EXIF capture time the metadata job resolved with an
            offset, `file` a file timestamp (reserved for the future
            directory-album importer).
          enum:
            - exif
            - file
            - import
        isTrashed:
          type: boolean
          description: |
            Always false in the timeline: trashed assets never enter
            it. The field exists to keep the shape identical to the
            asset detail's.
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset (metadata and
            serving copies) completed; until then the
            pipeline-dependent fields are null and the client renders
            placeholders.
        width:
          type:
            - integer
            - 'null'
          description: |
            Pixel width in sensor order; null until the metadata job
            refined the dimensions.
        height:
          type:
            - integer
            - 'null'
          description: |
            Pixel height in sensor order; null until the metadata job
            refined the dimensions.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile (image assets) or poster frame
            (video assets) for placeholder rendering; null until the
            thumbnail job stored it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (resolvable for playback); null otherwise.
    TimelineResponse:
      type: object
      description: |
        One page of the timeline. `nextCursor` is present exactly when
        another page follows the `items` of this one: the client
        passes it back as the `cursor` query parameter to continue,
        and a response without it ends the pagination. The last page
        is the one whose follow-up page would be empty, so no run
        ever observes an empty page mid-pagination.
      required:
        - items
      properties:
        items:
          type: array
          description: |
            The timeline items of this page, ordered by `takenAt`
            descending with the id as the tiebreak.
          items:
            $ref: '#/components/schemas/TimelineItem'
        nextCursor:
          type: string
          description: |
            The opaque continuation cursor: pass it back as the
            `cursor` query parameter to fetch the next page. Absent
            exactly when this is the last page.
    TrashItem:
      type: object
      description: |
        One asset of the trash view: the timeline item's fields (the
        tile-relevant identity and pipeline fields, so the trash page
        renders the same tiles as the timeline) plus the trash
        semantics -- `deletedAt`, when the soft delete happened, and
        `remainingDays`, the countdown of whole days until the expiry
        job removes the row (rounded up; 0 once past the deadline,
        for the short window until the hourly job catches up). Every
        item is trashed by construction; there is no `isTrashed`
        field. The component video rows of Live Photos never appear:
        the pair is represented by its photo. The shape is fixed --
        every property is always present.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - livePhotoVideoId
        - deletedAt
        - remainingDays
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: Media family of the asset.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: The file name the asset was uploaded with.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339), the value the timeline would
            order the asset by.
        takenAtSource:
          type: string
          description: Where `takenAt` comes from.
          enum:
            - exif
            - file
            - import
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset (metadata and
            serving copies) completed.
        width:
          type:
            - integer
            - 'null'
          description: |
            Pixel width in sensor order; null until the metadata job
            refined the dimensions.
        height:
          type:
            - integer
            - 'null'
          description: |
            Pixel height in sensor order; null until the metadata job
            refined the dimensions.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile for placeholder rendering; null
            until the thumbnail job stored it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (restored and expired together with the photo);
            null otherwise.
        deletedAt:
          type: string
          format: date-time
          description: |
            When the asset was soft deleted (RFC 3339 UTC). The
            retention window ends at `deletedAt` plus the instance's
            `trash_retention_days`.
        remainingDays:
          type: integer
          minimum: 0
          description: |
            Whole days until the expiry job removes the asset,
            rounded up (an asset trashed moments ago with the default
            retention of 30 days shows 30). 0 once the deadline has
            passed -- the row survives only until the next hourly
            expiry run.
    TrashResponse:
      type: object
      description: |
        The trash view: the caller's trashed assets, newest deletion
        first. The list is bounded (the 200 most recent deletions)
        and unpaginated -- the trash is a recovery view for recent
        deletes, and items age out through expiry on their own.
      required:
        - items
      properties:
        items:
          type: array
          description: |
            The trashed assets of the caller, ordered by `deletedAt`
            descending.
          items:
            $ref: '#/components/schemas/TrashItem'
    Error:
      type: object
      description: |
        Error envelope shared by all endpoints. `code` is the authoritative
        registry of stable error codes; clients must not parse `message`.
      required:
        - code
      properties:
        code:
          type: string
          description: |
            Stable error code. The i18n translation key is the lowercase
            form of this value.
          enum:
            - SETUP_ALREADY_COMPLETED
            - VALIDATION_FAILED
            - INTERNAL
            - AUTH_INVALID_CREDENTIALS
            - AUTH_RATE_LIMITED
            - PAIRING_TOKEN_INVALID
            - ASSET_TOO_LARGE
            - ASSET_NOT_FOUND
            - ASSET_NOT_READY
        message:
          type: string
          description: English technical description for debugging.
        details:
          type: object
          additionalProperties: true
          description: |
            Optional structured context, for example the offending field
            names of a `VALIDATION_FAILED` request. Its shape is
            code-specific.
          examples:
            - fields:
                - email
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lumemor_session
      description: |
        Web session cookie issued by `POST /auth/login`: HttpOnly,
        SameSite=Strict, Secure when the instance is reached over
        HTTPS, sliding 30-day expiry.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Mobile session token issued by `POST /auth/pairing/consume`,
        sent as `Authorization: Bearer`. It is the mobile form of the
        same session records the cookie authenticates; both are
        revoked together.
