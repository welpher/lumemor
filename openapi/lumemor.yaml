  /admin/settings/storage:
    get:
      operationId: getStorageSettings
      tags:
        - admin
      summary: Read the storage template setting.
      description: |
        The storage settings read of the admin surface: the
        instance's upload path template, the sample path it renders,
        and the built-in preset list the settings section's dropdown
        fills from.

        The template is the path grammar every NEW upload renders its
        file placement from: `originals/<ownerUserId>/<rendered>.<ext>`,
        with the per-user root pinning one directory tree per account.
        The grammar is variable substitution plus `{{#if
        album}}...{{else}}...{{/if}}` conditionals over the file
        (`{{filename}}`, `{{ext}}`, `{{filetype}}`, `{{filetypefull}}`),
        date (`{{y}} {{yy}} {{M}} {{MM}} {{MMM}} {{MMMM}} {{d}} {{dd}}
        {{W}} {{WW}} {{H}} {{HH}} {{h}} {{hh}} {{m}} {{mm}} {{s}} {{ss}}
        {{SSS}}`), album (`{{album}}`, `{{album-startDate-*}}`,
        `{{album-endDate-*}}`), camera (`{{make}} {{model}}
        {{lensModel}}`) and id (`{{assetId}}`, `{{assetIdShort}}`)
        families. Compilation is strict -- an unknown variable or a
        malformed conditional is an error, never a silent blank.

        THE RENDERING CONTRACT (what changing the template does and
        never does): the path is rendered exactly once, at ingest,
        from the taken-at fallback chain (the file's EXIF header
        time, else the client-reported `deviceCreatedAt`, else the
        upload time) and the values known at that moment. Later
        metadata refinement NEVER re-paths an asset -- a refined
        taken-at, an album membership joined after upload, none of it
        moves a file. Existing assets keep the paths they were
        ingested under; there is deliberately NO migration of stored
        files when the template changes (moving files after ingest is
        the architecture photo libraries have lost data to; lumemor
        never moves them). New uploads follow the new template from
        the moment it is saved. Album variables render empty for
        direct uploads: the only album an upload joins at ingest is
        the system sync stream, which is not a naming source.

        The sample path is the current template rendered over a fixed
        sample asset (an image named `IMG_1234.jpg`, taken
        `2023:07:14 10:15:30.123 +05:30`, camera `Acme Alpha 5` with
        the `24-70mm f/2.8` lens, no album, under the sample owner
        `0192f8c1-0000-7000-8000-000000000001`) with the extension
        appended -- exactly the shape a real upload of that file
        would land at under this template. The response never fails
        over a corrupt setting row: the default template answers
        instead, and the server log carries the corruption.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The instance's storage template, its sample render and
            the built-in presets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettingsResponse'
              examples:
                default:
                  summary: An instance running on the default template.
                  value:
                    template: '{{y}}/{{MM}}/{{filename}}'
                    samplePath: originals/0192f8c1-0000-7000-8000-000000000001/2023/07/IMG_1234.jpg
                    presets:
                      - '{{y}}/{{MM}}/{{filename}}'
                      - '{{y}}/{{y}}-{{MM}}/{{filename}}'
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateStorageSettings
      tags:
        - admin
      summary: Validate and save the storage template.
      description: |
        The storage settings save of the admin surface. The template
        passes a three-stage validation before anything is written:

        1. **Compile** -- strict grammar: every `{{variable}}` must be
        a known member of the variable table, every conditional
        balanced. An unknown variable or a malformed conditional is
        rejected here.
        2. **Sample render** -- the compiled template renders over a
        fixed set of sample assets (an album-less image, an
        album-grouped image, a video), exactly as an upload would: a
        template that renders an empty path (an album-only template
        over the album-less sample) is rejected here.
        3. **Structure** -- the rendered paths must be safe: no `..`
        traversal, no dot segments, bounded depth (10) and bounded
        length, per-segment and total. The engine sanitizes the
        user-influenced values (file name, album, camera) and the
        structural pass guards the literal template text.

        A template that passes is saved and answers 200 with the
        saved value, its sample render and the presets. A template
        that fails any stage answers 400 `VALIDATION_FAILED` naming
        `template` in the details, with the specific reason in the
        error message; nothing is written. The save takes effect for
        uploads from the next request on: paths already recorded are
        never re-derived and never moved (see GET for the full
        rendering contract).
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsUpdateRequest'
            examples:
              yearMonthPreset:
                summary: The default year/month organization.
                value:
                  template: '{{y}}/{{MM}}/{{filename}}'
              cameraPreset:
                summary: Organizing by camera.
                value:
                  template: '{{make}}/{{model}}/{{filename}}'
      responses:
        '200':
          description: |
            The template passed the three-stage validation and was
            saved; the response carries the saved value, its sample
            render and the presets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettingsResponse'
              examples:
                saved:
                  summary: The freshly saved camera template.
                  value:
                    template: '{{make}}/{{model}}/{{filename}}'
                    samplePath: originals/0192f8c1-0000-7000-8000-000000000001/Acme/Alpha 5/IMG_1234.jpg
                    presets:
                      - '{{y}}/{{MM}}/{{filename}}'
                      - '{{y}}/{{y}}-{{MM}}/{{filename}}'
        '400':
          description: |
            The template failed a validation stage: it does not
            compile (unknown variable, malformed conditional, empty
            or whitespace-only text, a literal trailing separator),
            its sample render errors, or its structure is unsafe
            (traversal, depth, length). The details name `template`;
            the message carries the specific reason. Nothing was
            written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknownVariable:
                  value:
                    code: VALIDATION_FAILED
                    message: 'storage template: unknown variable "category"'
                    details:
                      fields:
                        - template
                traversal:
                  value:
                    code: VALIDATION_FAILED
                    message: 'storage template: rendered path carries the traversal segment ".."'
                    details:
                      fields:
                        - template
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: |
            The template passed the validation but the write failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/settings/trash:
    get:
      operationId: getTrashSettings
      tags:
        - admin
      summary: Read the trash retention setting.
      description: |
        The trash settings read of the admin surface: the instance's
        trash retention in whole days -- the window a soft-deleted
        asset stays recoverable before the hourly expiry job purges
        it (rows, thumbnails, derivatives and orphaned files
        together). A fresh instance (or a corrupt row) answers the
        default 30; the read never fails over a row the save
        endpoint's validation should have kept honest.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The instance's trash retention in days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashSettingsResponse'
              examples:
                default:
                  summary: An instance running on the default.
                  value:
                    retentionDays: 30
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateTrashSettings
      tags:
        - admin
      summary: Save the trash retention setting.
      description: |
        The trash settings save of the admin surface. The retention
        is a whole number of days, 0 to 365:

        - **0 means immediate permanent delete** -- an asset enters
        the trash and the NEXT expiry run purges it (the hourly
        periodic job and the boot run are the runs; nothing is
        deleted by the save request itself).
        - The expiry job reads the setting at the START of each run
        (the boot run and every hourly periodic run alike), so a
        change takes effect for the next run's window, not
        retroactively for rows a past run already considered.
        - An already-trashed asset's fate is decided by the run's
        own deadline computation: with a SHORTENED retention, rows
        past the new window leave on the next run; with a LENGTHENED
        one, every row gains the added days from its own deletion
        mark.

        The save validates the bound and answers the saved value; a
        value outside 0-365 answers 400 VALIDATION_FAILED naming
        `retentionDays`, and nothing is written.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashSettingsUpdateRequest'
            examples:
              immediate:
                summary: 'Zero retention: the trash becomes a straight delete.'
                value:
                  retentionDays: 0
              year:
                summary: A full year of recoverability.
                value:
                  retentionDays: 365
      responses:
        '200':
          description: The retention was saved; the response carries it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashSettingsResponse'
              examples:
                saved:
                  summary: The freshly saved retention.
                  value:
                    retentionDays: 14
        '400':
          description: |
            The retention is not a whole number of days within 0 to
            365, or the body is not valid JSON. The details name
            `retentionDays`; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outOfRange:
                  value:
                    code: VALIDATION_FAILED
                    message: retentionDays must be between 0 and 365
                    details:
                      fields:
                        - retentionDays
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: The validated retention could not be written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/settings/transcoding:
    get:
      operationId: getTranscodingSettings
      tags:
        - admin
      summary: Read the video transcoding settings.
      description: |
        The transcoding settings read of the admin surface: the
        instance's video transcoding profile -- the preset the
        transcode job re-encodes new video uploads at, the
        concurrency bound of simultaneous re-encodes, the
        video-thumbnail frame capture switch, and the
        keep-original-on-failure policy. A fresh instance (or a
        corrupt row) answers the documented defaults.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The instance's video transcoding profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodingSettingsResponse'
              examples:
                default:
                  summary: An instance running on the defaults.
                  value:
                    preset: auto
                    concurrency: 2
                    thumbnailFrame: true
                    keepOriginal: true
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateTranscodingSettings
      tags:
        - admin
      summary: Save the video transcoding settings.
      description: |
        The transcoding settings save of the admin surface.

        **The scope pin, documented honestly: the profile affects
        NEW ingests only.** The transcode job of a video upload
        reads the profile when it runs, so a saved change governs
        every video uploaded after it; videos already transcoded
        keep their existing playable copy and are never re-encoded,
        and a video whose job is still queued picks up the profile
        at its run time (the job reads the setting at run time, not
        enqueue time).

        The fields: `preset` bounds the re-encode's vertical
        resolution (`auto` keeps the source resolution, the numeric
        presets scale down to the bound, `off` skips the re-encode
        entirely -- the original file stays in place and
        downloadable, and the video's pipeline still completes);
        `concurrency` bounds how many re-encodes run at once;
        `thumbnailFrame` turns the video poster-frame capture (the
        video's thumbnail) on or off; `keepOriginal` decides the
        failure policy -- a failed re-encode either completes the
        job quietly (the original stays in place and downloadable
        through the original endpoint) or fails it for retry.

        The save validates every field against its enum and answers
        the saved profile; an out-of-enum value answers 400
        VALIDATION_FAILED naming the field, and nothing is written.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscodingSettingsUpdateRequest'
            examples:
              spaceSaving:
                summary: A space-conscious profile.
                value:
                  preset: 720p
                  concurrency: 1
                  thumbnailFrame: true
                  keepOriginal: false
              originalOnly:
                summary: Store originals without re-encoding.
                value:
                  preset: 'off'
                  concurrency: 2
                  thumbnailFrame: true
                  keepOriginal: true
      responses:
        '200':
          description: |
            The profile was saved; the response carries the saved
            value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodingSettingsResponse'
              examples:
                saved:
                  summary: The freshly saved profile.
                  value:
                    preset: 720p
                    concurrency: 1
                    thumbnailFrame: true
                    keepOriginal: false
        '400':
          description: |
            A field is outside its enum (`preset`, `concurrency`) or
            the body is not valid JSON. The details name the
            offending field; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badPreset:
                  value:
                    code: VALIDATION_FAILED
                    message: preset must be one of auto, 1080p, 720p, 480p, off
                    details:
                      fields:
                        - preset
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: The validated profile could not be written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/settings/update-check:
    get:
      operationId: getUpdateCheckSettings
      tags:
        - admin
      summary: Read the release check settings.
      description: |
        The release check's three knobs, as the settings face renders
        them: the switch, the release feed URL and the cadence in
        hours.

        `endpoint` is the URL the server fetches on every check. The
        document behind it must be a JSON object whose newest tag
        rides `tag` (a release feed that names it `tag_name`, as
        release APIs commonly do, is read the same way). The value
        is handed back verbatim; the default is the product's own
        release feed.

        `intervalHours` is the cadence: the server probes at most
        once per interval, and the answer is cached until the next
        one -- a failed probe waits the same interval instead of
        hammering a feed that is not there.

        A corrupt settings row answers the documented defaults
        (enabled, the default feed, 24 hours) with the corruption
        logged server-side, the same discipline the other instance
        settings keep.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The release check's settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckSettingsResponse'
              examples:
                defaults:
                  summary: The shipped defaults.
                  value:
                    enabled: true
                    endpoint: https://api.github.com/repos/welpher/lumemor/releases/latest
                    intervalHours: 24
                switchedOff:
                  summary: The check switched off.
                  value:
                    enabled: false
                    endpoint: https://api.github.com/repos/welpher/lumemor/releases/latest
                    intervalHours: 24
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
    put:
      operationId: updateUpdateCheckSettings
      tags:
        - admin
      summary: Save the release check settings.
      description: |
        The settings save: all three fields are required (an omitted
        `enabled` would decode as the disabled switch, silently
        turning the check off), and each is validated before
        anything is written.

        `endpoint` must be an `http` or `https` URL with a host --
        the address the server will probe. The probe itself refuses
        addresses that resolve to loopback, private, link-local or
        otherwise internal ranges, and never follows a redirect:
        the setting can be saved pointing at an internal host, and
        the check simply stays `unknown` (the settings save does not
        probe, so it cannot judge reachability).

        A failed validation answers 400 `VALIDATION_FAILED` naming
        the offending field, with nothing written. A saved value
        takes effect from the next scheduled check on; the manual
        check runs against the saved value immediately.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCheckSettingsUpdateRequest'
            examples:
              dailyDefaultFeed:
                summary: Daily checks against the product feed.
                value:
                  enabled: true
                  endpoint: https://api.github.com/repos/welpher/lumemor/releases/latest
                  intervalHours: 24
              hourlyMirror:
                summary: Hourly checks against a self-hosted mirror.
                value:
                  enabled: true
                  endpoint: https://releases.example.net/lumemor/latest.json
                  intervalHours: 1
      responses:
        '200':
          description: The validated settings were saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckSettingsResponse'
              examples:
                saved:
                  summary: The freshly saved settings.
                  value:
                    enabled: true
                    endpoint: https://releases.example.net/lumemor/latest.json
                    intervalHours: 1
        '400':
          description: |
            A field is missing, `endpoint` is not an absolute
            `http`/`https` URL, or `intervalHours` is outside 1-168.
            The details name the offending field; nothing was
            written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badEndpoint:
                  value:
                    code: VALIDATION_FAILED
                    message: endpoint must be an absolute http or https URL
                    details:
                      fields:
                        - endpoint
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: The validated settings could not be written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
  /admin/settings/tiles:
    get:
      operationId: getTilesSettings
      tags:
        - admin
      summary: Read the map tile source setting.
      description: |
        The map's tile sources, as the administrator configured them:
        the light style every theme loads as its fallback, and the
        optional dark style the dark theme loads instead. Either is
        the empty string when the instance has none.

        THE SHAPE: each URL names a document the browser's map
        library can build a base layer from -- a style document (the
        vector case: sources, layers, sprites and glyphs) or a
        TileJSON descriptor (the raster case: the tile templates and
        their attribution). The map detects which of the two it
        received and builds the base layer accordingly, so each field
        covers both the raster and the vector-and-style forms of the
        self-hosting ecosystem.

        THE DARK STYLE IS OPTIONAL: an empty `darkTilejsonUrl` means
        the dark theme reuses the light source, so a single source
        keeps a single look in both themes. A configured one is
        loaded by the dark theme only; the light theme always loads
        `tilejsonUrl`. A row written before the field existed reads
        as the empty string.

        THE EMPTY VALUE IS THE SHIPPED DEFAULT and a real state: no
        source ships with the product (a public tile service's usage
        policy forbids carrying the traffic of every install), so a
        fresh instance draws its map with the tile layer absent and
        says so. Loading the document needs the host to send the
        usual cross-origin headers; a host that does not lands on the
        same stated absence.

        A corrupt settings row answers the empty strings with the
        corruption logged server-side.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The configured tile sources, or the empty strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TilesSettingsResponse'
              examples:
                pair:
                  summary: A self-hosted raster TileJSON with its dark style.
                  value:
                    tilejsonUrl: https://tiles.example.net/osm/tilejson.json
                    darkTilejsonUrl: https://tiles.example.net/osm-dark/tilejson.json
                    gcj02: false
                    darkGcj02: false
                lightOnly:
                  summary: One source for both themes (the dark style is empty).
                  value:
                    tilejsonUrl: https://tiles.example.net/osm/tilejson.json
                    darkTilejsonUrl: ''
                    gcj02: false
                    darkGcj02: false
                chinaBasemap:
                  summary: A GCJ-02 basemap (Amap) in the light theme.
                  value:
                    tilejsonUrl: https://webrd01.is.autonavi.com/appmaptile?style=7&x={x}&y={y}&z={z}
                    darkTilejsonUrl: ''
                    gcj02: true
                    darkGcj02: false
                unconfigured:
                  summary: 'The shipped state: no source configured.'
                  value:
                    tilejsonUrl: ''
                    darkTilejsonUrl: ''
                    gcj02: false
