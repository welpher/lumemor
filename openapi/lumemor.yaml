                        grantedAt: '2026-11-05T09:30:00Z'
                    granted:
                      - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                    revoked: []
                    skipped:
                      - userId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f99
                        reason: invalid_account
        '400':
          description: |
            The request is invalid: the body is not valid JSON, the
            `audience` field is absent (an explicit empty array --
            "only me" -- is valid and required; the field must ride
            the body), or the list carries more than 200 ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                audienceMissing:
                  summary: The field must ride the body, even empty.
                  value:
                    code: VALIDATION_FAILED
                    message: audience is required
                    details:
                      fields:
                        - audience
                tooManyIds:
                  summary: Past the list bound.
                  value:
                    code: VALIDATION_FAILED
                    message: audience exceeds the limit of 200
                    details:
                      fields:
                        - audience
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller can see the album but is not its owner (an
            album shared to the caller): the share is view-only, so
            editing the audience is an honest authorization failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                viewerWrite:
                  value:
                    code: AUTH_FORBIDDEN
                    message: only the album's owner may edit its audience
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, or it is a sync album (the caller's own
            included) -- indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /albums/{albumId}/rescan:
    post:
      operationId: rescanAlbum
      tags:
        - albums
      summary: Start one rescan of a directory album's source.
      description: |
        The rescan trigger: one run that walks the directory
        album's source root on the server and reconciles the album's
        membership with what the filesystem holds. The walk never
        follows symlinks -- a symlinked entry is skipped, a symlinked
        subdirectory is never descended -- and each walk entry and
        each live member resolves through exactly one arm of the
        three-arm diff:

        - a file on disk no live member matches is ADDED by
          reference-style ingest: a new asset row
          (`storage_kind` `external`, `file_path` the file's real
          absolute path, zero copy zero move) and its album
          membership land in one transaction, and the existing
          pipeline jobs (metadata, thumbnail, and for a video the
          transcode) run over that file exactly like an
          upload's. An owner+checksum duplicate of content the owner
          already holds never creates a second row: a live duplicate
          gains the album membership, a trashed duplicate is left
          alone (no revival semantics).
        - a live member whose file is gone from disk is marked
          `deleted_at` directly (the orphan arm's pinned semantics:
          the file is not the server's and the trash has no meaning
          for it) -- no missing state, no revival. If the file
          returns, the next scan's add arm ingests it as a NEW row.
        - a member whose mtime+size snapshot changed has its
          checksum re-read and stored, the snapshot re-stamped, and
          its metadata pipeline re-run (EXIF re-extracted, thumbnail
          regenerated, the playable copy of a video re-encoded); the
          ML arm follows the pipeline's own re-run path, which does
          not re-fire -- readiness is already stamped.

        The run's `job_runs` row (`kind` `album_rescan`, carrying
        the album's id) surfaces progress the way the places
        re-resolution run does: `job.started` / `job.progress` /
        `job.finished` on the activity stream, `total`/`done`
        counting resolved walk entries plus vanished members and
        `failed` the entries the run could not resolve. The
        idempotent rescan is the pinned contract: a second run over
        an unchanged directory performs zero asset writes and
        publishes zero asset events (the run's own `job_runs`
        bookkeeping is the progress surface, not product state).

        The endpoint is idempotent the way the places
        re-resolution is, scoped to the album: a rescan of THIS
        album still in flight (`queued` or `running`) answers 200
        with its identifier and starts nothing; another album's
        rescan never blocks this one.

        Permission is the album writes' own: the owner (or an
        administrator) proceeds, a sharee answers the honest 403,
        everyone else folds into the album 404. A non-directory
        album -- the caller's own sync album, a memory album --
        answers the same 404: the rescan is the directory album's
        own flow (a memory holds references to photos that live
        elsewhere -- there is no source to walk), and ids stay
        unproammable.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the directory album to rescan.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            A rescan of this album is already in flight (`queued` or
            `running`); its identifier is returned and NO new run is
            created or enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumRescanResponse'
              examples:
                inFlight:
                  summary: The run currently scanning this album.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '202':
          description: |
            The rescan run was created (state `queued`) and its job
            enqueued. The worker flips the run to `running` when the
            walk begins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumRescanResponse'
              examples:
                started:
                  summary: The freshly created run.
                  value:
                    jobRunId: 0192f8a1-0b1c-2d3e-4f5a-6b7c8d9e0f10
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller can see the album but is not its owner (an
            album shared to the caller): the share is view-only, so
            starting a rescan is an honest authorization failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                viewerWrite:
                  value:
                    code: AUTH_FORBIDDEN
                    message: only the album's owner may rescan it
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, it is a sync album, or it is not a directory
            album (a memory album) -- indistinguishable by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: |
            The run could not be started: no job queue is wired to
            the API surface, or creating the run failed. The run
            itself, once started, reports its own failures through
            its `job_runs` row (state `failed`) -- an unreadable or
            vanished source root closes the run failed, never the
            membership silently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: the rescan could not be started
  /albums/{albumId}/timeline-preference:
    put:
      operationId: setAlbumTimelinePreference
      tags:
        - albums
      summary: Set the caller's timeline preference of one album.
      description: |
        Upserts the calling user's per-user timeline preference of
        one album: the `user_album_prefs` row keyed
        (userId, albumId) whose `inTimeline` switch says whether the
        album feeds the caller's aggregated timeline. The preference
        is the CALLER's own state over an album they can see --
        self-affecting only, which is why these writes publish no
        event: the caller's own response is the only view that
        changed, and no other session has anything to refetch.
        The scope is the albums whose membership a caller could want
        out of their timeline feed: the caller's own `directory`
        albums, and every album shared to the caller (whatever the
        owner's type). Two kinds of album answer 400 instead, with
        the `album_pref_not_excludable` message key in the details:

        - the caller's own `sync` album: it IS the core stream, and
          the core stream is never excludable (the aggregation
          formula exempts the sync arm from the preference row --
          a stray row there excludes nothing);
        - the caller's own `memory` albums: they never feed the
          caller's own timeline at all (in-stream curation would be
          pure duplication), so there is nothing to exclude.

        An album the caller cannot see -- unknown, another account's
        unshared album, a revoked share -- answers the same
        byte-identical 404 `ALBUM_NOT_FOUND` as every album face, so
        album ids cannot be probed for existence through this
        endpoint. There is no administrator override: the
        preference is always the caller's own row over their own
        view, never a write onto another account's state.

        `inTimeline` is required and must be a JSON boolean: a body
        that is not valid JSON, or one without the field, answers
        400 `VALIDATION_FAILED`. The write is an upsert: repeating
        it with the same value converges to the same row, and
        repeating it with the other value flips the switch -- the
        response always carries the stored state.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the album.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumTimelinePreferenceRequest'
            examples:
              excludeFromTimeline:
                summary: Keep the album's items out of the timeline.
                value:
                  inTimeline: false
              includeAgain:
                summary: Feed the timeline again.
                value:
                  inTimeline: true
      responses:
        '200':
          description: |
            The stored preference: the album and the switch as the
            row now carries it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumTimelinePreferenceResponse'
              examples:
                excluded:
                  value:
                    albumId: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6073
                    inTimeline: false
        '400':
          description: |
            The request is not a well-formed preference: the body is
            not valid JSON or carries no `inTimeline`; or the album
            is not excludable from the caller's timeline (the
            caller's own sync or own memory album, the
            `album_pref_not_excludable` message key in the details).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationFailed:
                  summary: The body carries no switch.
                  value:
                    code: VALIDATION_FAILED
                    message: request body must be valid JSON
                    details:
                      fields:
                        - body
                notExcludable:
                  summary: The caller's own sync album.
                  value:
                    code: VALIDATION_FAILED
                    message: this album cannot be excluded from the timeline
                    details:
                      key: album_pref_not_excludable
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, or the share was revoked -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: resetAlbumTimelinePreference
      tags:
        - albums
      summary: Reset the caller's timeline preference of one album.
      description: |
        Removes the calling user's preference row of one album: the
        album returns to the default state of feeding the caller's
        timeline (a missing row means kept in). The eligibility
        scope is the PUT's own -- the caller's own directory albums
        and the albums shared to the caller; the same 400
        `album_pref_not_excludable` answers the caller's own sync
        and own memory albums, and the same single-shape 404
        answers an album the caller cannot see.

        The delete is idempotent: an album with no preference row
        (never set, or already reset) still answers 204 -- the row
        is gone either way, which is the state the caller asked for.
        Like the PUT it publishes no event: the preference is the
        caller's own state, and no other session has anything to
        refetch.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: albumId
          in: path
          required: true
          description: Identifier of the album.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: |
            The preference row is gone; the album feeds the caller's
            timeline again (or never stopped).
        '400':
          description: |
            The album is not excludable from the caller's timeline:
            the caller's own sync or own memory album
            (`album_pref_not_excludable` in the details).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notExcludable:
                  value:
                    code: VALIDATION_FAILED
                    message: this album cannot be excluded from the timeline
                    details:
                      key: album_pref_not_excludable
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '404':
          description: |
            No such album for this caller: the id is unknown, the
            album belongs to another account without a share to the
            caller, or the share was revoked -- indistinguishable by
            design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                albumNotFound:
                  value:
                    code: ALBUM_NOT_FOUND
                    message: no such album for this caller
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /memories:
    post:
      operationId: createMemory
      tags:
        - albums
      summary: Create one memory.
      description: |
        Creates one memory owned by the calling user: a reference
        set the owner curates photos into -- the photos themselves
        live in the albums they were ingested through, the memory
        holds references to them. The request carries a title and
        an audience, nothing else: a memory owns no `rootPath` (no
        source to name -- the directory album's own field is absent
        from this request and from the memory's every response
        shape), no deletability switch (a memory's delete never
        moves files), and no timeline switch (a memory never feeds
        its creator's own timeline, so there is nothing to switch).

        EVERY member may create. Curation is personal expression,
        not configuration: a memory names no filesystem location,
        touches no source, and borrows nothing but photos the
        creator already sees -- the exact opposite gate of the
        directory album's administrator-only creation. Any signed-in
        account's POST succeeds; there is no role check to refuse.

        The title is trimmed and must span 1-64 Unicode characters
        (the count is over runes, so multi-byte titles stay within
        the bound at the same length).

        `audience` is the memory's audience, the full grantee set of
        view ACL rows the creation lands in the same request:
        absent (or empty) means "only me". Its semantics are the
        audience write's: every id that cannot be granted -- an
        unknown or disabled account, or the caller's own id (the
        owner sees the memory by construction) -- is skipped,
        never an error, and the response's `skipped` list reports
        each with its reason.

        The memory is born out of its creator's aggregated
        timeline: the creation writes the creator's own timeline
        preference row (`inTimeline: false`) in the same write, so
        the aggregate never feeds the memory's photos whatever
        future arms admit. The exclusion is the creator's own --
        the audience members' feeds are governed by their own
        preference rows, never by this write.

        The response is the created memory's wall card -- the
        summary exactly as `GET /albums` lists it: `callerRole`
        `owner`, `type` `memory`, an empty `coverAssetIds` array
        (never null), `itemCount` 0 and `photoCount` 0 (nothing is a
        member yet), no `inTimeline` field (an own memory card omits
        it) -- widened
        with the honest audience report. The write publishes one
        `album.created` event and one `album.shared` event per
        audience row that landed.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreateRequest'
            examples:
              titled:
                summary: A titled memory with an initial audience.
                value:
                  title: Road trip 2026
                  audience:
                    - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
              bare:
                summary: The minimal creation, title only.
                value:
                  title: Quick picks
      responses:
        '201':
          description: |
            The memory exists; the response is its wall card (the
            creation-time zeros: no member, no cover) with the
            honest audience report. The grants that landed are the
            request's usable ids; the `skipped` entries are the rest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryCreateResponse'
              examples:
                freshMemory:
                  summary: The freshly created memory, one grantee landed.
                  value:
                    id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f60a1
                    title: Road trip 2026
                    type: memory
                    isShared: true
                    coverAssetIds: []
                    itemCount: 0
                    photoCount: 0
                    updatedAt: '2026-11-11T10:15:00Z'
                    callerRole: owner
                    skipped: []
                skippedAudience:
                  summary: The creation landed, one requested audience id did not.
                  value:
                    id: 0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f60a2
                    title: Road trip 2026
                    type: memory
                    isShared: false
                    coverAssetIds: []
                    itemCount: 0
                    photoCount: 0
                    updatedAt: '2026-11-11T10:15:00Z'
                    callerRole: owner
                    skipped:
                      - userId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f99
                        reason: invalid_account
        '400':
          description: |
            The request is invalid: the body is not valid JSON, the
            title is missing, empty, whitespace-only or spans more
            than 64 characters, or the audience carries more than
            200 ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                titleTooLong:
                  summary: A title past the bound.
                  value:
                    code: VALIDATION_FAILED
                    message: title must span 1-64 characters
                    details:
                      fields:
                        - title
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /people:
    get:
      operationId: listPeople
      tags:
        - people
      summary: The caller's named people.
      description: |
        The named region of the people surface: every face cluster
        the caller sees that carries one of the caller's own labels.
        A cluster is listed here when both hold:

        - it contains at least one face on an asset visible to the
          caller (an asset the caller can see that is live -- not
          trashed, not archived, no Live Photo component row: their
          own, or one shared to them through an album), and
        - the caller has labeled it with a `user_face_labels` row of
          their own.

        The per-user-state semantics of the people domain: face clusters are
        GLOBAL structures of the instance (the same person's faces
        land in one cluster whatever account uploaded the photos),
        while names are PRIVATE per user -- two accounts label the
        same cluster independently and neither sees the other's
        label. The people domain has exactly two states: named (this
        list) and unnamed (`GET /people/unnamed`). There is no third
        state: hiding a person retired whole (the per-user switch,
        its badge and its events are gone; removing the caller's
        name -- `DELETE /people/{clusterId}/label` -- is the way a
        person leaves this list).

        `photoCount` is honest per caller: the number of DISTINCT
        live assets the cluster has a face on that the caller can
        see, so the same cluster can show different counts to
        different accounts. It counts photos, not faces -- two faces
        of one person in one photo are one photo.

        The list is sorted by name, case-insensitively, with the
        cluster id as the tiebreak.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The caller's named people, sorted by name (case-
            insensitive, cluster id as the tiebreak). The array is
            empty when the caller has labeled no cluster they can
            see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonSummary'
              examples:
                twoPeople:
                  summary: Two labeled clusters.
                  value:
                    - clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
                      name: Ada
                      photoCount: 9
                      representativeFaceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
                      thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
                    - clusterId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f72
                      name: Grace
                      photoCount: 2
                      representativeFaceId: 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f73
                      thumbnail: /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f73/thumbnail
                empty:
                  summary: Nothing labeled yet.
                  value: []
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /people/unnamed:
    get:
      operationId: listUnnamedPeople
      tags:
        - people
      summary: The caller's unnamed face clusters, one keyset page at a time.
      description: |
        The unnamed region of the people surface: every face cluster
        that contains at least one face on an asset visible to the
        caller (an asset the caller can see that is live -- not
        trashed, not archived, no Live Photo component row: their own,
        or one shared to them through an album) and carries NO
        `user_face_labels` row of the caller. The moment the caller
        labels a cluster it moves to `GET /people` and out of this
        list; another account's label never moves it for this
        caller (clusters are global, labels are private per
        user).

        Pages are keyset-paginated with an opaque cursor over the
        ordering `faceCount` descending, `clusterId` descending as
        the tiebreak. The continuation key is the (faceCount,
        clusterId) pair of a page's last row -- the same row-value
        predicate pattern the timeline endpoint applies to its
        (takenAt, id) pair, which keeps pages stable while clusters
        gain or lose faces. The response carries `nextCursor` exactly
        when another page exists; the first page omits the `cursor`
        parameter.

        `totalCount` is the caller's whole unnamed region -- every
        cluster this listing would walk -- so a page never has to be
        walked to its end to count the region (the people list's
        unnamed entry badge and this page's own bar count read it).

        `limit` bounds the page size: absent means the default of
        60; a value below 1 or over 200 answers 400
        `VALIDATION_FAILED`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page; absent on the
            first page. An unparseable value answers 400
            `VALIDATION_FAILED` (cursors are opaque strings produced
            by this endpoint, never assembled by clients).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |
            Page size: the number of cluster summaries one response
