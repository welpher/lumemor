  /admin/settings/run-budget:
    get:
      operationId: getRunBudgetSettings
      tags:
        - admin
      summary: Read the background work's budget.
      description: |
        The task panel's run-settings document: the three dials that
        decide WHEN the background work spends the machine's
        capacity --

        - `concurrencyPreset`: the dial's three steps, `light`
          (one job at a time), `standard` (half the cores) and `full`
          (all but one core). The panel never asks for a NUMBER: a
          NAS owner does not know what to type, so the dial speaks in
          steps and the mapping is the honest explanation line.
        - `nightlyEnabled` with `nightlyStart`/`nightlyEnd`: the night
          window (shipped 02:00-06:00, off). While it is on, the HEAVY
          work -- derivative rebuilds, video transcodes, model
          recomputation -- runs only inside it; a window that ends
          stops the work at the asset it just finished and the next
          window resumes from there. A window that spans midnight
          (start after end) is a legal shape. Uploads and browsing
          are NEVER held by the window -- they are foreground work,
          not background jobs.
        - `pausedJobs`: the five per-kind pause switches
          (thumbnails, metadata, transcode, machine learning, place
          resolution). A paused kind's NEW jobs sit held; the one
          already running finishes. Uploads of a paused kind enqueue
          without being blocked -- the request never waits, the job
          does.

        Both the concurrency preset and the pauses take effect
        immediately: every job reads this document when it starts,
        so a save changes what the NEXT job sees, and a held job
        wakes within the hold's own granularity to re-read it.

        A corrupt settings row answers the defaults with the
        corruption logged server-side.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The current run budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunBudgetSettingsResponse'
              examples:
                shippedDefaults:
                  summary: 'The shipped posture: standard dial, no window, nothing paused.'
                  value:
                    concurrencyPreset: standard
                    nightlyEnabled: false
                    nightlyStart: '02:00'
                    nightlyEnd: '06:00'
                    pausedJobs:
                      thumbnail: false
                      metadata: false
                      transcode: false
                      ml: false
                      places: false
                nightShift:
                  summary: 'The quiet-night posture: the window on, thumbnails held.'
                  value:
                    concurrencyPreset: light
                    nightlyEnabled: true
                    nightlyStart: '01:30'
                    nightlyEnd: '05:30'
                    pausedJobs:
                      thumbnail: true
                      metadata: false
                      transcode: false
                      ml: false
                      places: false
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
    put:
      operationId: updateRunBudgetSettings
      tags:
        - admin
      summary: Save the background work's budget.
      description: |
        The budget save. Every field is contract-required (an omitted
        one would decode as its zero value and silently change the
        posture), and each value is checked: the concurrency preset
        against its three-step enum, the two times against the
        `HH:MM` form, and the five pause switches against booleans.

        The two times must differ: an equal pair would define a
        zero-length window, which reads as a window that never opens
        -- turning the window OFF is the honest way to say that, so
        the save refuses the ambiguous shape.

        The save takes effect immediately, without a restart: the
        next job a worker picks up reads the fresh document, and a
        job already held wakes within its hold granularity and
        re-reads. The switches never touch a job already running --
        the one in flight finishes, which is the card's own
        headline.

        The window and the pauses NEVER gate an upload or a serving
        request: they are worker-side facts. The upload path
        enqueues without consulting them, and the browser's reads
        are answered whatever the budget says.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunBudgetSettingsUpdateRequest'
            examples:
              shippedDefaults:
                summary: The shipped posture, saved back whole.
                value:
                  concurrencyPreset: standard
                  nightlyEnabled: false
                  nightlyStart: '02:00'
                  nightlyEnd: '06:00'
                  pausedJobs:
                    thumbnail: false
                    metadata: false
                    transcode: false
                    ml: false
                    places: false
              nightShift:
                summary: The quiet-night posture.
                value:
                  concurrencyPreset: light
                  nightlyEnabled: true
                  nightlyStart: '01:30'
                  nightlyEnd: '05:30'
                  pausedJobs:
                    thumbnail: true
                    metadata: false
                    transcode: false
                    ml: false
                    places: false
      responses:
        '200':
          description: The saved budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunBudgetSettingsResponse'
              examples:
                saved:
                  summary: The save's own answer.
                  value:
                    concurrencyPreset: light
                    nightlyEnabled: true
                    nightlyStart: '01:30'
                    nightlyEnd: '05:30'
                    pausedJobs:
                      thumbnail: true
                      metadata: false
                      transcode: false
                      ml: false
                      places: false
        '400':
          description: |
            A required field is missing, a value is outside its enum,
            a time is not `HH:MM`, or the two times are equal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingField:
                  value:
                    code: VALIDATION_FAILED
                    message: 'required fields missing: nightlyStart'
                invalidPreset:
                  value:
                    code: VALIDATION_FAILED
                    message: concurrencyPreset must be one of light, standard, full
                invalidTime:
                  value:
                    code: VALIDATION_FAILED
                    message: nightlyStart must be a HH:MM time
                equalTimes:
                  value:
                    code: VALIDATION_FAILED
                    message: nightlyStart and nightlyEnd must differ
        '401':
          description: |
            Authentication is missing or no longer valid: the cookie
            or bearer token is absent, expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: AUTH_INVALID_CREDENTIALS
                    message: authentication required
        '403':
          description: |
            The caller is authenticated but their role is not
            `admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: administrator role required
        '500':
          description: The validated setting could not be written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal:
                  value:
                    code: INTERNAL
                    message: internal server error
components:
  schemas:
    LoginRequest:
      type: object
      description: Credentials of `POST /auth/login`.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Login address of the account.
        password:
          type: string
          format: password
          description: Account password; never echoed in any response.
          examples:
            - correct horse battery staple
    SessionInfo:
      type: object
      description: |
        One authenticated session of a user. Web sessions authenticate
        through the `lumemor_session` cookie and mobile sessions
        through their bearer token; both are the same session records
        and appear together in `GET /auth/sessions`.

        The session carries its user's identity: `userId` and `role`
        name whose credentials this is, so a client that restores a
        session (a web app booting with the cookie, a mobile app
        resuming with its bearer token) knows who is calling without a
        second endpoint. `POST /auth/login`, `GET /auth/sessions` and
        `POST /auth/pairing/consume` all answer this schema, so the
        identity arrives at login time, at restore time and at pairing
        time alike. The role is the live account row's, read through
        the session's own user join.
      required:
        - id
        - kind
        - userId
        - role
        - createdAt
        - lastSeenAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the session.
        kind:
          type: string
          description: |
            Where the session credential lives: `web` sessions ride
            the `lumemor_session` cookie and slide their expiry by 30
            days on use; `mobile` sessions ride a bearer token and are
            revoked explicitly.
          enum:
            - web
            - mobile
        deviceName:
          type: string
          description: |
            Human-readable device label of the session. For web
            sessions it is the browser user agent captured at login;
            mobile sessions carry the name supplied during pairing.
        userId:
          type: string
          format: uuid
          description: |
            UUIDv7 identifier of the account the session belongs to.
            Every entry of `GET /auth/sessions` carries the caller's
            own id (the list is the caller's sessions); the caller is
            who the client compares asset and album ownership against.
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          description: When the session was created (RFC 3339 UTC).
        lastSeenAt:
          type: string
          format: date-time
          description: When the session was last used (RFC 3339 UTC).
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the session expires (RFC 3339 UTC). Null for bearer
            sessions, which are revoked explicitly instead of
            expiring.
    PairingTokenResponse:
      type: object
      description: The one-time pairing token issued by `POST /auth/pairing/token`.
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: |
            One-time pairing secret, 128 random bits as a URL-safe
            string. Render it as a QR code and never store or log it;
            the server keeps only its hash.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the token expires (RFC 3339 UTC); five minutes after
            issuance.
    PairingConsumeRequest:
      type: object
      description: Payload of `POST /auth/pairing/consume`.
      required:
        - token
        - deviceName
        - deviceId
      properties:
        token:
          type: string
          description: The pairing token read from the QR code.
        deviceName:
          type: string
          description: |
            Human-readable device label shown in the session list,
            for example `Pixel 9`.
        deviceId:
          type: string
          description: |
            Stable client-generated identifier of the physical device,
            for example a UUID the app persists; it lets the server
            recognize the same device across pairings.
    BearerSession:
      type: object
      description: |
        The mobile session minted by consuming a pairing token: the
        bearer credential plus the session it authenticates.
      required:
        - token
        - session
      properties:
        token:
          type: string
          description: |
            Bearer credential of the new mobile session; send it as
            `Authorization: Bearer <token>`. It appears only in this
            response, and the server stores only its hash: a device
            that loses it must pair again.
        session:
          $ref: '#/components/schemas/SessionInfo'
    ServerInfo:
      type: object
      description: Instance capability report served by `GET /server/info`.
      required:
        - version
        - initialized
        - features
      properties:
        version:
          type: string
          description: Server version (semantic versioning).
          examples:
            - 0.1.0
        initialized:
          type: boolean
          description: |
            True once the instance has an administrator account. Clients use
            it to decide between the first-run wizard and the login screen.
        features:
          type: object
          description: |
            Instance feature switches (model slots, search modes, pairing).
            Unknown keys must be ignored by clients.
          additionalProperties:
            type: boolean
          examples:
            - faces: true
              semanticSearch: true
    CreateAdminRequest:
      type: object
      description: Payload of the first-run wizard (`POST /server/setup/admin`).
      required:
        - email
        - password
      properties:
        name:
          type: string
          description: Optional display name; defaults to the email address.
        email:
          type: string
          format: email
          description: Login address of the administrator.
        password:
          type: string
          format: password
          description: Account password; stored only as an Argon2id hash.
          examples:
            - correct horse battery staple
    UserRole:
      type: string
      description: |
        Authorization role of an account: `admin` is granted by the
        first-run wizard or by another administrator, `user` is the
        default of every other creation path.
      enum:
        - admin
        - user
    AdminUserResponse:
      type: object
      description: |
        One account as the admin surface returns it: the identity and
        role columns together with the disabled switch this surface
        toggles. The password hash is never part of an admin
        response.
      required:
        - id
        - name
        - email
        - role
        - isDisabled
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
          description: Display name.
        email:
          type: string
          format: email
          description: Login address.
        role:
          $ref: '#/components/schemas/UserRole'
        isDisabled:
          type: boolean
          description: |
            The disabled switch. A disabled account loses the
            authority of its sessions and its sign-in until
            re-enabled; its data stays untouched.
        createdAt:
          type: string
          format: date-time
          description: Creation time (RFC 3339 UTC).
    AdminUserListResponse:
      type: object
      description: |
        The user management listing: every account of the instance,
        oldest first, in one bounded response.
      required:
        - items
      properties:
        items:
          type: array
          description: Every account of the instance, oldest first.
          items:
            $ref: '#/components/schemas/AdminUserResponse'
    AdminCreateUserRequest:
      type: object
      description: Payload of `POST /admin/users`.
      required:
        - email
        - password
      properties:
        name:
          type: string
          description: Optional display name; defaults to the email address.
        email:
          type: string
          format: email
          description: Login address of the new account; unique instance-wide.
        password:
          type: string
          format: password
          description: Account password; stored only as an Argon2id hash.
          examples:
            - correct horse battery staple
        role:
          $ref: '#/components/schemas/UserRole'
    AdminUserPatch:
      type: object
      description: Payload of `PATCH /admin/users/{id}`.
      required:
        - isDisabled
      properties:
        isDisabled:
          type: boolean
          description: |
            The switch to write. `true` locks the account out of its
            sessions and sign-in; `false` lets it back in.
    AdminUserDeleteRequest:
      type: object
      description: |
        Payload of `DELETE /admin/users/{id}`: the disposition of the
        departing account's photos. Exactly one of the two fields is
        present -- `transferTo` hands them to another member, and
        `dispose` walks them into the caller's trash.
      properties:
        transferTo:
          type: string
          format: uuid
          description: |
            Identifier of the account that receives every photo,
            album and memory the departing account owned. Must name
            another existing account: the departing account itself
            answers 409 USER_TRANSFER_TO_SELF, an unknown id 400
            VALIDATION_FAILED.
        dispose:
          type: string
          enum:
            - trash
          x-enum-varnames:
            - UserDisposeTrash
          description: |
            The alternative to `transferTo`: the departing account's
            photos enter the calling administrator's trash, where the
            instance's retention window governs their permanent
            removal.
    StorageSettingsResponse:
      type: object
      description: |
        The storage settings of `GET /admin/settings/storage` and the
        successful `PUT`: the instance's upload path template, the
        sample path it renders, and the built-in presets.
      required:
        - template
        - samplePath
        - presets
      properties:
        template:
          type: string
          description: |
            The template new uploads render their placement from. A
            fresh instance (or a corrupt row) answers the default
            `{{y}}/{{MM}}/{{filename}}`.
          examples:
            - '{{y}}/{{MM}}/{{filename}}'
        samplePath:
          type: string
          description: |
            The template rendered over the fixed sample asset with
            the extension appended, as a stored relative path --
            exactly the placement a real upload of the sample file
            would land at.
          examples:
            - originals/0192f8c1-0000-7000-8000-000000000001/2023/07/IMG_1234.jpg
        presets:
          type: array
          description: |
            The built-in preset templates, in the settings section's
            dropdown order: date nestings, album layouts, camera
            groupings, the type grouping, the asset-id fallback and
            the bare file name.
          minItems: 1
          items:
            type: string
          examples:
            - - '{{y}}/{{MM}}/{{filename}}'
              - '{{y}}/{{y}}-{{MM}}/{{filename}}'
    StorageSettingsUpdateRequest:
      type: object
      description: Payload of `PUT /admin/settings/storage`.
      required:
        - template
      properties:
        template:
          type: string
          description: |
            The template to validate and save. Must compile strictly,
            render over the sample asset set, and produce safe
            structure; 1 to 512 runes.
          minLength: 1
          maxLength: 512
          examples:
            - '{{y}}/{{MM}}/{{filename}}'
    UserTheme:
      type: string
      description: |
        The account's stored appearance preference for the client's
        color scheme. `auto` follows the device's system
        preference (the web app maps it to its `system` mode),
        `light` and `dark` are the manual choices. The value is
        declarative account state: a client that reads it applies it
        at sign-in, and the client performing the change applies it
        immediately.
      enum:
        - auto
        - light
        - dark
    UserLocale:
      type: string
      description: |
        The account's stored interface language. The values are the
        UI's installed locales -- the same table the web and mobile
        clients share -- and the list grows with that table: a
        locale file added to the i18n directory is a locale this
        enum admits next. Clients that cannot render a stored value
        fall back to their own default.
      enum:
        - en
        - zh-Hans
    DownloadFormat:
      type: string
      description: |
        The account's preferred archive format of batch and
        whole-album downloads.
      enum:
        - zip
        - tar
    UserSelfResponse:
      type: object
      description: |
        The caller's own account as the me-scoped user surface
        returns it: the identity fields of the profile section, the
        appearance pair, and the download preferences. The password
        hash is never part of any response.
      required:
        - id
        - name
        - email
        - role
        - theme
        - locale
        - downloadFormat
        - downloadIncludeVideos
        - downloadIncludeSidecars
        - downloadIncludeEmbeddedVideos
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the account.
        name:
          type: string
          description: Display name.
        email:
          type: string
          format: email
          description: Login address; unique instance-wide.
        role:
          $ref: '#/components/schemas/UserRole'
        theme:
          $ref: '#/components/schemas/UserTheme'
        locale:
          $ref: '#/components/schemas/UserLocale'
        downloadFormat:
          $ref: '#/components/schemas/DownloadFormat'
        downloadIncludeVideos:
          type: boolean
          description: |
            Whether the account's download packaging includes the
            original video files. Photos are the download's content
            and always ride along.
        downloadIncludeSidecars:
          type: boolean
          description: |
            Whether the account's download packaging includes EXIF
            sidecar files (`.xmp`) beside the media.
        downloadIncludeEmbeddedVideos:
          type: boolean
          description: |
            Whether a download adds the motion a single-file "motion
            photo" embeds as a separate video file. Default `false`:
            the still's original already carries that motion, so the
            extra copy is a duplicate unless the account asks for it.
            A paired Live Photo's own motion file always rides along
            and this switch never removes it.
    UserSelfPatch:
      type: object
      description: |
        Payload of `PATCH /users/me`. Every field is optional: an
        absent field keeps its stored value, a present one replaces
        it. At least one field must be present.
      minProperties: 1
      properties:
        name:
          type: string
          description: |
            The new display name; 1 to 100 runes after trimming (an
            empty name is refused -- the profile always carries one).
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          description: |
            The new login address, parsed and lower-cased like every
            creation path; an address another account already owns
            answers 409 USER_EMAIL_TAKEN.
        theme:
          $ref: '#/components/schemas/UserTheme'
        locale:
          $ref: '#/components/schemas/UserLocale'
        downloadFormat:
          $ref: '#/components/schemas/DownloadFormat'
        downloadIncludeVideos:
          type: boolean
          description: The download packaging's video switch.
        downloadIncludeSidecars:
          type: boolean
          description: The download packaging's sidecar switch.
        downloadIncludeEmbeddedVideos:
          type: boolean
          description: |
            The download packaging's embedded-motion switch (default
            false: the single-file motion photo's original already
            carries its motion).
    PasswordChangeRequest:
      type: object
      description: Payload of `PUT /users/me/password`.
      required:
        - current
        - next
      properties:
        current:
          type: string
          format: password
          description: |
            The account's current password; it must verify against
            the stored Argon2id hash before anything is written.
        next:
          type: string
          format: password
          description: The new password; 8 to 128 runes, stored as a fresh Argon2id hash.
          minLength: 8
          maxLength: 128
    DeviceSession:
      type: object
      description: |
        One of the caller's active sessions as the device list
        renders it: the row's identity and rendering fields, the
        `isCurrent` marker derived against the request's own
        credential, and the session's creation-time address.
      required:
        - id
        - kind
        - lastSeenAt
        - isCurrent
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the session.
        kind:
          type: string
          description: |
            Where the session credential lives: `web` sessions ride
            the `lumemor_session` cookie, `mobile` sessions ride a
            bearer token.
          enum:
            - web
            - mobile
        deviceName:
          type: string
          description: |
            Human-readable device label: the browser's user agent
            captured at login for web sessions, the name supplied
            during pairing for mobile ones.
        lastSeenAt:
          type: string
          format: date-time
          description: When the session was last used (RFC 3339 UTC).
        ipAddress:
          type: string
          description: |
            The address the session was created from (the login's or
            pairing exchange's socket peer), captured at creation
            time. Omitted when the row predates the column or no
            address was captured; an audit hint, not a geolocation
            claim.
          examples:
            - 192.168.1.100
        isCurrent:
          type: boolean
          description: |
            Whether this row is the session the request itself
            authenticates with -- the device the caller is managing
            from. Exactly one entry of a list carries `true`, and
            that entry cannot be revoked through
            `DELETE /users/me/sessions/{id}` (the sign-out flow is
            its exit).
    TrashSettingsResponse:
      type: object
      description: |
        The trash settings of `GET /admin/settings/trash` and the
        successful `PUT`: the instance's trash retention in whole
        days.
      required:
        - retentionDays
      properties:
        retentionDays:
          type: integer
          description: |
            The retention window of a soft-deleted asset in whole
            days, 0 to 365. A fresh instance (or a corrupt row)
            answers the default 30; 0 means the next expiry run
            purges everything trashed.
          minimum: 0
          maximum: 365
          examples:
            - 30
    TrashSettingsUpdateRequest:
      type: object
      description: Payload of `PUT /admin/settings/trash`.
      required:
        - retentionDays
      properties:
        retentionDays:
          type: integer
          description: The retention to save, in whole days, 0 to 365.
          minimum: 0
          maximum: 365
          examples:
            - 14
    TranscodePreset:
      type: string
      description: |
        The transcode job's re-encode preset for new video ingests:
        `auto` keeps the source resolution, the numeric presets
        scale down to the named vertical bound, and `off` skips the
        re-encode entirely (the original stays in place and
        downloadable; the video's pipeline still completes).
      enum:
        - auto
        - 1080p
        - 720p
        - 480p
        - 'off'
    TranscodingSettingsResponse:
      type: object
      description: |
        The transcoding settings of `GET /admin/settings/transcoding`
        and the successful `PUT`: the instance's video transcoding
        profile.
      required:
        - preset
        - concurrency
        - thumbnailFrame
        - keepOriginal
      properties:
        preset:
          $ref: '#/components/schemas/TranscodePreset'
        concurrency:
          type: integer
          description: |
            How many video re-encodes may run at once: 1 (low load),
            2 (the recommended default) or 4 (high load).
          enum:
            - 1
            - 2
            - 4
        thumbnailFrame:
          type: boolean
          description: |
            Whether the video thumbnail job captures a poster frame
            (the poster IS a video's thumbnail). Off skips the frame
            capture; the video's pipeline still completes.
        keepOriginal:
          type: boolean
          description: |
            The re-encode failure policy: on, a failed re-encode
            completes the job quietly and the original stays in
            place and downloadable; off, the job fails and retries.
      examples:
        - preset: auto
          concurrency: 2
          thumbnailFrame: true
          keepOriginal: true
    TranscodingSettingsUpdateRequest:
      type: object
      description: Payload of `PUT /admin/settings/transcoding`.
      required:
        - preset
        - concurrency
        - thumbnailFrame
        - keepOriginal
      properties:
        preset:
          $ref: '#/components/schemas/TranscodePreset'
        concurrency:
          type: integer
          description: 'The concurrency bound to save: 1, 2 or 4.'
          enum:
            - 1
            - 2
            - 4
        thumbnailFrame:
          type: boolean
          description: The poster-frame capture switch to save.
        keepOriginal:
          type: boolean
          description: The failure policy to save.
    UpdateCheckSettingsResponse:
      type: object
      description: |
        The release check's settings of `GET /admin/settings/update-check`
        and the successful `PUT`.
      required:
        - enabled
        - endpoint
        - intervalHours
      properties:
        enabled:
          type: boolean
          description: |
            The switch in force at the settings layer. `false` stops
            every scheduled and manual check; the cached answer is
            kept, so switching it back on resumes from the same
            state.
        endpoint:
          type: string
          description: |
            The release feed URL the server probes: a JSON document
            whose newest tag rides `tag` (or `tag_name`). The server
            fetches it with a bounded timeout, through the
            environment's forward proxy, refusing internal addresses
            and never following a redirect.
          examples:
            - https://api.github.com/repos/welpher/lumemor/releases/latest
        intervalHours:
          type: integer
          description: |
            The cadence in hours, 1-168: the server probes at most
            once per interval and caches the answer until the next
            one.
          minimum: 1
          maximum: 168
          examples:
            - 24
    UpdateCheckSettingsUpdateRequest:
      type: object
      description: Payload of `PUT /admin/settings/update-check`.
      required:
        - enabled
        - endpoint
        - intervalHours
      properties:
        enabled:
          type: boolean
          description: The switch to save.
        endpoint:
          type: string
          description: |
            The release feed URL to save: an absolute `http` or
            `https` URL with a host.
        intervalHours:
          type: integer
          description: The cadence to save, 1-168 hours.
          minimum: 1
          maximum: 168
    UpdateCheckStatus:
      type: string
      description: |
        The verdict of the release check. `up_to_date` and
        `update_available` are the two claims a successful tag
        comparison makes; `unknown` is the honest silence of a check
        that could not conclude (a failed probe, a feed that named
        nothing readable, a running version that is not a release
        tag); `disabled` means no check runs.
      enum:
        - disabled
        - unknown
        - up_to_date
        - update_available
    UpdateCheckResponse:
      type: object
      description: |
        The instance's release check state, served by
        `GET /server/update-check` and the manual `POST`.
      required:
        - enabled
        - status
        - currentVersion
        - latestVersion
        - checkedAt
      properties:
        enabled:
          type: boolean
          description: |
            Whether a check runs at all: both switches -- the
            settings switch and the deployment's own -- are open
            (neither one is off) for `true`; either one off answers
            `false`.
        status:
          $ref: '#/components/schemas/UpdateCheckStatus'
        currentVersion:
          type: string
          description: |
            The running server version -- the build's version
            string, verbatim (development builds report `dev`,
            which the comparison cannot rank; such an instance stays
            `unknown`).
          examples:
            - 0.4.1
            - dev
        latestVersion:
          type:
            - string
            - 'null'
          description: |
            The newest tag the feed named, verbatim including its
            `v` prefix, or null when no probe has succeeded yet.
          examples:
            - v0.5.0
        checkedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the last probe completed, successful or not; null
            before the first probe. The settings face renders it as
            the quiet "last checked" line when a probe failed.
    TilesSettingsResponse:
      type: object
      description: |
        The map tile sources of `GET /admin/settings/tiles` and the
        successful `PUT`: the light style plus the optional dark one,
        each empty when unconfigured.
      required:
        - tilejsonUrl
        - darkTilejsonUrl
        - gcj02
        - darkGcj02
      properties:
        tilejsonUrl:
          type: string
          description: |
            The light tile source URL: a style document (vector) or
            a TileJSON descriptor (raster), loaded by the browser in
            the light theme and in the dark theme when no dark style
            is configured. The empty string is the shipped state: no
            source, and the map draws its pins over the stated
            absence of a base layer.
          examples:
            - https://tiles.example.net/osm/tilejson.json
            - ''
        darkTilejsonUrl:
          type: string
          description: |
            The dark tile source URL, same shapes as the light one.
            The empty string means the dark theme reuses
            `tilejsonUrl` -- one source, one look in both themes. A
            configured value is loaded by the dark theme only.
          examples:
            - https://tiles.example.net/osm-dark/tilejson.json
            - ''
        gcj02:
          type: boolean
          description: |
            The light source's coordinate system: `true` when its
            basemap draws in GCJ-02 (the offset datum Amap and Tencent
            use inside China), `false` for the standard WGS-84 every
            other source draws in. The flag is a property of the
            source, not of the library: the stored photo coordinates
            stay WGS-84 and the map converts only at the display and
            pick boundaries.
          examples:
            - false
            - true
        darkGcj02:
          type: boolean
          description: |
            The dark source's coordinate system, on the same rule as
            `gcj02`. An empty dark source reuses the light one, and
            the light source's flag then governs the dark theme too.
          examples:
            - false
            - true
    TilesSettingsUpdateRequest:
      type: object
      description: |
        Payload of `PUT /admin/settings/tiles`: both styles, one
        document. The save replaces the pair wholesale.
      required:
        - tilejsonUrl
      properties:
        tilejsonUrl:
          type: string
          description: |
            The light tile source URL to save, or the empty string to
            clear it. A non-empty value must be an absolute `http`
            or `https` URL; a LAN address is legitimate (the browser
            loads the source, not the server).
        darkTilejsonUrl:
          type: string
          description: |
            The dark tile source URL to save. Omitting it or sending
            the empty string clears it (the dark theme then reuses
            the light source). A non-empty value follows the light
            field's rule: an absolute `http` or `https` URL, a LAN
            address included.
        gcj02:
          type: boolean
          default: false
          description: |
            The light source's coordinate system: `true` for a GCJ-02
            basemap (Amap, Tencent), `false` or omitted for the
            standard WGS-84. Omitting it saves the false default, so
            a client unaware of the flag keeps behaving exactly as
            before.
          examples:
            - false
            - true
        darkGcj02:
          type: boolean
          default: false
          description: |
            The dark source's coordinate system, on the same rule as
            `gcj02`: `true` for a GCJ-02 basemap, `false` or omitted
            for WGS-84. Ignored while the dark source is empty (the
            light source then governs both themes).
          examples:
            - false
            - true
    ModelSettingsResponse:
      type: object
      description: |
        The model store's policy, download sources and pipeline
        params of `GET /admin/settings/models` and the successful
        `PUT`.
      required:
        - autoDownload
        - allowedHosts
        - mirrorBaseUrl
        - params
      properties:
        autoDownload:
          type: boolean
          description: |
            Whether an AI job whose slot is configured but whose
            weights are missing may start the model group's download
            on its own. It never fills an unconfigured slot: the
            first-run download stays the administrator's own act.
        allowedHosts:
          type: array
          items:
            type: string
          description: |
            The hosts the model download may travel through. A URL
            whose host matches no entry -- entries are exact
            hostnames or a `*.` wildcard prefix for a whole domain
            suffix -- fails the download with the host named, and the
            answer points at the sources panel that can add it. The
            shipped default list covers the manifest's own hosts;
            the manifest's pinned URLs stay the identity of what is
            downloaded, this list is only where the bytes may come
            from.
          examples:
            - - huggingface.co
              - '*.hf.co'
              - hf-mirror.com
        mirrorBaseUrl:
          type: string
          description: |
            The download mirror's base host, the empty string when
            no mirror is configured. Non-empty, it replaces the
            manifest's pinned `huggingface.co` hostname wholesale on
            every candidate URL before the fetch, and its host joins
            `allowedHosts` automatically at save time (a mirror the
            list refuses would fail on its first hop). Custom model
            imports are not mirror-rewritten.
          examples:
            - - ''
            - hf-mirror.com
        params:
          $ref: '#/components/schemas/ModelParams'
    ModelParams:
      type: object
      description: |
        The pipeline's steering params (E41): the values the ML jobs
        read at their own dispatch. The set is honest by contract --
        v1 carries exactly the two knobs the pipeline actually reads,
        and it grows only as the pipeline grows (a slot without a
        knob renders no empty block).

        A change takes effect on the NEXT dispatch: each job reads
        the params once at its own start, so work already in flight
        runs to completion on the values it read; no in-flight job is
        re-steered. A corrupt stored value (a row the save
        endpoint's validation should have kept honest) answers the
        pipeline default on the read -- 0.6 for the minimum score,
        0.55 for the clustering threshold -- with the corruption
        logged server-side.
      required:
        - faceDetectMinScore
        - faceRecognizeThreshold
      properties:
        faceDetectMinScore:
          type: number
          description: |
            The face detection's minimum confidence, 0 to 1
            inclusive: a candidate scoring below it never enters the
            library. The shipped default is the pipeline's own 0.6;
            the admin value overrides the active model's manifest
            entry for this knob. Contract granularity is steps of
            0.05 (the page's stepper); the domain is what validates.
          minimum: 0
          maximum: 1
          examples:
            - 0.6
        faceRecognizeThreshold:
          type: number
          description: |
            The face recognition's clustering threshold, 0 to 1
            inclusive: two embeddings whose cosine distance is below
            it belong to one person. The shipped default is the
            pipeline's own 0.55; the admin value overrides the
            active model's manifest entry for this knob. Contract
            granularity is steps of 0.05 (the page's stepper); the
            domain is what validates.
          minimum: 0
          maximum: 1
          examples:
            - 0.55
    ModelSettingsUpdateRequest:
      type: object
      description: Payload of `PUT /admin/settings/models`.
      required:
        - autoDownload
        - allowedHosts
        - mirrorBaseUrl
        - params
      properties:
        autoDownload:
          type: boolean
          description: The policy to save.
        allowedHosts:
          type: array
          items:
            type: string
          description: The allowed hosts to save, replacing the stored list wholesale.
        mirrorBaseUrl:
          type: string
          description: The mirror base host to save, or the empty string to clear it.
        params:
          $ref: '#/components/schemas/ModelParams'
    MapConfigResponse:
      type: object
      description: |
        The map's client-side configuration of `GET /map/config`:
        the light and dark tile sources the browser loads, each null
        when the instance has none.
      required:
        - tilejsonUrl
        - darkTilejsonUrl
        - gcj02
        - darkGcj02
      properties:
        tilejsonUrl:
          type:
            - string
            - 'null'
          description: |
            The light tile source URL the browser loads directly from
            the tile host (a style document or a TileJSON
            descriptor); null means no source is configured and the
            map renders its stated absence. The dark theme falls back
            to this source when `darkTilejsonUrl` is null. The pin
            data never crosses the tile line: it comes from
            `GET /places`.
          examples:
            - https://tiles.example.net/planet/style.json
        darkTilejsonUrl:
          type:
            - string
            - 'null'
          description: |
            The dark tile source URL, loaded by the dark theme
            instead of `tilejsonUrl`; null (or, equivalently, the
            instance not configuring one) means the dark theme reuses
            the light source. The light theme never loads it.
          examples:
            - https://tiles.example.net/planet/style-dark.json
            - null
        gcj02:
          type: boolean
          description: |
            Whether the light source draws in GCJ-02 (the offset
            datum Amap and Tencent use inside China). False is the
            standard WGS-84 every other source draws in, and the
            shipped default. The browser converts the pins into the
            active source's datum for display and converts a picked
            point back to WGS-84 before it reaches the library --
            the stored coordinates never leave WGS-84.
          examples:
            - false
            - true
        darkGcj02:
          type: boolean
          description: |
            Whether the dark source draws in GCJ-02, on the same
            rule as `gcj02`. When no dark source is configured the
            dark theme reuses the light source and this flag is
            not consulted.
          examples:
            - false
            - true
    AlbumPathCompletionsResponse:
      type: object
      description: |
        The path completion answer: the pickable source directories
        of the creation dialog's combobox, each with the write fact
        the completion discovered by probing the directory once
        (the write-probe discipline of the creation, applied at
        listing time -- the dialog renders the deletability switch
        only for a `writable` row).
      required:
        - completions
      properties:
        completions:
          type: array
          maxItems: 20
          description: |
            The pickable directories of the container's visible
            filesystem -- outside the server's managed tree, real
            directories (symlinked entries are never listed).
            Deduplicated, sorted ascending by path, at most 20 rows.
            The empty array is an honest "nothing matches", never an
            error. Every row carries its write fact: the probe file
            was written, read back and removed cleanly (`writable`
            true), or any step refused (false -- a read-only
            directory is a legitimate source, and a false fact is
            information, never an error).
          items:
            $ref: '#/components/schemas/AlbumPathCompletion'
    AlbumPathCompletion:
      type: object
      description: |
        One row of the completion answer: the directory's path and
        the write fact the listing's probe discovered. The probe is
        the creation-time probe's own three steps (write, read back,
        remove) run once per row, so the dialog knows -- before any
        album is created -- whether the deletability switch applies
        there.
      required:
        - path
        - writable
      properties:
        path:
          type: string
          description: |
            Full absolute directory path of the container's visible
            filesystem, never inside the server's managed tree.
        writable:
          type: boolean
          description: |
            The directory's write fact as the listing discovered it:
            true when the probe file landed, read back and removed
            cleanly; false when any step refused. The fact is
            information, never an error -- a false row lists
            alongside the true ones, and picking it creates a
            legitimate read-only-source album.
    AlbumRescanResponse:
      type: object
      description: |
        The identifier of one directory album rescan run: the
        `job_runs` row the rescan job drives and the `job.*` events
        announce.
      required:
        - jobRunId
      properties:
        jobRunId:
          type: string
          format: uuid
          description: |
            UUIDv7 identifier of the run's `job_runs` row. `202`
            carries the freshly created run; `200` the in-flight one
            of THIS album the request joined instead.
    ModelDownloadResponse:
      type: object
      description: |
        The identifier of one model download run: the `job_runs` row
        the download drives and the `job.*` events announce.
      required:
        - jobRunId
      properties:
        jobRunId:
          type: string
          format: uuid
          description: |
            UUIDv7 identifier of the run's `job_runs` row. `202`
            carries the freshly created run; `200` the existing
            in-flight or most recent one.
    ModelSlot:
      type: string
      description: |
        The functional slot a model fills. `face_detect`,
        `face_recognize`, `clip_embed` and `ocr` are the machine
        learning slots of the pipeline; `clip_text` is the search's
        semantic arm -- the CLIP text tower that embeds queries into
        the vision tower's joint embedding space (it produces no
        per-asset rows, so its rerun endpoint answers 400
        `MODEL_INVALID`); a speech slot arrives later.
      enum:
        - face_detect
        - face_recognize
        - clip_embed
        - clip_text
        - ocr
    ModelSource:
      type: string
      description: |
        Where a model's registration came from: `downloaded` models
        landed through the download endpoint's manifest-pinned
        group; `custom` models were registered by the scan of a
        directory an administrator placed.
      enum:
        - downloaded
        - custom
    ModelResponse:
      type: object
      description: |
        One registered model as the admin surface returns it: the
        database row's identity, source, dimension and params, the
        on-disk manifest's license, provenance notice and input
        geometry, the activation flag, and the presence probe of the
        model's files. The pinned sha256 digests and the file paths
        are server-side business and never leave the server.
      required:
        - id
        - slot
        - version
        - source
        - license
        - notice
        - dim
        - inputSize
        - isActive
        - filesPresent
        - params
      properties:
        id:
          type: string
          description: |
            The model's stable slug identifier -- also the name of
            its directory under the models dir.
        slot:
          $ref: '#/components/schemas/ModelSlot'
        version:
          type: string
          description: |
            The upstream release tag of the model family, as the
            manifest declares it.
        source:
          $ref: '#/components/schemas/ModelSource'
        license:
          type: string
          description: |
            The upstream license identifier, as the model's manifest
            declares it (empty when the manifest is unreadable -- the
            row still lists so the administrator can clean it up).
        notice:
          type:
            - string
            - 'null'
          description: |
            The model's provenance notice line, as the manifest
            declares it (null when the manifest is unreadable -- the
            fact is unknowable; empty when the manifest declares no
            notice). The admin surface displays it beside the license
            so the attribution stays honest.
        dim:
          type:
            - integer
            - 'null'
          description: |
            The embedding dimension the model emits. Null for models
            that do not embed (detectors, OCR).
        inputSize:
          type:
            - object
            - 'null'
          description: |
            The model's input geometry. Null when the model's
            manifest is unreadable.
          properties:
            width:
              type: integer
              description: Input width in pixels.
            height:
              type: integer
              description: Input height in pixels.
          required:
            - width
            - height
        isActive:
          type: boolean
          description: |
            True when the model is the active one of its slot. At
            most one model per slot is active.
        filesPresent:
          type: boolean
          description: |
            True when the model's on-disk manifest is readable and
            every file it pins exists -- a presence probe only. The
            sha256 verification runs at activation and load time,
            not here.
        params:
          type: object
          description: |
            The model's inference defaults (thresholds, normalization
            constants) as its manifest declares them; empty when it
            declares none.
          additionalProperties: true
    JobRunKind:
      type: string
      description: |
        The kinds of job runs the instance records. The model
        download is one run; each machine learning slot's rerun is
        its own kind, named after the slot it redoes; the place
        re-resolution is the places-data-update path's kind; the
        album rescan is the directory album's source-reconciliation
        run; the derivative rebuild is the image card's explicit
        re-derivation of the serving copies at the current settings.
      enum:
        - model_download
        - face_detect_rerun
        - face_recognize_rerun
        - clip_embed_rerun
        - ocr_rerun
        - places_rerun
        - album_rescan
        - rebuild_derivatives
    JobRunState:
      type: string
      description: |
        The lifecycle of a job run: `queued` from creation until the
        driver picks it up, `running` while it works, then
        `succeeded`, `failed` -- or `cancelled` when the
        administrator's cancel ended it at a chunk boundary (the
        committed portion keeps its counts; a cancelled run is the
        admin's own deliberate ending, never a broken one).
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
    JobRunResponse:
      type: object
      description: |
        One job run as the task panel and the model page render it.
        The progress fields carry the run's own work's units: pinned
        bytes for the model download (with `failed` counting failed
        models), asset counts for the reruns (with `failed` counting
        the assets whose rerun failed).
      required:
        - id
        - kind
        - state
        - subject
        - total
        - done
        - failed
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the run's `job_runs` row.
        kind:
          $ref: '#/components/schemas/JobRunKind'
        state:
          $ref: '#/components/schemas/JobRunState'
        subject:
          type:
            - string
            - 'null'
          description: |
            The run's subject label (E41): the directory album a
            rescan run walks, by title, so the panel's row names what
            it did ("Album rescan · Family archive"). Every other
            kind has no subject -- the instance-wide reruns never
            name one -- and answers null; a null subject renders the
            kind's own label alone.
        total:
          type: integer
          description: |
            The run's whole work, in the run's own units: the
            download group's pinned bytes, or the rerun scope's
            asset count.
        done:
          type: integer
          description: |
            The work completed so far, in the same units as
            `total`.
        failed:
          type: integer
          description: |
            The failed work count: failed models for the download,
            assets whose rerun failed for a rerun.
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the run's driver first picked it up (RFC 3339
            UTC). Null while the run sits `queued`.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the run closed (RFC 3339 UTC). Null until then.
    JobRunListResponse:
      type: object
      description: |
        The task panel listing: the instance's job runs, newest
        first, bounded by the `limit` parameter.
      required:
        - jobs
      properties:
        jobs:
          type: array
          description: The newest job runs, newest first.
          items:
            $ref: '#/components/schemas/JobRunResponse'
    ModelListResponse:
      type: object
      description: |
        The model management listing: every registered model plus
        the download run summary, the per-slot state view the page's
        cards render, and the manifest catalog the switch dialog's
        official group renders.
      required:
        - models
        - download
        - slots
        - official
      properties:
        models:
          type: array
          description: |
            Every registered model, grouped by slot then id.
          items:
            $ref: '#/components/schemas/ModelResponse'
        download:
          type:
            - object
            - 'null'
          description: |
            The most recent `model_download` run of whatever state,
            or null before the first download was ever started.
          allOf:
            - $ref: '#/components/schemas/JobRunResponse'
        slots:
          type: array
          description: |
            One row per pipeline slot (the contract's enum order):
            the four-state view the page's cards render, the slot's
            active model, its source facts and the download run's
            progress while a run is in flight.
          items:
            $ref: '#/components/schemas/SlotStateResponse'
        official:
          type: array
          description: |
            The manifest's catalog: the validated list the switch
            dialog's official group renders, every entry with its
            download state. The image is not the entry -- the mirror
            carries no weights; `downloaded` is the presence probe
            and the digest check stays the activation's business.
          items:
            $ref: '#/components/schemas/ModelCatalogEntry'
    SlotState:
      type: string
      description: |
        The four states a slot's card speaks. `active` is a slot
        running its model (the state badge renders as the model's
        own facts); `downloading` is a model download run in flight
        whose bytes this slot still waits for (the card shows the
        run's percent); `not_downloaded` is an unfilled slot -- or a
        filled one whose weights are gone with no run coming; `failed`
        is the same missing-weights state while the most recent
        download run failed (the card shows the retry).
      enum:
        - active
        - downloading
        - not_downloaded
        - failed
    SlotStateResponse:
      type: object
      description: |
        One pipeline slot's state row. `modelId` is the slot's active
        model's id, null when the slot is unfilled; `source` is null
        for an unfilled slot; `progress` is the in-flight download
        run's counts while `state` is `downloading` (and null
        otherwise -- the run is group-level, the card renders its
        percent).
      required:
        - slot
        - state
        - modelId
        - source
        - progress
      properties:
        slot:
          $ref: '#/components/schemas/ModelSlot'
        state:
          $ref: '#/components/schemas/SlotState'
        modelId:
          type:
            - string
            - 'null'
        source:
          type:
            - object
            - 'null'
          description: |
            Where the slot's active model came from. `official` models
            were registered by the download service; `custom` models
            were imported by the administrator (a URL or a local file
            probe). `host` and `sha256` come from the model's on-disk
            manifest (the host is null when the manifest is unreadable
            or carries no source URL); `downloadedAt` is the
            registration time. Null for an unfilled slot.
          required:
            - kind
            - host
            - sha256
            - downloadedAt
          properties:
            kind:
              type: string
              enum: [official, custom]
            host:
              type:
                - string
                - 'null'
              description: The host the bytes were fetched from, when known.
              examples:
                - huggingface.co
            sha256:
              type:
                - string
                - 'null'
              description: The primary file's pinned digest, or null when unknown.
            downloadedAt:
              type: string
              format: date-time
              description: When the model was registered.
        progress:
          type:
            - object
            - 'null'
          description: |
            The in-flight download run's `{done, total}` pinned-byte
            counts, null when no run is in flight.
          required:
            - done
            - total
          properties:
            done:
              type: integer
            total:
              type: integer
    ModelCatalogEntry:
      type: object
      description: |
        One official-list entry: a manifest model with the facts the
        switch dialog's dropdown renders (name, license, size,
        dimension) and its download state.
      required:
        - id
        - slot
        - name
        - license
        - bytes
        - downloaded
      properties:
        id:
          type: string
          description: The manifest model's stable id.
        slot:
          $ref: '#/components/schemas/ModelSlot'
        name:
          type: string
          description: The display name the manifest's notice carries, derived from the model id.
          examples:
            - Chinese-CLIP ViT-B/16
        license:
          type: string
          description: The upstream license identifier, empty when undeclared.
        dim:
          type: integer
          description: The embedding dimension; absent for models that do not embed.
        bytes:
          type: integer
          description: The pinned byte count of the entry's files.
        downloaded:
          type: boolean
          description: Whether the entry's files are present on disk (a presence probe, not a digest check).
    ModelProbeAcceptedResponse:
      type: object
      description: |
        The 202 answer of a probe POST: the identifier to poll.
      required:
        - probeId
      properties:
        probeId:
          type: string
    ModelProbeResponse:
      type: object
      description: |
        One source probe's current state. `state` is `queued`,
        `running` (with the download progress when the source is a
        URL), `ok`, `error` (the reason names the check that failed)
        or `warn` (the checks passed; the host is not on the download
        sources list; the save may still proceed). `dims` and
        `inputSize` are the facts a finished probe read off the
        graph; `sha256` is the computed digest of the staged bytes
        (the given pin, when one was given, already matched it); a
        failed probe carries none of them.
      required:
        - probeId
        - state
        - progress
        - dims
        - inputSize
        - sha256
        - hostDeclared
        - reason
      properties:
        probeId:
          type: string
        state:
          type: string
          enum: [queued, running, ok, error, warn]
        progress:
          type:
            - object
            - 'null'
          description: The URL download's `{done, total}` counts while running, null otherwise.
          required:
            - done
            - total
          properties:
            done:
              type: integer
            total:
              type: integer
        dims:
          type:
            - integer
            - 'null'
          description: The model's output dimension, read off the graph.
        inputSize:
          type:
            - object
            - 'null'
          description: The model's input geometry, read off the graph.
          required:
            - width
            - height
          properties:
            width:
              type: integer
            height:
              type: integer
        sha256:
          type:
            - string
            - 'null'
          description: The staged bytes' digest, set when the probe finished (ok or warn).
        hostDeclared:
          type: boolean
          description: Whether the source's host is on the download sources list.
        reason:
          type:
            - string
            - 'null'
          description: The failing check, named, for state `error`.
          examples:
            - the model emits 384 dimensions, this slot needs 512
    ModelSourceSwitchRequest:
      type: object
      description: |
        The source a slot is switched onto. `kind` selects the shape:
        `builtin` takes `modelId` (an official-list entry, no probe
        needed), `url` and `file` take a `probeId` whose checks
        finished OK. `confirmWipe` is required when the switch would
        change the embed slot's vector dimension.
      required:
        - kind
      properties:
        kind:
          type: string
          enum: [builtin, url, file]
        modelId:
          type: string
          description: The official-list entry, for kind `builtin`.
        probeId:
          type: string
          description: The finished probe, for kinds `url` and `file`.
        confirmWipe:
          type: boolean
          description: |
            The explicit confirmation a cross-dimension embed switch
            requires (the wipe cannot be undone).
    ModelSourceSwitchResponse:
      type: object
      description: |
        What one switch did: the slot's newly active model, the
        destructive arm's facts when the dimension changed, and the
        recalculation run's id when the switch's semantics enqueue
        one (the face slots and a cross-dimension embed switch; a
        same-dimension embed switch keeps both generations and
        recomputes nothing).
      required:
        - activated
        - dimensionChanged
        - wipedEmbeddings
        - recalcRunId
      properties:
        activated:
          $ref: '#/components/schemas/ModelRef'
        dimensionChanged:
          type:
            - object
            - 'null'
          description: Set when the switch re-typed the vector column.
          required:
            - from
            - to
          properties:
            from:
              type: integer
            to:
              type: integer
        wipedEmbeddings:
          type:
            - integer
            - 'null'
          description: The number of embeddings the dimension switch deleted.
        recalcRunId:
          type:
            - string
            - 'null'
          description: The enqueued recalculation run's identifier, null when none is due.
    ModelRef:
      type: object
      description: |
        The identity of one model: its slug id and its slot.
      required:
        - id
        - slot
      properties:
        id:
          type: string
          description: The model's stable slug identifier.
        slot:
          $ref: '#/components/schemas/ModelSlot'
    ModelDimensionChange:
      type: object
      description: |
        The dimension switch of a cross-dimension clip activation:
        what the embeddings column was and what it became.
      required:
        - from
        - to
      properties:
        from:
          type: integer
          description: The embeddings column's dimension before the switch.
        to:
          type: integer
          description: The embeddings column's dimension after the switch.
    ModelActivateResponse:
      type: object
      description: |
        The report of one activation. The optional fields appear
        exactly on a cross-dimension switch of the clip-embed slot
        -- the destructive arm -- so their absence IS the
        same-dimension guarantee that nothing was deleted.
      required:
        - activated
      properties:
        activated:
          $ref: '#/components/schemas/ModelRef'
        dimensionChanged:
          $ref: '#/components/schemas/ModelDimensionChange'
        wipedEmbeddings:
          type: integer
          description: |
            The number of clip embedding rows the cross-dimension
            switch deleted inside its transaction.
    ModelScanResponse:
      type: object
      description: |
        The custom model scan's report: every model directory the
        scan verified and registered, in scan order. Nothing is
        activated.
      required:
        - registered
      properties:
        registered:
          type: array
          description: |
            The models the scan registered, in scan order.
          items:
            $ref: '#/components/schemas/ModelResponse'
    ModelRerunResponse:
      type: object
      description: |
        The identifier of one rerun run: the `job_runs` row the
        rerun drives and the `job.*` events announce.
      required:
        - jobRunId
      properties:
        jobRunId:
          type: string
          format: uuid
          description: |
            UUIDv7 identifier of the run's `job_runs` row. `202`
            carries the freshly created run; `200` the in-flight one
            the click joined instead.
    User:
      type: object
      description: A lumemor account.
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
          description: Display name.
        email:
          type: string
          format: email
          description: Login address.
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          description: Creation time (RFC 3339 UTC).
    AssetNotice:
      type: object
      description: |
        One thing the client MUST tell the user about a successful
        upload: the server made a decision the user cannot see in the
        response's asset fields. Notices are informational, never
        failures -- the upload itself succeeded.
      required:
        - code
        - assetId
        - name
      properties:
        code:
          type: string
          description: |
            What happened.

            `LIVE_PHOTO_MOTION_ABSORBED`: the Live Photo's motion bytes
            already existed as a live standalone video of this owner;
            that row became the pair's motion (`assetId` names it) and
            no longer lists as its own asset. Carried on a 201
            `created` answer.

            `LIVE_PHOTO_MOTION_ALREADY_STORED`: the uploaded bytes
            already play as a Live Photo's motion, so the returned
            row is that hidden component (`assetId` names it) and does
            not list on its own. Carried on a 200 `duplicate` answer:
            the content genuinely exists, so the state stays
            `duplicate` -- there is nothing for the user to fix.
          enum:
            - LIVE_PHOTO_MOTION_ABSORBED
            - LIVE_PHOTO_MOTION_ALREADY_STORED
          x-enum-varnames:
            - AssetNoticeCodeLivePhotoMotionAbsorbed
            - AssetNoticeCodeLivePhotoMotionAlreadyStored
        assetId:
          type: string
          format: uuid
          description: |
            The asset the notice is about: the video row that plays as
            a Live Photo's motion.
        name:
          type: string
          description: |
            The affected asset's original filename, so the message can
            name what moved.
    AssetResponse:
      type: object
      description: |
        One stored asset as the upload and idempotency endpoints return
        it. `state` discriminates the upload outcome: `created` (201, a
        new asset), `duplicate` (200, an identical live asset already
        existed), `trashed` (200, an identical asset sits in the trash;
        the body carries that asset so the client can offer restore or
        save-as-new). The idempotency lookup mirrors the same states:
        it reports what a re-upload of the content would yield, so
        `created` never appears there.

        `notices` is absent or empty unless something needs telling:
        a Live Photo whose motion bytes were reused as an existing
        standalone video's row, or a standalone video whose bytes
        already play as some Live Photo's motion (the returned row is
        then that hidden component, still a `duplicate`). A client
        that ignores it leaves the user with a video that silently
        stopped listing on its own, so the obligation to surface each
        notice is part of the contract, not a presentation choice.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - state
        - createdAt
        - takenAt
        - isTrashed
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image` whose
            video component is stored as a linked `video` row that
            never appears in the timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: |
            The file name the asset was uploaded with: the client-side
            `fileName` of the photo (the component video keeps its own
            file part name).
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            owner-scoped idempotency key of the upload.
        state:
          type: string
          description: |
            The upload outcome: `created` (201), `duplicate` (200, an
            identical live asset) or `trashed` (200, an identical asset
            in the trash).
          enum:
            - created
            - duplicate
            - trashed
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; responses render the best value the
            server has at answer time.
        isTrashed:
          type: boolean
          description: |
            True when the asset sits in the trash; `state: trashed`
            responses carry it as true so clients can offer the
            restore or save-as-new decision.
        notices:
          type: array
          description: |
            What the client must tell the user about this upload.
            Absent or empty when there is nothing to say; the array is
            informational, never a failure list. Present on a 201
            `created` answer today (a Live Photo motion absorbed into
            an existing video); the client surfaces each entry to the
            user without blocking the upload.
          items:
            $ref: '#/components/schemas/AssetNotice'
    AssetDetail:
      type: object
      description: |
        One asset as the detail endpoint returns it: the upload
        response's identity and storage fields, the pipeline's
        refinements, the owner-level attributes the PATCH
        endpoint edits (`description`, `isArchived`, and the
        `takenAt` / `latitude` / `longitude` edits), the asset's
        faces as the calling user sees them (`faces`), and the
        CALLER's tags on the asset (`tags`). The caller-visible
        album memberships surface as `albums` (the info panel's
        where-does-this-live row) and the GPS resolution as `place`
        (the info panel's city row, the locale-joined display
        name). The shape is
        fixed -- every property is always present -- and the
        pipeline-dependent values (`width`, `height`, `durationMs`,
        `blurhash` and the fields inside `exif`) are null until the
        jobs produced them, turning non-null when `asset.ready`
        fired. A value that stays null on a ready asset means the
        file carries no such metadata.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - takenAtZone
        - isTrashed
        - isArchived
        - description
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - contentCopies
        - livePhotoVideoId
        - exif
        - location
        - path
        - faces
        - tags
        - albums
        - place
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image` whose
            video component is stored as a linked `video` row that
            never appears in the timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: |
            The file name the asset was uploaded with; the original
            download re-uses it (RFC 5987 escaped) for
            `Content-Disposition`.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; the response renders the best value the
            server has at answer time. The owner's manual edit rides
            `PATCH /assets/{id}`, which replaces the value wholesale.
        takenAtSource:
          type: string
          description: |
            Where `takenAt` comes from: `import` is the
            device-reported capture time of the upload, `exif` an
            EXIF capture time the metadata job resolved with an
            offset, `file` a file timestamp (reserved for the future
            directory-album importer).
          enum:
            - exif
            - file
            - import
        takenAtZone:
          type:
            - string
            - 'null'
          description: |
            The zone the displayed capture time resolves in, EXIF
            offset notation (`+05:30`): the owner's choice when the
            capture time was last written through `PATCH /assets/{id}`,
            the EXIF resolution chain's offset (the OffsetTime tags,
            else the upload's device zone) when the metadata job
            refined it, and null when neither resolved a zone -- the
            client renders the time without a zone suffix.
        isTrashed:
          type: boolean
          description: True when the asset sits in the trash.
        isArchived:
          type: boolean
          description: |
            True while the asset is archived: out of every family flow
            -- the timeline, the favorites, the people and places
            walls, the map, the memories, the search -- and listed
            only through the archived view, until it is unarchived.
            An album keeps its archived members (the album is a
            reference container), and the owner unarchives from there
            or from the archived view. The same switch `PATCH
            /assets/{id}` and the batch `hide` / `unhide` actions
            flip.
        description:
          type: string
          description: |
            The owner's free-text description of the asset, the text
            the detail panel renders; the empty string until the
            owner wrote one. Editable only by the owner through
            `PATCH /assets/{id}`, which replaces it wholesale.
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset completed -- the
            metadata and thumbnail jobs for an image, plus the
            transcode job for a video (for a Live Photo component,
            the transcode job alone); the `asset.ready` event fires
            at that moment. Until then the client shows placeholders
            and the media endpoints answer `ASSET_NOT_READY` for
            missing derived files.
        width:
          type:
            - integer
            - 'null'
          description: |
            Pixel width in sensor order (not orientation-corrected);
            null until the metadata job refined the dimensions.
        height:
          type:
            - integer
            - 'null'
          description: |
            Pixel height in sensor order (not orientation-corrected);
            null until the metadata job refined the dimensions.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile (image assets) or poster frame
            (video assets) for placeholder rendering; null until the
            thumbnail job stored it.
        contentCopies:
          type: integer
          description: |
            How many OTHER live rows of the same owner carry this
            asset's content (same checksum) -- the twin copies a
            delete leaves behind. A directory album mirrors its
            folder, so one photo can be an uploaded copy and a source
            copy at once; trashing one leaves the other. 0 means this
            row is the content's only live copy. The count is
            owner-scoped: it never reveals rows outside the asset's
            owner, and it counts rows, not surfaces. The PATCH
            response serves the same value, exactly as the GET serves
            it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (never in the timeline; its original is
            downloadable by that id, and its transcoded play stream
            is served there too); null otherwise.
        exif:
          allOf:
            - $ref: '#/components/schemas/ExifSummary'
          description: |
            The EXIF hot fields. Always present as an object; every
            field inside it is null until the metadata job wrote the
            extraction.
        location:
          description: |
            The coordinates the info panel renders -- the photo's
            current location. The owner's manual pair when a location
            edit wrote one (`PATCH /assets/{id}`'s `latitude` /
            `longitude`), the camera-recorded GPS otherwise (the
            `exif` fields' own values). Null when the asset carries
            neither -- no GPS and no manual edit -- and the whole
            location row stays unrendered. The PATCH response serves
            the same face, exactly as the GET serves it.
          anyOf:
            - $ref: '#/components/schemas/AssetCoordinates'
            - type: 'null'
        path:
          type:
            - string
            - 'null'
          description: |
            The storage-relative path of the original file (the
            `assets.file_path` render), as the administrator's info
            panel shows it -- the copyable machine location. Populated
            ONLY when the caller is an administrator: every other
            caller reads null and the field stays out of their panel
            entirely (the instance's internal layout is machine
            information, not content). An external asset (a directory
            album's source file) carries the file's real absolute
            path instead of the storage layout's relative form.
        faces:
          type: array
          description: |
            The asset's faces as the calling user sees them, strongest
            score first with the face id as the tiebreak. The array is
            caller-scoped: the asset being visible to the caller
            is the gate -- the faces ride on the detail's own
            permission -- and each entry's `label` is the caller's own
            label of the face's cluster, never another account's.
            Always present, empty when the asset carries no faces
            (none detected, or detection has not run yet). The PATCH
            response serves the same array, exactly as the GET serves
            it.
          items:
            $ref: '#/components/schemas/AssetFaceSummary'
        tags:
          type: array
          description: |
            The CALLER's tags on this asset: the caller's own
            assignment rows joined to their own tag rows, sorted by
            name case-insensitively with the tag id as the tiebreak
            (the vocabulary listing's own ordering). Another
            account's tags on the same asset never surface, so the
            same shared asset answers different arrays for the owner
            and the sharee (each sees their own, or none). Always
            present, empty when the caller tagged the asset with
            nothing. The PATCH response serves the same array,
            exactly as the GET serves it.
          items:
            $ref: '#/components/schemas/AssetTagSummary'
        albums:
          type: array
          description: |
            The albums holding this asset, as the calling user sees
            them: every album whose membership row references the
            asset and that the caller can see -- their own albums
            (the sync stream included: the pinned core card the
            uploads land in) plus every album shared to them. An
            album the caller cannot see -- another account's sync
            album, an unshared album -- never surfaces, so the same
            asset answers different arrays for the owner and a
            sharee. The caller's own sync album is included exactly
            when it is theirs (its membership is the upload stream's
            materialized rows), and every entry's `callerRole` is
            the viewer's relation to that album. Ordered with the
            sync card first, then by title case-insensitively with
            the album id as the tiebreak. Always present, empty when
            no visible album holds the asset. The PATCH response
            serves the same array, exactly as the GET serves it.
          items:
            $ref: '#/components/schemas/AssetAlbumRef'
        place:
          description: |
            The asset's resolved place (the metadata job's GPS
            resolution, the `assets.place_id` the pipeline wrote),
            as the info panel's city row: the place id -- the deep
            link's key into the place-filtered browse -- and the
            display name joined at the request's `locale` (the
            `place_names` row of that locale when the place data
            carries one, the GeoNames canonical name otherwise; the
            `GET /places` join's exact discipline). Null when the
            asset carries no resolved place -- no GPS, the pipeline
            has not run yet, or the deployment baked no place data.
            The PATCH response serves the same face at its own
            `locale`, exactly as the GET serves it.
          anyOf:
            - $ref: '#/components/schemas/AssetPlaceRef'
            - type: 'null'
    AssetFaceSummary:
      type: object
      description: |
        One face of the asset detail's `faces` array: the crop's
        identity, the detection score, the face's bounding box (the
        on-photo face-box layer's geometry), the face's cluster, the
        CALLER's label of that cluster and the person entity's birth
        date. The label is per-user state: another account's label of
        the same global cluster never shows here; the birth date is
        the entity's own attribute (one value for every account) and
        exists so the chip can render the person's age WHEN THIS PHOTO
        WAS TAKEN. `clusterId` is null while the face waits for its
        first clustering assignment; such a face has no person yet and
        every assignment write on it answers the people surface's 404.
      required:
        - id
        - score
        - thumbnail
        - bbox
        - clusterId
        - label
        - birthDate
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the face row.
        score:
          type: number
          format: float
          description: |
            The detector's confidence for this face; a hand-drawn face
            (the caller's own certainty) carries 1.0.
        thumbnail:
          type: string
          description: |
            URL of the face's crop: the face crop endpoint
            `GET /api/v1/faces/{faceId}/thumbnail` with this face's
            id, serving the bounding-box crop of the asset's
            view-size derivative.
          examples:
            - /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
        bbox:
          $ref: '#/components/schemas/FaceBbox'
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            Identifier of the face's cluster, or null before the
            clustering assigned one (a face the recognition run has
            not grouped yet).
        label:
          description: |
            The caller's own label of the face's cluster, or null when
            the caller has not labeled it (the unnamed state) -- and
            null for a clusterless face, which has no cluster to
            label.
          anyOf:
            - $ref: '#/components/schemas/PersonLabel'
            - type: 'null'
        birthDate:
          description: |
            The person's birth date (the entity's own attribute), or
            null when unset or the face has no cluster. The client
            computes the capture-time age from it and the asset's
            `takenAt` -- the birth date's whole purpose beside the
            birthday memories.
          anyOf:
            - type: string
              format: date
            - type: 'null'
    FaceBbox:
      type: object
      description: |
        A face's bounding box in per-mille units of the asset's view
        derivative (the pixels the crop endpoint addresses and the
        on-photo face-box layer renders): `x`/`y` the top-left
        corner, `w`/`h` the box's extents, each an integer 0..1000.
        A detected face's box is the detector's own; a hand-drawn
        face (POST /faces) carries the drawn box as-is.
      required:
        - x
        - y
        - w
        - h
      properties:
        x:
          type: integer
          description: Per-mille of the derivative's width where the box starts.
          minimum: 0
          maximum: 1000
          examples:
            - 312
        y:
          type: integer
          description: Per-mille of the derivative's height where the box starts.
          minimum: 0
          maximum: 1000
          examples:
            - 118
        w:
          type: integer
          description: The box's width, in per-mille of the derivative's width.
          minimum: 0
          maximum: 1000
          examples:
            - 187
        h:
          type: integer
          description: The box's height, in per-mille of the derivative's height.
          minimum: 0
          maximum: 1000
          examples:
            - 190
    AssetTagSummary:
      type: object
      description: |
        One entry of the asset detail's `tags` array: the caller's
        own tag as it rides the asset -- identity and name only, the
        vocabulary's listing face carries the counts. Per-user state:
        the entry exists exactly because the CALLER's
        assignment row does.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the tag (the caller's own row).
        name:
          type: string
          description: The tag's name, the caller's own vocabulary.
    AssetAlbumRef:
      type: object
      description: |
        One entry of the asset detail's `albums` array: the album
        holding the asset as the calling user sees it -- identity,
        title, type and the viewer's own relation. The type rides
        the same convention as the wall cards: the sync entry's
        `title` is the internal system label ('Sync') and clients
        render the localized display name keyed by the type.
      required:
        - id
        - title
        - type
        - callerRole
        - sourceWritable
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the album (the detail face's deep link).
        sourceWritable:
          type: boolean
          description: |
            Whether the album's source directory can take the
            application's writes. False only for a directory album
            whose creation-time write probe answered no -- every
            other type (sync, memory, a writable directory) is true.
            The photo-detail faces read this to gate the destructive
            affordances: a photo housed only in a read-only source
            is the scan's verdict alone and offers no delete.
        title:
          type: string
          description: The album's display title (the sync card's internal label).
        type:
          type: string
          enum:
            - memory
            - directory
            - sync
          description: |
            The album's type. A `memory` entry is one of the viewer's
            own or shared reference sets; `directory` entries are
            sources. The one `sync` entry, when present, is the
            viewer's own default album (never another account's).
        callerRole:
          type: string
          enum:
            - owner
            - viewer
          description: |
            The caller's relation to this album: `owner` items are
            the caller's own (the sync stream's entry is always
            one), `viewer` items the albums shared to them.
    AssetPlaceRef:
      type: object
      description: |
        The asset detail's `place` face: the resolved city as the
        info panel renders it -- the deep link's key and the
        display name, nothing more (the place listing's counts and
        covers are the `GET /places` face's own).
      required:
        - placeId
        - name
      properties:
        placeId:
          type: integer
          format: int32
          description: |
            The GeoNames geonameid of the place -- the `places` row's
            primary key and the `assets.place_id` foreign key, the
            same identifier the place-filtered browse filters on.
          examples:
            - 2988507
        name:
          type: string
          description: |
            The display name at the request's locale: the
            `place_names` row of that locale when the place data
            carries one, the GeoNames canonical (English or
            romanized) name otherwise.
          examples:
            - Paris
            - 巴黎
    AssetCoordinates:
      type: object
      description: |
        One geographic position in degrees: the pair the info panel's
        mini map and coordinate line render. Both halves always
        present -- half a coordinate is no location.
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          format: double
          description: Latitude in degrees (-90..90).
          examples:
            - 48.8584
        lon:
          type: number
          format: double
          description: Longitude in degrees (-180..180).
          examples:
            - 2.2945
    ExifSummary:
      type: object
      description: |
        The EXIF hot fields of an asset, flattened from the raw
        exiftool output by the metadata job. Every property is always
        present and null until the job wrote it -- or forever, for
        files that carry no such tag.
      required:
        - cameraMake
        - cameraModel
        - lens
        - iso
        - aperture
        - shutter
        - focal
        - lat
        - lon
        - alt
        - tzOffset
      properties:
        cameraMake:
          type:
            - string
            - 'null'
          description: Camera manufacturer (EXIF Make).
        cameraModel:
          type:
            - string
            - 'null'
          description: Camera model (EXIF Model).
        lens:
          type:
            - string
            - 'null'
          description: Lens identifier (LensModel, LensID or Lens).
        iso:
          type:
            - integer
            - 'null'
          description: ISO sensitivity.
        aperture:
          type:
            - number
            - 'null'
          description: Aperture as the f-number.
        shutter:
          type:
            - string
            - 'null'
          description: |
            Exposure time in photo notation, for example `1/250` or
            `2.5s`.
        focal:
          type:
            - number
            - 'null'
          description: Focal length in millimeters.
        lat:
          type:
            - number
            - 'null'
          format: double
          description: GPS latitude in degrees.
        lon:
          type:
            - number
            - 'null'
          format: double
          description: GPS longitude in degrees.
        alt:
          type:
            - number
            - 'null'
          description: GPS altitude in meters.
        tzOffset:
          type:
            - string
            - 'null'
          description: |
            The offset that resolved the capture time, in EXIF
            notation (`+05:30`); null when the capture time did not
            resolve through EXIF.
    TimelineItem:
      type: object
      description: |
        One asset of the timeline: the asset detail's fields minus the
        `exif` object, the `place` join and the `description` edit
        attribute -- the detail endpoint renders the EXIF panel, the
        place card and the edit controls; the timeline renders tiles.
        An item is live on every family-flow wall by construction --
        archived assets, trashed assets and the component video rows of
        Live Photos never enter those -- so `isTrashed` is always false
        there and is carried only to keep the item shape identical to
        the detail's. The album narrow is the exception: an album keeps
        its archived members, so its items carry `isArchived: true` for
        them (the container's unarchive entry reads it); the archived
        view's items are `true` by construction. `isReady` still
        varies: a fresh
        upload enters the timeline immediately with its
        pipeline-dependent fields null, and the client upgrades the
        tile when `asset.ready` fires. The shape is fixed -- every
        property is always present. `isFavorite` is per-user state
        computed for the requesting user, so the same asset is a
        favorite tile for one viewer and a plain tile for another.
      required:
        - id
        - ownerId
        - kind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - isTrashed
        - isArchived
        - isFavorite
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - livePhotoVideoId
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: |
            Media family of the asset. A Live Photo is an `image`
            whose linked component video row never appears in the
            timeline.
          enum:
            - image
            - video
        originalFilename:
          type: string
          description: The file name the asset was uploaded with.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339). Seeded from `deviceCreatedAt` (or
            the upload time when absent) and refined from EXIF by the
            metadata pipeline; the timeline orders by it.
        takenAtSource:
          type: string
          description: |
            Where `takenAt` comes from: `import` is the
            device-reported capture time of the upload, `exif` an
            EXIF capture time the metadata job resolved with an
            offset, `file` a file timestamp (reserved for the future
            directory-album importer).
          enum:
            - exif
            - file
            - import
        isTrashed:
          type: boolean
          description: |
            Always false in the timeline: trashed assets never enter
            it. The field exists to keep the shape identical to the
            asset detail's.
        isArchived:
          type: boolean
          description: |
            The row's archive state: `false` on every family-flow
            wall (the flows exclude archived rows), `true` on the
            archived view's items and on an album's archived members
            (the container keeps them visible and unarchivable).
        isFavorite:
          type: boolean
          description: |
            Whether the REQUESTING user favorites this asset: the
            caller's own row of the per-user favorites state, written
            by the batch endpoint's favorite action. False whenever
            the caller has no favorites row for the asset -- the same
            asset can be a favorite for one viewer of a shared
            timeline and not for another.
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset (metadata and
            serving copies) completed; until then the
            pipeline-dependent fields are null and the client renders
            placeholders.
        width:
          type: integer
          description: |
            Pixel width in sensor order, straight from the assets
            column: the upload writes the 0 placeholder and the
            metadata job refines the real value, so 0 means "not
            refined yet" (the wall layout assumes a fallback aspect
            until then). Always present -- the justified photo wall
            reads it on every tile, never null.
        height:
          type: integer
          description: |
            Pixel height in sensor order, straight from the assets
            column: the upload writes the 0 placeholder and the
            metadata job refines the real value, so 0 means "not
            refined yet" (the wall layout assumes a fallback aspect
            until then). Always present -- the justified photo wall
            reads it on every tile, never null.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile (image assets) or poster frame
            (video assets) for placeholder rendering; null until the
            thumbnail job stored it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (its original is downloadable by that id, the
            transcoded play stream is not); null otherwise.
    TimelineResponse:
      type: object
      description: |
        One page of a timeline-shaped view: the aggregated timeline,
        the favorites view or the archived view all answer with this
        page shape (the same ordering and the same cursor semantics).
        `nextCursor` is present exactly when another page follows the
        `items` of this one: the client passes it back as the
        `cursor` query parameter to continue, and a response without
        it ends the pagination. The last page is the one whose
        follow-up page would be empty, so no run ever observes an
        empty page mid-pagination.
      required:
        - items
      properties:
        items:
          type: array
          description: |
            The timeline items of this page, ordered by `takenAt`
            descending with the id as the tiebreak.
          items:
            $ref: '#/components/schemas/TimelineItem'
        nextCursor:
          type: string
          description: |
            The opaque continuation cursor: pass it back as the
            `cursor` query parameter to fetch the next page. Absent
            exactly when this is the last page.
    TrashItem:
      type: object
      description: |
        One asset of the trash view: the timeline item's fields (the
        tile-relevant identity and pipeline fields, so the trash page
        renders the same tiles as the timeline) plus the trash
        semantics -- `deletedAt`, when the soft delete happened, and
        `remainingDays`, the countdown of whole days until the expiry
        job removes the row (rounded up; 0 once past the deadline,
        for the short window until the hourly job catches up). Every
        item is trashed by construction; there is no `isTrashed`
        field. The component video rows of Live Photos never appear:
        the pair is represented by its photo. The shape is fixed --
        every property is always present.
      required:
        - id
        - ownerId
        - kind
        - storageKind
        - originalFilename
        - fileSize
        - mimeType
        - checksum
        - createdAt
        - takenAt
        - takenAtSource
        - isReady
        - width
        - height
        - durationMs
        - blurhash
        - livePhotoVideoId
        - deletedAt
        - remainingDays
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the asset.
        ownerId:
          type: string
          format: uuid
          description: UUIDv7 identifier of the owning account.
        kind:
          type: string
          description: Media family of the asset.
          enum:
            - image
            - video
        storageKind:
          type: string
          description: |
            Where the asset's original file lives. `blob` rows were
            uploaded into the server's originals tree and were
            soft-deleted in place (the file stays until expiry).
            `external` rows reference a directory album's source file
            and were moved INTO the server's trash area when the
            owner trashed them -- the listing is honest for both
            kinds, and a restore moves the external file back to its
            recorded original location. External rows the rescan's
            orphan arm marked deleted never appear here at all: the
            file was never the server's and the trash has no meaning
            for it.
          enum:
            - blob
            - external
        originalFilename:
          type: string
          description: The file name the asset was uploaded with.
        fileSize:
          type: integer
          format: int64
          description: Size of the stored file in bytes.
        mimeType:
          type: string
          description: |
            Canonical content type of the stored format, for example
            `image/jpeg` or `video/quicktime`.
        checksum:
          type: string
          description: |
            SHA-256 digest of the file bytes, lowercase hex. The
            prefix of the entity tags the media endpoints serve.
        createdAt:
          type: string
          format: date-time
          description: When the asset record was created (RFC 3339 UTC).
        takenAt:
          type: string
          format: date-time
          description: |
            Capture time (RFC 3339), the value the timeline would
            order the asset by.
        takenAtSource:
          type: string
          description: Where `takenAt` comes from.
          enum:
            - exif
            - file
            - import
        isReady:
          type: boolean
          description: |
            True once the whole pipeline of the asset (metadata and
            serving copies) completed.
        width:
          type:
            - integer
            - 'null'
          description: |
            Pixel width in sensor order; null until the metadata job
            refined the dimensions.
        height:
          type:
            - integer
            - 'null'
          description: |
            Pixel height in sensor order; null until the metadata job
            refined the dimensions.
        durationMs:
          type:
            - integer
            - 'null'
          description: |
            Playback duration of a video in milliseconds; null for
            images and until the metadata job refined it.
        blurhash:
          type:
            - string
            - 'null'
          description: |
            The blurhash of the tile for placeholder rendering; null
            until the thumbnail job stored it.
        livePhotoVideoId:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            For a Live Photo image, the id of its linked component
            video row (restored and expired together with the photo);
            null otherwise.
        deletedAt:
          type: string
          format: date-time
          description: |
            When the asset was soft deleted (RFC 3339 UTC). The
            retention window ends at `deletedAt` plus the instance's
            `trash_retention_days`.
        remainingDays:
          type: integer
          minimum: 0
          description: |
            Whole days until the expiry job removes the asset,
            rounded up (an asset trashed moments ago with the default
            retention of 30 days shows 30). 0 once the deadline has
            passed -- the row survives only until the next hourly
            expiry run.
    TrashResponse:
      type: object
      description: |
        The trash view: the caller's trashed assets, newest deletion
        first. The list is bounded (the 200 most recent deletions)
        and unpaginated -- the trash is a recovery view for recent
        deletes, and items age out through expiry on their own.
      required:
        - items
        - retentionDays
      properties:
        items:
          type: array
          description: |
            The trashed assets of the caller, ordered by `deletedAt`
            descending.
          items:
            $ref: '#/components/schemas/TrashItem'
        retentionDays:
          type: integer
          description: |
            The instance's trash retention window in whole days, the
            same setting the listing's `remainingDays` countdowns were
            computed against (`trash_retention_days`, default 30). The
            trash page's note renders it; adjusting the setting stays
            the administrator's surface, but the number itself is
            visible to every signed-in member. A corrupt setting row
            answers the default 30 -- the same degradation the
            countdowns follow.
          minimum: 0
          maximum: 365
          examples:
            - 30
    TrashSweepResponse:
      type: object
      description: |
        The report of one whole-trash action (`restore-all`, `empty`):
        how many rows the sweep actually applied. An empty trash
        answers 0 -- the endpoints are idempotent, there is no
        not-found surface (the sweep scans what is in the trash right
        now, so the 404 of the single-row endpoints never appears).
      required:
        - affected
      properties:
        affected:
          type: integer
          description: |
            The number of trashed rows the sweep applied: the rows the
            restore-all returned to the live views (the events the
            sweep published), or the rows the empty permanently
            deleted. The trash is owner-scoped, so the sweep never
            touches another account's rows.
          minimum: 0
          examples:
            - 6
    TrashBatchRequest:
      type: object
      description: |
        One batch action over a list of ids IN THE CALLER'S TRASH.
        Both actions are destructive-of-place: `restore` returns the
        rows to the live views, `delete` removes them permanently --
        the client confirms the delete arm first. The id resolution
        mirrors the assets batch's set semantics with a trash-scoped
        guard: an id that is not in the caller's trash at the time of
        the request (unknown, another account's, already live or
        already purged) is ignored and reported in `missing`; a batch
        never fails over an individual id. `ids` carries between 1 and
        1000 entries; repeated ids collapse to one application.
      required:
        - action
        - ids
      properties:
        action:
          type: string
          description: |
            The action to apply to every id in the caller's trash.
            `restore` clears the trash mark (the Live Photo pair
            moving as one asset, the external row's file moving back
            to its recorded original location); `delete` removes the
            rows and their files permanently (the shared-blob rule
            applies, the component video rows go with their photos).
          enum:
            - restore
            - delete
        ids:
          type: array
          description: |
            The asset ids to apply the action to: at least 1, at most
            1000.
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1000
    TrashBatchResponse:
      type: object
      description: |
        The set-semantics report of one trash batch action. `affected`
        and `missing` partition the request's distinct ids: every id
        is either applied or was not in the caller's trash, none is
        both, and none is silently dropped.
      required:
        - affected
        - missing
      properties:
        affected:
          type: integer
          description: |
            How many distinct request ids were in the caller's trash
            at the time of the request and were processed. The trash
            batch's guard is trash-scoped, so an id already live or
            already purged lands in `missing` instead of counting here
            (the deliberate difference from the assets batch, whose
            state-agnostic guard counts an already-in-state row as
            affected): the trash view's rows are the caller's whole
            world, and a row that left it between render and click is
            a missing row, not a no-op.
          minimum: 0
        missing:
          type: array
          description: |
            The distinct request ids that were not in the caller's
            trash at the time of the request -- unknown ids, other
            accounts' assets (indistinguishable by design), rows
            already restored to the live views and rows the expiry job
            already purged -- in the order of their first appearance
            in the request. Empty when every id was still in the
            trash.
          items:
            type: string
            format: uuid
    BatchRequest:
      type: object
      description: |
        One batch action over a list of asset ids. The action applies
        to every id that resolves to a caller-owned asset; the rest
        (unknown or another account's, indistinguishable) are ignored
        and reported in the response's `missing` list -- a batch never
        fails over an individual id. `ids` carries between 1 and 1000
        entries; repeated ids collapse to one application.
      required:
        - action
        - ids
      properties:
        action:
          type: string
          description: |
            The set operation to apply. `favorite` / `unfavorite`
            write or remove the caller's per-user favorites rows;
            `hide` / `unhide` flip the owner-level visibility switch
            (an archived asset leaves every live view until unarchived);
            `trash` / `restore` run the trash lifecycle of the trash
            endpoints, the Live Photo pair moving as one asset.
          enum:
            - favorite
            - unfavorite
            - hide
            - unhide
            - trash
            - restore
        ids:
          type: array
          description: |
            The asset ids to apply the action to: at least 1, at most
            1000.
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1000
    BatchResponse:
      type: object
      description: |
        The set-semantics report of one batch action. `affected` and
        `missing` partition the request's distinct ids: every id is
        either applied or unresolvable, none is both, and none is
        silently dropped.
      required:
        - affected
        - missing
      properties:
        affected:
          type: integer
          description: |
            How many distinct request ids resolved to a caller-owned
            asset and were processed -- INCLUDING ids that were
            already in the target state (the idempotent no-op of the
            set semantics: a repeat of a successful batch answers the
            same count, because the endpoint is a convergence
            operation, not a state-change counter). NOT a count of
            rows written: trashing a Live Photo pair moves two rows
            but one request id, and counts once.
          minimum: 0
        missing:
          type: array
          description: |
            The distinct request ids that did not resolve to a
            caller-owned asset -- unknown ids and other accounts'
            assets, indistinguishable by design -- in the order of
            their first appearance in the request. Empty when every
            id resolved. This deliberate reporting (instead of the
            byte-identical 404 of the single-asset endpoints) is the
            trade of the list surface: the caller handed the ids over
            themselves, so reporting them back hides nothing.
          items:
            type: string
            format: uuid
    AssetPatch:
      type: object
      description: |
        The partial edit of one asset: every field is optional, at
        least one must be present (a body that carries none -- null
        values count as absent -- is a client bug and answers 400),
        and only the fields the request carries update; the rest keep
        their values. Every field is owner-level asset state, so a
        patch that actually changes one of them publishes a single
        `asset.updated` event; a patch that repeats the stored values
        is the idempotent no-op and publishes nothing.
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 10000
          description: |
            The owner's free-text description of the asset, the text
            the detail panel renders. The value replaces the stored
            text wholesale (an empty string clears it). At most
            10,000 Unicode characters -- the count is over runes, so
            a text of multi-byte characters stays within the bound at
            the same length.
        isArchived:
          type: boolean
          description: |
            The owner-level archive switch: `true` keeps the asset out
            of every family flow until it is unarchived; `false`
            returns it. An album keeps its archived members, so the
            album surface is unaffected either way. The same switch
            the batch `hide` / `unhide` actions flip.
        takenAt:
          type: string
          format: date-time
          description: |
            The owner's manual capture-time edit: the value replaces
            the stored instant wholesale. The timestamp MUST carry a
            UTC offset (RFC 3339's `Z` or `+hh:mm` designator) -- the
            offset is the capture zone the info panel displays beside
            the time, so a zone-less value is ambiguous and answers
            400 `VALIDATION_FAILED`. The same value decides where the
            photo sits on the timeline (the instant) and which offset
            renders beside it (the offset).
          examples:
            - '2026-08-12T18:42:00+08:00'
        latitude:
          type: number
          format: double
          description: |
            The manual location edit's latitude, in degrees
            (-90..90). It rides with `longitude` (the pair is the
            location; one half alone answers 400
            `VALIDATION_FAILED`). Writing the pair replaces the
            asset's location: the info panel renders these
            coordinates and the resolved place follows the pin. The
            camera-recorded GPS in `exif` keeps the file's own
            reading and is not touched.
          examples:
            - 36.0671
        longitude:
          type: number
          format: double
          description: |
            The manual location edit's longitude, in degrees
            (-180..180). It rides with `latitude` (see there for the
            pair's semantics).
          examples:
            - 120.3826
    PersonSummary:
      type: object
      description: |
        One named person of the caller's people list: a global face
        cluster carrying the caller's own label. The name is the
        caller's private label state -- another account labeling the
        same cluster never changes this view. The person entity's
        own attributes (the avatar) are shared: every account of the
        family sees the same avatar face.
      required:
        - clusterId
        - name
        - photoCount
        - representativeFaceId
        - thumbnail
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        name:
          type: string
          description: The caller's own label of the cluster.
        photoCount:
          type: integer
          description: |
            The number of DISTINCT live assets the cluster has a face
            on that the caller can see -- photos, not faces, so two
            faces of one person in one photo count once. Honest per
            caller, never the global count.
        representativeFaceId:
          type: string
          format: uuid
          description: |
            The face the person card renders: the person's chosen
            avatar face when it is a caller-visible live member of
            the cluster, otherwise the cluster's strongest-scoring
            caller-visible face (score descending, the face id
            ascending as the tiebreak) -- the best face the CALLER
            can see, never a face on an asset the caller cannot
            view. The field is the thumbnail's face id.
        thumbnail:
          type: string
          description: |
            URL of the card's face crop: the face crop endpoint
            `GET /api/v1/faces/{faceId}/thumbnail` with
            `representativeFaceId`.
          examples:
            - /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
    UnnamedClusterSummary:
      type: object
      description: |
        One unnamed face cluster of the caller's unnamed region: a
        global cluster the caller sees through at least one visible
        asset and has not labeled themselves. Unlabeled for THIS
        caller says nothing about another account's labels
        (labels are private per user).
      required:
        - clusterId
        - faceCount
        - representativeFaceId
        - thumbnail
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        faceCount:
          type: integer
          description: |
            The cluster's faces on assets visible to the caller --
            the honest per-caller count, not the global member count.
        representativeFaceId:
          type: string
          format: uuid
          description: |
            The face the cluster tile renders: the person's chosen
            avatar face when it is a caller-visible live member of
            the cluster, otherwise the cluster's strongest-scoring
            caller-visible face (score descending, the face id
            ascending as the tiebreak) -- the best face the CALLER
            can see, never a face on an asset the caller cannot
            view.
        thumbnail:
          type: string
          description: |
            URL of the tile's face crop: the face crop endpoint
            `GET /api/v1/faces/{faceId}/thumbnail` with the
            caller-visible best face's id.
          examples:
            - /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
    UnnamedClustersResponse:
      type: object
      description: One keyset page of the caller's unnamed clusters.
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          description: |
            The page's clusters, ordered by `faceCount` descending
            with the cluster id as the tiebreak.
          items:
            $ref: '#/components/schemas/UnnamedClusterSummary'
        nextCursor:
          type: string
          description: |
            The opaque continuation cursor: pass it back as the
            `cursor` query parameter to fetch the next page. Absent
            exactly when this is the last page.
        totalCount:
          type: integer
          description: |
            The caller's whole unnamed region: every cluster this
            listing would walk, independent of the page size and the
            cursor. The people list's unnamed entry badge and the
            unnamed page's own count both read it.
    ClusterDetail:
      type: object
      description: |
        One face cluster's detail as the calling user sees it: the
        caller's own label state, the person entity's global
        attributes and the cluster's faces on caller-visible assets,
        strongest score first.
      required:
        - clusterId
        - label
        - birthDate
        - avatarFaceId
        - photoCount
        - faces
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        label:
          description: |
            The caller's label of the cluster, or null when the
            caller has not labeled it (the unnamed state). It is the
            calling user's label or no label at all: another
            account's label never shows here.
          anyOf:
            - $ref: '#/components/schemas/PersonLabel'
            - type: 'null'
        birthDate:
          description: |
            The person's birth date (the entity's own attribute, one
            value for every account), or null when unset. Rendered
            locale-aware by the client (`Intl.DateTimeFormat`'s
            numeric year/month/day -- never hand-assembled).
          anyOf:
            - type: string
              format: date
            - type: 'null'
        avatarFaceId:
          description: |
            The face this person's avatar renders (the entity's own
            attribute), or null when none was picked -- the reads
            then fall back to the cluster's best caller-visible face.
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        photoCount:
          type: integer
          description: |
            The number of DISTINCT live assets the cluster has a face
            on that the caller can see (photos, not faces).
        faces:
          type: array
          description: |
            The cluster's faces on assets visible to the caller,
            strongest score first with the face id as the tiebreak.
            Faces on other accounts' assets never appear.
          items:
            $ref: '#/components/schemas/FaceDetail'
    PersonLabel:
      type: object
      description: The calling user's private label of one face cluster.
      required:
        - name
      properties:
        name:
          type: string
          description: The caller's name for the person.
    FaceDetail:
      type: object
      description: |
        One face of the cluster on an asset visible to the caller:
        the crop's identity, the detection score and the minimal
        asset context the detail grid renders.
      required:
        - id
        - assetId
        - score
        - thumbnail
        - asset
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the face row.
        assetId:
          type: string
          format: uuid
          description: Identifier of the asset the face sits on.
        score:
          type: number
          format: float
          description: The detector's confidence for this face.
        thumbnail:
          type: string
          description: |
            URL of the face's crop: the face crop endpoint
            `GET /api/v1/faces/{faceId}/thumbnail` with this face's
            id, serving the bounding-box crop of the asset's
            view-size derivative.
        asset:
          type: object
          description: |
            The minimal context of the asset the face sits on: when
            it was taken and under what file name -- the two lines
            the cluster detail renders under each crop.
          required:
            - takenAt
            - originalFilename
          properties:
            takenAt:
              type: string
              format: date-time
              description: When the asset was taken (RFC 3339 UTC).
            originalFilename:
              type: string
              description: The file name the asset was uploaded under.
    LabelPersonRequest:
      type: object
      description: |
        The caller's name for one face cluster. The server trims the
        value and requires 1-64 characters; duplicate names are
        allowed (no NAME_TAKEN -- families have real duplicates).
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The caller's name for the person, trimmed.
          example: Ada
    SetPersonBirthdateRequest:
      type: object
      description: |
        One person's birth date: a `YYYY-MM-DD` date, or null to
        clear the stored value. The field is always present (a body
        without it answers 400) so a clear is an explicit act.
      required:
        - birthDate
      properties:
        birthDate:
          description: |
            The person's birth date, or null to clear it.
          anyOf:
            - type: string
              format: date
            - type: 'null'
    PersonBirthdateResponse:
      type: object
      description: |
        One person's birth date after the write (the entity's own
        attribute, shared by every account).
      required:
        - clusterId
        - birthDate
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        birthDate:
          description: |
            The stored birth date, or null when the person carries
            none.
          anyOf:
            - type: string
              format: date
            - type: 'null'
    SetPersonAvatarRequest:
      type: object
      description: |
        The face one person's avatar renders: one of the cluster's
        own faces, on an asset visible to the caller.
      required:
        - faceId
      properties:
        faceId:
          type: string
          format: uuid
          description: Identifier of the face to render as the avatar.
    PersonAvatarResponse:
      type: object
      description: One person's avatar face after the write.
      required:
        - clusterId
        - avatarFaceId
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        avatarFaceId:
          type: string
          format: uuid
          description: The stored avatar face.
    PersonLabelResponse:
      type: object
      description: |
        The calling user's label state of one face cluster after a
        label write: the caller's own row only
        (another account's label never shows here).
      required:
        - clusterId
        - name
      properties:
        clusterId:
          type: string
          format: uuid
          description: Identifier of the face cluster.
        name:
          type: string
          description: The caller's (trimmed) name for the person.
    MergePeopleRequest:
      type: object
      description: |
        One merge: 1-50 source clusters folded into one target
        cluster. The source clusters dissolve with their labels (the
        honest documented cost -- a source cluster's user-given name
        dies); the target's label persists.
      required:
        - sourceClusterIds
        - targetClusterId
      properties:
        sourceClusterIds:
          type: array
          description: |
            The clusters to fold into the target: at least 1 and at
            most 50 after duplicates collapse, every one visible to
            the caller. Each dissolves with its label rows. A single
            id is the pairwise fold of the cluster detail's
            "merge into" action.
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        targetClusterId:
          type: string
          format: uuid
          description: |
            The surviving cluster: every source face re-homes here
            and its representative recomputes to the strongest
            member of the merged set. It must be visible to the
            caller and must not sit among the sources.
    MergePeopleResponse:
      type: object
      description: One committed merge.
      required:
        - survivingClusterId
        - mergedClusterIds
      properties:
        survivingClusterId:
          type: string
          format: uuid
          description: The target cluster that absorbed the sources.
        mergedClusterIds:
          type: array
          description: |
            The source clusters that dissolved into the target, in
            request order. Their rows -- and every label on them --
            are gone.
          items:
            type: string
            format: uuid
    ClusterFaceResponse:
      type: object
      description: |
        One committed from-face person creation: the seeding face
        occupies the new cluster alone and serves as its
        representative face.
      required:
        - faceId
        - clusterId
      properties:
        faceId:
          type: string
          format: uuid
          description: Identifier of the seeding face.
        clusterId:
          type: string
          format: uuid
          description: |
            The newly created cluster: the face is its sole member
            and its representative face.
    MoveFaceRequest:
      type: object
      description: One face's move onto an existing face cluster.
      required:
        - targetClusterId
      properties:
        targetClusterId:
          type: string
          format: uuid
          description: |
            The cluster the face joins. It must be visible to the
            caller; its representative recomputes when the move
            changes the strongest member.
    MoveFaceResponse:
      type: object
      description: One committed face move.
      required:
        - faceId
        - clusterId
      properties:
        faceId:
          type: string
          format: uuid
          description: Identifier of the moved face.
        clusterId:
          type: string
          format: uuid
          description: The cluster the face occupies after the move.
    FaceCreateRequest:
      type: object
      description: |
        One hand-drawn face: the asset it sits on and the drawn box,
        in the FaceBbox per-mille units. The drawn box is the face
        row's bounding box as-is; the crop endpoint and the on-photo
        face-box layer render from it.
      required:
        - assetId
        - bbox
      properties:
        assetId:
          type: string
          format: uuid
          description: |
            The asset the drawn face sits on. It must be the caller's
            own live asset (the face writes' gate).
          examples:
            - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f70
        bbox:
          $ref: '#/components/schemas/FaceBbox'
    FaceCreated:
      type: object
      description: |
        One committed manual face: its identity and the crop URL. The
        face carries no cluster yet -- the assign flow (the move or
        the from-face creation) is the caller's next step, and that
        is where the drawn face becomes someone.
      required:
        - id
        - thumbnail
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the new face row.
          examples:
            - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f74
        thumbnail:
          type: string
          description: |
            URL of the new face's crop: the face crop endpoint with
            the new face's id (the same shape the detail's faces
            carry).
          examples:
            - /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f74/thumbnail
    FaceBoxPatchRequest:
      type: object
      description: |
        One adjusted face box, normalized to the image: x/y the
        top-left corner, width/height the extents, each a number in
        0-1 with x + width <= 1 and y + height <= 1 and both extents
        at least 0.01. All four values are required. The server
        stores the box in the faces table's per-mille units.
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: number
          format: double
          description: The box's left edge, as a fraction of the image's width.
          minimum: 0
          maximum: 1
          examples:
            - 0.56
        y:
          type: number
          format: double
          description: The box's top edge, as a fraction of the image's height.
          minimum: 0
          maximum: 1
          examples:
            - 0.38
        width:
          type: number
          format: double
          description: The box's width, as a fraction of the image's width (at least 0.01).
          minimum: 0.01
          maximum: 1
          examples:
            - 0.14
        height:
          type: number
          format: double
          description: The box's height, as a fraction of the image's height (at least 0.01).
          minimum: 0.01
          maximum: 1
          examples:
            - 0.14
    FaceBoxPatchResponse:
      type: object
      description: |
        One committed face-box rewrite: the face's identity, its
        crop URL, and the stored box in the per-mille units the
        crop endpoint and the on-photo face-box layer address.
      required:
        - faceId
        - thumbnail
        - bbox
      properties:
        faceId:
          type: string
          format: uuid
          description: Identifier of the rewritten face.
          examples:
            - 0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71
        thumbnail:
          type: string
          description: |
            URL of the face's crop, which now derives from the new
            box (the crop endpoint computes at query time; the
            change signal is the face row's updated_at).
          examples:
            - /api/v1/faces/0192f4a1-5b6c-7d8e-9f0a-2b3c4d5e6f71/thumbnail
        bbox:
          $ref: '#/components/schemas/FaceBbox'
    PlaceSummary:
      type: object
      description: |
        One city group of the caller's places list: a GeoNames place
        holding at least one caller-visible live asset. The count and
        the covers are the caller's honest view -- the same place can
        show different counts to different accounts.
      required:
        - placeId
        - name
        - country
        - assetCount
        - latitude
        - longitude
        - takenAtFrom
        - takenAtTo
        - representativeCoverAssetIds
      properties:
        placeId:
          type: integer
          format: int32
          description: |
            The GeoNames geonameid of the place -- the `places` row's
            primary key and the `assets.place_id` foreign key the
            ingestion pipeline's resolution writes.
          examples:
            - 2988507
        name:
          type: string
          description: |
            The display name in the request's locale: the
            `place_names` row of that locale when the place data
            carries one, the GeoNames canonical (English or
            romanized) name otherwise. A locale switch changes this
            join only, never an asset row.
          examples:
            - Paris
            - 巴黎
        country:
          type: string
          description: |
            The place's ISO 3166-1 alpha-2 country code. The display
            country name is the client's business (its own locale
            table maps the code).
          examples:
            - FR
        assetCount:
          type: integer
          description: |
            The place's caller-visible live assets -- the honest
            per-caller count, not the global member count.
        latitude:
          type: number
          format: double
          description: |
            The place's latitude in degrees (the GeoNames record's
            own coordinate, never a photo's). It is the point the
            places map pins and clusters -- the map layer is a view
            over the same grouping, so no asset coordinate ever
            needs to leave the instance for it.
          examples:
            - 48.85341
        longitude:
          type: number
          format: double
          description: |
            The place's longitude in degrees (the GeoNames record's
            own coordinate, never a photo's).
          examples:
            - 2.3488
        takenAtFrom:
          type: string
          format: date-time
          description: |
            The earliest capture time among the place's
            caller-visible live members (RFC 3339 UTC). The city
            card's year span starts here; the listing's own ordering
            reads the other end.
          examples:
            - '2019-04-08T10:12:00Z'
        takenAtTo:
          type: string
          format: date-time
          description: |
            The latest capture time among the place's caller-visible
            live members (RFC 3339 UTC). It is the ordering key of
            the list -- the most recently photographed city leads --
            and the city card's year span ends here. Equal to
            `takenAtFrom` when the place holds one member.
          examples:
            - '2026-08-02T15:40:00Z'
        representativeCoverAssetIds:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            format: uuid
          description: |
            The place's cover candidates: its (up to) four most
            recent caller-visible live members, taken_at descending
            with the asset id as the tiebreak -- the wall's
            derived-cover discipline applied to city groups, newest
            first.
    PlacesRerunResponse:
      type: object
      description: |
        The identifier of one place re-resolution run: the
        `job_runs` row the re-resolution job drives and the
        `job.*` events announce.
      required:
        - jobRunId
      properties:
        jobRunId:
          type: string
          format: uuid
          description: |
            UUIDv7 identifier of the run's `job_runs` row. `202`
            carries the freshly created run; `200` the in-flight one
            the request joined instead.
    RebuildDerivativesRequest:
      type: object
      description: |
        The scope of one derivative rebuild run: the honest pair the
        image card's dialog chooses between.
      required:
        - scope
      properties:
        scope:
          type: string
          description: |
            `missing` derives only the assets whose current-format
            serving files are absent; `all` re-derives every image
            asset at the current settings and removes the other
            encoding format's stale files.
          enum:
            - missing
            - all
    RebuildDerivativesResponse:
      type: object
      description: |
        The identifier of one derivative rebuild run: the
        `job_runs` row the rebuild job drives and the `job.*`
        events announce.
      required:
        - jobRunId
      properties:
        jobRunId:
          type: string
          format: uuid
          description: |
            UUIDv7 identifier of the run's `job_runs` row. `202`
            carries the freshly created run; `200` the in-flight one
            the request joined instead, and the stop's `200` the run
            the stop landed on.
    DerivativesSummaryResponse:
      type: object
      description: |
        The image card's cost line: the library's image count and the
        declared estimate of a full rebuild at the current settings
        and dial. The estimate is the documented plan-of-record
        number (one second per asset, divided by the dial's current
        mapping), never a measurement.
      required:
        - imageCount
        - estimateMinutes
      properties:
        imageCount:
          type: integer
          description: |
            The image assets the rebuild would visit. Video assets
            are not counted: the rebuild re-derives image serving
            copies only.
        estimateMinutes:
          type: integer
          description: |
            The declared estimate of a full rebuild, in whole
            minutes, floored at one.
    ImageSettingsResponse:
      type: object
      description: |
        The derivative image settings: the sizes and encoding every
        NEW derivation runs at. Saving them recomputes nothing --
        serving copies already on disk stay as they are until the
        explicit rebuild re-derives them.
      required:
        - tileSize
        - previewSize
        - format
        - fullSize
        - rawEmbedded
      properties:
        tileSize:
          type: integer
          description: |
            The timeline tile's bounding box in pixels: 250 is the
            shipped default, 320 reads sharper on high-density
            screens.
          enum:
            - 250
            - 320
        previewSize:
          type: integer
          description: |
            The viewer's inline preview long edge in pixels: 1080 is
            the shipped default (enough to look at, cheapest to
            derive), 1440 and 2048 zoom sharper at a bigger encode.
          enum:
            - 1080
            - 1440
            - 2048
        format:
          $ref: '#/components/schemas/DerivativeFormat'
        fullSize:
          type: boolean
          description: |
            Whether derivations also produce the full-resolution
            serving copy. Shipped OFF: the viewer reads the preview,
            and the full-size copy is disk the family never opens.
        rawEmbedded:
          type: boolean
          description: |
            Whether a RAW source derives from its embedded preview.
            Shipped ON.
    ImageSettingsUpdateRequest:
      type: object
      description: |
        The image settings save. Every field is contract-required:
        the PUT replaces the document wholesale, so an omitted field
        would silently reset it.
      required:
        - tileSize
        - previewSize
        - format
        - fullSize
        - rawEmbedded
      properties:
        tileSize:
          type: integer
          enum:
            - 250
            - 320
        previewSize:
          type: integer
          enum:
            - 1080
            - 1440
            - 2048
        format:
          $ref: '#/components/schemas/DerivativeFormat'
        fullSize:
          type: boolean
        rawEmbedded:
          type: boolean
    DerivativeFormat:
      type: string
      description: |
        The serving copies' encoding. `avif` stores smaller and
        encodes slower (on a weak machine it makes first browsing
        slower); `webp` encodes faster and stores a little larger.
      enum:
        - avif
        - webp
    PausedJobsState:
      type: object
      description: |
        The five per-kind pause switches. A paused kind's NEW jobs sit
        held and the one already running finishes; the switches never
        touch an upload request or a serving read.
      required:
        - thumbnail
        - metadata
        - transcode
        - ml
        - places
      properties:
        thumbnail:
          type: boolean
          description: |
            Holds new thumbnail derivations -- and, with them, the
            derivative rebuild (its work is thumbnail-class).
        metadata:
          type: boolean
          description: Holds new metadata jobs.
        transcode:
          type: boolean
          description: Holds new video transcodes.
        ml:
          type: boolean
          description: |
            Holds new machine learning work: the four per-asset
            inference jobs and the slot reruns.
        places:
          type: boolean
          description: Holds new place re-resolution runs.
    RunBudgetSettingsResponse:
      type: object
      description: |
        The background work's budget: the concurrency dial's preset,
        the night window, and the five per-kind pause switches. Every
        job reads this document when it starts, so a save takes
        effect on the next job without a restart.
      required:
        - concurrencyPreset
        - nightlyEnabled
        - nightlyStart
        - nightlyEnd
        - pausedJobs
      properties:
        concurrencyPreset:
          $ref: '#/components/schemas/ConcurrencyPreset'
        nightlyEnabled:
          type: boolean
          description: |
            Whether the night window is on. Off, the heavy work runs
            whenever there is work.
        nightlyStart:
          type: string
          description: |
            The window's opening time, `HH:MM` local to the server.
            Shipped `02:00`.
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        nightlyEnd:
          type: string
          description: |
            The window's closing time, `HH:MM` local to the server.
            Shipped `06:00`; earlier than the start is a window that
            spans midnight.
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        pausedJobs:
          $ref: '#/components/schemas/PausedJobsState'
    RunBudgetSettingsUpdateRequest:
      type: object
      description: |
        The budget save. Every field is contract-required: the PUT
        replaces the document wholesale, so an omitted field would
        silently reset it. The two times must differ.
      required:
        - concurrencyPreset
        - nightlyEnabled
        - nightlyStart
        - nightlyEnd
        - pausedJobs
      properties:
        concurrencyPreset:
          $ref: '#/components/schemas/ConcurrencyPreset'
        nightlyEnabled:
          type: boolean
        nightlyStart:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        nightlyEnd:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        pausedJobs:
          $ref: '#/components/schemas/PausedJobsState'
    ConcurrencyPreset:
      type: string
      description: |
        The concurrency dial's three steps, mapped to worker counts:
        `light` runs one job at a time, `standard` runs half the
        cores, `full` runs all but one. The panel never asks for a
        number -- the mapping is the explanation line.
      enum:
        - light
        - standard
        - full
    MediaKind:
      type: string
      description: |
        The media family of an asset. A Live Photo is an `image`
        whose linked component video row never appears in the
        timeline or the search.
      enum:
        - image
        - video
    SearchResponse:
      type: object
      description: |
        One page of the unified search: the keyset-paged items (the
        timeline item shape -- the search results page renders the
        same wall the timeline does) plus the facet counts of the
        current filtered set minus each dimension. `nextCursor` is
        present exactly when another page follows; the cursor is
        mode-tagged (the fused-rank order of a text query, or the
        timeline order of the filter browse).
      required:
        - items
        - facets
      properties:
        items:
          type: array
          description: |
            The page's assets, ordered by the fused score descending
            with the asset id ascending as the tiebreak (a text
            query), or by taken-at descending with the id descending
            (the filter browse -- the timeline's own order).
          items:
            $ref: '#/components/schemas/TimelineItem'
        nextCursor:
          type: string
          description: |
            The continuation token of the page: present exactly when
            another page follows. Opaque; pass it back as `cursor`.
        facets:
          $ref: '#/components/schemas/SearchFacets'
    SearchFacets:
      type: object
      description: |
        The filter bar's counts over the current filtered set minus
        each dimension: a facet entry's `assetCount` answers "how
        many results would I have if I added this value ON TOP of
        the current query and filters" (the dimension's own filter
        parameters excluded). Every facet is caller-scoped exactly
        like the surface it summarizes: places count visible assets,
        tags and people are the caller's own, albums are the
        ones the caller can see. The lists are ordered by
        `assetCount` descending with a deterministic per-dimension
        tiebreak; they are not paginated (bounded by the family
        instance's vocabulary sizes, the tags listing's own shape).
      required:
        - people
        - places
        - years
        - cameras
        - kinds
        - albums
        - tags
      properties:
        people:
          type: array
          description: |
            The caller's named, non-hidden people: one entry per
            labeled face cluster with a face on the current set.
            Hidden labels never list (the hidden switch removes
            the person from every face position).
          items:
            $ref: '#/components/schemas/PersonFacetCount'
        places:
          type: array
          description: |
            The resolved places of the current set with the locale
            display name (`locale` parameter, the `GET /places` join).
          items:
            $ref: '#/components/schemas/PlaceFacetCount'
        years:
          type: array
          description: |
            The taken-at years of the current set, newest first: the
            time-range facet (the `from`/`to` filters are the
            dimension the year counts exclude).
          items:
            $ref: '#/components/schemas/YearFacetCount'
        cameras:
          type: array
          description: |
            The EXIF camera makes/models of the current set. The `id`
            is the round-trip filter value (`make|model`); `make` and
            `model` are the display halves, null exactly when the
            EXIF row carries no value there.
          items:
            $ref: '#/components/schemas/CameraFacetCount'
        kinds:
          type: array
          description: The media families of the current set.
          items:
            $ref: '#/components/schemas/KindFacetCount'
        albums:
          type: array
          description: |
            The caller-visible albums (own and shared, never the sync
            albums -- the timeline is their face) holding members of
            the current set.
          items:
            $ref: '#/components/schemas/AlbumFacetCount'
        tags:
          type: array
          description: |
            The CALLER's tags with members in the current set
            (another account's tags never surface).
          items:
            $ref: '#/components/schemas/TagFacetCount'
    PersonFacetCount:
      type: object
      description: One named person of the people facet.
      required:
        - id
        - name
        - assetCount
      properties:
        id:
          type: string
          format: uuid
          description: The face cluster id (the people surface's id).
        name:
          type: string
          description: The CALLER's label of the cluster.
        assetCount:
          type: integer
          description: |
            The number of assets of the current filtered set (minus
            the person filter) carrying a face of this cluster.
    PlaceFacetCount:
      type: object
      description: One place of the places facet.
      required:
        - placeId
        - name
        - country
        - assetCount
      properties:
        placeId:
          type: integer
          format: int32
          description: The GeoNames id (the round-trip filter value).
        name:
          type: string
          description: The locale display name, canonical fallback.
        country:
          type: string
          description: The ISO country code.
        assetCount:
          type: integer
          description: |
            The number of assets of the current filtered set (minus
            the place filter) resolved to this place.
    YearFacetCount:
      type: object
      description: One year of the time-range facet.
      required:
        - year
        - assetCount
      properties:
        year:
          type: integer
          format: int32
          description: The taken-at year.
        assetCount:
          type: integer
          description: |
            The number of assets of the current filtered set (minus
            the time-range filter) taken in this year.
    CameraFacetCount:
      type: object
      description: One camera of the cameras facet.
      required:
        - id
        - assetCount
      properties:
        id:
          type: string
          description: |
            The round-trip filter value: `make|model` with both
            halves trimmed, empty where the EXIF row carries no
            value.
        make:
          type: string
          nullable: true
          description: The EXIF camera make, null when absent.
        model:
          type: string
          nullable: true
          description: The EXIF camera model, null when absent.
        assetCount:
          type: integer
          description: |
            The number of assets of the current filtered set (minus
            the camera filter) shot with this camera.
    KindFacetCount:
      type: object
      description: One media family of the kinds facet.
      required:
        - kind
        - assetCount
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        assetCount:
          type: integer
          description: |
            The number of assets of the current filtered set (minus
            the kind filter) of this family.
    AlbumFacetCount:
      type: object
      description: One album of the albums facet.
      required:
        - id
        - title
        - assetCount
      properties:
        id:
          type: string
          format: uuid
          description: The album id (the round-trip filter value).
        title:
          type: string
          description: The album's title.
        assetCount:
          type: integer
          description: |
            The number of members of the current filtered set (minus
            the album filter) this album holds.
    TagFacetCount:
      type: object
      description: One tag of the tags facet.
      required:
        - id
        - name
        - assetCount
      properties:
        id:
          type: string
          format: uuid
          description: The CALLER's tag id (the round-trip filter value).
        name:
          type: string
          description: The caller's tag name.
        assetCount:
          type: integer
          description: |
            The number of assets of the current filtered set (minus
            the tag filter) carrying this tag.
    TagSummary:
      type: object
      description: |
        One tag of the caller's vocabulary as every tags-face
        response answers it: the identity, the name, the honest
        count and the timestamps. The write faces (create, rename)
        answer this same shape, so a write's answer is the entry the
        listing lists.
      required:
        - id
        - name
        - assetCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier of the tag (the caller's own row).
        name:
          type: string
          description: |
            The tag's display name, unique within the caller's
            vocabulary. Trimmed on write; 1-64 Unicode characters
            (counted over runes).
        assetCount:
          type: integer
          description: |
            The tag's assignment rows joined to caller-visible live
            assets: the album union plus the timeline's live filters
            (not trashed, not archived, no Live Photo component). A
            trashed or archived member stops counting until it
            returns; the assignment row survives underneath, exactly
            like a favorite row.
        createdAt:
          type: string
          format: date-time
          description: When the tag row was created (RFC 3339 UTC).
        updatedAt:
          type: string
          format: date-time
          description: |
            When the tag's name last truly changed (RFC 3339 UTC).
            The idempotent create and the no-op rename leave it
            untouched -- only a real rename moves it.
    TagNameRequest:
      type: object
      description: |
        The name-carrying body of the tag create and rename writes:
        one field, required. The name is trimmed server-side and
        must span 1-64 Unicode characters after the trim (the count
        is over runes, so multi-byte names stay within the bound at
        the same length).
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The tag's name, trimmed server-side. On create a name
            the caller already owns converges on the existing tag;
            on rename a name another tag carries answers 409
            `TAG_NAME_TAKEN`, the row's own name the idempotent
            no-op.
    TagAssetsRequest:
      type: object
      description: |
        The assignment write body: the list of asset ids to tag with
        or untag from the caller's tag. Repeated ids collapse to one
        application; the report's counts cover the distinct ids.
      required:
        - assetIds
      properties:
        assetIds:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            The asset ids of the assignment write, between 1 and 200
            entries. The add skips -- never errors on -- every id
            that is not caller-visible or that already carries the
            tag; the remove skips the ids that carry no assignment.
          items:
            type: string
            format: uuid
    AddTagAssetsResponse:
      type: object
      description: |
        The honest report of one assignment add over the request's
        distinct ids: what landed and what was skipped, invisible
        and already-tagged ids alike.
      required:
        - added
        - skipped
      properties:
        added:
          type: integer
          description: |
            The assignment rows the request inserted. Zero for an
            all-skipped request, which is still a 200 -- batch
            semantics, never an error.
        skipped:
          type: integer
          description: |
            The distinct ids that did not land: unknown ids,
            another account's unshared assets, any id the caller
            cannot see, and the ids already carrying the tag (the
            idempotent add).
    RemoveTagAssetsResponse:
      type: object
      description: |
        The honest report of one assignment remove over the
        request's distinct ids: the rows that left and the ids that
        carried no assignment of the tag.
      required:
        - removed
        - skipped
      properties:
        removed:
          type: integer
          description: |
            The assignment rows the request deleted. Zero for an
            all-skipped request, which is still a 200.
        skipped:
          type: integer
          description: |
            The distinct ids that carried no assignment of this tag
            -- never tagged, or already untagged.
    AlbumWallResponse:
      type: object
      description: |
        The caller's album wall: the own group followed by the shared
        group, concatenated into one array.
      required:
        - albums
      properties:
        albums:
          type: array
          description: |
            Every wall album: the pinned sync card first (the
            caller's own core upload stream, the default "My
            photos" album), then the own group (the caller's memory
            and directory albums, `updatedAt` descending), then the
            shared group (the albums shared to the caller, the
            caller's grant time descending). Each group breaks ties
            on the album id, descending. A sync album another
            account owns never appears.
          items:
            $ref: '#/components/schemas/AlbumSummary'
    AlbumSummary:
      type: object
      description: |
        One album card of the wall: the metadata, the member count,
        the PHOTO count and the collage source, plus the
        `callerRole` discriminator the client keys each card's face
        by (a viewer card carries the read-only mark; an own card
        its own shared state). Shared
        items carry `owner`, the honest attribution of another
        account's album; own items omit it.
      required:
        - id
        - title
        - type
        - isShared
        - coverAssetIds
        - itemCount
        - photoCount
        - updatedAt
        - callerRole
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the album.
        title:
          type: string
          description: The album's display title.
        type:
          type: string
          enum:
            - memory
            - directory
            - sync
          description: |
            The album's type. `memory` albums are reference sets
            curated by their owner -- photos live in the albums they
            were ingested through, a memory holds references to
            them; `directory` albums mirror a filesystem path. The
            one `sync` card, when present, is the caller's own
            default album pinned first (never another account's):
            its `title` is the internal system label ('Sync') and
            clients render the localized display name instead (en
            "My photos", zh-Hans "我的照片").
        isShared:
          type: boolean
          description: |
            True when the album carries at least one `album_shares`
            row -- someone besides the owner can see it. Always true
            on shared-group items by construction.
        coverAssetIds:
          type: array
          maxItems: 6
          description: |
            The collage source of the wall card, in render order: the
            frames of the album's cover. A cover holds four frames
            (the album card's 2x2 collage) or six (the memory band's
            3-across 2-down strip), and the server answers the group
            the card draws -- the card is the first thing rendered
            and cannot see the collection, so the automatic group is
            computed here, never by the client.

            The owner's pinned set wins: when the owner picked a full
            set, these are its frames in pick order, exactly as
            written (the server never re-sorts a pin). An album
            without pins renders the automatic group: a weekly
            rotation, re-sampled per ISO week from the whole live
            collection (never the newest frames and never a random
            order), frozen for the week so an upload mid-week cannot
            move a frame, and never rotating at all while the album
            holds fewer than twice the frame count -- such an album
            keeps one stable sample of its own. A pinned frame that
            is no longer visible to the caller (moved out, trashed,
            archived) is filled silently from the caller's visible
            pool; a fully dead pin falls back to the automatic group.

            The order is the render order and the length is at most
            the card's frame count: a collection with fewer members
            than frames answers the frames it has (one fills, two
            split, three lay one large beside two small), and an
            album with no members answers an empty array (the card's
            empty cover, no placeholder photo).
          items:
            type: string
            format: uuid
        itemCount:
          type: integer
          description: |
            The album's member count: trashed and Live Photo component
            rows never count, while an archived member does -- an
            album is a reference container that keeps its archived
            members (a memory, a family-flow surface, drops them).
            The members of every media kind count here -- this is
            the collection's own size, the number the cover pool and
            the removal's arithmetic consult.
        photoCount:
          type: integer
          description: |
            The album's PHOTO count: the same member predicate
            narrowed to `kind: image` members. The
            interface's count idiom beside the image glyph reads
            this field (it says "12 photos", so it counts photos);
            a video is a member but never a photo, and the wall
            marks it with its own glyph instead. Equal to
            `itemCount` for an album holding no videos.
        updatedAt:
          type: string
          format: date-time
          description: When the album row last changed (RFC 3339 UTC).
        callerRole:
          type: string
          enum:
            - owner
            - viewer
          description: |
            The caller's relation to this album: `owner` items belong
            to the caller's own group on the wire, `viewer` items to
            the shared group. The client renders ONE wall list and
            keys each card's face off this discriminator (the
            read-only mark is the member's, the shared state the
            owner's).
        owner:
          description: |
            The owner attribution of a shared item: the account that
            owns the album. Present exactly when `callerRole` is
            `viewer`; own items omit it (the owner is the caller).
          allOf:
            - $ref: '#/components/schemas/AlbumOwnerRef'
        inTimeline:
          type: boolean
          description: |
            The caller's timeline preference of this album: whether
            it feeds their aggregated timeline. Present exactly on
            the excludable cards -- the own `directory` items and
            every shared item; the own `memory` items omit it
            (they never feed the caller's own timeline, so there is
            nothing to exclude), and the pinned `sync` card omits it
            too (the core stream is never excludable). The value is
            the preference row's switch, true when no row exists
            (the default).
    AlbumOwnerRef:
      type: object
      description: |
        The owner of an album shared to the caller: the honest
        attribution a shared wall card renders. The display name
        leads; `email` is the fallback an empty name leaves (the
        card never renders a blank attribution).
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the owning account.
        email:
          type: string
          format: email
          description: |
            The email address of the owning account: the fallback
            the client renders when `name` is empty, and the
            disambiguator between two accounts that share a name.
        name:
          type: string
          description: |
            The owning account's display name, exactly as stored.
            The empty string when the account set none -- the
            client then renders `email` instead. Never treated as a
            unique key: two accounts may share a name, and the
            email is what tells them apart.
    AlbumDetail:
      type: object
      description: |
        One album's detail as the calling user sees it: the metadata,
        the caller's role, the member count, the photo count and one
        keyset page of the members.
      required:
        - id
        - title
        - type
        - coverAssetIds
        - callerRole
        - itemCount
        - photoCount
        - items
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the album.
        title:
          type: string
          description: The album's display title.
        type:
          type: string
          enum:
            - memory
            - directory
            - sync
          description: |
            The album's type. `memory` is a reference set the caller
            owns or that is shared to them; `sync` is the caller's
            own default
            album -- a read-only, system-managed detail (no write
            affordance applies, the display name is the client's
            localized one keyed by the type). Another account's sync
            album never reaches this shape: it answers the
            single-shape 404.
        coverAssetIds:
          type: array
          maxItems: 6
          description: |
            The owner's stored pin, in pick order: the frames the
            owner picked, exactly as written (the server stores and
            returns the order given), or an empty array when the
            album is on the automatic weekly group. A pinned frame
            that has since left the album (moved out, trashed,
            archived) still appears here: the picker seeds from this
            list and marks the cells that are no longer in the album.
            The wall card's own `coverAssetIds` is the FILLED group
            (the dead pins replaced from the caller's visible pool);
            this field is the pin itself, never the rendered card.
          items:
            type: string
            format: uuid
        rootPath:
          type: string
          description: |
            The album's source directory: the RESOLVED absolute path
            the album row stores, present exactly on `directory`
            albums (the edit dialog's read-only source line; the
            property patch carries no field for it -- the source is
            pinned at creation). Memory and sync albums omit it: a
            memory has no source.
        sourceWritable:
          type: boolean
          description: |
            The creation-time write probe's fact: whether the
            source directory could be written, read back and
            removed from when the album was created. Present
            exactly on `directory` albums, both roles -- the fact is
            the album's own, not a role's. `false` is not an error
            state: a readable but read-only directory is a
            legitimate source whose photos cannot be deleted through
            the application. The truth is discovered exactly once,
            at creation; nothing re-probes it at runtime.
        allowAppDeletion:
          type: boolean
          description: |
            The owner's deletability switch: whether deleting this
            album's photos THROUGH the application -- the trash move
            of the source file -- is permitted. Present exactly on
            the OWNER's view of a `directory` album (the edit
            dialog's switch state; a viewer holds no write
            affordance to read it for). A read-only source carries
            the stored value too, but it governs nothing there: the
            derived `deletable` face stays false whatever it says.
        deletable:
          type: boolean
          description: |
            The wall's delete-affordance derivation, computed
            server-side and carried as one boolean: the caller is
            the owner, the source was writable at creation, and the
            deletability switch is on. Present exactly on the
            OWNER's view of a `directory` album. The derivation is
            pure data -- no runtime probing -- and it drives the
            affordance only: the delete itself stays the operating
            system's authority, and a move it refuses answers the
            honest error.
        callerRole:
          type: string
          enum:
            - owner
            - viewer
          description: |
            The caller's relation to this album: the owner holds the
            write affordances, a viewer is read-only.
        itemCount:
          type: integer
          description: |
            The album's member count, the same predicate as the
            items below (every media kind).
        photoCount:
          type: integer
          description: |
            The album's photo count: the member predicate narrowed
            to image-kind members. The contextual bar's
            count idiom renders this field (the image glyph says
            "photos"); the wall beside it carries videos as their
            own tiles, never as photos. Equal to `itemCount` when
            the album holds no videos.
        items:
          type: array
          description: |
            One page of the album's members, `takenAt` descending
            with the asset id as the tiebreak.
          items:
            $ref: '#/components/schemas/AlbumItem'
        nextCursor:
          type: string
          description: |
            The opaque continuation cursor: pass it back as the
            `cursor` query parameter to fetch the next page. Absent
            exactly when this is the last page.
        shares:
          type: array
          description: |
            The album's grantee list, riding ONLY the owner's view:
            one entry per `album_shares` row in the grant order
            (`grantedAt` ascending) -- the share management dialog's
            list. The owner's response always carries the field, an
            empty array when the album holds no grants; viewer
            responses never carry it at all.
          items:
            $ref: '#/components/schemas/AlbumShareEntry'
        inTimeline:
          type: boolean
          description: |
            The caller's timeline preference of this album: whether
            it feeds their aggregated timeline. Present exactly when
            the album is excludable for the caller -- an own
            `directory` album or an album shared to them; an own
            `memory` album omits the field (it never feeds the
            caller's own timeline), and the caller's own `sync`
            album omits it too (the core stream is never
            excludable). The value is the preference row's
            switch, true when no row exists (the default).
            The preference scopes the aggregated timeline only: it
            never filters this album's own items, whatever the
            switch says.
    AlbumItem:
      type: object
      description: |
        One member of the album: the membership's identity and the
        minimal asset context the detail grid renders.
      required:
        - assetId
        - addedAt
        - asset
      properties:
        assetId:
          type: string
          format: uuid
          description: Identifier of the member asset.
        addedAt:
          type: string
          format: date-time
          description: |
            When the membership row was added to the album (RFC 3339
            UTC).
        asset:
          description: The minimal context of the member asset.
          allOf:
            - $ref: '#/components/schemas/AlbumItemAsset'
    AlbumItemAsset:
      type: object
      description: |
        The minimal context of one album member asset: the lines the
        detail grid renders per tile.
      required:
        - takenAt
        - originalFilename
        - kind
        - thumbnail
      properties:
        takenAt:
          type: string
          format: date-time
          description: When the asset was taken (RFC 3339 UTC).
        originalFilename:
          type: string
          description: The file name the asset was uploaded under.
        kind:
          type: string
          enum:
            - image
            - video
          description: The asset's media kind.
        thumbnail:
          type: string
          description: |
            URL of the asset's tile-size serving copy: the asset
            thumbnail endpoint
            `GET /api/v1/assets/{assetId}/thumbnail?size=tile`.
          examples:
            - /api/v1/assets/0192f5b3-6c7d-8e9f-a0b1-2c3d4e5f6072/thumbnail?size=tile
    AlbumCreateRequest:
      type: object
      description: |
        The creation body of one directory album
        (albums-as-sources): the title, the existing directory the
        album references in place, the audience the album starts
        with, and the two dialog switches of the create-time
        autonomy -- the deletability switch and the creator's
        timeline exclusion. No type field exists -- this endpoint IS
        directory creation, the only creatable album type. No
        description field either: it died whole (the 2026-11-08 owner
        evaluation -- real-world fill rate near zero, the context
        already carried by title/date-range+count/place/cover), and
        the property patch carries no field that could set one.
      required:
        - title
        - rootPath
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The album's display title, trimmed server-side; it must
            span 1-64 Unicode characters after the trim (the count
            is over runes, so multi-byte titles stay within the
            bound at the same length).
        rootPath:
          type: string
          maxLength: 4096
          description: |
            The source directory: an existing absolute path the
            server validates against the path matrix (existence,
            directory-ness, readability, symlink resolution, the
            managed tree) before creating anything. The album row
            stores the RESOLVED absolute path -- symlink segments
            evaluated -- so a later symlink swap cannot repoint the
            album. After the matrix passes, the server probes the
            directory's writability once and records the fact; a
            read-only directory is a valid source, never a refusal.
        allowAppDeletion:
          type: boolean
          description: |
            The owner's deletability switch, carried from the
            creation dialog: whether the album's photos may be
            deleted through the application (the trash move of the
            source file). On by default; the dialog renders the
            switch only where the source is writable (the
            completion row's `writable` fact), and on a read-only
            source the stored value governs nothing -- the derived
            `deletable` face stays false whatever it says. Editable
            later through the property patch.
        inTimeline:
          type: boolean
          description: |
            The creator's timeline preference, carried from the
            creation dialog: `false` keeps the album out of the
            CREATOR's aggregated timeline from birth -- the same
            per-user switch `PUT /albums/{albumId}/timeline-preference`
            writes, landed in the creation itself (a per-user
            preference, not an album fact: it needs no photos to
            exist, so the creation is exactly the right moment).
            Absent or true feeds the timeline (the default -- no
            preference row is written). The exclusion is the
            creator's own: the audience members' feeds are governed
            by their own preference rows, never by this field.
        audience:
          type: array
          maxItems: 200
          description: |
            The accounts the album starts being visible to: the
            initial `album_shares` set, empty (or absent) meaning
            "only me". Entries that cannot be granted -- an unknown
            or disabled account, or the caller's own id -- are
            skipped and reported in the response's `skipped` list,
            never errors.
          items:
            type: string
            format: uuid
    AlbumCreateResponse:
      description: |
        The creation answer: the fresh directory album's wall card
        (the summary exactly as `GET /albums` lists it) plus the
        honest audience report -- the requested ids that did not
        become audience, each with its reason -- and the creation
        probe's `sourceWritable` fact. The card's companions are the
        creation-time constants: `callerRole` `owner`, `isShared`
        true exactly when the audience landed a row, an empty
        `coverAssetIds`, `itemCount` 0, `photoCount` 0.
      allOf:
        - $ref: '#/components/schemas/AlbumSummary'
        - type: object
          required:
            - skipped
            - sourceWritable
          properties:
            sourceWritable:
              type: boolean
              description: |
                The creation-time write probe's fact of the album
                this response just created: `true` when the probe
                file landed, read back and removed cleanly; `false`
                for a readable but read-only source. The creation
                SUCCEEDED either way -- a read-only directory is a
                legitimate album -- and `false` is the honest
                feedback the dialog renders (photos of this
                directory cannot be deleted through the
                application).
            skipped:
              type: array
              description: |
                The requested audience ids that stayed ungranted:
                the album's own owner and every id that names no
                usable account. Empty when the whole audience
                landed.
              items:
                $ref: '#/components/schemas/AlbumAudienceSkip'
    MemoryCreateRequest:
      type: object
      description: |
        The creation body of one memory: the title and the audience
        the memory starts with, nothing else. A memory owns no
        source path, no deletability switch and no timeline switch
        -- the fields the directory album's creation carries have no
        home on a reference set, and the shape says so by omitting
        them.
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The memory's display title, trimmed server-side; it must
            span 1-64 Unicode characters after the trim (the count
            is over runes, so multi-byte titles stay within the
            bound at the same length).
        audience:
          type: array
          maxItems: 200
          description: |
            The accounts the memory starts being visible to: the
            initial `album_shares` set, empty (or absent) meaning
            "only me". Entries that cannot be granted -- an unknown
            or disabled account, or the caller's own id -- are
            skipped and reported in the response's `skipped` list,
            never errors.
          items:
            type: string
            format: uuid
    MemoryCreateResponse:
      description: |
        The creation answer: the fresh memory's wall card (the
        summary exactly as `GET /albums` lists it) plus the honest
        audience report. The card's companions are the creation-time
        constants: `callerRole` `owner`, `type` `memory`, `isShared`
        true exactly when the audience landed a row, an empty
        `coverAssetIds`, `itemCount` 0, `photoCount` 0, no
        `inTimeline` field (an own memory card omits it -- the
        memory never feeds its creator's timeline).
      allOf:
        - $ref: '#/components/schemas/AlbumSummary'
        - type: object
          required:
            - skipped
          properties:
            skipped:
              type: array
              description: |
                The requested audience ids that stayed ungranted:
                the memory's own owner and every id that names no
                usable account. Empty when the whole audience
                landed.
              items:
                $ref: '#/components/schemas/AlbumAudienceSkip'
    AlbumPatch:
      type: object
      description: |
        The partial edit of one album: every field is optional, at
        least one must be present (a body that carries none -- JSON
        null values count as absent, the patch discipline of the
        asset surface -- is a client bug and answers 400), and only
        the fields the request carries update; the rest keep their
        values. A present `coverAssetIds` must carry 0 or exactly the
        card's frame count of distinct ids, every one a renderable
        member of the album itself (an archived member is renderable
        on an album and refused on a memory). The write publishes one
        `album.updated` event whatever fields changed.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The album's display title, trimmed server-side; when
            present it must span 1-64 Unicode characters after the
            trim.
        coverAssetIds:
          type: array
          maxItems: 6
          description: |
            The owner's pin, as a full set: the frames of the cover in
            render order (the order the owner picked them in -- the
            server stores and returns it as given, never re-sorting).
            The length is 0 or exactly N, N being the card's frame
            count (four on the album card, six on the memory band):
            an empty array clears the pin and returns the album to
            the automatic weekly group, a full set pins it, and any
            other length answers 400 `VALIDATION_FAILED` (a partial
            set is the picker's un-saveable state, never a stored
            one). Repeated ids answer 400 too -- a cover is a set,
            and one frame cannot fill two cells. Every id must be a
            RENDERABLE member of THIS album (the membership row exists
            and the asset is not trashed, is not a Live Photo
            component row, and on a memory album is not archived --
            an album's archived members render and may pin); otherwise
            the answer is 400 with the
            message key `album_cover_not_member` and a `count` of the
            refused frames. Absent (or JSON null, which decodes as
            absent) leaves the pin unchanged.
          items:
            type: string
            format: uuid
        allowAppDeletion:
          type: boolean
          description: |
            The owner's deletability switch of a DIRECTORY album:
            whether the album's photos may be deleted through the
            application (the trash move of the source file). On for
            a writable source by default; the owner who manages
            file-system deletions themselves turns it off, and the
            wall's delete affordances disappear with it (the derived
            `deletable` face of the detail read). A patch carrying
            the field on a memory album answers 400 with the
            message key `album_deletable_not_directory` -- the
            switch is the directory album's own, a memory album's
            deletions never move files. Idempotent: repeating the
            stored value converges.
    AlbumItemsRequest:
      type: object
      description: |
        The membership write body, shared by the memory's curation
        arms: the list of asset ids to add to or remove from one
        memory album. Repeated ids collapse to one
        application; the report's counts cover the distinct ids.
      required:
        - assetIds
      properties:
        assetIds:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            The asset ids of the membership write, between 1 and
            200 entries; the add skips the ids that are not
            currently visible to the caller or already members, the
            remove the ids that are no members.
          items:
            type: string
            format: uuid
    AddAlbumItemsResponse:
      type: object
      description: |
        The honest report of one membership add over the request's
        distinct ids: the rows that landed and the ids that stayed
        out.
      required:
        - added
        - skipped
      properties:
        added:
          type: integer
          description: |
            The membership rows the request landed -- the photos the
            creator currently sees and that were not members yet.
            Zero for an all-skipped request, which is still a 200.
        skipped:
          type: integer
          description: |
            The distinct ids that stayed out of the set: not
            currently visible to the caller (the re-share ground
            failed), not a live row, or already a member (the
            idempotent no-op).
    RemoveAlbumItemsResponse:
      type: object
      description: |
        The honest report of one membership remove over the
        request's distinct ids: the rows that left and the ids that
        were no members.
      required:
        - removed
        - skipped
      properties:
        removed:
          type: integer
          description: |
            The membership rows the request deleted. Zero for an
            all-skipped request, which is still a 200.
        skipped:
          type: integer
          description: |
            The distinct ids that were no members of the album --
            never added, or already removed.
    AlbumAudienceRequest:
      type: object
      description: |
        The audience write body: the COMPLETE grantee set, the state
        the album's `album_shares` rows must converge to. The field
        must ride the body -- an explicit empty array IS the valid
        "only me" request (every row leaves), while an absent field
        is a client bug the 400 names, the destructive-silent-
        default guard of the settings writes.
      required:
        - audience
      properties:
        audience:
          type: array
          maxItems: 200
          description: |
            Every account that may view the album after this write,
            between 0 and 200 entries. Repeated ids collapse to one
            application. The owner's own id is skippable noise (the
            owner sees the album by construction), and ids that name
            no usable account are skipped with a reason -- never
            errors.
          items:
            type: string
            format: uuid
    AlbumAudienceResponse:
      type: object
      description: |
        The audience write's honest report: the audience as it
        stands after the write, the transitions this write caused,
        and the requested ids it skipped. The three id lists carry
        only what the write actually did -- a concurrent writer's
        rows surface in `audience`, never in a transition the
        response claims.
      required:
        - albumId
        - audience
        - granted
        - revoked
        - skipped
      properties:
        albumId:
          type: string
          format: uuid
          description: Identifier of the album the audience belongs to.
        audience:
          type: array
          description: |
            The grantee list after the write, one entry per
            `album_shares` row in the grant order (`grantedAt`
            ascending) -- the same list the owner's album detail
            carries as `shares`, the edit dialog's chips.
          items:
            $ref: '#/components/schemas/AlbumShareEntry'
        granted:
          type: array
          description: |
            The ids whose rows THIS write landed -- empty for the
            idempotent repeat of the stored set. One `album.shared`
            event fired per entry.
          items:
            type: string
            format: uuid
        revoked:
          type: array
          description: |
            The ids whose rows THIS write removed -- empty for the
            idempotent repeat. One `album.unshared` event fired per
            entry.
          items:
            type: string
            format: uuid
        skipped:
          type: array
          description: |
            The requested ids that stayed ungranted, each with its
            reason. Empty when the whole request was actionable.
          items:
            $ref: '#/components/schemas/AlbumAudienceSkip'
    AlbumAudienceSkip:
      type: object
      description: |
        One requested audience entry the write could not grant: the
        id and the honest reason. The reason is a machine value the
        client maps onto its own phrasing; it never probes the
        account table further.
      required:
        - userId
        - reason
      properties:
        userId:
          type: string
          format: uuid
          description: The requested id that stayed ungranted.
        reason:
          type: string
          enum:
            - owner
            - invalid_account
          description: |
            Why the id was skipped: `owner` -- the album's own owner,
            whose visibility is the ownership row, never a share row;
            `invalid_account` -- an unknown or disabled account (the
            same reason for both, so user ids cannot be probed).
    AlbumTimelinePreferenceRequest:
      type: object
      description: |
        The caller's timeline preference write: the per-user switch
        of whether one album feeds the caller's aggregated timeline.
        The `inTimeline` field is required in practice: a body
        without it (or one carrying an explicit JSON null -- a
        required boolean has no absent-state semantics) answers 400
        `VALIDATION_FAILED` naming the body.
      properties:
        inTimeline:
          type: boolean
          nullable: true
          description: |
            Whether the album's items feed the caller's aggregated
            timeline. `false` keeps them out; `true` (and a missing
            preference row) keeps them in.
    AlbumTimelinePreferenceResponse:
      type: object
      description: |
        One album's timeline preference as the caller's row now
        carries it. Self-affecting state: the write publishes no
        event, this response is the only view that changed.
      required:
        - albumId
        - inTimeline
      properties:
        albumId:
          type: string
          format: uuid
          description: Identifier of the album the preference scopes.
        inTimeline:
          type: boolean
          description: |
            Whether the album feeds the caller's aggregated timeline
            (a missing preference row means true, the default).
    AlbumShareEntry:
      type: object
      description: |
        One grantee of the owner's `shares` list on the album
        detail: the grantee's identity and the grant time -- the
        share management dialog's row.
      required:
        - userId
        - email
        - grantedAt
      properties:
        userId:
          type: string
          format: uuid
          description: Identifier of the grantee account.
        email:
          type: string
          format: email
          description: The grantee's login address.
        grantedAt:
          type: string
          format: date-time
          description: When the view ACL was granted (RFC 3339 UTC).
    UserSummary:
      type: object
      description: |
        One account of the minimal member list: exactly the identity
        fields a pick list renders -- the display name (with the
        email as the fallback for an account that set none), the
        role and the disabled switch; no timestamps, and never a
        password hash.
      required:
        - id
        - email
        - name
        - role
        - isDisabled
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        email:
          type: string
          format: email
          description: |
            Login address: the identity's unique key, the fallback
            a pick list renders when the display name is empty, and
            the disambiguator between two accounts that share a
            name.
        name:
          type: string
          description: |
            The account's display name, exactly as stored. The
            empty string when the account set none -- the client
            then renders `email` instead.
        role:
          $ref: '#/components/schemas/UserRole'
        isDisabled:
          type: boolean
          description: |
            The disabled switch: a disabled account cannot sign in
            and its sessions carry no authority until re-enabled.
    UserListResponse:
      type: object
      description: |
        The instance's member list: every account, `email`
        ascending, in one bounded response (a family instance holds
        a handful of accounts).
      required:
        - users
      properties:
        users:
          type: array
          description: Every account of the instance, `email` ascending.
          items:
            $ref: '#/components/schemas/UserSummary'
    Error:
      type: object
      description: |
        Error envelope shared by all endpoints. `code` is the authoritative
        registry of stable error codes; clients must not parse `message`.
      required:
        - code
      properties:
        code:
          type: string
          description: |
            Stable error code. The i18n translation key is the lowercase
            form of this value.
          enum:
            - SETUP_ALREADY_COMPLETED
            - VALIDATION_FAILED
            - INTERNAL
            - AUTH_FORBIDDEN
            - AUTH_INVALID_CREDENTIALS
            - AUTH_RATE_LIMITED
            - PAIRING_TOKEN_INVALID
            - ASSET_TOO_LARGE
            - ASSET_NOT_FOUND
            - ASSET_NOT_READY
            - USER_EMAIL_TAKEN
            - USER_NOT_FOUND
            - USER_LAST_ADMIN
            - USER_TRANSFER_TO_SELF
            - MODEL_DOWNLOAD_FAILED
            - MODEL_NOT_FOUND
            - MODEL_INVALID
            - MODEL_SLOT_UNKNOWN
            - MODEL_PROBE_NOT_FOUND
            - MODEL_PROBE_REQUIRED
            - MODEL_CONFIRM_REQUIRED
            - MODEL_SLOT_LOCKED
            - PERSON_NOT_FOUND
            - ALBUM_NOT_FOUND
            - ALBUM_PATH_NOT_FOUND
            - ALBUM_PATH_NOT_DIRECTORY
            - ALBUM_PATH_NOT_READABLE
            - ALBUM_PATH_IN_MANAGED_TREE
            - TAG_NOT_FOUND
            - TAG_NAME_TAKEN
            - ASSET_TRASH_MOVE_FAILED
            - ASSET_RESTORE_MOVE_FAILED
            - ASSET_COMPONENT_CONFLICT
            - REBUILD_NOT_RUNNING
            - JOB_NOT_CANCELLABLE
            - JOB_RUN_NOT_FOUND
        message:
          type: string
          description: English technical description for debugging.
        details:
          type: object
          additionalProperties: true
          description: |
            Optional structured context, for example the offending field
            names of a `VALIDATION_FAILED` request. Its shape is
            code-specific.
          examples:
            - fields:
                - email
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lumemor_session
      description: |
        Web session cookie issued by `POST /auth/login`: HttpOnly,
        SameSite=Strict, Secure when the instance is reached over
        HTTPS, sliding 30-day expiry.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Mobile session token issued by `POST /auth/pairing/consume`,
        sent as `Authorization: Bearer`. It is the mobile form of the
        same session records the cookie authenticates; both are
        revoked together.
