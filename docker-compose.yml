# M1 deployment: the lumemor server and its PostgreSQL database.
#
# `docker compose up` starts both containers: the server waits for the
# database to pass its healthcheck, connects, applies migrations and
# serves the first-run wizard at http://localhost:8244 until an
# administrator account exists. The credentials below are fixed
# development placeholders, not secrets.
#
# ./lumemor is the single storage root: the server keeps photo data
# (originals, upload staging, derivatives) under data/ and models under
# config/ inside it. Split them across volumes by pointing the
# LUMEMOR_DATA_DIR and LUMEMOR_CONFIG_DIR variables below at additional
# mounts; the defaults keep the zero-configuration single volume.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lumemor
      POSTGRES_PASSWORD: lumemor
      POSTGRES_DB: lumemor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lumemor"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  lumemor:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      args:
        # Optional passthroughs: release builds pass their version tag,
        # networks with a restricted default module proxy pass their
        # GOPROXY, networks where deb.debian.org is slow or unreachable
        # pass their apt mirror host name, and networks where
        # registry.npmjs.org is slow or unreachable pass the npm
        # registry URL for the web build stage. Empty values keep the
        # Dockerfile defaults.
        VERSION: ${LUMEMOR_VERSION:-dev}
        GOPROXY: ${LUMEMOR_BUILD_GOPROXY:-}
        APT_MIRROR: ${LUMEMOR_BUILD_APT_MIRROR:-}
        PNPM_REGISTRY: ${LUMEMOR_BUILD_PNPM_REGISTRY:-}
    ports:
      # 8244 binds all interfaces so family devices can run the wizard from the LAN; this unauthenticated pre-setup window closes once the first admin exists.
      - "8244:8244"
    volumes:
      # The single storage root (see the header comment above). The
      # container runs as the fixed uid/gid 10001 the image creates,
      # so a fresh install on Linux must prepare the host directory
      # before the first `docker compose up` -- Docker creates a
      # missing bind source as root:root, and the unprivileged server
      # could not lay out its directories inside:
      #     mkdir -p ./lumemor && sudo chown -R 10001:10001 ./lumemor
      # Rootless-docker and macOS desktop runtimes map the mount
      # permissively and need no preparation; a script that cannot
      # sudo can chown through the image itself instead:
      # `docker run --rm -u 0 -v ./lumemor:/var/lib/lumemor <image>
      #  chown -R 10001:10001 /var/lib/lumemor`.
      - ./lumemor:/var/lib/lumemor
    environment:
      LUMEMOR_DATABASE_URL: "postgres://lumemor:lumemor@db:5432/lumemor?sslmode=disable"
      LUMEMOR_DATA_DIR: "/var/lib/lumemor/data"
      LUMEMOR_CONFIG_DIR: "/var/lib/lumemor/config"
    # No app healthcheck in M1: /healthz exists, but compose-level
    # dependency gating on the server is deferred until the container
    # gains something meaningful to probe beyond liveness.
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
